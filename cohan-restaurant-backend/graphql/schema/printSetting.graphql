# src/graphql/schema/printSetting.graphql

type PrintSetting {
  id: ID!
  restaurantId: ID!
  printers: JSON
  stations: JSON
  templates: [PrintTemplate!]!
  jobs: [PrintJob!]!
  createdAt: DateTime
  updatedAt: DateTime
}

type PrintTemplate {
  key: String!
  name: String!
  enabled: Boolean!
  content: String
  updatedAt: DateTime
}

type PrintJob {
  id: ID!
  printerId: String
  printerName: String
  stationId: String
  printType: String!
  templateKey: String
  status: String!
  error: String
  retryCount: Int!
  payload: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

input UpsertPrintSettingInput {
  restaurantId: ID!
  printers: JSON
  stations: JSON
  templates: [PrintTemplateInput!]
}

input PrintTemplateInput {
  key: String!
  name: String!
  enabled: Boolean!
  content: String
}

input EnqueuePrintJobInput {
  restaurantId: ID!
  printerId: String
  stationId: String
  printType: String!
  templateKey: String
  payload: JSON
}

input RetryPrintJobInput {
  restaurantId: ID!
  jobId: ID!
}

input UpdatePrintJobStatusInput {
  restaurantId: ID!
  jobId: ID!
  status: String!
  error: String
}

input TestPrintInput {
  restaurantId: ID!
  printerId: String!
  draftName: String
  draftIp: String
  draftType: String
  draftLocation: String
}

extend type Query {
  printSettings(restaurantId: ID!): PrintSetting
}

extend type Mutation {
  upsertPrintSettings(input: UpsertPrintSettingInput!): PrintSetting!
  enqueuePrintJob(input: EnqueuePrintJobInput!): PrintJob!
  retryPrintJob(input: RetryPrintJobInput!): PrintJob!
  updatePrintJobStatus(input: UpdatePrintJobStatusInput!): PrintJob!
  testPrint(input: TestPrintInput!): PrintJob!
}
