"Đơn vị tính chuẩn cho nguyên liệu"
enum Unit {
  g
  kg
  ml
  l
  unit
  piece
  tbsp
  tsp
  pack
  bottle
  can
}

"Loại dịch chuyển kho"
enum MovementType {
  inbound
  outbound
  adjustment
  transfer
}

"Chuyển đổi giữa các đơn vị (1 from = ratio to)"
type UnitConversion {
  from: Unit!
  to: Unit!
  ratio: Float!
}

input UnitConversionInput {
  from: Unit!
  to: Unit!
  ratio: Float!
}

"Nguyên liệu (Ingredient)"
type Ingredient {
  id: ID!
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  baseUnit: Unit!
  conversions: [UnitConversion!]!
  costPerBaseUnit: Float
  photos: [String!]!
  minStock: Float
  notes: String
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

"Kho (Warehouse)"
type Warehouse {
  id: ID!
  restaurantId: ID!
  name: String!
  code: String
  address: String
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

input CreateIngredientInput {
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  baseUnit: Unit!
  conversions: [UnitConversionInput!]
  costPerBaseUnit: Float
  photos: [String!]
  minStock: Float
  notes: String
  isActive: Boolean
}

input UpdateIngredientInput {
  id: ID!
  name: String
  sku: String
  category: String
  baseUnit: Unit
  conversions: [UnitConversionInput!]
  costPerBaseUnit: Float
  photos: [String!]
  minStock: Float
  notes: String
  isActive: Boolean
}

input CreateWarehouseInput {
  restaurantId: ID!
  name: String!
  code: String
  address: String
  isActive: Boolean
}

input UpdateWarehouseInput {
  id: ID!
  name: String
  code: String
  address: String
  isActive: Boolean
}

"Chi tiết batch trong kho"
type StockBatch {
  id: ID!
  lot: String
  qty: Float!
  expiry: DateTime
  costPerBaseUnit: Float
  createdAt: DateTime
  updatedAt: DateTime
}

input StockBatchInput {
  lot: String
  qty: Float!
  expiry: DateTime
  costPerBaseUnit: Float
}

"Item trong kho (StockItem)"
type StockItem {
  id: ID!
  restaurantId: ID!
  warehouseId: ID
  ingredientId: ID!
  onHand: Float!
  reserved: Float!
  batches: [StockBatch!]!
  createdAt: DateTime
  updatedAt: DateTime
}

"Movement ghi nhận mỗi lần nhập/xuất/điều chỉnh kho"
type StockMovement {
  id: ID!
  restaurantId: ID!
  warehouseId: ID!
  ingredientId: ID!
  type: MovementType!
  qty: Float!
  reason: String
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

"Thành phần công thức"
type RecipeComponent {
  ingredientId: ID!
  qty: Float!
  unit: String
  wastePct: Float
  ingredientName: String
}

input RecipeComponentInput {
  ingredientId: ID!
  qty: Float!
  unit: String
  wastePct: Float
}

"Phương pháp chế biến (variant) trong công thức"
enum ServingMode {
  PORTION
  BY_WEIGHT
}

type ServingVariant {
  key: String! # "portion" | "byWeight"
  mode: ServingMode!
  yieldQty: Float!
  yieldUnit: String! # "portion" | "100g" | "g"
  preparationMethodName: String
  components: [RecipeComponent!]!
}

input ServingVariantInput {
  key: String!
  mode: ServingMode!
  yieldQty: Float!
  yieldUnit: String!
  preparationMethodName: String
  components: [RecipeComponentInput!]!
}

"Recipe: chỉ còn servingVariants, không có baseComponents"
type Recipe {
  id: ID!
  restaurantId: ID!
  menuItemId: ID!
  servingVariants: [ServingVariant!]!
  notes: String
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

"Input UpsertRecipe chỉ dùng servingVariants, bỏ baseComponents"
input UpsertRecipeInput {
  restaurantId: ID!
  menuItemId: ID!
  yieldQty: Float
  yieldUnit: String
  notes: String
  isActive: Boolean
  servingVariants: [ServingVariantInput!]
}

"MenuItem kèm Recipe để hiển thị danh sách"
type MenuItemWithRecipe {
  menuItem: MenuItem!
  recipe: Recipe
}

type MenuItemsWithRecipes {
  items: [MenuItemWithRecipe!]!
  total: Int
  pageInfo: PageInfo!
}

"OrderLine: cho phép định nghĩa cách phục vụ"
input OrderLineInput {
  menuItemId: ID!
  quantity: Float
  preparationMethodName: String
  weightGrams: Float
  servingKey: String
  servingMode: ServingMode
}

"Consumption (trừ kho theo order)"
"""
Nếu warehouseId không truyền, BE sẽ tự lấy warehouse đầu tiên (kho chính)
của restaurantId để thực hiện consume / reserve / commit / cancel.
"""
input ConsumeForOrderInput {
  restaurantId: ID!
  warehouseId: ID
  orderCode: String!
  lines: [OrderLineInput!]!
  allowNegative: Boolean = false
}

"Trả kết quả khi trừ kho"
type ConsumptionResult {
  success: Boolean!
  totalConsumed: Float!
  movements: [StockMovement!]!
  lowStocks: [Ingredient!]!
}

"Thống kê movement trong thời gian"
type MovementSummary {
  inbound: Float!
  outbound: Float!
  adjustment: Float!
  transferIn: Float!
  transferOut: Float!
  net: Float!
  count: Int!
}

extend type Query {
  # Ingredient
  ingredients(
    restaurantId: ID!
    search: String
    limit: Int = 100
  ): [Ingredient!]!
  ingredient(id: ID!): Ingredient

  # Warehouse
  warehouses(restaurantId: ID!): [Warehouse!]!

  # Stock
  stockItems(
    restaurantId: ID!
    warehouseId: ID
    ingredientIds: [ID!]
    lowOnly: Boolean
    limit: Int = 200
  ): [StockItem!]!

  # Recipe
  menuItemsWithRecipes(
    restaurantId: ID!
    timeSlot: TimeSlot
    search: String
    categoryId: ID
    first: Int = 30
    after: String
  ): MenuItemsWithRecipes!

  recipe(restaurantId: ID!, menuItemId: ID!): Recipe
  recipesByMenuItems(restaurantId: ID!, menuItemIds: [ID!]!): [Recipe!]!

  # Movement
  stockMovements(
    restaurantId: ID!
    warehouseId: ID
    ingredientId: ID
    type: MovementType
    orderCode: String
    dateFrom: DateTime
    dateTo: DateTime
    limit: Int = 200
    sort: Int = -1
  ): [StockMovement!]!

  stockMovementSummary(
    restaurantId: ID!
    warehouseId: ID
    ingredientId: ID
    dateFrom: DateTime
    dateTo: DateTime
  ): MovementSummary!
}

extend type Mutation {
  # Ingredient
  createIngredient(input: CreateIngredientInput!): Ingredient!
  updateIngredient(input: UpdateIngredientInput!): Ingredient!
  deleteIngredient(id: ID!): Boolean!

  # Warehouse
  createWarehouse(input: CreateWarehouseInput!): Warehouse!
  updateWarehouse(input: UpdateWarehouseInput!): Warehouse!
  deleteWarehouse(id: ID!): Boolean!

  # Stock
  upsertStockItem(
    restaurantId: ID!
    warehouseId: ID!
    ingredientId: ID!
    onHand: Float
    reserved: Float
    batches: [StockBatchInput!]
  ): StockItem!

  adjustStock(
    restaurantId: ID!
    warehouseId: ID!
    ingredientId: ID!
    qty: Float!
    reason: String
  ): StockItem!

  transferStock(
    restaurantId: ID!
    fromWarehouseId: ID!
    toWarehouseId: ID!
    ingredientId: ID!
    qty: Float!
    reason: String
  ): Boolean!

  # Recipe
  upsertRecipe(input: UpsertRecipeInput!): Recipe!
  deleteRecipe(restaurantId: ID!, menuItemId: ID!): Boolean!

  # Consumption
  consumeForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  reserveForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  commitReservationForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  cancelReservationForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
}
