# ================================
# ENUMS
# ================================

enum Unit {
  g
  kg
  ml
  l
  unit
  piece
  tbsp
  tsp
  pack
  bottle
  can
}

enum MovementType {
  inbound
  outbound
  adjustment
  transfer
}

enum ServingMode {
  PORTION
  BY_WEIGHT
}

# ================================
# SHARED TYPES
# ================================

type UnitConversion {
  from: Unit!
  to: Unit!
  ratio: Float!
}

input UnitConversionInput {
  from: Unit!
  to: Unit!
  ratio: Float!
}

# ================================
# INGREDIENT
# ================================

type Ingredient {
  id: ID!
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  baseUnit: Unit!
  conversions: [UnitConversion!]!
  costPerBaseUnit: Float
  photos: [String!]!
  minStock: Float
  notes: String
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

input CreateIngredientInput {
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  baseUnit: Unit!
  conversions: [UnitConversionInput!]
  costPerBaseUnit: Float
  photos: [String!]
  minStock: Float
  notes: String
  isActive: Boolean
}

input UpdateIngredientInput {
  id: ID!
  name: String
  sku: String
  category: String
  baseUnit: Unit
  conversions: [UnitConversionInput!]
  costPerBaseUnit: Float
  photos: [String!]
  minStock: Float
  notes: String
  isActive: Boolean
}

# ================================
# WAREHOUSE
# ================================

type Warehouse {
  id: ID!
  restaurantId: ID!
  name: String!
  code: String
  address: String
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

input CreateWarehouseInput {
  restaurantId: ID!
  name: String!
  code: String
  address: String
  isActive: Boolean
}

input UpdateWarehouseInput {
  id: ID!
  name: String
  code: String
  address: String
  isActive: Boolean
}

# ================================
# STOCK
# ================================

type StockBatch {
  id: ID!
  lot: String
  qty: Float!
  expiry: DateTime
  costPerBaseUnit: Float
  createdAt: DateTime
  updatedAt: DateTime
}

input StockBatchInput {
  lot: String
  qty: Float!
  expiry: DateTime
  costPerBaseUnit: Float
}

type StockItem {
  id: ID!
  restaurantId: ID!
  warehouseId: ID
  ingredientId: ID!
  onHand: Float!
  reserved: Float!
  batches: [StockBatch!]!
  createdAt: DateTime
  updatedAt: DateTime
}

type StockMovement {
  id: ID!
  restaurantId: ID!
  warehouseId: ID!
  ingredientId: ID!
  type: MovementType!
  qty: Float!
  reason: String
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

# ================================
# RECIPE
# ================================

type IngredientsComponent {
  ingredientId: ID!
  quantify: Float!
  wastePct: Float
  name: String
  costPerBaseUnit: Float
  baseUnit: Unit
}

input IngredientsComponentInput {
  ingredientId: ID!
  qty: Float!
  name: String
  wastePct: Float
}

type ServingVariant {
  key: String!
  mode: ServingMode!
  yieldQty: Float!
  yieldUnit: String!
  name: String
  Ingredients: [IngredientsComponent!]!
  price: Float
  isDefault: Boolean
}

input ServingVariantInput {
  key: String!
  mode: ServingMode!
  yieldQty: Float!
  yieldUnit: String!
  preparationMethodName: String
  ingredients: [IngredientsComponentInput!]!
  price: Float
}

type Recipe {
  id: ID!
  restaurantId: ID!
  menuItemId: ID!
  servingVariants: [ServingVariant!]!
  notes: String
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

input UpsertRecipeInput {
  restaurantId: ID!
  menuItemId: ID!
  yieldQty: Float
  yieldUnit: String
  notes: String
  isActive: Boolean
  servingVariants: [ServingVariantInput!]
}

type MenuItemWithRecipe {
  menuItem: MenuItem!
  recipe: Recipe
}

type MenuItemsWithRecipes {
  items: [MenuItemWithRecipe!]!
  total: Int
  pageInfo: PageInfo!
}

# ================================
# ORDERING / CONSUMPTION
# ================================

input OrderLineInput {
  menuItemId: ID!
  quantity: Float
  preparationMethodName: String
  weightGrams: Float
  servingKey: String
  servingMode: ServingMode
}

input ConsumeForOrderInput {
  restaurantId: ID!
  warehouseId: ID
  orderCode: String!
  lines: [OrderLineInput!]!
  allowNegative: Boolean = false
}

type ConsumptionResult {
  success: Boolean!
  totalConsumed: Float!
  movements: [StockMovement!]!
  lowStocks: [Ingredient!]!
}

type MovementSummary {
  inbound: Float!
  outbound: Float!
  adjustment: Float!
  transferIn: Float!
  transferOut: Float!
  net: Float!
  count: Int!
}

# ================================
# QUERY
# ================================

extend type Query {
  ingredients(
    restaurantId: ID!
    search: String
    limit: Int = 100
  ): [Ingredient!]!

  ingredient(id: ID!): Ingredient

  warehouses(restaurantId: ID!): [Warehouse!]!

  stockItems(
    restaurantId: ID!
    warehouseId: ID
    ingredientIds: [ID!]
    lowOnly: Boolean
    limit: Int = 200
  ): [StockItem!]!

  menuItemsWithRecipes(
    restaurantId: ID!
    timeSlot: TimeSlot
    search: String
    categoryId: ID
    first: Int = 30
    after: String
  ): MenuItemsWithRecipes!

  recipe(restaurantId: ID!, menuItemId: ID!): Recipe

  recipesByMenuItems(restaurantId: ID!, menuItemIds: [ID!]!): [Recipe!]!

  stockMovements(
    restaurantId: ID!
    warehouseId: ID
    ingredientId: ID
    type: MovementType
    orderCode: String
    dateFrom: DateTime
    dateTo: DateTime
    limit: Int = 200
    sort: Int = -1
  ): [StockMovement!]!

  stockMovementSummary(
    restaurantId: ID!
    warehouseId: ID
    ingredientId: ID
    dateFrom: DateTime
    dateTo: DateTime
  ): MovementSummary!
}

# ================================
# MUTATION
# ================================

extend type Mutation {
  createIngredient(input: CreateIngredientInput!): Ingredient!
  updateIngredient(input: UpdateIngredientInput!): Ingredient!
  deleteIngredient(id: ID!): Boolean!

  createWarehouse(input: CreateWarehouseInput!): Warehouse!
  updateWarehouse(input: UpdateWarehouseInput!): Warehouse!
  deleteWarehouse(id: ID!): Boolean!

  upsertStockItem(
    restaurantId: ID!
    warehouseId: ID!
    ingredientId: ID!
    onHand: Float
    reserved: Float
    batches: [StockBatchInput!]
  ): StockItem!

  adjustStock(
    restaurantId: ID!
    warehouseId: ID!
    ingredientId: ID!
    qty: Float!
    reason: String
  ): StockItem!

  transferStock(
    restaurantId: ID!
    fromWarehouseId: ID!
    toWarehouseId: ID!
    ingredientId: ID!
    qty: Float!
    reason: String
  ): Boolean!

  upsertRecipe(input: UpsertRecipeInput!): Recipe!
  deleteRecipe(restaurantId: ID!, menuItemId: ID!): Boolean!

  consumeForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  reserveForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  commitReservationForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  cancelReservationForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
}
