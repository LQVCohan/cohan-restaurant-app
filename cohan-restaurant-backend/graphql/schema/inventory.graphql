# ================================
# ENUMS
# ================================

enum Unit {
  g
  kg
  ml
  l
  unit
  piece
  tbsp
  tsp
  pack
  bottle
  can
}

enum MovementType {
  inbound
  outbound
  adjustment
  transfer
}

enum ServingMode {
  PORTION
  BY_WEIGHT
}

# Sell unit cho variant (đơn vị bán)
enum SellUnit {
  portion
  g
  kg
}

# ================================
# SHARED TYPES
# ================================

type UnitConversion {
  from: Unit!
  to: Unit!
  ratio: Float!
}

input UnitConversionInput {
  from: Unit!
  to: Unit!
  ratio: Float!
}

# ================================
# INGREDIENT
# ================================

type Ingredient {
  id: ID!
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  ingredientCategoryId: ID
  ingredientCategory: IngredientCategory
  baseUnit: Unit!
  conversions: [UnitConversion!]!
  costPerBaseUnit: Float
  photos: [String!]!
  minStock: Float
  notes: String
  isActive: Boolean
  deletedAt: DateTime
  deleteExpiresAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
}

type IngredientDeleteBlocker {
  id: ID!
  name: String!
  status: String
}

type IngredientCategory {
  id: ID!
  restaurantId: ID!
  name: String!
  slug: String!
  source: String
  usageCount: Int
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

type IngredientCategorySyncSample {
  ingredientId: ID!
  ingredientName: String
  predictedCategory: String!
  reason: String!
  confidence: Float!
  matchedKeyword: String
}

type IngredientCategorySyncReport {
  totalIngredients: Int!
  categoriesCreated: Int!
  categoriesUpdated: Int!
  ingredientsReassigned: Int!
  skipped: Int!
  errors: Int!
  summaryText: String!
  syncedAt: DateTime!
  sample: [IngredientCategorySyncSample!]!
  categories: [IngredientCategory!]!
}

type IngredientCategorySyncLog {
  id: ID!
  at: DateTime
  actorUserId: ID
  status: String
  totalIngredients: Int!
  categoriesCreated: Int!
  categoriesUpdated: Int!
  ingredientsReassigned: Int!
  skipped: Int!
  errors: Int!
  summaryText: String
}

input CreateIngredientInput {
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  ingredientCategoryId: ID
  baseUnit: Unit!
  conversions: [UnitConversionInput!]
  costPerBaseUnit: Float
  photos: [String!]
  minStock: Float
  notes: String
  isActive: Boolean
}

input UpdateIngredientInput {
  id: ID!
  name: String
  sku: String
  category: String
  ingredientCategoryId: ID
  baseUnit: Unit
  conversions: [UnitConversionInput!]
  costPerBaseUnit: Float
  photos: [String!]
  minStock: Float
  notes: String
  isActive: Boolean
}

input CreateIngredientCategoryInput {
  restaurantId: ID!
  name: String!
}

input UpdateIngredientCategoryInput {
  id: ID!
  name: String
  isActive: Boolean
}

# ================================
# WAREHOUSE
# ================================

type Warehouse {
  id: ID!
  restaurantId: ID!
  name: String!
  code: String
  address: String
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

input CreateWarehouseInput {
  restaurantId: ID!
  name: String!
  code: String
  address: String
  isActive: Boolean
}

input UpdateWarehouseInput {
  id: ID!
  name: String
  code: String
  address: String
  isActive: Boolean
}

# ================================
# STOCK
# ================================

type StockBatch {
  id: ID
  lot: String
  qty: Float!
  expiry: DateTime
  costPerBaseUnit: Float
  createdAt: DateTime
  updatedAt: DateTime
}

input StockBatchInput {
  lot: String
  qty: Float!
  expiry: DateTime
  costPerBaseUnit: Float
}

type StockItem {
  id: ID!
  restaurantId: ID!
  warehouseId: ID
  ingredientId: ID
  supplyId: ID
  onHand: Float!
  reserved: Float!
  costPerUnit: Float
  pricePerUnit: Float
  note: String
  batches: [StockBatch!]!
  createdAt: DateTime
  updatedAt: DateTime
}

type StockMovement {
  id: ID!
  restaurantId: ID!
  warehouseId: ID!
  ingredientId: ID!
  type: MovementType!
  qty: Float!
  reason: String
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

# ================================
# RECIPE (UPDATED)
# ================================

"""
1 dòng nguyên liệu trong công thức:
- qty + unit là số lượng theo đơn vị chỉ định
- wastePct là % hao hụt (0..100)
"""
type RecipeIngredientLine {
  ingredientId: ID!
  qty: Float!
  unit: Unit!
  wastePct: Float
  name: String
  baseUnit: Unit
  costPerBaseUnit: Float
}

input RecipeIngredientLineInput {
  ingredientId: ID!
  qty: Float!
  unit: Unit!
  wastePct: Float
}

"""
ServingVariant:
- ingredients là nguyên liệu cho 1 sell unit (sellQty + sellUnit)
- price là giá bán theo 1 sell unit
"""
type ServingVariant {
  key: String!
  name: String
  mode: ServingMode!

  sellQty: Float
  sellUnit: SellUnit

  ingredients: [RecipeIngredientLine!]
  price: Float
  isDefault: Boolean
}

input ServingVariantInput {
  key: String!
  name: String
  mode: ServingMode!

  sellQty: Float
  sellUnit: SellUnit

  ingredients: [RecipeIngredientLineInput!]!
  price: Float
  isDefault: Boolean
}
type IngredientSuggestionsPayload {
  topUsed: [Ingredient!]!
  recentUsed: [Ingredient!]!
  recentCreated: [Ingredient!]!
}
type Recipe {
  id: ID!
  restaurantId: ID!
  menuItemId: ID!
  servingVariants: [ServingVariant!]!
  notes: String
  isActive: Boolean
  deletedAt: DateTime
  deleteExpiresAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
}

type RecipeTrashItem {
  recipe: Recipe!
  menuItem: MenuItem
}

input UpsertRecipeInput {
  restaurantId: ID!
  menuItemId: ID!
  notes: String
  isActive: Boolean
  servingVariants: [ServingVariantInput!]
}

type MenuItemWithRecipe {
  menuItem: MenuItem!
  recipe: Recipe
}

type MenuItemsWithRecipes {
  items: [MenuItemWithRecipe!]!
  total: Int
  pageInfo: PageInfo!
}

# ================================
# ORDERING / CONSUMPTION
# ================================

input OrderLineInput {
  menuItemId: ID!
  quantity: Float
  preparationMethodName: String
  weightGrams: Int
  servingKey: String
  servingMode: ServingMode
}

input ConsumeForOrderInput {
  restaurantId: ID!
  warehouseId: ID
  orderCode: String!
  lines: [OrderLineInput!]!
  allowNegative: Boolean = false
}

type ConsumptionResult {
  success: Boolean!
  totalConsumed: Float!
  movements: [StockMovement!]!
  lowStocks: [Ingredient!]!
}

type MovementSummary {
  inbound: Float!
  outbound: Float!
  adjustment: Float!
  transferIn: Float!
  transferOut: Float!
  net: Float!
  count: Int!
}

type IngredientPricePoint {
  movementId: ID
  createdAt: DateTime
  qtyBase: Float
  costPerBaseUnit: Float!
  totalValue: Float
  lot: String
  supplierNote: String
}

type IngredientPriceSuggestionsPayload {
  latestCostPerBaseUnit: Float
  avgRecentCostPerBaseUnit: Float
  recent: [IngredientPricePoint!]!
}

# ================================
# QUERY
# ================================

extend type Query {
  ingredients(
    restaurantId: ID!
    search: String
    limit: Int = 100
    includeDeleted: Boolean = false
  ): [Ingredient!]!
  ingredientTrash(restaurantId: ID!, limit: Int = 200): [Ingredient!]!
  ingredientSuggestions(
    restaurantId: ID!
    limit: Int = 8
  ): IngredientSuggestionsPayload!
  ingredientPriceSuggestions(
    restaurantId: ID!
    ingredientId: ID!
    limit: Int = 5
  ): IngredientPriceSuggestionsPayload!
  ingredient(id: ID!): Ingredient
  ingredientCategories(
    restaurantId: ID!
    search: String
    includeInactive: Boolean = false
    limit: Int = 200
  ): [IngredientCategory!]!
  ingredientCategorySyncLogs(restaurantId: ID!, limit: Int = 10): [IngredientCategorySyncLog!]!

  warehouses(restaurantId: ID!): [Warehouse!]!

  stockItems(
    restaurantId: ID!
    warehouseId: ID
    ingredientIds: [ID!]
    lowOnly: Boolean
    limit: Int = 200
  ): [StockItem!]!

  menuItemsWithRecipes(
    restaurantId: ID!
    timeSlot: TimeSlot
    search: String
    categoryId: ID
    first: Int = 30
    after: String
  ): MenuItemsWithRecipes!

  recipe(restaurantId: ID!, menuItemId: ID!): Recipe
  recipeTrash(restaurantId: ID!, limit: Int = 200): [RecipeTrashItem!]!

  recipesByMenuItems(restaurantId: ID!, menuItemIds: [ID!]!): [Recipe!]!

  stockMovements(
    restaurantId: ID!
    warehouseId: ID
    ingredientId: ID
    type: MovementType
    orderCode: String
    dateFrom: DateTime
    dateTo: DateTime
    limit: Int = 200
    sort: Int = -1
  ): [StockMovement!]!

  stockMovementSummary(
    restaurantId: ID!
    warehouseId: ID
    ingredientId: ID
    dateFrom: DateTime
    dateTo: DateTime
  ): MovementSummary!

  menuItemsUsingIngredient(
    restaurantId: ID!
    ingredientId: ID!
    limit: Int = 100
  ): [MenuItem!]!
}

# ================================
# MUTATION
# ================================

extend type Mutation {
  createIngredient(input: CreateIngredientInput!): Ingredient!
  updateIngredient(input: UpdateIngredientInput!): Ingredient!
  deleteIngredient(id: ID!): Boolean!
  restoreIngredient(id: ID!): Ingredient!
  deleteIngredientPermanently(id: ID!): Boolean!
  createIngredientCategory(input: CreateIngredientCategoryInput!): IngredientCategory!
  updateIngredientCategory(input: UpdateIngredientCategoryInput!): IngredientCategory!
  deleteIngredientCategory(id: ID!): Boolean!
  syncIngredientCategoriesFromIngredients(restaurantId: ID!): [IngredientCategory!]!
  syncIngredientCategories(restaurantId: ID!): IngredientCategorySyncReport!

  createWarehouse(input: CreateWarehouseInput!): Warehouse!
  updateWarehouse(input: UpdateWarehouseInput!): Warehouse!
  deleteWarehouse(id: ID!): Boolean!
  recordIngredientUsed(restaurantId: ID!, ingredientId: ID!): Boolean!
  upsertStockItem(
    restaurantId: ID!
    warehouseId: ID!
    ingredientId: ID!
    onHand: Float
    reserved: Float
    batches: [StockBatchInput!]
  ): StockItem!

  adjustStock(
    restaurantId: ID!
    warehouseId: ID!
    ingredientId: ID!
    qty: Float!
    reason: String
  ): StockItem!

  transferStock(
    restaurantId: ID!
    fromWarehouseId: ID!
    toWarehouseId: ID!
    ingredientId: ID!
    qty: Float!
    reason: String
  ): Boolean!

  receiveStock(
    restaurantId: ID!
    warehouseId: ID!
    ingredientId: ID!
    qty: Float!
    costPerBaseUnit: Float!
    reason: String
    lot: String
    expiry: DateTime
    supplierNote: String
  ): StockItem!

  upsertRecipe(input: UpsertRecipeInput!): Recipe!
  deleteRecipe(restaurantId: ID!, menuItemId: ID!): Boolean!
  restoreRecipe(restaurantId: ID!, menuItemId: ID!): Recipe!
  deleteRecipePermanently(restaurantId: ID!, menuItemId: ID!): Boolean!

  consumeForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  reserveForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  commitReservationForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
  cancelReservationForOrder(input: ConsumeForOrderInput!): ConsumptionResult!
}
