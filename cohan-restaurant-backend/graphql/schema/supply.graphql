type SupplyCategory {
  id: ID!
  restaurantId: ID!
  name: String!
  slug: String!
  source: String
  usageCount: Int
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

type SupplyCategorySuggestion {
  categoryId: ID
  categoryName: String!
  categorySlug: String
  reason: String
  confidence: Float!
  matchedKeyword: String
  existing: Boolean!
  autoSelected: Boolean!
}

type Supply {
  id: ID!
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  unit: Unit!
  costPerUnit: Float
  pricePerUnit: Float
  minStock: Float
  notes: String
  isActive: Boolean
  deletedAt: DateTime
  deleteExpiresAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
}

input StockTransferInput {
  restaurantId: ID!
  fromWarehouseId: ID!
  toWarehouseId: ID!
  supplyId: ID!
  qty: Float!
  reason: String
  meta: JSON
}

type SupplyWithStock {
  id: ID!
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  unit: Unit!
  costPerUnit: Float
  pricePerUnit: Float
  minStock: Float
  notes: String
  isActive: Boolean
  deletedAt: DateTime
  deleteExpiresAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
  stockItem: StockItem
}

input CreateSupplyInput {
  restaurantId: ID!
  name: String!
  sku: String
  category: String
  unit: Unit = unit
  costPerUnit: Float
  pricePerUnit: Float
  minStock: Float
  notes: String
  isActive: Boolean = true
}

input UpdateSupplyInput {
  name: String
  sku: String
  category: String
  unit: Unit
  costPerUnit: Float
  pricePerUnit: Float
  minStock: Float
  notes: String
  isActive: Boolean
}

input AdjustSupplyInput {
  restaurantId: ID!
  warehouseId: ID!
  supplyId: ID!
  qty: Float!
  reason: String
  meta: JSON
}

input StockInboundInput {
  restaurantId: ID!
  warehouseId: ID!
  supplyId: ID!
  qty: Float!
  costPerBaseUnit: Float
  lot: String
  expiry: DateTime
  supplier: String
  reason: String
  meta: JSON
}

input StockOutboundInput {
  restaurantId: ID!
  warehouseId: ID!
  supplyId: ID!
  qty: Float!
  reason: String
  meta: JSON
}

extend type Query {
  supplies(restaurantId: ID!, warehouseId: ID): [SupplyWithStock!]!
  supply(id: ID!): SupplyWithStock
  supplyTrash(restaurantId: ID!, warehouseId: ID, limit: Int = 200): [SupplyWithStock!]!
  supplyStockItems(restaurantId: ID!, supplyId: ID): [StockItem!]!
  supplyCategories(restaurantId: ID!, search: String, includeInactive: Boolean = false, limit: Int = 200): [SupplyCategory!]!
  suggestSupplyCategory(restaurantId: ID!, name: String!, category: String): SupplyCategorySuggestion
}

extend type Mutation {
  createSupply(input: CreateSupplyInput!): Supply!
  updateSupply(id: ID!, input: UpdateSupplyInput!): Supply!
  deleteSupply(id: ID!): Boolean!
  restoreSupply(id: ID!): Supply!
  stockTransfer(input: StockTransferInput!): Boolean!
  adjustSupply(input: AdjustSupplyInput!): StockItem!
  stockInbound(input: StockInboundInput!): StockItem!
  stockOutbound(input: StockOutboundInput!): StockItem!
}
