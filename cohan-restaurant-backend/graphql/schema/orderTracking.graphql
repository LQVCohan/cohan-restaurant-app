enum OrderTrackingEventType {
  status_changed
  item_status_changed
  items_updated
  payment_updated
  shipping_updated
  print
  note_added
  refund
  system_adjustment
  other
}

enum OrderTrackingActorType {
  user
  customer
  system
  third_party
}

enum OrderTrackingChannel {
  pos
  waiter_app
  kitchen_display
  customer_app
  web_portal
  integration
  system
  other
}

# ENUM mới cho status code chuẩn hoá
enum PaymentStatusCode {
  SUCCESS
  PENDING
  FAILED
  REFUNDED
  PARTIALLY_REFUNDED
  CANCELED
}

type OrderTrackingActor {
  type: OrderTrackingActorType!
  userId: ID
  customerId: ID
  name: String
}

type OrderTrackingClientMeta {
  ip: String
  userAgent: String
  deviceId: String
  appVersion: String
}

type OrderTrackingShippingCheckpointLocation {
  lat: Float
  lng: Float
  address: String
}

type OrderTrackingShippingCheckpoint {
  status: String
  description: String
  location: OrderTrackingShippingCheckpointLocation
  externalRef: String
  eta: DateTime
}

type OrderTrackingSnapshotTotals {
  subtotal: Float
  discount: Float
  tax: Float
  service: Float
  shippingFee: Float
  grandTotal: Float
}

type OrderTrackingSnapshotPayment {
  method: String
  rawStatus: String
  statusCode: PaymentStatusCode
  paidAmount: Float
  changeAmount: Float
  currency: String
}

type OrderTrackingSnapshotShipping {
  fullName: String
  phone: String
  address: String
  distance: Float
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

type OrderTrackingSnapshot {
  currentStatus: String
  orderType: String
  tableCode: String
  guestCount: Int
  totals: OrderTrackingSnapshotTotals
  payment: OrderTrackingSnapshotPayment
  shipping: OrderTrackingSnapshotShipping
}

type OrderTracking {
  id: ID!
  orderId: ID!
  orderCode: String!
  restaurantId: ID!
  eventType: OrderTrackingEventType!

  statusFrom: String
  statusTo: String

  itemId: ID
  itemName: String
  itemStatusFrom: String
  itemStatusTo: String

  paymentStatusRawFrom: String
  paymentStatusRawTo: String

  paymentStatusCodeFrom: PaymentStatusCode
  paymentStatusCodeTo: PaymentStatusCode

  paymentChange: JSON

  shippingStatusFrom: String
  shippingStatusTo: String
  shippingCheckpoint: OrderTrackingShippingCheckpoint

  actor: OrderTrackingActor
  channel: OrderTrackingChannel!
  clientMeta: OrderTrackingClientMeta

  snapshot: OrderTrackingSnapshot

  note: String
  meta: JSON

  createdAt: DateTime!
  updatedAt: DateTime!
}

input UploadOrderItemProofInput {
  restaurantId: ID
  orderId: ID!
  orderItemId: ID!
  proofImages: [String!]!
  note: String
}

input SetOrderItemProofWaiverInput {
  restaurantId: ID
  orderId: ID!
  orderItemId: ID!
  waived: Boolean!
  reason: String
}

type CustomerTrackingTimelineItem {
  status: String
  displayMessage: String
  changedAt: DateTime
}

type CustomerTrackingDeliveryTimelineItem {
  status: String
  label: String
  at: DateTime
  note: String
}

type CustomerTrackingDelivery {
  orderType: String
  deliveryStatus: String
  deliveryStatusLabel: String
  shippingAddress: String
  eta: DateTime
  distance: Float
  duration: Float
  driverName: String
  driverPhone: String
  driverVehiclePlate: String
  externalTrackingCode: String
  timeline: [CustomerTrackingDeliveryTimelineItem!]!
}

type CustomerTrackingPayment {
  status: String!
  method: String
  provider: String
  canRequestPayment: Boolean!
  totalAmount: Int!
}

type CustomerTrackingLatestRequest {
  requestId: String!
  type: String!
  status: String!
  message: String
  createdAt: DateTime
  acknowledgedAt: DateTime
  resolvedAt: DateTime
}

type CustomerTrackingItem {
  name: String
  quantity: Float
  publicStatus: String
  publicStatusLabel: String
  proofImages: [String!]!
  requiresProofImage: Boolean!
  proofUploaded: Boolean!
}

type CustomerTracking {
  trackingCode: String
  publicStatus: String
  publicStatusLabel: String
  customerVisibleNote: String
  estimatedReadyAt: DateTime
  timeline: [CustomerTrackingTimelineItem!]!
  items: [CustomerTrackingItem!]!
  delivery: CustomerTrackingDelivery
  payment: CustomerTrackingPayment!
  latestRequest: CustomerTrackingLatestRequest
}

type CustomerTrackingActionPayload {
  success: Boolean!
  message: String
  tracking: CustomerTracking
}

type CustomerServiceRequest {
  orderId: ID!
  orderCode: String
  trackingCode: String
  tableCode: String
  requestId: String!
  type: String!
  status: String!
  message: String
  createdAt: DateTime
  acknowledgedAt: DateTime
  resolvedAt: DateTime
}

type OrderSubscriptionEvent {
  type: String
  order: Order
  payload: JSON
  meta: JSON
}

extend type Query {
  orderTrackingByOrderId(orderId: ID!): [OrderTracking!]!
  orderTrackingByOrderCode(
    restaurantId: ID!
    orderCode: String!
  ): [OrderTracking!]!

  customerTrackOrder(trackingToken: String!): CustomerTracking
  customerServiceRequests(
    restaurantId: ID!
    status: String
    type: String
    limit: Int
  ): [CustomerServiceRequest!]!
  orderTrackingQrSvg(orderId: ID!): String!

  myOrders(limit: Int = 20, cursor: ID): OrdersConnection!
  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!

  order(id: ID!): Order
  orders(filter: OrderFilterInput, limit: Int, offset: Int): OrderList!
  previewOrderDiscount(input: PreviewOrderDiscountInput!): DiscountBreakdown!
  ordersByRestaurantNow(restaurantId: ID!, limit: Int, cursor: ID): OrdersConnection!
  ordersByRestaurant(restaurantId: ID!, limit: Int, cursor: ID): OrdersConnection!
  futureReservationOrders(restaurantId: ID!, limit: Int): [Order!]!
  ordersByTableCode(
    restaurantId: ID!
    tableCode: String!
    limit: Int
    offset: Int
  ): OrderList!
  ordersGroupedByTable(
    restaurantId: ID!
    tableId: ID
    tableCode: String
  ): [OrderGroup!]!
  activeTableSessionOrders(
    restaurantId: ID!
    tableId: ID!
  ): ActiveTableSessionOrdersResult!
}

extend type Mutation {
  requestPaymentFromTracking(trackingToken: String!): CustomerTrackingActionPayload!
  callStaffFromTracking(trackingToken: String!, reason: String): CustomerTrackingActionPayload!
  acknowledgeCustomerServiceRequest(
    restaurantId: ID!
    orderId: ID!
    requestId: String!
  ): ActionResultPayload!
  resolveCustomerServiceRequest(
    restaurantId: ID!
    orderId: ID!
    requestId: String!
  ): ActionResultPayload!

  uploadOrderItemProof(input: UploadOrderItemProofInput!): UpdateOrderItemStatusPayload!
  setOrderItemProofWaiver(input: SetOrderItemProofWaiverInput!): UpdateOrderItemStatusPayload!
  cancelOrder(restaurantId: ID!, orderId: ID!, reason: String): CancelOrderPayload!
  createOrderForTable(input: CreateOrderForTableInput!): CreateOrderForTablePayload!
  createOffPremiseOrder(input: CreateOffPremiseOrderInput!): CreateOffPremiseOrderPayload!
  createStaffRemoteOrder(input: CreateStaffRemoteOrderInput!): CreateStaffRemoteOrderPayload!
  confirmIncomingOrder(input: ConfirmIncomingOrderInput!): ConfirmIncomingOrderPayload!
  rejectIncomingOrder(input: RejectIncomingOrderInput!): RejectIncomingOrderPayload!
  createTemporaryBillPrintJob(input: CreateTemporaryBillPrintJobInput!): ActionResultPayload!
  requestPaymentForOrder(input: RequestPaymentForOrderInput!): ActionResultPayload!
  requestPaymentForTable(input: RequestPaymentForTableInput!): ActionResultPayload!
  remindOrderItem(input: RemindOrderItemInput!): ActionResultPayload!
  createCheckoutOrders(input: CreateCheckoutOrdersInput!): CreateCheckoutOrdersPayload!

  updateOrderStatus(input: UpdateOrderStatusInput!): Order!
  updateOrderItemStatus(input: UpdateOrderItemStatusInput!): UpdateOrderItemStatusPayload!
  updateOrderItemPriority(input: UpdateOrderItemPriorityInput!): UpdateOrderItemPriorityPayload!
  updateOrderCustomerByCode(input: UpdateOrderCustomerByCodeInput!): UpdateOrderCustomerByCodePayload!
  adjustOrderItemQuantity(input: AdjustOrderItemQuantityInput!): Order!
  requestOrderItemVoid(input: RequestOrderItemVoidInput!): Order!
  reviewOrderItemVoid(input: ReviewOrderItemVoidInput!): Order!
  requestOrderItemReturn(input: RequestOrderItemReturnInput!): Order!
  reviewOrderItemReturn(input: ReviewOrderItemReturnInput!): Order!
}

extend type Subscription {
  orderEvents(restaurantId: ID!): OrderSubscriptionEvent
}
