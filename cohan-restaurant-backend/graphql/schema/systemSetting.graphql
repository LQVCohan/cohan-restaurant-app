type SystemSettingOperational {
  businessDayStartHour: Int!
  defaultLanguage: String!
}

type SystemSettingModules {
  scheduling: Boolean!
  rbac: Boolean!
  printing: Boolean!
  backup: Boolean!
}

type SystemSettingOvertimeLimit {
  maxMinutesPerDay: Int!
}

type SystemSettingOvertimeRoleGroupLimits {
  service: SystemSettingOvertimeLimit!
  kitchen: SystemSettingOvertimeLimit!
  shiftManager: SystemSettingOvertimeLimit!
}

type SystemSettingOvertimePolicy {
  enabled: Boolean!
  defaultMaxMinutesPerDay: Int!
  roleGroupLimits: SystemSettingOvertimeRoleGroupLimits!
}

type SystemSettingMetadata {
  note: String
  version: Int!
}

type SystemSetting {
  id: ID!
  restaurantId: ID!
  timezone: String!
  currency: String!
  dateFormat: String!
  operational: SystemSettingOperational!
  modules: SystemSettingModules!
  overtimePolicy: SystemSettingOvertimePolicy!
  metadata: SystemSettingMetadata!
  updatedBy: ID
  createdAt: DateTime
  updatedAt: DateTime
}

input SystemSettingOperationalInput {
  businessDayStartHour: Int
  defaultLanguage: String
}

input SystemSettingModulesInput {
  scheduling: Boolean
  rbac: Boolean
  printing: Boolean
  backup: Boolean
}

input SystemSettingOvertimeLimitInput {
  maxMinutesPerDay: Int
}

input SystemSettingOvertimeRoleGroupLimitsInput {
  service: SystemSettingOvertimeLimitInput
  kitchen: SystemSettingOvertimeLimitInput
  shiftManager: SystemSettingOvertimeLimitInput
}

input SystemSettingOvertimePolicyInput {
  enabled: Boolean
  defaultMaxMinutesPerDay: Int
  roleGroupLimits: SystemSettingOvertimeRoleGroupLimitsInput
}

input UpdateSystemSettingInput {
  restaurantId: ID!
  timezone: String
  currency: String
  dateFormat: String
  operational: SystemSettingOperationalInput
  modules: SystemSettingModulesInput
  overtimePolicy: SystemSettingOvertimePolicyInput
  note: String
}

extend type Query {
  systemSetting(restaurantId: ID!): SystemSetting!
}

extend type Mutation {
  updateSystemSetting(input: UpdateSystemSettingInput!): SystemSetting!
}
