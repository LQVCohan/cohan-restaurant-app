type RestaurantPaymentCredentialStatus {
  restaurantId: ID!
  provider: String!
  mode: String!
  configured: Boolean!
  source: String!
  maskedIdentifier: String!
  version: Int!
  updatedAt: DateTime
}

type RestaurantPaymentIntegrationReadiness {
  provider: String!
  mode: String!
  publicBaseUrl: String!
  webBaseUrl: String!
  returnUrl: String!
  ipnUrl: String!
  gatewayUrl: String!
  paymentChannel: String!
  encryptionReady: Boolean!
  callbackReady: Boolean!
  webReturnReady: Boolean!
  ready: Boolean!
  blockers: [String!]!
}

input SaveRestaurantPaymentCredentialInput {
  restaurantId: ID!
  provider: String!
  mode: String!
  credentialPayload: JSON!
}

extend type PaymentProviderPublicConfig {
  configured: Boolean!
  credentialSource: String!
}

extend type Query {
  restaurantPaymentCredentialStatuses(restaurantId: ID!): [RestaurantPaymentCredentialStatus!]!
  restaurantPaymentIntegrationReadiness(restaurantId: ID!): [RestaurantPaymentIntegrationReadiness!]!
}

extend type Mutation {
  saveRestaurantPaymentCredential(input: SaveRestaurantPaymentCredentialInput!): RestaurantPaymentCredentialStatus!
  disconnectRestaurantPaymentCredential(restaurantId: ID!, provider: String!, mode: String!): RestaurantPaymentCredentialStatus!
}
