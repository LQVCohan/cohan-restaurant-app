# ponytail: staff self-service operation compatibility fields.

extend input RespondShiftAcknowledgementInput {
  shiftId: ID
  response: String
  reasonCategory: String
}

extend type AttendanceCorrectionRequest {
  timesheetId: ID
  shiftId: ID
  workDate: DateTime
  correctionType: String
  requestedCheckInAt: DateTime
  requestedCheckOutAt: DateTime
  requestedAt: DateTime
}

extend type OvertimeRequest {
  shiftId: ID
  timesheetId: ID
  workDate: DateTime
  plannedStartTime: DateTime
  plannedEndTime: DateTime
  plannedOvertimeMinutes: Int
  overtimeType: String
  requestedAt: DateTime
}
