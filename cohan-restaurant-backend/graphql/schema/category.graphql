type Category {
  id: ID!
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String!
  order: Int
  isActive: Boolean
  menuItemCount: Int! # ✅ mới thêm
  createdAt: DateTime
  updatedAt: DateTime
}

input CreateCategoryInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String!
  order: Int
}

input UpdateCategoryInput {
  id: ID!
  name: String
  order: Int
  isActive: Boolean
}

extend type Query {
  categories(restaurantId: ID!, timeSlot: TimeSlot!): [Category!]!

  # ✅ Query mới: 6 category có nhiều món nhất (limit chỉnh được)
  topCategoriesByMenuItemCount(
    restaurantId: ID!
    timeSlot: TimeSlot!
    limit: Int = 6
  ): [Category!]!
  topGlobalCategoriesByMenuItemCount(
    timeSlot: TimeSlot
    limit: Int = 6
  ): [Category!]!
}

extend type Mutation {
  createCategory(input: CreateCategoryInput!): Category!
  updateCategory(input: UpdateCategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!
}
