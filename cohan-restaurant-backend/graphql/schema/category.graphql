type Category {
  id: ID!
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String!
  order: Int
  isActive: Boolean
  createdAt: Date
  updatedAt: Date
}

input CreateCategoryInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String!
  order: Int
}

input UpdateCategoryInput {
  id: ID!
  name: String
  order: Int
  isActive: Boolean
}

extend type Query {
  categories(restaurantId: ID!, timeSlot: TimeSlot!): [Category!]!
}

extend type Mutation {
  createCategory(input: CreateCategoryInput!): Category!
  updateCategory(input: UpdateCategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!
}
