  payrollItemId: ID
  periodId: ID
  periodName: String
  periodStartDate: DateTime
  periodEndDate: DateTime
  periodStatus: String
  periodFinalizedAt: DateTime
  name: String
  code: String
  role: String
  department: String
  avatar: String
  baseSalary: Float
  workDays: Float
  actualWorkDays: Float
  totalHours: Float
  hourlyRate: Float
  salaryType: String
  commissionRate: Float
  regularHours: Float
  commissionableAmount: Float
  salaryConfigurationIssue: String
  allowance: Float
  bonus: Float
  otherAddition: Float
  overtime: Float
  overtimeNormal: Float
  overtimeWeekend: Float
  overtimeHoliday: Float
  nightShiftExtra: Float
  overtimeHours: Float
  overtimeNormalHours: Float
  overtimeWeekendHours: Float
  overtimeHolidayHours: Float
  nightHours: Float
  overtimeNightHours: Float
  deduction: Float
  otherDeduction: Float
  advance: Float
  insuranceSocial: Float
  insuranceHealth: Float
  insuranceUnemployment: Float
  insuranceTotal: Float
  insuranceEmployerTotal: Float
  personalIncomeTax: Float
  grossIncome: Float
  coefficient: Float
  totalIncome: Float
  totalDeduction: Float
  netSalary: Float
  policyCode: String
  policyEffectiveFrom: DateTime
  regionCode: String
  minimumWageMonthly: Float
  minimumWageHourly: Float
  minimumWageViolation: Boolean
  insuranceEligible: Boolean
  warningMessages: [String!]
  status: String
  paidAmount: Float
  remainingAmount: Float
  paidAt: DateTime
  lateMinutes: Float
  earlyLeaveMinutes: Float
  unpaidLeaveDays: Float
  paidLeaveDays: Float
  scheduleShiftCount: Float
  manualAdjustmentTotal: Float
}

type PayrollPaginationInfo {
  totalCount: Int!
  limit: Int!
  offset: Int!
  page: Int!
  pageSize: Int!
  totalPages: Int!
  hasMore: Boolean!
}

type StaffPayrollOverviewPage {
  stats: PayrollStats!
  items: [StaffPayrollItem!]!
  pageInfo: PayrollPaginationInfo!
}

extend type Query {
  staffPayrollOverviewPage(
    startDate: DateTime!
    endDate: DateTime!
    restaurantId: ID
    periodId: ID
    search: String
    status: String
    limit: Int = 10
    offset: Int = 0
  ): StaffPayrollOverviewPage!
}
