type PayrollPaginationInfo {
  totalCount: Int!
  limit: Int!
  offset: Int!
  page: Int!
  pageSize: Int!
  totalPages: Int!
  hasMore: Boolean!
}

type StaffPayrollOverviewPage {
  stats: PayrollStats!
  items: [StaffPayrollItem!]!
  pageInfo: PayrollPaginationInfo!
}

extend type Query {
  staffPayrollOverviewPage(
    startDate: DateTime!
    endDate: DateTime!
    restaurantId: ID
    periodId: ID
    search: String
    status: String
    limit: Int = 10
    offset: Int = 0
  ): StaffPayrollOverviewPage!
}
