# =========================================================
# ENUMS
# =========================================================

enum ModifierGroupType {
  SIZE
  TOPPING
  PREPARATION
  CUSTOM
}

enum ModifierCoverage {
  GLOBAL
  ITEMS
}

enum ModifierSelectionType {
  single
  multiple
}

enum ModifierPriceRuleType {
  DELTA
  SET
}

enum ModifierInventoryRuleType {
  NONE
  ADD_INGREDIENTS
  REPLACE_INGREDIENTS
  MULTIPLY_BASE_RECIPE
}

# =========================================================
# VALUE OBJECTS
# =========================================================

type ModifierInventoryIngredientLine {
  ingredientId: ID!
  qty: Float!
  unit: String! # must match UnitEnum in BE (g, kg, ml, l, unit, piece,...)
  wastePct: Float # 0..100
}

input ModifierInventoryIngredientLineInput {
  ingredientId: ID!
  qty: Float!
  unit: String!
  wastePct: Float
}

type ModifierPriceRule {
  rule: ModifierPriceRuleType!
  amount: Float! # VND; DELTA can be negative; SET must be >= 0
}

input ModifierPriceRuleInput {
  rule: ModifierPriceRuleType!
  amount: Float!
}

type ModifierInventoryRule {
  rule: ModifierInventoryRuleType!

  ingredientLines: [ModifierInventoryIngredientLine!]!
  baseRecipeMultiplier: Float
  note: String
}

input ModifierInventoryRuleInput {
  rule: ModifierInventoryRuleType!
  ingredientLines: [ModifierInventoryIngredientLineInput!]
  baseRecipeMultiplier: Float
  note: String
}

# =========================================================
# OPTION
# =========================================================

type ModifierOption {
  id: ID!
  name: String!
  isDefault: Boolean
  isActive: Boolean

  priceRule: ModifierPriceRule!
  inventoryRule: ModifierInventoryRule!
}

input ModifierOptionInput {
  name: String!
  isDefault: Boolean
  isActive: Boolean

  priceRule: ModifierPriceRuleInput!
  inventoryRule: ModifierInventoryRuleInput!
}

# =========================================================
# GROUP
# =========================================================

type ModifierGroup {
  id: ID!
  restaurantId: ID!
  name: String!

  groupType: ModifierGroupType!
  coverage: ModifierCoverage!

  # if coverage=ITEMS => must have values
  # if coverage=GLOBAL => must be empty
  menuItemIds: [ID!]!

  selectionType: ModifierSelectionType!
  required: Boolean

  minSelected: Int
  maxSelected: Int

  options: [ModifierOption!]!

  note: String
  isActive: Boolean

  createdAt: DateTime
  updatedAt: DateTime
}

# =========================================================
# INPUTS — CREATE / UPDATE
# =========================================================

input CreateModifierGroupInput {
  restaurantId: ID!
  name: String!

  groupType: ModifierGroupType! = CUSTOM
  coverage: ModifierCoverage! = ITEMS
  menuItemIds: [ID!]

  selectionType: ModifierSelectionType! = multiple
  required: Boolean = false
  minSelected: Int = 0
  maxSelected: Int

  options: [ModifierOptionInput!]!

  note: String
  isActive: Boolean = true
}

input UpdateModifierGroupInput {
  id: ID!

  name: String

  groupType: ModifierGroupType
  coverage: ModifierCoverage
  menuItemIds: [ID!]

  selectionType: ModifierSelectionType
  required: Boolean
  minSelected: Int
  maxSelected: Int

  options: [ModifierOptionInput!]

  note: String
  isActive: Boolean
}

# =========================================================
# FILTERS (for Query)
# =========================================================

input ModifierGroupFilterInput {
  restaurantId: ID!
  search: String

  # fetch groups applicable to a menu item:
  # - coverage=GLOBAL OR (coverage=ITEMS and menuItemIds contains menuItemId)
  menuItemId: ID

  groupType: ModifierGroupType
  isActive: Boolean = true
}

# =========================================================
# QUERIES / MUTATIONS
# =========================================================

extend type Query {
  # list groups with filters (cleaner than separate params)
  modifierGroups(filter: ModifierGroupFilterInput!): [ModifierGroup!]!

  modifierGroup(id: ID!): ModifierGroup
}

extend type Mutation {
  # Group CRUD
  createModifierGroup(input: CreateModifierGroupInput!): ModifierGroup!
  updateModifierGroup(input: UpdateModifierGroupInput!): ModifierGroup!
  deleteModifierGroup(id: ID!): Boolean!

  # Option CRUD (operate on a group)
  addModifierOption(groupId: ID!, option: ModifierOptionInput!): ModifierGroup!
  updateModifierOption(
    groupId: ID!
    optionId: ID!
    option: ModifierOptionInput!
  ): ModifierGroup!
  removeModifierOption(groupId: ID!, optionId: ID!): ModifierGroup!
}
