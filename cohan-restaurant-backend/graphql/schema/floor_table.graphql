enum TableStatus {
  available
  occupied
  reserved
  cleaning
  offline
  payment_pending
}

enum TableType {
  standard
  booth
  vip
  outdoor
  bar
  private
}

type Floor {
  id: ID!
  restaurantId: ID!
  name: String!
  level: Int!
  description: String
  planImage: String
  isActive: Boolean
  isWatching: Boolean
  layout: JSON
  meta: FloorMeta
  createdAt: DateTime
  updatedAt: DateTime
  viewLockUserId: ID
  viewLockExpiresAt: DateTime
  isViewingLocked: Boolean
  viewLockViewerName: String
}

type FloorMeta {
  width: Int
  height: Int
}

input FloorMetaInput {
  width: Int
  height: Int
}

input CreateFloorInput {
  restaurantId: ID!
  name: String!
  level: Int!
  description: String
  planImage: String
  isActive: Boolean
  isWatching: Boolean
  layout: JSON
  meta: FloorMetaInput
}

input UpdateFloorInput {
  id: ID!
  name: String
  level: Int
  description: String
  planImage: String
  isActive: Boolean
  isWatching: Boolean
  layout: JSON
  meta: FloorMetaInput
}

type Position {
  x: Float!
  y: Float!
  rotation: Float
  shape: String
  w: Float
  h: Float
  path: String
}

input PositionInput {
  x: Float!
  y: Float!
  rotation: Float
  shape: String
  w: Float
  h: Float
  path: String
}

type Table {
  id: ID!
  restaurantId: ID!
  floorId: ID!
  code: String!
  type: TableType!
  capacity: Int!
  position: Position!
  photos: [String!]!
  vrUrl: String
  notes: String
  visualConfig: JSON
  tableAccessUrl: String
  tableQrCodeDataUrl: String
  tableQrGeneratedAt: DateTime
  tableQrExpiresAt: DateTime
  status: TableStatus!
  nextReservationAt: DateTime
  reservationGraceEndsAt: DateTime
  reservationPhase: String
  reservationId: ID
  reservationOrderCode: String
  reservationStatus: String
  reservationCustomerName: String
  reservationCustomerPhone: String
  reservationCustomerEmail: String
  reservationPartySize: Int
  floorLevel: Int
  deposit: Int
  tags: [String!]
  zone: String
  promotionIds: [ID!]
  bookingPerks: [String!]
  reservationHoldMinutes: Int
  minSpend: Float
  cancelPolicy: String
  isJoinable: Boolean
  joinGroupId: String
  mergedFromTableIds: [ID!]
  mergeAnchorTableId: ID
  mergedAt: DateTime
  mergeDetails: JSON
  createdAt: DateTime
  updatedAt: DateTime
  viewLockUserId: ID
  viewLockExpiresAt: DateTime
  isViewingLocked: Boolean
  viewLockViewerName: String
}

input CreateTableInput {
  restaurantId: ID!
  floorId: ID!
  code: String!
  type: TableType = standard
  capacity: Int!
  position: PositionInput!
  deposit: Int
  photos: [String!]
  vrUrl: String
  notes: String
  visualConfig: JSON
  status: TableStatus
  tags: [String!]
  isJoinable: Boolean
  joinGroupId: String
}

input UpdateTableInput {
  id: ID!
  code: String
  type: TableType
  capacity: Int
  position: PositionInput
  photos: [String!]
  deposit: Int
  vrUrl: String
  notes: String
  visualConfig: JSON
  status: TableStatus
  tags: [String!]
  zone: String
  promotionIds: [ID!]
  bookingPerks: [String!]
  reservationHoldMinutes: Int
  minSpend: Float
  cancelPolicy: String
  isJoinable: Boolean
  joinGroupId: String
}

input MoveTableInput {
  id: ID!
  floorId: ID
  position: PositionInput
}

input SetTableStatusInput {
  id: ID!
  status: TableStatus!
}

input SwapTableCodesInput {
  restaurantId: ID!
  floorId: ID!
  aId: ID!
  bId: ID!
}

input BulkUpsertTablesInput {
  restaurantId: ID!
  floorId: ID!
  items: [BulkTableItemInput!]!
}

input BulkTableItemInput {
  code: String!
  type: TableType = standard
  capacity: Int!
  position: PositionInput!
  photos: [String!]
  deposit: Int
  vrUrl: String
  notes: String
  status: TableStatus
  tags: [String!]
  isJoinable: Boolean
  joinGroupId: String
}

input GenerateTableAccessQrInput {
  tableId: ID!
  baseUrl: String!
}

input MergeTablesInput {
  restaurantId: ID!
  tableIds: [ID!]!
  anchorId: ID!
  joinGroupId: String
}

type MergeResult {
  joinGroupId: String!
  anchorId: ID!
  tableIds: [ID!]!
  mergedTableId: ID!
  mergedTableCode: String!
}

input SplitTablesInput {
  restaurantId: ID!
  joinGroupId: String!
  mode: SplitMode!
  itemIds: [ID!]
  tableIds: [ID!]
  createNewTable: Boolean
}

enum SplitMode {
  ALL
  PARTIAL
}

type SplitResult {
  ok: Boolean!
  unmergedTableIds: [ID!]!
}

extend type Query {
  floors(restaurantId: ID!): [Floor!]!
  floorByLevel(restaurantId: ID!, level: Int!): Floor
  floor(id: ID!): Floor
  publicFloors(restaurantId: ID!): [Floor!]!

  tables(
    restaurantId: ID!
    floorId: ID
    status: TableStatus
    type: TableType
    search: String
    limit: Int = 200
  ): [Table!]!
  tableByCode(restaurantId: ID!, floorId: ID!, code: String!): Table
  tableQrAccessList(restaurantId: ID!): [Table!]!
  publicTables(
    restaurantId: ID!
    floorId: ID
    status: TableStatus
    type: TableType
    limit: Int = 200
  ): [Table!]!
}

extend type Mutation {
  mergeTables(input: MergeTablesInput!): MergeResult!
  splitTables(input: SplitTablesInput!): SplitResult!
  createFloor(input: CreateFloorInput!): Floor!
  updateFloor(input: UpdateFloorInput!): Floor!
  deleteFloor(id: ID!): Boolean!
  createTable(input: CreateTableInput!): Table!
  updateTable(input: UpdateTableInput!): Table!
  deleteTable(id: ID!): Boolean!
  moveTable(input: MoveTableInput!): Table!
  setTableStatus(input: SetTableStatusInput!): Table!
  swapTableCodes(input: SwapTableCodesInput!): Boolean!
  bulkUpsertTables(input: BulkUpsertTablesInput!): Int!
  generateTableAccessQr(input: GenerateTableAccessQrInput!): Table!
  revokeTableAccessQr(tableId: ID!): Table!
  acquireTableViewLock(input: AcquireTableViewLockInput!): Table!
  releaseTableViewLock(input: ReleaseTableViewLockInput!): Table
}

input AcquireTableViewLockInput {
  tableId: ID!
  userId: ID
  sessionId: String
  viewerName: String
}

input ReleaseTableViewLockInput {
  tableId: ID!
  userId: ID
  sessionId: String
}
