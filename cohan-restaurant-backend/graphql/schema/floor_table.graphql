enum TableStatus {
  available
  occupied
  reserved
  cleaning
  offline
  payment_pending
}

enum TableType {
  standard
  booth
  vip
  outdoor
  bar
  private
}

type Floor {
  id: ID!
  restaurantId: ID!
  name: String!
  level: Int!
  description: String
  planImage: String
  isActive: Boolean
  isWatching: Boolean
  # Dữ liệu layout (decor items) cho Floor Plan Designer
  layout: JSON
  meta: FloorMeta
  createdAt: DateTime
  updatedAt: DateTime
  viewLockUserId: ID
  viewLockExpiresAt: DateTime
  isViewingLocked: Boolean
  viewLockViewerName: String
}

type FloorMeta {
  width: Int
  height: Int
}

input FloorMetaInput {
  width: Int
  height: Int
}

input CreateFloorInput {
  restaurantId: ID!
  name: String!
  level: Int!
  description: String
  planImage: String
  isActive: Boolean
  isWatching: Boolean
  # Cho phép gửi layout ngay khi tạo
  layout: JSON
  meta: FloorMetaInput
}

input UpdateFloorInput {
  id: ID!
  name: String
  level: Int
  description: String
  planImage: String
  isActive: Boolean
  isWatching: Boolean
  # Cập nhật layout khi save từ Designer
  layout: JSON
  meta: FloorMetaInput
}

type Position {
  x: Float!
  y: Float!
  rotation: Float
  shape: String
  w: Float
  h: Float
  path: String
}

input PositionInput {
  x: Float!
  y: Float!
  rotation: Float
  shape: String
  w: Float
  h: Float
  path: String
}

type Table {
  id: ID!
  restaurantId: ID!
  floorId: ID!
  code: String!
  type: TableType!
  capacity: Int!
  position: Position!
  photos: [String!]!
  vrUrl: String
  notes: String
  visualConfig: JSON
  status: TableStatus!
  floorLevel: Int
  deposit: Int
  tags: [String!]
  isJoinable: Boolean
  joinGroupId: String
  createdAt: DateTime
  updatedAt: DateTime
  viewLockUserId: ID
  viewLockExpiresAt: DateTime
  isViewingLocked: Boolean
  viewLockViewerName: String
}

input CreateTableInput {
  restaurantId: ID!
  floorId: ID!
  code: String!
  type: TableType = standard
  capacity: Int!
  position: PositionInput!
  deposit: Int
  photos: [String!]
  vrUrl: String
  notes: String
  visualConfig: JSON
  status: TableStatus
  tags: [String!]
  isJoinable: Boolean
  joinGroupId: String
}

input UpdateTableInput {
  id: ID!
  code: String
  type: TableType
  capacity: Int
  position: PositionInput
  photos: [String!]
  deposit: Int
  vrUrl: String
  notes: String
  visualConfig: JSON
  status: TableStatus
  tags: [String!]
  isJoinable: Boolean
  joinGroupId: String
}

input MoveTableInput {
  id: ID!
  floorId: ID
  position: PositionInput
}

input SetTableStatusInput {
  id: ID!
  status: TableStatus!
}

input SwapTableCodesInput {
  restaurantId: ID!
  floorId: ID!
  aId: ID!
  bId: ID!
}

input BulkUpsertTablesInput {
  restaurantId: ID!
  floorId: ID!
  items: [BulkTableItemInput!]!
}

input BulkTableItemInput {
  code: String!
  type: TableType = standard
  capacity: Int!
  position: PositionInput!
  photos: [String!]
  deposit: Int
  vrUrl: String
  notes: String
  status: TableStatus
  tags: [String!]
  isJoinable: Boolean
  joinGroupId: String
}

input MergeTablesInput {
  restaurantId: ID!
  tableIds: [ID!]! # các bàn sẽ vào 1 nhóm
  anchorId: ID! # bàn đại diện (hiển thị & nhận order)
  joinGroupId: String # nếu không truyền -> server tự sinh
}

type MergeResult {
  joinGroupId: String!
  anchorId: ID!
  tableIds: [ID!]!
}

input SplitTablesInput {
  restaurantId: ID!
  joinGroupId: String!
  # Chế độ tách:
  mode: SplitMode! # ALL | PARTIAL
  # Nếu PARTIAL, chỉ lock-in các itemIds chuyển đi:
  itemIds: [ID!]
  tableIds: ID # đổ item sang bàn có sẵn
  createNewTable: Boolean
}

enum SplitMode {
  ALL
  PARTIAL
}

type SplitResult {
  ok: Boolean!
  unmergedTableIds: [ID!]!
}

extend type Query {
  floors(restaurantId: ID!): [Floor!]!
  floorByLevel(restaurantId: ID!, level: Int!): Floor
  # Lấy chi tiết 1 tầng (bao gồm layout)
  floor(id: ID!): Floor

  publicFloors(restaurantId: ID!): [Floor!]!

  tables(
    restaurantId: ID!
    floorId: ID
    status: TableStatus
    type: TableType
    search: String
    limit: Int = 200
  ): [Table!]!
  tableByCode(restaurantId: ID!, floorId: ID!, code: String!): Table
  publicTables(
    restaurantId: ID!
    floorId: ID
    status: TableStatus
    type: TableType
    limit: Int = 200
  ): [Table!]!
}

extend type Mutation {
  mergeTables(input: MergeTablesInput!): MergeResult!
  splitTables(input: SplitTablesInput!): SplitResult!

  createFloor(input: CreateFloorInput!): Floor!
  updateFloor(input: UpdateFloorInput!): Floor!
  deleteFloor(id: ID!): Boolean! # hard delete; nếu muốn soft → đổi bool/flag
  createTable(input: CreateTableInput!): Table!
  updateTable(input: UpdateTableInput!): Table!
  deleteTable(id: ID!): Boolean!

  moveTable(input: MoveTableInput!): Table! # đổi sàn / đổi tọa độ
  setTableStatus(input: SetTableStatusInput!): Table! # đổi trạng thái nhanh
  swapTableCodes(input: SwapTableCodesInput!): Boolean! # hoán đổi code giữa 2 bàn
  bulkUpsertTables(input: BulkUpsertTablesInput!): Int! # trả về số bàn upsert
  acquireTableViewLock(input: AcquireTableViewLockInput!): Table!
  releaseTableViewLock(input: ReleaseTableViewLockInput!): Table
}


input AcquireTableViewLockInput {
  tableId: ID!
  userId: ID
  sessionId: String
  viewerName: String
}

input ReleaseTableViewLockInput {
  tableId: ID!
  userId: ID
  sessionId: String
}
