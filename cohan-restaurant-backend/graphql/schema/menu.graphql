enum TimeSlot {
  breakfast
  lunch
  dinner
  late_night
}

enum PriceUpdateMode {
  PERCENT
  AMOUNT
}

input BulkPriceUpdateTarget {
  categoryId: ID
  menuItemIds: [ID!]
}

input BulkPriceUpdateInput {
  restaurantId: ID!
  timeSlot: TimeSlot
  target: BulkPriceUpdateTarget!
  mode: PriceUpdateMode!
  value: Float!
  roundTo: Int
  floorZero: Boolean
}

type BulkPriceUpdateResult {
  updatedCount: Int!
  items: [MenuItem!]!
}

type Menu {
  id: ID!
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String
  description: String
  coverImage: String
  isActive: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

# Nếu không còn dùng PreparationMethod, có thể xoá hẳn 2 type dưới.
# Chị đã bỏ khỏi MenuItem nên chúng không còn được tham chiếu.
# type PreparationMethod { ... }
# input PreparationMethodInput { ... }

input MenuItemFilter {
  restaurantId: ID!
  timeSlot: TimeSlot
  categoryId: ID
  status: String
  search: String
  minPrice: Float
  maxPrice: Float
}

type MenuItemEdge {
  node: MenuItem!
  cursor: ID!
}

type MenuItemConnection {
  edges: [MenuItemEdge!]!
  pageInfo: PageInfo!
}

type MenuItem {
  id: ID!
  restaurantId: ID!
  menuId: ID!
  categoryId: ID!
  name: String!
  description: String
  basePrice: Float
  byWeight: Boolean
  servingVariants: [ServingVariant]
  thumbImage: String
  mediaAssetIds: [ID!]
  modifierGroupIds: [ID!]
  status: String
  avgPrepTimeMin: Int
  notes: String
  point: Int
  createdAt: DateTime
  updatedAt: DateTime
}

input UpdateMenuItemBasicInput {
  restaurantId: ID!
  menuItemId: ID!
  name: String
  description: String
  categoryId: ID
}

input EnsureMenuInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String
  description: String
  coverImage: String
}

input CreateMenuItemInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  categoryId: ID!
  name: String!
  description: String
  basePrice: Float
  byWeight: Boolean
  thumbImage: String
  mediaAssetIds: [ID!]
  modifierGroupIds: [ID!]
  status: String
  avgPrepTimeMin: Int
  notes: String
}

input UpdateMenuItemInput {
  id: ID!
  name: String
  description: String
  categoryId: ID
  basePrice: Float
  byWeight: Boolean
  thumbImage: String
  mediaAssetIds: [ID!]
  modifierGroupIds: [ID!]
  status: String
  avgPrepTimeMin: Int
  notes: String
}

extend type Query {
  menus(restaurantId: ID!): [Menu!]!
  menu(restaurantId: ID!, timeSlot: TimeSlot!): Menu
  menuItems(
    restaurantId: ID!
    timeSlot: TimeSlot
    categoryId: ID
    search: String
    limit: Int = 50
  ): [MenuItem!]!
  menuItemsConnection(
    limit: Int = 20
    cursor: ID
    filter: MenuItemFilter!
  ): MenuItemConnection!
  topMenuItems(limit: Int = 8, restaurantId: ID, categoryId: ID): [MenuItem!]!
}

extend type Mutation {
  bulkUpdateMenuItemPrices(input: BulkPriceUpdateInput!): BulkPriceUpdateResult!
  ensureMenu(input: EnsureMenuInput!): Menu!
  createMenuItem(input: CreateMenuItemInput!): MenuItem!
  updateMenuItem(input: UpdateMenuItemInput!): MenuItem!
  deleteMenuItem(id: ID!): Boolean!
  toggleMenuItemStatus(id: ID!, status: String!): MenuItem!
  updateMenuItemBasic(input: UpdateMenuItemBasicInput!): MenuItem!
}
