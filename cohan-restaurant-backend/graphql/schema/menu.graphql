enum TimeSlot {
  breakfast
  lunch
  dinner
  late_night
}

enum PriceUpdateMode {
  PERCENT
  AMOUNT
}

enum MenuItemStatus {
  available
  unavailable
  out_of_stock
  hidden
}

input BulkPriceUpdateTarget {
  categoryId: ID
  menuItemIds: [ID!]
}

input BulkPriceUpdateInput {
  restaurantId: ID!
  timeSlot: TimeSlot
  target: BulkPriceUpdateTarget!
  mode: PriceUpdateMode!
  value: Float!
  roundTo: Int
  floorZero: Boolean
}

type BulkPriceUpdateResult {
  updatedCount: Int!
  items: [MenuItem!]!
}

type Menu {
  id: ID!
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String
  description: String
  coverImage: String
  isActive: Boolean!
  createdAt: DateTime
  updatedAt: DateTime
  categoryMenu: CategoryMenu
}

input MenuItemFilter {
  restaurantId: ID!
  timeSlot: TimeSlot
  categoryId: ID
  status: MenuItemStatus
  search: String
  minPrice: Float
  maxPrice: Float
}

type MenuItemEdge {
  node: MenuItem!
  cursor: ID!
}

type MenuItemConnection {
  edges: [MenuItemEdge!]!
  pageInfo: PageInfo!
}

type MenuItem {
  id: ID!
  restaurantId: ID!
  menuId: ID!
  categoryId: ID!

  code: String
  name: String!
  description: String

  sortOrder: Int
  labels: [String!]
  servingVariants: [ServingVariant]
  # cache sync từ Recipe
  basePrice: Float
  defaultServingKey: String
  hasByWeightVariant: Boolean

  taxRate: Float

  # UI meta
  servingPortion: Float
  servingUnit: String

  printStationId: ID

  thumbImage: String
  mediaAssetIds: [ID!]

  status: MenuItemStatus!
  avgPrepTimeMin: Int
  point: Int
  rate: Float
  orderCounter: Int
  notes: String

  createdAt: DateTime
  updatedAt: DateTime
}

input EnsureMenuInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String!
  description: String
  coverImage: String
  isActive: Boolean
  categoryMenuId: ID
}

"""
Create: vẫn dùng timeSlot để BE suy ra menuId (vì model yêu cầu menuId).
"""
input CreateMenuItemInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  categoryId: ID!

  code: String
  name: String!
  description: String

  sortOrder: Int
  labels: [String!]

  # cache: thường do Recipe sync, nhưng vẫn cho set nếu bạn muốn
  basePrice: Float
  defaultServingKey: String
  hasByWeightVariant: Boolean

  taxRate: Float
  servingPortion: Float
  servingUnit: String

  printStationId: ID

  thumbImage: String
  mediaAssetIds: [ID!]

  status: MenuItemStatus
  avgPrepTimeMin: Int
  point: Int
  rate: Float
  orderCounter: Int
  notes: String
}

"""
Update full (theo id).
"""
input UpdateMenuItemInput {
  id: ID!

  categoryId: ID

  code: String
  name: String
  description: String

  sortOrder: Int
  labels: [String!]

  basePrice: Float
  defaultServingKey: String
  hasByWeightVariant: Boolean

  taxRate: Float
  servingPortion: Float
  servingUnit: String

  printStationId: ID

  thumbImage: String
  mediaAssetIds: [ID!]

  status: MenuItemStatus
  avgPrepTimeMin: Int
  point: Int
  rate: Float
  orderCounter: Int
  notes: String
}

"""
Update nhanh (đúng nghĩa "basic") — bạn có thể giữ ít field hơn nếu muốn.
"""
input UpdateMenuItemBasicInput {
  restaurantId: ID!
  menuItemId: ID!

  categoryId: ID
  code: String
  name: String
  description: String

  sortOrder: Int
  labels: [String!]

  taxRate: Float
  servingPortion: Float
  servingUnit: String

  printStationId: ID
  thumbImage: String
  mediaAssetIds: [ID!]

  status: MenuItemStatus
  avgPrepTimeMin: Int
  point: Int
  rate: Float
  orderCounter: Int
  notes: String
}

extend type Query {
  menus(restaurantId: ID!): [Menu!]!
  menu(restaurantId: ID!, timeSlot: TimeSlot!): Menu

  menuItems(
    restaurantId: ID!
    timeSlot: TimeSlot
    categoryId: ID
    search: String
    limit: Int = 50
  ): [MenuItem!]!

  menuItemsConnection(
    limit: Int = 20
    cursor: ID
    filter: MenuItemFilter!
  ): MenuItemConnection!

  topMenuItems(
    limit: Int = 8
    restaurantId: ID
    categoryId: ID
    categoryName: String
    timeSlot: TimeSlot
  ): [MenuItem!]!
}

extend type Mutation {
  bulkUpdateMenuItemPrices(input: BulkPriceUpdateInput!): BulkPriceUpdateResult!

  ensureMenu(input: EnsureMenuInput!): Menu!

  createMenuItem(input: CreateMenuItemInput!): MenuItem!
  updateMenuItem(input: UpdateMenuItemInput!): MenuItem!
  deleteMenuItem(id: ID!): Boolean!

  toggleMenuItemStatus(id: ID!, status: MenuItemStatus!): MenuItem!

  updateMenuItemBasic(input: UpdateMenuItemBasicInput!): MenuItem!
}
