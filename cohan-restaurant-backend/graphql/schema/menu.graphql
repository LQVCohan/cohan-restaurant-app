enum TimeSlot {
  breakfast
  lunch
  dinner
  late_night
}

enum PriceUpdateMode {
  PERCENT
  AMOUNT
}

enum MenuItemStatus {
  available
  unavailable
  out_of_stock
  hidden
}

enum PreparationStation {
  kitchen
  bar
}

enum MenuItemSort {
  default
  name_asc
  name_desc
  price_asc
  price_desc
}

enum MenuItemInventoryStatus {
  NOT_TRACKED
  IN_STOCK
  LOW_STOCK
  OUT_OF_STOCK
  ERROR
}

enum FoodType {
  VEGETARIAN
  NON_VEGETARIAN
  VEGAN
  MIXED
  UNKNOWN
}

enum MeatType {
  BEEF
  PORK
  CHICKEN
  DUCK
  SEAFOOD
  FISH
  LAMB
  OTHER
}

input BulkPriceUpdateTarget {
  categoryId: ID
  menuItemIds: [ID!]
}

input BulkPriceUpdateInput {
  restaurantId: ID!
  timeSlot: TimeSlot
  target: BulkPriceUpdateTarget!
  mode: PriceUpdateMode!
  value: Float!
  roundTo: Int
  floorZero: Boolean
}

type BulkPriceUpdateResult {
  updatedCount: Int!
  items: [MenuItem!]!
}

input RestoreMenuItemPricesInput {
  restaurantId: ID!
  menuItemIds: [ID!]!
}

type RestoreMenuItemPricesResult {
  restoredCount: Int!
  skippedCount: Int!
  items: [MenuItem!]!
}

type Menu {
  id: ID!
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String
  description: String
  coverImage: String
  isActive: Boolean!
  createdAt: DateTime
  updatedAt: DateTime
  categoryMenu: CategoryMenu
  itemCount: Int!
  revenue: Float!
  orderCount: Int!
  soldItemCount: Float!
  rating: Float
}

input MenuItemFilter {
  restaurantId: ID!
  timeSlot: TimeSlot
  categoryId: ID
  status: MenuItemStatus
  search: String
  minPrice: Float
  maxPrice: Float
  sort: MenuItemSort
}

type MenuItemEdge {
  node: MenuItem!
  cursor: ID!
}

type MenuItemConnection {
  edges: [MenuItemEdge!]!
  pageInfo: PageInfo!
}

type MenuItemStockShortage {
  ingredientId: ID!
  ingredientName: String
  available: Float!
  required: Float!
  missing: Float!
  unit: String
}

type MenuItemTasteProfile {
  containsOnion: Boolean
  containsCilantro: Boolean
  sugar: Int
  spice: String
}

input MenuItemTasteProfileInput {
  containsOnion: Boolean
  containsCilantro: Boolean
  sugar: Int
  spice: String
}

type MenuItem {
  id: ID!
  restaurantId: ID!
  menuId: ID!
  categoryId: ID!

  code: String
  name: String!
  description: String

  sortOrder: Int
  labels: [String!]
  foodType: FoodType
  meatTypes: [MeatType!]
  dietTags: [String!]
  allergenTags: [String!]
  tasteProfile: MenuItemTasteProfile
  servingVariants: [ServingVariant]
  # cache sync từ Recipe
  basePrice: Float
  defaultServingKey: String
  hasByWeightVariant: Boolean

  taxRate: Float

  # UI meta
  servingPortion: Float
  servingUnit: String

  prepStation: PreparationStation
  printStationId: ID

  thumbImage: String
  mediaAssetIds: [ID!]

  status: MenuItemStatus!
  inventoryStatus: MenuItemInventoryStatus!
  maxAvailable: Int!
  stockWarnings: [String!]!
  stockShortages: [MenuItemStockShortage!]!
  avgPrepTimeMin: Int
  point: Int
  rate: Float
  orderCounter: Int
  notes: String

  createdAt: DateTime
  updatedAt: DateTime
}

input EnsureMenuInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  name: String!
  description: String
  coverImage: String
  isActive: Boolean
  categoryMenuId: ID
}

input CopyMenuInput {
  restaurantId: ID!
  sourceMenuId: ID
  sourceTimeSlot: TimeSlot
  targetTimeSlot: TimeSlot!
  name: String
  description: String
  coverImage: String
  categoryMenuId: ID
  isActive: Boolean
  copyItems: Boolean = true
  copyRecipes: Boolean = true
}

input SyncMenuItemInventoryStatusesInput {
  restaurantId: ID!
  timeSlot: TimeSlot
  menuItemIds: [ID!]
  recoverOutOfStock: Boolean = true
  dryRun: Boolean = false
}

type MenuItemInventorySyncChange {
  menuItemId: ID!
  menuItemName: String
  beforeStatus: MenuItemStatus!
  afterStatus: MenuItemStatus!
  inventoryStatus: MenuItemInventoryStatus!
  maxAvailable: Int!
  stockWarnings: [String!]!
}

type SyncMenuItemInventoryStatusesResult {
  checkedCount: Int!
  updatedCount: Int!
  toOutOfStockCount: Int!
  toAvailableCount: Int!
  items: [MenuItem!]!
  warnings: [String!]!
  changes: [MenuItemInventorySyncChange!]!
}

"""
Create: vẫn dùng timeSlot để BE suy ra menuId (vì model yêu cầu menuId).
"""
input CreateMenuItemInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  categoryId: ID!

  code: String
  name: String!
  description: String

  sortOrder: Int
  labels: [String!]
  foodType: FoodType
  meatTypes: [MeatType!]
  dietTags: [String!]
  allergenTags: [String!]
  tasteProfile: MenuItemTasteProfileInput

  # cache: thường do Recipe sync, nhưng vẫn cho set nếu bạn muốn
  basePrice: Float
  defaultServingKey: String
  hasByWeightVariant: Boolean

  taxRate: Float
  servingPortion: Float
  servingUnit: String

  prepStation: PreparationStation! = kitchen
  printStationId: ID

  thumbImage: String
  mediaAssetIds: [ID!]

  status: MenuItemStatus
  avgPrepTimeMin: Int
  point: Int
  rate: Float
  orderCounter: Int
  notes: String
}

"""
Update full (theo id).
"""
input UpdateMenuItemInput {
  id: ID!

  categoryId: ID

  code: String
  name: String
  description: String

  sortOrder: Int
  labels: [String!]
  foodType: FoodType
  meatTypes: [MeatType!]
  dietTags: [String!]
  allergenTags: [String!]
  tasteProfile: MenuItemTasteProfileInput

  basePrice: Float
  defaultServingKey: String
  hasByWeightVariant: Boolean

  taxRate: Float
  servingPortion: Float
  servingUnit: String

  prepStation: PreparationStation
  printStationId: ID

  thumbImage: String
  mediaAssetIds: [ID!]

  status: MenuItemStatus
  avgPrepTimeMin: Int
  point: Int
  rate: Float
  orderCounter: Int
  notes: String
}

"""
Update nhanh (đúng nghĩa "basic") — bạn có thể giữ ít field hơn nếu muốn.
"""
input UpdateMenuItemBasicInput {
  restaurantId: ID!
  menuItemId: ID!

  categoryId: ID
  code: String
  name: String
  description: String

  sortOrder: Int
  labels: [String!]
  foodType: FoodType
  meatTypes: [MeatType!]
  dietTags: [String!]
  allergenTags: [String!]
  tasteProfile: MenuItemTasteProfileInput

  taxRate: Float
  servingPortion: Float
  servingUnit: String

  prepStation: PreparationStation
  printStationId: ID
  thumbImage: String
  mediaAssetIds: [ID!]

  status: MenuItemStatus
  avgPrepTimeMin: Int
  point: Int
  rate: Float
  orderCounter: Int
  notes: String
}

extend type Query {
  menus(restaurantId: ID!): [Menu!]!
  menu(restaurantId: ID!, timeSlot: TimeSlot!): Menu

  menuItems(
    restaurantId: ID!
    timeSlot: TimeSlot
    categoryId: ID
    search: String
    sort: MenuItemSort = default
    limit: Int = 50
  ): [MenuItem!]!

  menuItemsConnection(
    limit: Int = 20
    cursor: ID
    filter: MenuItemFilter!
  ): MenuItemConnection!
  customerMenuItem(id: ID!, restaurantId: ID): MenuItem

  topMenuItems(
    limit: Int = 8
    restaurantId: ID
    categoryId: ID
    categoryName: String
    timeSlot: TimeSlot
  ): [MenuItem!]!
}

extend type Mutation {
  bulkUpdateMenuItemPrices(input: BulkPriceUpdateInput!): BulkPriceUpdateResult!
  restoreMenuItemPrices(input: RestoreMenuItemPricesInput!): RestoreMenuItemPricesResult!

  ensureMenu(input: EnsureMenuInput!): Menu!
  copyMenu(input: CopyMenuInput!): Menu!
  deleteMenu(id: ID!, force: Boolean = false): Boolean!
  syncMenuItemInventoryStatuses(
    input: SyncMenuItemInventoryStatusesInput!
  ): SyncMenuItemInventoryStatusesResult!

  createMenuItem(input: CreateMenuItemInput!): MenuItem!
  updateMenuItem(input: UpdateMenuItemInput!): MenuItem!
  deleteMenuItem(id: ID!): Boolean!

  toggleMenuItemStatus(id: ID!, status: MenuItemStatus!): MenuItem!

  updateMenuItemBasic(input: UpdateMenuItemBasicInput!): MenuItem!
}
