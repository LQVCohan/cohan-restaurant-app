type PublicOrderPayment {
  status: String
  requestedAt: DateTime
}

type PublicOrderTotals {
  grandTotal: Int!
}

type PublicTableOrderItem {
  id: ID!
  name: String!
  quantity: Float!
  unit: String
  servingKey: String
  unitPrice: Int
  modifiersPrice: Int
  lineSubtotal: Int
  note: String
  status: ItemStatus
  proofImages: [String!]!
  requiresProofImage: Boolean!
  proofUploaded: Boolean!
}

type PublicTableCustomerRequest {
  requestId: String
  type: String
  status: String
  message: String
  createdAt: DateTime
  acknowledgedAt: DateTime
  resolvedAt: DateTime
}

type PublicTableSessionSummary {
  id: ID!
  orderCode: String
  orderKind: String
  currentStatus: OrderStatus
  sessionStatus: String
  orderPaymentStatus: String
  payment: PublicOrderPayment
}

type PublicTableOrder {
  id: ID!
  orderCode: String
  orderKind: String
  currentStatus: OrderStatus
  createdAt: DateTime
  note: String
  totals: PublicOrderTotals!
  payment: PublicOrderPayment
  items: [PublicTableOrderItem!]!
}

type PublicActiveTableSessionOrdersResult {
  session: PublicTableSessionSummary
  orders: [PublicTableOrder!]!
  customerRequests: [PublicTableCustomerRequest!]!
  tableId: ID
  tableCode: String
  tableStatus: String
  canOrder: Boolean!
  orderBlockedReason: String
  canRequestOrderAccess: Boolean!
  orderAccessConfirmed: Boolean!
  orderAccessBlockedReason: String
}

type PublicRequestTablePaymentResult {
  ok: Boolean!
  warning: Boolean!
  readyForPayment: Boolean!
  message: String
  pendingOrderCodes: [String!]!
  session: PublicTableSessionSummary
  orders: [PublicTableOrder!]!
  requestedAt: String
}

type PublicCallStaffForTableResult {
  ok: Boolean!
  message: String
  requestId: String
  status: String
  requestedAt: String
}

type PublicTableIdentityOtpResult {
  ok: Boolean!
  message: String
  challengeToken: String
  maskedPhone: String
  demoOtp: String
}

type PublicTableIdentityVerificationResult {
  ok: Boolean!
  message: String
  requiresAccountConfirmation: Boolean!
  candidateToken: String
  identityToken: String
  maskedCustomerName: String
  linkedAsGuest: Boolean!
}

type PublicTableIdentityResult {
  ok: Boolean!
  message: String
  identityToken: String
}

type PublicSubmitTableOrderResult {
  ok: Boolean!
  message: String
  order: PublicTableOrder
}

type PublicTableOrderAccessRequestResult {
  ok: Boolean!
  message: String
  requestToken: String!
  requestId: String!
  requestLabel: String!
  expiresAt: DateTime
}

type PublicTableOrderAccessConfirmationResult {
  ok: Boolean!
  message: String
  orderSessionToken: String!
  sessionId: ID!
  expiresAt: DateTime
}

type TableQrOrderAccessRequest {
  requestId: String!
  requestLabel: String!
  tableId: ID!
  tableCode: String
  requestedAt: DateTime
  expiresAt: DateTime
  confirmationCode: String!
}

input PublicRequestTablePaymentInput {
  restaurantId: ID!
  tableId: ID!
  tableCode: String
  token: String!
  note: String
}

input PublicTableIdentityOtpInput {
  restaurantId: ID!
  tableId: ID!
  token: String!
  phone: String!
}

input PublicTableIdentityVerifyInput {
  challengeToken: String!
  otp: String!
}

input PublicTableIdentityConfirmInput {
  candidateToken: String!
  accept: Boolean!
}

input PublicSubmitTableOrderInput {
  restaurantId: ID!
  tableId: ID!
  token: String!
  identityToken: String
  items: [OrderItemInput!]!
  note: String
  idempotencyKey: String!
}

input PublicTableOrderAccessRequestInput {
  restaurantId: ID!
  tableId: ID!
  token: String!
  deviceId: String!
}

input PublicTableOrderAccessConfirmInput {
  requestToken: String!
  deviceId: String!
  confirmationCode: String!
}

extend type Query {
  publicActiveTableSessionOrders(
    restaurantId: ID!
    tableId: ID!
    token: String!
  ): PublicActiveTableSessionOrdersResult!

  tableQrOrderAccessRequests(
    restaurantId: ID!
  ): [TableQrOrderAccessRequest!]!
}

extend type Mutation {
  publicRequestTablePayment(
    input: PublicRequestTablePaymentInput!
  ): PublicRequestTablePaymentResult!

  publicCallStaffForTable(
    input: PublicRequestTablePaymentInput!
  ): PublicCallStaffForTableResult!

  publicRequestTableIdentityOtp(
    input: PublicTableIdentityOtpInput!
  ): PublicTableIdentityOtpResult!

  publicVerifyTableIdentityOtp(
    input: PublicTableIdentityVerifyInput!
  ): PublicTableIdentityVerificationResult!

  publicConfirmTableIdentity(
    input: PublicTableIdentityConfirmInput!
  ): PublicTableIdentityResult!

  publicSubmitTableOrder(
    input: PublicSubmitTableOrderInput!
  ): PublicSubmitTableOrderResult!

  publicRequestTableOrderAccess(
    input: PublicTableOrderAccessRequestInput!
  ): PublicTableOrderAccessRequestResult!

  publicConfirmTableOrderAccess(
    input: PublicTableOrderAccessConfirmInput!
  ): PublicTableOrderAccessConfirmationResult!
}
