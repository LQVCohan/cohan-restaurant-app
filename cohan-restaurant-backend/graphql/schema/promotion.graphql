"""Khuyến mãi cho nhà hàng"""
type Promotion {
  id: ID!
  name: String!
  code: String
  description: String
  scope: String
  restaurantId: ID
  categoryId: ID
  itemId: ID
  discountType: String
  discountValue: Float
  minOrderValue: Float
  maxDiscount: Float
  usageLimit: Int
  usageCount: Int
  targetAudience: String
  conditions: [String!]
  level: Int
  startAt: DateTime
  endAt: DateTime
  isActive: Boolean
  stacking: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

extend type Query {
  promotionsByRestaurant(
    restaurantId: ID!
    activeOnly: Boolean = true
    limit: Int = 20
    offset: Int = 0
    now: DateTime
  ): [Promotion!]!
}

input PromotionInput {
  name: String!
  code: String
  description: String
  scope: String
  restaurantId: ID!
  categoryId: ID
  itemId: ID
  discountType: String
  discountValue: Float!
  minOrderValue: Float
  maxDiscount: Float
  usageLimit: Int
  targetAudience: String
  conditions: [String!]
  level: Int
  startAt: DateTime
  endAt: DateTime
  isActive: Boolean
  stacking: Boolean
}

extend type Mutation {
  createPromotion(input: PromotionInput!): Promotion!
  updatePromotion(id: ID!, input: PromotionInput!): Promotion!
  deletePromotion(id: ID!): Boolean!
  togglePromotion(id: ID!, isActive: Boolean!): Promotion!
}
