"""Món bắt buộc trong khuyến mãi combo"""
type ComboPromotionItem {
  itemId: ID!
  quantity: Int!
}

input ComboPromotionItemInput {
  itemId: ID!
  quantity: Int!
}

"""Khuyến mãi cho nhà hàng"""
type Promotion {
  id: ID!
  name: String!
  code: String
  description: String
  promotionType: String
  scope: String
  restaurantId: ID
  categoryId: ID
  itemId: ID
  giftItemId: ID
  discountType: String
  discountValue: Float
  buyQuantity: Int
  getQuantity: Int
  comboItems: [ComboPromotionItem!]
  minOrderValue: Float
  maxDiscount: Float
  usageLimit: Int
  usageCount: Int
  targetAudience: String
  conditions: [String!]
  level: Int
  startAt: DateTime
  endAt: DateTime
  isActive: Boolean
  stacking: Boolean
  createdAt: DateTime
  updatedAt: DateTime
}

extend type Query {
  promotionsByRestaurant(
    restaurantId: ID!
    activeOnly: Boolean = true
    limit: Int = 20
    offset: Int = 0
    now: DateTime
  ): [Promotion!]!
}

input PromotionInput {
  name: String!
  code: String
  description: String
  promotionType: String
  scope: String
  restaurantId: ID!
  categoryId: ID
  itemId: ID
  giftItemId: ID
  discountType: String
  discountValue: Float!
  buyQuantity: Int
  getQuantity: Int
  comboItems: [ComboPromotionItem!]
  minOrderValue: Float
  maxDiscount: Float
  usageLimit: Int
  targetAudience: String
  conditions: [String!]
  level: Int
  startAt: DateTime
  endAt: DateTime
  isActive: Boolean
  stacking: Boolean
}

extend type Mutation {
  createPromotion(input: PromotionInput!): Promotion!
  updatePromotion(id: ID!, input: PromotionInput!): Promotion!
  deletePromotion(id: ID!): Boolean!
  togglePromotion(id: ID!, isActive: Boolean!): Promotion!
}
