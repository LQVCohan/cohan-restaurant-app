type RestaurantInitialSetup {
  status: String!
  templateKey: String
  templateVersion: Int
  completedAt: DateTime
  completedBy: ID
}

type RestaurantCuisineTemplateMenu {
  key: String!
  name: String!
  timeSlot: TimeSlot!
  dishCount: Int!
  dishNames: [String!]!
}

type RestaurantCuisineTemplate {
  key: String!
  version: Int!
  name: String!
  cuisineType: String!
  description: String!
  ingredientCount: Int!
  menuCount: Int!
  timeSlotCount: Int!
  menuItemCount: Int!
  recipeCount: Int!
  featuredItems: [String!]!
  dishNames: [String!]!
  menus: [RestaurantCuisineTemplateMenu!]!
}

type RestaurantCuisineTemplateApplyResult {
  success: Boolean!
  restaurant: Restaurant!
  ingredientCount: Int!
  menuCount: Int!
  menuItemCount: Int!
  warnings: [String!]!
}

extend type Restaurant {
  initialSetup: RestaurantInitialSetup
}

extend type Query {
  restaurantCuisineTemplates: [RestaurantCuisineTemplate!]!
}

extend type Mutation {
  applyRestaurantCuisineTemplate(
    restaurantId: ID!
    templateKey: String!
  ): RestaurantCuisineTemplateApplyResult!

  skipRestaurantCuisineSetup(restaurantId: ID!): Restaurant!
}
