scalar JSON

type Address {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
  postalCode: String
  lat: Float
  lng: Float
}

type PaymentProviderConfig {
  provider: String!
  label: String!
  active: Boolean!
  priority: Int!
  mode: String!
}

type PaymentSettings {
  defaultProvider: String!
  providers: [PaymentProviderConfig!]!
}

type ReservationSettings {
  baseDepositAmount: Float
  menuDepositPercent: Float
  changeTimeFee: Float
  changeTableFee: Float
  vatRate: Float
  serviceFee: Float
}

input PaymentProviderConfigInput {
  provider: String!
  label: String
  active: Boolean
  priority: Int
  mode: String
}

input PaymentSettingsInput {
  defaultProvider: String
  providers: [PaymentProviderConfigInput!]
}

input ReservationSettingsInput {
  baseDepositAmount: Float
  menuDepositPercent: Float
  changeTimeFee: Float
  changeTableFee: Float
  vatRate: Float
  serviceFee: Float
}

type Restaurant {
  id: ID!
  name: String!
  avatar: String
  coverImage: String
  spaceImages: [String]
  vrTourUrl: String
  address: Address
  phone: String
  email: String
  featuredMenu: [String]
  amenities: [String]
  seatingCapacity: Int
  priceRange: String
  openingHours: String
  closingHours: String
  description: String
  notesOnHours: String
  notesOnAmenities: String
  cuisineType: String
  status: String
  timezone: String
  weeklyOpeningHours: JSON
  specialHours: [JSON!]
  capabilities: JSON
  reservationPolicy: JSON
  orderPolicy: JSON
  businessStatus: String
  publicationStatus: String
  operationalStatus: String
  openingStatus: String
  openingStatusReason: String
  nextOpeningTime: String
  canView: Boolean
  canReserve: Boolean
  canOrder: Boolean
  canTableOrder: Boolean
  canDelivery: Boolean
  canPickup: Boolean
  manager: User
  brandId: ID
  brand: Brand
  tables: [Table]
  categories: [Category]
  avgRating: Float
  distanceKm: Float
  straightLineDistanceKm: Float
  roadDistanceKm: Float
  estimatedTravelMinutes: Float
  distanceSource: String
  reviewCount: Int
  orderCount: Int
  reservationCount: Int
  tableParticipationCount: Int
  reservationSettings: ReservationSettings
  paymentSettings: PaymentSettings
  defaultCurrency: String
  manualUsdToVndRate: Float
}

input RestaurantFilter {
  city: String
  district: String
  cuisineTypes: [String!]
  minRating: Float
  priceRange: [String!]
  search: String
  restaurantIds: [ID!]
  openingStatus: String
  openNow: Boolean
  acceptsReservations: Boolean
  acceptsOrders: Boolean
}

type RestaurantCategoryIndexCategory {
  categoryId: ID!
  menuItemCount: Int!
}

type RestaurantCategoryIndex {
  id: ID!
  restaurantId: ID!
  timeSlot: TimeSlot!
  categoryIds: [ID!]!
  categories: [RestaurantCategoryIndexCategory!]!
  distinctCategoryCount: Int!
  orderCount: Int
  reservationCount: Int
  tableParticipationCount: Int
  updatedAt: DateTime
}

type PageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

type RestaurantEdge {
  node: Restaurant!
  cursor: ID!
}

type RestaurantConnection {
  edges: [RestaurantEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type RestaurantProfileRewriteResult {
  text: String!
  provider: String!
  usedGemini: Boolean!
  reason: String
}

input RewriteRestaurantProfileInput {
  restaurantId: ID!
  restaurantName: String
  cuisineType: String
  currentText: String
  chefName: String
  tone: String
}

extend type Query {
  restaurants(
    limit: Int = 20
    cursor: ID
    restaurantFilter: RestaurantFilter
  ): RestaurantConnection!

  restaurant(id: ID!): Restaurant

  restaurantsTop(
    limit: Int = 6
    restaurantFilter: RestaurantFilter
  ): [Restaurant!]!

  restaurantsNearby(
    lat: Float!
    lng: Float!
    radiusKm: Float = 20
    limit: Int = 6
    restaurantFilter: RestaurantFilter
  ): [Restaurant!]!

  publicRestaurants(
    limit: Int = 20
    cursor: ID
    filter: RestaurantFilter
  ): RestaurantConnection!
  publicRestaurant(id: ID!): Restaurant
  similarRestaurants(restaurantId: ID!, limit: Int = 6): [Restaurant!]!

  restaurantsByManager(
    managerId: ID!
  brandId: ID
    limit: Int = 20
    cursor: ID
    restaurantFilter: RestaurantFilter
  ): RestaurantConnection!

  refRestaurants(userId: ID!): [Restaurant!]!

  restaurantsByCategoryTimeSlot(
    categoryId: ID!
    timeSlot: TimeSlot!
    limit: Int = 12
  ): [Restaurant!]!

  restaurantCategoryIndexes(
    restaurantId: ID
    timeSlot: TimeSlot
  ): [RestaurantCategoryIndex!]!

  refreshRestaurantCategoryIndexes(timeSlot: TimeSlot!): Int!
}

input AddressInput {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
  postalCode: String
  lat: Float
  lng: Float
}

input CreateRestaurantInput {
  name: String!
  avatar: String
  coverImage: String
  spaceImages: [String]
  vrTourUrl: String
  address: AddressInput
  phone: String
  email: String
  featuredMenu: [String]
  amenities: [String]
  seatingCapacity: Int
  priceRange: String
  openingHours: String
  closingHours: String
  description: String
  notesOnHours: String
  notesOnAmenities: String
  cuisineType: String
  status: String
  businessStatus: String
  publicationStatus: String
  operationalStatus: String
  timezone: String
  weeklyOpeningHours: JSON
  specialHours: [JSON!]
  capabilities: JSON
  reservationPolicy: JSON
  orderPolicy: JSON
  managerId: ID!
  brandId: ID
  reservationSettings: ReservationSettingsInput
  paymentSettings: PaymentSettingsInput
  defaultCurrency: String
  manualUsdToVndRate: Float
}

input UpdateRestaurantInput {
  name: String
  avatar: String
  coverImage: String
  spaceImages: [String]
  vrTourUrl: String
  address: AddressInput
  phone: String
  email: String
  featuredMenu: [String]
  amenities: [String]
  seatingCapacity: Int
  priceRange: String
  openingHours: String
  closingHours: String
  description: String
  notesOnHours: String
  notesOnAmenities: String
  cuisineType: String
  status: String
  businessStatus: String
  publicationStatus: String
  operationalStatus: String
  timezone: String
  weeklyOpeningHours: JSON
  specialHours: [JSON!]
  capabilities: JSON
  reservationPolicy: JSON
  orderPolicy: JSON
  brandId: ID
  reservationSettings: ReservationSettingsInput
  paymentSettings: PaymentSettingsInput
  defaultCurrency: String
  manualUsdToVndRate: Float
}

input UpdateRestaurantManagerInput {
  restaurantId: ID!
  managerId: ID!
  reservationSettings: ReservationSettingsInput
  paymentSettings: PaymentSettingsInput
}

input UpdateRestaurantCategoryIndexInput {
  restaurantId: ID!
  timeSlot: TimeSlot!
  categoryIds: [ID!]!
}

extend type Mutation {
  createRestaurant(input: CreateRestaurantInput!): Restaurant!
  updateRestaurant(id: ID!, input: UpdateRestaurantInput!): Restaurant!
  deleteRestaurant(id: ID!): Boolean!
  updateRestaurantManager(input: UpdateRestaurantManagerInput!): Restaurant!
  updateRestaurantCategoryIndex(
    input: UpdateRestaurantCategoryIndexInput!
  ): RestaurantCategoryIndex!
  rewriteRestaurantProfileDescription(
    input: RewriteRestaurantProfileInput!
  ): RestaurantProfileRewriteResult!
}

type Category {
  id: ID!
  name: String!
  parentId: ID
  order: Int
}

type Table {
  id: ID!
  code: String!
  capacity: Int!
  status: TableStatus!
}

enum TableStatus {
  available
  occupied
  reserved
  maintenance
}
