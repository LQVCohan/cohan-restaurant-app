# ============================================================================
#  REACTION SUMMARY (DÙNG CHUNG)
# ============================================================================
"""
Tổng hợp reaction kiểu Facebook
"""
type ReactionSummary {
  like: Int
  love: Int
  care: Int
  haha: Int
  wow: Int
  sad: Int
  angry: Int
  total: Int
}

# ============================================================================
#  REVIEW
# ============================================================================
type Review {
  id: ID!

  targetType: String!
  targetId: ID!
  targetName: String

  restaurantId: ID!
  restaurantName: String

  customerId: ID
  customerName: String
  customerAvatar: String
  staffId: ID
  staffName: String

  rating: Int!
  title: String
  content: String!
  images: [String]

  location: String
  verifiedPurchase: Boolean
  verifiedSource: String
  verifiedSourceId: ID
  visitedAt: String
  orderCompletedAt: String
  sentiment: String
  topicTags: [String]
  moderationReason: String
  moderationNote: String
  moderatedBy: ID
  moderatedAt: String
  firstOfficialReplyAt: String
  tags: [String]

  status: String!

  likesCount: Int
  commentsCount: Int
  sharesCount: Int
  helpfulCount: Int
  reportsCount: Int

  reactions: ReactionSummary

  createdAt: String
  updatedAt: String
}

# ============================================================================
#  REVIEW INPUT
# ============================================================================
input ReviewInput {
  targetType: String!
  targetId: ID!
  targetName: String

  restaurantId: ID!
  restaurantName: String

  customerId: ID
  customerName: String
  customerAvatar: String
  staffId: ID
  staffName: String

  rating: Int!
  title: String
  content: String!
  images: [String]

  location: String
  verifiedPurchase: Boolean
  verifiedSource: String
  verifiedSourceId: ID
  visitedAt: String
  orderCompletedAt: String
  sentiment: String
  topicTags: [String]
  moderationReason: String
  moderationNote: String
  moderatedBy: ID
  moderatedAt: String
  firstOfficialReplyAt: String
  tags: [String]
}

input ReviewUpdateInput {
  staffId: ID
  rating: Int
  title: String
  content: String
  images: [String]
  location: String
  tags: [String]
  status: String
  reason: String
  moderationNote: String
}

# ============================================================================
#  REVIEW CONNECTION (PAGINATION)
# ============================================================================
type ReviewsConnection {
  total: Int!
  items: [Review!]!
}

# ============================================================================
#  REVIEW STATS
# ============================================================================
type ReviewStats {
  total: Int!
  avgRating: Float!
  pending: Int!
  ratingBreakdown: JSON
}

# ============================================================================
#  COMMENT + REPLY
# ============================================================================
type ReviewComment {
  id: ID!

  reviewId: ID!
  restaurantId: ID!
  parentId: ID

  authorUserId: ID
  authorName: String!
  authorAvatar: String
  authorRole: String
  authorType: String
  officialReply: Boolean
  replyByRestaurantId: ID

  content: String!
  status: String!

  likesCount: Int
  repliesCount: Int

  reactions: ReactionSummary

  isEdited: Boolean

  createdAt: String
  updatedAt: String
}

input ReviewCommentInput {
  reviewId: ID!
  restaurantId: ID!
  parentId: ID
  authorUserId: ID
  authorName: String!
  authorAvatar: String
  officialReply: Boolean
  content: String!
}

input ReviewCommentUpdateInput {
  content: String
  status: String
  reason: String
  moderationNote: String
}

# ============================================================================
#  COMMENT CONNECTION (PAGINATION)
# ============================================================================
type ReviewCommentsConnection {
  total: Int!
  items: [ReviewComment!]!
}



type ReviewReport {
  id: ID!
  reviewId: ID!
  restaurantId: ID!
  reporterUserId: ID!
  reason: String!
  detail: String
  status: String!
  resolvedBy: ID
  resolvedAt: String
  resolutionNote: String
  createdAt: String
  updatedAt: String
}

input ReviewReportInput {
  reason: String!
  detail: String
}

input ReviewReportResolveInput {
  status: String
  resolutionNote: String
}

type ReviewReportsConnection {
  total: Int!
  items: [ReviewReport!]!
}

type ReviewReportStats {
  total: Int!
  pending: Int!
  resolved: Int!
  rejected: Int!
  byReason: JSON
}

type ReviewTrendPoint { date: String!, total: Int!, avgRating: Float! }
type ReviewNameCount { id: ID, name: String, targetType: String, count: Int!, avgRating: Float }
type ReviewActionQueueCounts { needsModeration: Int!, needsReply: Int!, highRisk: Int! }
type ReviewAnalytics {
  totalReviews: Int!
  avgRating: Float!
  pendingCount: Int!
  publishedCount: Int!
  hiddenCount: Int!
  rejectedCount: Int!
  reportedCount: Int!
  negativeCount: Int!
  verifiedRate: Float!
  replyRate: Float!
  avgFirstReplyMinutes: Int!
  ratingTrend: [ReviewTrendPoint!]!
  ratingBreakdown: JSON
  topTags: [ReviewNameCount!]!
  topStaffMentioned: [ReviewNameCount!]!
  lowRatedTargets: [ReviewNameCount!]!
  reportBreakdown: [ReviewNameCount!]!
  actionQueueCounts: ReviewActionQueueCounts!
}

# ============================================================================
#  QUERIES
# ============================================================================
extend type Query {
  # Danh sách review (có phân trang)
  reviews(
    restaurantId: ID
    targetType: String
    targetId: ID
    status: String
    minRating: Int
    maxRating: Int
    limit: Int = 20
    skip: Int = 0
  ): ReviewsConnection!

  # Chi tiết review
  review(id: ID!): Review

  # Comment + Reply (có phân trang)
  reviewComments(
    reviewId: ID!
    parentId: ID
    limit: Int = 20
    skip: Int = 0
  ): ReviewCommentsConnection!

  # Thống kê review (cho header trang review/admin)
  reviewStats(restaurantId: ID, targetType: String, targetId: ID): ReviewStats!
  reviewReports(restaurantId: ID, status: String, reason: String, limit: Int = 20, skip: Int = 0): ReviewReportsConnection!
  reviewReportStats(restaurantId: ID): ReviewReportStats!
  reviewAnalytics(restaurantId: ID, targetType: String, dateFrom: String, dateTo: String): ReviewAnalytics!
}

# ============================================================================
#  MUTATIONS
# ============================================================================
extend type Mutation {
  # Review CRUD
  createReview(input: ReviewInput!): Review
  updateReview(id: ID!, input: ReviewUpdateInput!): Review
  deleteReview(id: ID!): Boolean

  setReviewStatus(id: ID!, status: String!, reason: String, moderationNote: String, notifyCustomer: Boolean): Review
  incrementReviewHelpful(id: ID!): Review

  # Reaction vào review
  reactReview(id: ID!, reaction: String!): Review
  reportReview(id: ID!, input: ReviewReportInput!): ReviewReport
  resolveReviewReport(id: ID!, input: ReviewReportResolveInput!): ReviewReport

  # Comment CRUD
  createReviewComment(input: ReviewCommentInput!): ReviewComment
  updateReviewComment(id: ID!, input: ReviewCommentUpdateInput!): ReviewComment
  deleteReviewComment(id: ID!): Boolean
  setReviewCommentStatus(id: ID!, status: String!): ReviewComment

  # Reaction vào comment
  reactReviewComment(id: ID!, reaction: String!): ReviewComment
}
