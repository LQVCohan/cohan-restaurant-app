type Reservation {
  id: ID!
  restaurantId: ID!
  restaurantName: String
  tableId: ID!
  userId: ID!
  orderCode: String

  timeTo: DateTime
  customerName: String
  customerPhone: String
  customerEmail: String
  partySize: Int!
  note: String
  depositAmount: Int!
  depositTxnId: ID
  depositStatus: String!
  status: String!
  pendingPaymentExpiresAt: DateTime
  durationMinutes: Int
  isUnlimitedTime: Boolean
  paymentMethod: String
  paymentReference: String
  changeRequestType: String
  changeRequestStatus: String
  changeRequestFee: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateReservationInput {
  restaurantId: ID!
  tableId: ID!
  timeTo: DateTime!
  partySize: Int = 2
  note: String
  restaurantName: String
  customerName: String
  customerPhone: String
  customerEmail: String
  depositAmount: Int
  linkedMenuSubtotal: Int
  durationMinutes: Int
  isUnlimitedTime: Boolean
  paymentMethod: String
  paymentReference: String
  changeRequestType: String
  changeRequestStatus: String
  changeRequestFee: Int
}

input UpdateReservationInput {
  id: ID!
  timeTo: DateTime
  durationMinutes: Int
  isUnlimitedTime: Boolean
  paymentMethod: String
  paymentReference: String
  changeRequestType: String
  changeRequestStatus: String
  changeRequestFee: Int
  partySize: Int
  note: String
  customerName: String
  customerPhone: String
  customerEmail: String
}

input UpdateReservationStatusInput {
  id: ID!
  status: String!
  depositStatus: String
  depositTxnId: ID
  paymentMethod: String
  paymentReference: String
}

input changeReservationTableInput {
  id: ID!
  newRestaurantId: ID
  newTableId: ID
  acceptPenalty: Boolean
  note: String
}

extend type Query {
  reservation(id: ID, orderCode: String): Reservation
  myReservations(limit: Int = 20, cursor: ID): [Reservation!]!
  confirmedReservationByTable(restaurantId: ID!, tableId: ID!): Reservation
}

extend type Mutation {
  changeReservationTable(input: changeReservationTableInput!): Reservation!
  createReservation(input: CreateReservationInput!): Reservation!
  updateReservation(input: UpdateReservationInput!): Reservation!
  updateReservationStatus(input: UpdateReservationStatusInput!): Reservation!
  cancelReservation(id: ID!): Reservation!
  deleteReservation(id: ID!): Reservation!
  submitReservationPayment(input: SubmitReservationPaymentInput!): Reservation!
  requestReservationChange(input: RequestReservationChangeInput!): Reservation!
}


input SubmitReservationPaymentInput {
  reservationId: ID!
  method: String!
  paymentStatus: String!
  externalRef: String
}

input RequestReservationChangeInput {
  reservationId: ID!
  type: String!
  requestedTimeTo: DateTime
  requestedDurationMinutes: Int
  requestedTableId: ID
  note: String
}
