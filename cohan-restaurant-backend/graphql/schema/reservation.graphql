type Reservation {
  id: ID!
  restaurantId: ID!
  restaurantName: String
  tableId: ID!
  userId: ID!
  orderCode: String

  timeTo: DateTime
  customerName: String
  customerPhone: String
  customerEmail: String
  partySize: Int!
  note: String
  linkedMenuSubtotal: Int
  linkedMenuDiscount: Int
  linkedMenuTotal: Int
  linkedMenuPromotionIds: [ID!]!
  depositAmount: Int!
  depositTxnId: ID
  depositStatus: String!
  depositPaidAt: DateTime
  depositPaymentProvider: String
  depositPaymentMethod: String
  depositPaymentReference: String
  depositProviderTransactionId: String
  status: String!
  pendingPaymentExpiresAt: DateTime
  durationMinutes: Int
  isUnlimitedTime: Boolean
  paymentMethod: String
  paymentReference: String
  changeRequestType: String
  changeRequestStatus: String
  changeRequestFee: Int
  requestedTimeTo: DateTime
  requestedDurationMinutes: Int
  requestedTableId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateReservationInput {
  restaurantId: ID!
  tableId: ID!
  timeTo: DateTime!
  partySize: Int = 2
  note: String
  restaurantName: String
  customerName: String
  customerPhone: String
  customerEmail: String
  depositAmount: Int
  linkedMenuSubtotal: Int
  linkedCartItemIds: [ID!]
  durationMinutes: Int
  isUnlimitedTime: Boolean
  paymentMethod: String
  paymentReference: String
  changeRequestType: String
  changeRequestStatus: String
  changeRequestFee: Int
}

input UpdateReservationInput {
  id: ID!
  timeTo: DateTime
  durationMinutes: Int
  isUnlimitedTime: Boolean
  paymentMethod: String
  paymentReference: String
  changeRequestType: String
  changeRequestStatus: String
  changeRequestFee: Int
  partySize: Int
  note: String
  customerName: String
  customerPhone: String
  customerEmail: String
}

input UpdateReservationStatusInput {
  id: ID!
  status: String!
  depositStatus: String
  depositTxnId: ID
  paymentMethod: String
  paymentReference: String
}

input changeReservationTableInput {
  id: ID!
  newRestaurantId: ID
  newTableId: ID
  acceptPenalty: Boolean
  note: String
}

input ApproveReservationChangeInput {
  reservationId: ID!
  note: String
}

input RejectReservationChangeInput {
  reservationId: ID!
  reason: String
}

input CheckInReservationInput {
  reservationId: ID!
  note: String
}

extend type Query {
  reservation(id: ID, orderCode: String): Reservation
  myReservations(limit: Int = 20, cursor: ID): [Reservation!]!
  pendingReservationChanges(restaurantId: ID!, limit: Int = 50): [Reservation!]!
  confirmedReservationByTable(restaurantId: ID!, tableId: ID!): Reservation
  activeReservationByTable(restaurantId: ID!, tableId: ID!): Reservation
}

extend type Mutation {
  changeReservationTable(input: changeReservationTableInput!): Reservation!
  createReservation(input: CreateReservationInput!): Reservation!
  updateReservation(input: UpdateReservationInput!): Reservation!
  updateReservationStatus(input: UpdateReservationStatusInput!): Reservation!
  cancelReservation(id: ID!): Reservation!
  markReservationNoShow(id: ID!): Reservation!
  deleteReservation(id: ID!): Reservation! @deprecated(reason: "Use markReservationNoShow. This marks the reservation as no_show and does not delete the record.")
  submitReservationPayment(input: SubmitReservationPaymentInput!): Reservation!
  requestReservationChange(input: RequestReservationChangeInput!): Reservation!
  approveReservationChange(input: ApproveReservationChangeInput!): Reservation!
  rejectReservationChange(input: RejectReservationChangeInput!): Reservation!
  checkInReservation(input: CheckInReservationInput!): Reservation!
}

input SubmitReservationPaymentInput {
  reservationId: ID!
  method: String!
  paymentStatus: String!
  externalRef: String
}

input RequestReservationChangeInput {
  reservationId: ID!
  type: String!
  requestedTimeTo: DateTime
  requestedDurationMinutes: Int
  requestedTableId: ID
  note: String
}
