enum SearchEntityType {
  RESTAURANT
  MENU_ITEM
  CHEF
  OWNER
  LOCATION
  CHEF
}

type RestaurantSearchSuggestion {
  id: ID!
  name: String!
  shortAddress: String
  fullAddress: String
  phone: String
  avgRating: Float
  cuisineType: String
  lat: Float
  lng: Float
}

type MenuItemSearchSuggestion {
  id: ID!
  name: String!
  restaurantId: ID!
  restaurantName: String!
  timeSlot: TimeSlot
  thumbImage: String
  basePrice: Float
  categoryName: String
  servingLabel: String
  cookingMethods: [String!]!
}

type ChefSearchProfile {
  id: ID!
  fullName: String
  positionTitle: String
  avatarUrl: String
  restaurantId: ID!
  restaurantName: String!
  contactPhone: String
}

type OwnerSearchSuggestion {
  id: ID!
  fullName: String
  phone: String
  email: String
  managedRestaurantCount: Int!
}

type LocationSearchSuggestion {
  label: String!
  ward: String
  district: String
  city: String
  country: String
  postalCode: String
  lat: Float
  lng: Float
}

type SearchSuggestions {
  restaurants: [RestaurantSearchSuggestion!]!
  menuItems: [MenuItemSearchSuggestion!]!
  chefs: [ChefSearchProfile!]!
  owners: [OwnerSearchSuggestion!]!
  locations: [LocationSearchSuggestion!]!
}

input SearchFilterInput {
  types: [SearchEntityType!]
  timeSlot: TimeSlot
  city: String
  district: String
  minRating: Float
}

type SearchResult {
  type: SearchEntityType!
  score: Float
  timeSlot: TimeSlot

  restaurant: Restaurant
  menuItem: MenuItem
  chef: ChefSearchProfile
  owner: User
  chef: User

  categoryName: String
  servingLabel: String
  cookingMethods: [String!]!

  locationLabel: String
  locationCity: String
  locationDistrict: String
}

type SearchResultConnection {
  items: [SearchResult!]!
  totalCount: Int!
}

extend type Query {
  searchSuggestions(
    query: String!
    timeSlot: TimeSlot
    limitPerType: Int = 5
  ): SearchSuggestions

  search(
    query: String!
    filter: SearchFilterInput
    limit: Int = 20
    offset: Int = 0
  ): SearchResultConnection
}
