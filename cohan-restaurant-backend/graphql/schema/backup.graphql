type BackupChecklist {
  reportsChecked: Boolean!
  transactionsReconciled: Boolean!
  settingsReviewed: Boolean!
  exportPrepared: Boolean!
  safeCopyStored: Boolean!
  operatorRecorded: Boolean!
}

type BackupScope {
  ordersAndPayments: Boolean!
  tablesAndFloorPlan: Boolean!
  menuAndPricing: Boolean!
  inventory: Boolean!
  staffAndPermissions: Boolean!
  schedules: Boolean!
  customersAndPromotions: Boolean!
  reportsAndReconciliation: Boolean!
}

type BackupRisk {
  key: String!
  label: String!
  severity: String!
  resolved: Boolean!
  description: String
}

type BackupReadiness {
  restaurantId: ID!
  ready: Boolean!
  risks: [BackupRisk!]!
  checklist: BackupChecklist!
  scope: BackupScope!
  lastRun: BackupRun
}

type BackupRun {
  id: ID!
  restaurantId: ID!
  status: String!
  checklist: BackupChecklist!
  scope: BackupScope!
  note: String
  createdBy: ID
  completedBy: ID
  completedAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
}

input BackupChecklistInput {
  reportsChecked: Boolean
  transactionsReconciled: Boolean
  settingsReviewed: Boolean
  exportPrepared: Boolean
  safeCopyStored: Boolean
  operatorRecorded: Boolean
}

input BackupScopeInput {
  ordersAndPayments: Boolean
  tablesAndFloorPlan: Boolean
  menuAndPricing: Boolean
  inventory: Boolean
  staffAndPermissions: Boolean
  schedules: Boolean
  customersAndPromotions: Boolean
  reportsAndReconciliation: Boolean
}



type ConfigBackupSectionCount {
  key: String!
  label: String!
  count: Int!
  enabled: Boolean!
}

type RestaurantConfigBackupPreview {
  restaurantId: ID!
  fileName: String!
  schemaVersion: Int!
  createdAt: DateTime!
  counts: [ConfigBackupSectionCount!]!
  warnings: [String!]!
}

type RestaurantConfigBackupFile {
  fileName: String!
  mimeType: String!
  encoding: String!
  contentBase64: String!
  checksum: String!
  sizeBytes: Int!
  createdAt: DateTime!
}

type RestaurantConfigImportChange {
  section: String!
  action: String!
  label: String
  count: Int!
  warning: String
}

type RestaurantConfigImportPreview {
  valid: Boolean!
  schemaVersion: Int
  sourceRestaurantName: String
  targetRestaurantId: ID!
  mode: String!
  changes: [RestaurantConfigImportChange!]!
  warnings: [String!]!
  errors: [String!]!
}

type RestaurantConfigImportResult {
  success: Boolean!
  dryRun: Boolean!
  targetRestaurantId: ID!
  mode: String!
  changes: [RestaurantConfigImportChange!]!
  warnings: [String!]!
  errors: [String!]!
  backupRun: BackupRun
}

input RestaurantConfigBackupSectionsInput {
  restaurantProfile: Boolean
  systemSettings: Boolean
  printSettings: Boolean
  customerRankSettings: Boolean
  payrollSettings: Boolean
  schedulingPolicy: Boolean
  floorTableLayout: Boolean
  menuCatalog: Boolean
  inventoryMaster: Boolean
  promotionConfig: Boolean
  aiChatbotConfig: Boolean
}

input ExportRestaurantConfigBackupInput {
  restaurantId: ID!
  sections: RestaurantConfigBackupSectionsInput
}

input ImportRestaurantConfigBackupInput {
  targetRestaurantId: ID!
  fileContentBase64: String!
  mode: String = "clone"
  sections: RestaurantConfigBackupSectionsInput
  dryRun: Boolean = true
  replaceExisting: Boolean = false
}

input CreateBackupRunInput {
  restaurantId: ID!
  checklist: BackupChecklistInput
  scope: BackupScopeInput
  note: String
}

input UpdateBackupRunInput {
  id: ID!
  restaurantId: ID!
  checklist: BackupChecklistInput
  scope: BackupScopeInput
  note: String
  status: String
}

extend type Query {
  backupReadiness(restaurantId: ID!): BackupReadiness!
  backupRuns(restaurantId: ID!, limit: Int = 20, offset: Int = 0): [BackupRun!]!
  restaurantConfigBackupPreview(input: ExportRestaurantConfigBackupInput!): RestaurantConfigBackupPreview!
}

extend type Mutation {
  createBackupRun(input: CreateBackupRunInput!): BackupRun!
  updateBackupRun(input: UpdateBackupRunInput!): BackupRun!
  exportRestaurantConfigBackup(input: ExportRestaurantConfigBackupInput!): RestaurantConfigBackupFile!
  previewRestaurantConfigImport(input: ImportRestaurantConfigBackupInput!): RestaurantConfigImportPreview!
  importRestaurantConfigBackup(input: ImportRestaurantConfigBackupInput!): RestaurantConfigImportResult!
}
