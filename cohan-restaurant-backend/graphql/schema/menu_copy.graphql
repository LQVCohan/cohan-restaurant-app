input CopyMenuInput {
  restaurantId: ID!
  sourceMenuId: ID
  sourceTimeSlot: TimeSlot
  targetTimeSlot: TimeSlot!
  name: String
  description: String
  coverImage: String
  categoryMenuId: ID
  isActive: Boolean
  copyItems: Boolean = true
  copyRecipes: Boolean = true
}

extend type Mutation {
  copyMenu(input: CopyMenuInput!): Menu!
}
