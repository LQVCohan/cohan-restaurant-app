# src/graphql/schema/tableCustomer.graphql

type TableCustomer {
  id: ID!
  restaurantId: ID!
  tableId: ID
  tableCode: String

  customerName: String
  customerPhone: String
  customerEmail: String
  customerUserId: ID
  note: String
  dietaryNotes: String
  customerPreferences: String
  partySize: Int
  timeTo: DateTime

  createdAt: DateTime
  updatedAt: DateTime
}

type TableCustomerProfile {
  sourceTableId: ID!
  sourceTableCode: String!
  customer: TableCustomer
}

type TableCustomerGroup {
  tableId: ID!
  tableCode: String!
  isMerged: Boolean!
  customerCount: Int!
  totalPartySize: Int!
  profiles: [TableCustomerProfile!]!
}

input UpsertTableCustomerInput {
  restaurantId: ID!
  tableId: ID
  tableCode: String

  customerName: String
  customerPhone: String
  customerEmail: String
  customerUserId: ID
  note: String
  dietaryNotes: String
  customerPreferences: String
  partySize: Int
  timeTo: DateTime
}

extend type Query {
  """
  Lấy thông tin khách cho một bàn.
  Ưu tiên tableId > tableCode.
  """
  tableCustomer(
    restaurantId: ID!
    tableId: ID
    tableCode: String
  ): TableCustomer

  """
  Lấy toàn bộ hồ sơ khách của bàn đang hiển thị.
  Nếu là bàn ghép, mỗi profile tương ứng một bàn gốc.
  """
  tableCustomerGroup(
    restaurantId: ID!
    tableId: ID
    tableCode: String
  ): TableCustomerGroup!

  """
  Lấy tất cả TableCustomer của 1 nhà hàng
  """
  tableCustomersByRestaurant(restaurantId: ID!): [TableCustomer!]!
}

extend type Mutation {
  upsertTableCustomer(input: UpsertTableCustomerInput!): TableCustomer!

  deleteTableCustomer(
    restaurantId: ID!
    tableId: ID
    tableCode: String
  ): Boolean!

  clearTableCustomers(restaurantId: ID!): Boolean!
}
