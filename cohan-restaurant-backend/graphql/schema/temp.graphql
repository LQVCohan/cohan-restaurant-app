# ============ DRAFT: Types & Inputs ============

type TableDraft {
  id: ID!
  restaurantId: ID!
  tableId: ID
  tableCode: String
  customerName: String
  customerPhone: String
  customerEmail: String
  note: String
  partySize: Int
  timeTo: String
  createdAt: String
  updatedAt: String
  expiresAt: String
}

input UpsertTableDraftInput {
  restaurantId: ID!
  # Chọn 1 trong 2: tableId hoặc tableCode (khuyên dùng tableId nếu có)
  tableId: ID
  tableCode: String

  customerName: String
  customerPhone: String
  customerEmail: String
  note: String
  partySize: Int
  timeTo: String # ISO datetime (nếu có)
  ttlHours: Int # tuỳ chọn, mặc định 72h
}

extend type Query {
  # Lấy 1 draft theo bàn
  tableDraft(restaurantId: ID!, tableId: ID, tableCode: String): TableDraft

  # Lấy tất cả draft của 1 nhà hàng
  tableDraftsByRestaurant(restaurantId: ID!): [TableDraft!]!
}

extend type Mutation {
  # Tạo/cập nhật draft (mỗi bàn tối đa 1 draft đang hoạt động)
  upsertTableDraft(input: UpsertTableDraftInput!): TableDraft!

  # Xoá draft của 1 bàn
  deleteTableDraft(restaurantId: ID!, tableId: ID, tableCode: String): Boolean!

  # Xoá toàn bộ draft của 1 nhà hàng
  clearTableDrafts(restaurantId: ID!): Boolean!
}
