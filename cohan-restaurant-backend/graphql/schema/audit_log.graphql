type AuditLog {
  id: ID!
  restaurantId: ID
  entity: String!
  entityId: ID!
  action: String!
  byUserId: ID
  diff: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

input AuditLogFilterInput {
  restaurantId: ID
  entity: String
  entityId: ID
  action: String
  byUserId: ID
}

type AuditLogConnection {
  items: [AuditLog!]!
  total: Int!
}

input CopyMenuInput {
  restaurantId: ID!
  sourceMenuId: ID
  sourceTimeSlot: TimeSlot
  targetTimeSlot: TimeSlot!
  name: String
  description: String
  coverImage: String
  categoryMenuId: ID
  isActive: Boolean
  copyItems: Boolean = true
  copyRecipes: Boolean = true
}

extend type Query {
  auditLogs(
    filter: AuditLogFilterInput
    limit: Int = 50
    offset: Int = 0
  ): AuditLogConnection!
}

extend type Mutation {
  copyMenu(input: CopyMenuInput!): Menu!
  deleteMenu(id: ID!, force: Boolean = false): Boolean!
}
