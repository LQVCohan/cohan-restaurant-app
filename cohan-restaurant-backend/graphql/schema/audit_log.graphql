type AuditLog {
  id: ID!
  restaurantId: ID
  entity: String
  entityId: ID
  action: String!
  byUserId: ID
  diff: JSON
  actorId: ID
  actorName: String
  actorRole: String
  module: String
  targetType: String
  targetId: ID
  targetName: String
  before: JSON
  after: JSON
  metadata: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

input AuditLogFilterInput {
  restaurantId: ID
  entity: String
  entityId: ID
  action: String
  byUserId: ID
}

input AuditLogFilter {
  action: String
  module: String
  targetType: String
  targetId: ID
  actorId: ID
  restaurantId: ID
}

type AuditLogConnection {
  items: [AuditLog!]!
  total: Int!
}

input CopyMenuInput {
  restaurantId: ID!
  sourceMenuId: ID
  sourceTimeSlot: TimeSlot
  targetTimeSlot: TimeSlot!
  name: String
  description: String
  coverImage: String
  categoryMenuId: ID
  isActive: Boolean
  copyItems: Boolean = true
  copyRecipes: Boolean = true
}

extend type Query {
  auditLogs(
    filter: AuditLogFilterInput
    limit: Int = 50
    offset: Int = 0
  ): AuditLogConnection!
  rbacAuditLogs(
    filter: AuditLogFilter
    limit: Int = 50
    offset: Int = 0
  ): [AuditLog!]!
}
