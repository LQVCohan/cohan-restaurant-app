# =========================
# User Schema (updated)
# =========================

type User {
  id: ID!
  fullName: String!
  username: String
  email: String
  phone: String
  address: Address
  role: Role
  status: String
  provider: String
  avatarUrl: String
  refRestaurants: [Restaurant]
  point: Int
  loyaltyPoints: Int
  roleName: String!
  users: [User!]!
  customerType: String
  totalOrders: Int
  totalSpending: Float
  emailVerified: Boolean
  createdAt: String
  updatedAt: String
  createdBy: User
  updatedBy: User
}

input AddressInput {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

input CreateUserInput {
  fullName: String!
  username: String
  email: String
  phone: String
  address: AddressInput
  password: String!
  provider: String
  status: String
  roleId: ID
  refRestaurantIds: [ID!]
  customerType: String
  captchaToken: String
}

input LoginInput {
  email: String
  username: String
  phone: String
  password: String!
  captchaToken: String
}

# ⬇️ Thêm input cho updateUser
input UpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
}

type AuthPayload {
  token: String!
  user: User!
}

input AssignRoleToUserInput {
  userId: ID!
  roleId: ID!
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}

extend type Query {
  me: User
}
input UpdateAvatarInput {
  fileBase64: String # Data URL "data:image/png;base64,..." hoặc chỉ phần base64 đều được
  fileUrl: String # tuỳ chọn: nếu bạn đã upload ở nơi khác và chỉ muốn set URL
}
extend type Mutation {
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!
  updateAvatar(input: UpdateAvatarInput!): User!
  createUser(input: CreateUserInput!): AuthPayload!
  login(
    email: String
    username: String
    phone: String
    password: String!
    captchaToken: String
  ): AuthPayload!
  assignRoleToUser(input: AssignRoleToUserInput!): User!

  requestEmailVerification(email: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  resendVerification(email: String!): Boolean!

  updateUser(input: UpdateUserInput!): User!
}
