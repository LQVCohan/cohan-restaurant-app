# =========================
# User Schema (updated)
# =========================

type User {
  id: ID!
  fullName: String!
  username: String
  email: String
  phone: String
  address: Address
  role: Role
  status: String
  provider: String
  avatarUrl: String
  refRestaurants: [Restaurant]
  point: Int
  loyaltyPoints: Int
  roleName: String!
  users: [User!]!
  customerType: String
  totalOrders: Int
  totalSpending: Float
  emailVerified: Boolean
  createdAt: String
  updatedAt: String
  createdBy: User
  updatedBy: User
  isGuest: Boolean
  guestExpiresAt: DateTime
}

input AddressInput {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

input CreateUserInput {
  fullName: String!
  username: String
  email: String
  phone: String
  address: AddressInput
  password: String!
  provider: String
  status: String
  roleId: ID
  refRestaurantIds: [ID!]
  customerType: String
  captchaToken: String
}

input LoginInput {
  email: String
  username: String
  phone: String
  password: String!
  captchaToken: String
}

# ⬇️ Thêm input cho updateUser
input UpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
}

type AuthPayload {
  token: String!
  user: User!
}

input AssignRoleToUserInput {
  userId: ID!
  roleId: ID!
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}
input AdminUpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
  status: String # 'active' | 'inactive' | 'blocked' | 'pending'
  customerType: CustomerType
  loyaltyPoints: Int
  totalOrders: Int
  totalSpending: Float
  isGuest: Boolean
  guestExpiresAt: String
  refRestaurantIds: [ID!]
  roleId: ID
}
extend type Query {
  me: User
  roleList: [Role!]!
  users(roleId: ID, search: String, isGuest: Boolean): [User!]!
  customers(search: String, includeGuests: Boolean): [User!]!
}
input UpdateAvatarInput {
  fileBase64: String
  fileUrl: String
}
extend type Mutation {
  createUser(input: CreateUserInput!): AuthPayload!
  login(
    email: String
    username: String
    phone: String
    password: String!
    captchaToken: String
  ): AuthPayload!
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!
  updateUser(input: UpdateUserInput!): User!
  updateAvatar(input: UpdateAvatarInput!): User!

  # Email verification (nếu bạn đã triển khai)
  requestEmailVerification(email: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  resendVerification(email: String!): Boolean!

  # Role & Admin operations
  assignRoleToUser(input: AssignRoleToUserInput!): User!
  adminUpdateUser(userId: ID!, input: AdminUpdateUserInput!): User!
  setUserStatus(userId: ID!, status: String!): User!
  softDeleteUser(userId: ID!): Boolean!

  # Guest helpers
  createGuestUser(fullName: String, phone: String, expiresInDays: Int): User!
}
