type Query {
  me: User
  users(roleId: ID, isGuest: Boolean, search: String): [User!]!
  customers(search: String, includeGuests: Boolean = true, restaurantId: ID): [User!]!
  customerListPage(
    restaurantId: ID!
    search: String
    includeGuests: Boolean = true
    customerKind: CustomerKindFilter = ALL
    customerRank: CustomerRankFilterInput
    sortBy: CustomerSortBy = CREATED_AT
    sortDirection: SortDirection = DESC
    limit: Int = 30
    cursor: String
  ): CustomerListPage!
  customerDetailAnalytics(restaurantId: ID!, userId: ID!): CustomerDetailAnalytics!
  customerListSummaries(restaurantId: ID!, userIds: [ID!]!): [CustomerListSummary!]!
  customerAnalytics(restaurantId: ID!): CustomerAnalyticsSummary!
  customerRankSettings(restaurantId: ID!): CustomerRankSettings!
  roleList(restaurantId: ID): [Role!]!
  staffPrivateProfile(id: ID!): StaffPrivateProfile!
  schedulePublications(restaurantId: ID!, periodStart: DateTime, periodEnd: DateTime): [SchedulePublication!]!
  schedulePublishValidation(restaurantId: ID!, periodStart: DateTime!, periodEnd: DateTime!, mandatoryShiftRoles: JSON): SchedulePublishValidationResult!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  deleteUser(id: ID!): User!
  updateProfile(input: UpdateUserInput!): User!
  sendVerification(channel: VerificationChannel!): VerificationResult!
  verifyContactChange(token: String!): User!
  verifyContactToken(token: String!): VerificationResult!
  publishSchedule(input: PublishScheduleInput!): SchedulePublication!
  reopenSchedulePublication(restaurantId: ID!, periodStart: DateTime!, periodEnd: DateTime!, reason: String!): SchedulePublication!
  changePublishedShiftGroupTime(input: ChangePublishedShiftGroupTimeInput!): ScheduleChangeLog!
  addStaffToPublishedShiftGroup(input: AddStaffToPublishedShiftGroupInput!): ScheduleChangeLog!
  removeStaffFromPublishedShift(input: RemoveStaffFromPublishedShiftInput!): ScheduleChangeLog!
  deletePublishedShiftGroup(input: DeletePublishedShiftGroupInput!): ScheduleChangeLog!
}
