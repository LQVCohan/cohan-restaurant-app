scalar DateTime

# =========================
# Enums
# =========================

enum UserType {
  CUSTOMER
  STAFF
  MANAGER
  HR
  ACCOUNTANT
  ADMIN
}

enum EmploymentType {
  FULL_TIME
  PART_TIME
  PROBATION
  SEASONAL
  CONTRACT
}

enum EmploymentStatus {
  WORKING
  ON_LEAVE
  RESIGNED
  SUSPENDED
}

enum ShiftType {
  MORNING
  AFTERNOON
  EVENING
  FULL_DAY
  ROTATING
}

enum StaffWorkingDay {
  MON
  TUE
  WED
  THU
  FRI
  SAT
  SUN
}

enum DepartmentType {
  service
  kitchen
  cashier
  management
  cleaning
  delivery
  inventory
  bar
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}

# =========================
# Core Types
# =========================

type Restaurant {
  id: ID!
  name: String!
  defaultCurrency: String
  manualUsdToVndRate: Float
}

type Address {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

type EmergencyContact {
  name: String
  phone: String
  relation: String
}

type Wallet {
  provider: String
  status: String
  balance: Float
  currency: String
  createdAt: DateTime
  updatedAt: DateTime
}

enum WalletTransactionType {
  TOPUP
  PAYMENT
  REFUND
  ADJUSTMENT
}

enum WalletTransactionStatus {
  SUCCESS
  FAILED
  PENDING
}

type WalletTransaction {
  id: ID!
  userId: ID!
  type: WalletTransactionType!
  amount: Float!
  currency: String
  balanceBefore: Float!
  balanceAfter: Float!
  status: WalletTransactionStatus!
  referenceType: String
  referenceId: ID
  orderIds: [ID!]
  metadata: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

# =========================
# User Schema
# =========================

type User {
  id: ID!
