scalar DateTime

# =========================
# Enums
# =========================

enum UserType {
  CUSTOMER
  STAFF
  MANAGER
  HR
  ACCOUNTANT
  ADMIN
}

enum EmploymentType {
  FULL_TIME
  PART_TIME
  PROBATION
  SEASONAL
  CONTRACT
}

enum EmploymentStatus {
  WORKING
  ON_LEAVE
  RESIGNED
  SUSPENDED
}

enum ShiftType {
  MORNING
  AFTERNOON
  EVENING
  FULL_DAY
  ROTATING
}

enum StaffWorkingDay {
  MON
  TUE
  WED
  THU
  FRI
  SAT
  SUN
}

enum DepartmentType {
  service
  kitchen
  cashier
  management
  cleaning
  delivery
  inventory
  bar
}

enum StaffGender {
  MALE
  FEMALE
  OTHER
  UNSPECIFIED
}

enum MaritalStatus {
  SINGLE
  MARRIED
  DIVORCED
  WIDOWED
  UNSPECIFIED
}

enum StaffContractType {
  NONE
  PROBATION
  FIXED_TERM
  INDEFINITE
  SEASONAL
  SERVICE
}

enum StaffSalaryType {
  MONTHLY
  HOURLY
  SHIFT
  COMMISSION
}

enum StaffTrainingStatus {
  NOT_STARTED
  IN_PROGRESS
  COMPLETED
  EXPIRED
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}

enum VerificationChannel {
  EMAIL
  SMS
  BOTH
  AUTO
}

enum VerificationDeliveryStatus {
  SENT
  SKIPPED
  FAILED
  NOT_CONFIGURED
  COOLDOWN
  ALREADY_VERIFIED
  VERIFIED
}

enum ContactChangeTarget {
  EMAIL
  PHONE
}

# =========================
# Core Types
# =========================
type SchedulePublication {
  id: ID!
  restaurantId: ID!
  periodStart: DateTime!
  periodEnd: DateTime!

  status: String!
  effectiveStatus: String!

  publishedAt: DateTime
  publishedBy: ID

  activatedAt: DateTime

  lockedAt: DateTime
  lockedBy: ID
  lockReason: String

  reopenedAt: DateTime
  reopenedBy: ID
  reopenReason: String
  reopenCount: Int

  closedAt: DateTime
  closedBy: ID
  closeReason: String

  reminderSentAt: DateTime
  lastChangedAt: DateTime

  permissions: ScheduleLifecyclePermissions!

  createdAt: DateTime
  updatedAt: DateTime
}

type ScheduleLifecyclePermissions {
  canPublish: Boolean!
  canApplyAutoSchedule: Boolean!
  canEditDraftSchedule: Boolean!
  canMakePublishedChange: Boolean!
  canChangeShiftTime: Boolean!
  canAddStaffToShift: Boolean!
  canRemoveStaffFromShift: Boolean!
  canDeleteShiftGroup: Boolean!
  requiresChangeReason: Boolean!
  requiresEmployeeNotification: Boolean!
  isReadOnly: Boolean!
  canReopen: Boolean!
}
type ScheduleChangeLog {
  id: ID!
  restaurantId: ID
  actorUserId: ID
  verb: String!
  source: String
  status: String
  objectKind: String
  objectId: ID
  objectCode: String
  reason: String
  affectedShiftIds: [ID!]!
  affectedEmployeeIds: [ID!]!
  notifyEmployees: Boolean
  oldStartTime: DateTime
  oldEndTime: DateTime
  newStartTime: DateTime
  newEndTime: DateTime
  meta: JSON
  diff: JSON
  createdAt: DateTime
  at: DateTime
}
input PublishScheduleInput {
  restaurantId: ID!
  periodStart: DateTime!
  periodEnd: DateTime!
  mandatoryShiftRoles: JSON
}
input ChangePublishedShiftGroupTimeInput {
  restaurantId: ID!
  shiftIds: [ID!]!
  startTime: DateTime!
  endTime: DateTime!
  reason: String!
  notifyEmployees: Boolean = true
  allowOverride: Boolean = false
  overrideReason: String
}
input AddStaffToPublishedShiftGroupInput {
  restaurantId: ID!
  shiftIds: [ID!]!
  employeeId: ID!
  reason: String!
  notifyEmployees: Boolean = true
  allowOverride: Boolean = false
  overrideReason: String
}
input RemoveStaffFromPublishedShiftInput {
  restaurantId: ID!
  shiftId: ID!
  reason: String!
  notifyEmployees: Boolean = true
}
input DeletePublishedShiftGroupInput {
  restaurantId: ID!
  shiftIds: [ID!]!
  reason: String!
  notifyEmployees: Boolean = true
}

type SchedulePublishValidationResult {
  canPublish: Boolean!
  errors: [String!]!
  warnings: [String!]!
  missingRoles: JSON
}

# =========================
# Additional Core Types
# =========================

type Address {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}


type Wallet {
  id: ID!
  balance: Float!
  currency: String!
  provider: String
  status: String
  updatedAt: DateTime
}

type WalletTransaction {
  id: ID!
  type: String!
  amount: Float!
  balanceBefore: Float
  balanceAfter: Float
  status: String!
  note: String
  createdAt: DateTime
}

type VerificationResult {
  status: VerificationDeliveryStatus!
  message: String!
  emailSent: Boolean!
  smsSent: Boolean!
  cooldownUntil: DateTime
  alreadyVerified: Boolean!
}

type EmergencyContact {
  name: String
  phone: String
  relation: String
}

type EmergencyContactExtended {
  name: String
  phone: String
  relation: String
  address: String
  isPrimary: Boolean
}

type StaffCertification {
  name: String
  issuedBy: String
  issuedAt: DateTime
  expiresAt: DateTime
  fileUrl: String
}

type StaffLanguageSkill {
  name: String
  level: String
}

