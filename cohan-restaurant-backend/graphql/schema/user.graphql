scalar DateTime

# =========================
# Enums
# =========================

enum UserType {
  CUSTOMER
  STAFF
  MANAGER
  ADMIN
}

enum EmploymentType {
  FULL_TIME
  PART_TIME
  PROBATION
  SEASONAL
  CONTRACT
}

enum EmploymentStatus {
  WORKING
  ON_LEAVE
  RESIGNED
  SUSPENDED
}

enum ShiftType {
  MORNING
  AFTERNOON
  EVENING
  FULL_DAY
  ROTATING
}

enum StaffWorkingDay {
  MON
  TUE
  WED
  THU
  FRI
  SAT
  SUN
}

enum DepartmentType {
  service
  kitchen
  cashier
  management
  cleaning
  delivery
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}

# =========================
# Core Types
# =========================

type Restaurant {
  id: ID!
  name: String!
}

type Address {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

type EmergencyContact {
  name: String
  phone: String
  relation: String
}

type Wallet {
  provider: String
  status: String
  balance: Float
  currency: String
  createdAt: DateTime
  updatedAt: DateTime
}

# =========================
# User Schema
# =========================

type User {
  id: ID!
  fullName: String!
  username: String
  email: String
  phone: String
  address: Address
  role: Role
  status: String
  provider: String
  avatarUrl: String
  refRestaurants: [Restaurant]
  restaurantForStaff: ID
  point: Int
  loyaltyPoints: Int
  roleName: String
  loyaltyRank: String

  customerType: CustomerType
  totalOrders: Int
  totalSpending: Float
  emailVerified: Boolean
  createdAt: String
  updatedAt: String
  createdBy: User
  updatedBy: User
  isGuest: Boolean
  guestExpiresAt: DateTime

  userType: UserType
  taxCode: String

  employeeCode: String
  positionTitle: String
  baseSalary: Int
  employmentType: EmploymentType
  employmentStatus: EmploymentStatus

  primaryRestaurant: Restaurant
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]

  dateJoined: DateTime
  dateLeft: DateTime

  lastLoginAt: DateTime
  lastLoginIp: String
  forcePasswordChange: Boolean

  noteInternal: String
  emergencyContact: EmergencyContact
  rate: Float
  rateCount: Int

  wallet: Wallet
}

# =========================
# Inputs
# =========================

input AddressInput {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

input EmergencyContactInput {
  name: String
  phone: String
  relation: String
}

input CreateUserInput {
  fullName: String!
  username: String
  email: String
  phone: String
  address: AddressInput
  password: String
  provider: String
  status: String
  roleId: ID
  refRestaurantIds: [ID!]
  restaurantForStaff: ID
  customerType: CustomerType
  captchaToken: String

  userType: UserType
  taxCode: String
  department: DepartmentType
  employeeCode: String
  positionTitle: String
  employmentType: EmploymentType
  employmentStatus: EmploymentStatus
  primaryRestaurantId: ID
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]
  dateJoined: DateTime
  noteInternal: String
  emergencyContact: EmergencyContactInput
  baseSalary: Int
}

input UpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
  loyaltyRank: String
}

input UpdateAvatarInput {
  fileBase64: String
  fileUrl: String
}

input CreateWalletInput {
  provider: String
  currency: String
}

input AssignRoleToUserInput {
  userId: ID!
  roleId: ID!
}

input AdminUpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
  status: String
  customerType: CustomerType
  loyaltyPoints: Int
  totalOrders: Int
  totalSpending: Float
  isGuest: Boolean
  guestExpiresAt: String
  refRestaurantIds: [ID!]
  restaurantForStaff: ID
  roleId: ID

  userType: UserType
  taxCode: String

  employeeCode: String
  positionTitle: String
  employmentType: EmploymentType
  employmentStatus: EmploymentStatus
  primaryRestaurantId: ID
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]
  dateJoined: DateTime
  dateLeft: DateTime
  forcePasswordChange: Boolean
  noteInternal: String
  emergencyContact: EmergencyContactInput
}

# =========================
# Auth
# =========================

type AuthPayload {
  token: String!
  user: User!
}

# =========================
# Queries
# =========================

type Query {
  me: User
  roleList: [Role!]!
  users(roleId: ID, search: String, isGuest: Boolean): [User!]!
  customers(search: String, includeGuests: Boolean): [User!]!

  staff(id: ID!): User
  staffList(
    restaurantId: ID
    roleId: ID
    search: String
    employmentStatus: EmploymentStatus
  ): [User!]!
}

# =========================
# Mutations
# =========================

type Mutation {
  createUser(input: CreateUserInput!): AuthPayload!
  login(
    email: String
    username: String
    phone: String
    password: String!
    captchaToken: String
  ): AuthPayload!
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!

  updateUser(input: UpdateUserInput!): User!
  updateAvatar(input: UpdateAvatarInput!): User!

  requestEmailVerification(email: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  resendVerification(email: String!): Boolean!

  assignRoleToUser(input: AssignRoleToUserInput!): User!
  adminUpdateUser(userId: ID!, input: AdminUpdateUserInput!): User!
  setUserStatus(userId: ID!, status: String!): User!
  softDeleteUser(userId: ID!): Boolean!

  createGuestUser(fullName: String, phone: String, expiresInDays: Int): User!

  createMyWallet(input: CreateWalletInput!): User!

  updateCustomerMetrics(
    id: ID!
    loyaltyPoints: Int!
    customerType: CustomerType!
  ): User!

  createStaff(input: CreateUserInput!): User!
  updateStaff(userId: ID!, input: AdminUpdateUserInput!): User!
  deleteStaff(userId: ID!): Boolean!
  rateStaff(userId: ID!, rating: Int!): User!
  setStaffEmploymentStatus(
    userId: ID!
    employmentStatus: EmploymentStatus!
  ): User!
}
