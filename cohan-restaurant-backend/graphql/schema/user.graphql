# =========================
# Common Scalars
# =========================
scalar DateTime

# =========================
# Core Types
# =========================

type Role {
  id: ID!
  name: String!
  slug: String!
  description: String
  createdAt: String
  updatedAt: String
}

type Restaurant {
  id: ID!
  name: String!
}

type Address {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

# =========================
# User Schema
# =========================

type User {
  id: ID!
  fullName: String!
  username: String
  email: String
  phone: String
  address: Address
  role: Role
  status: String
  provider: String
  avatarUrl: String
  refRestaurants: [Restaurant]
  point: Int
  loyaltyPoints: Int
  roleName: String

  customerType: String
  totalOrders: Int
  totalSpending: Float
  emailVerified: Boolean
  createdAt: String
  updatedAt: String
  createdBy: User
  updatedBy: User
  isGuest: Boolean
  guestExpiresAt: DateTime
}

# =========================
# Inputs
# =========================

input AddressInput {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

input CreateUserInput {
  fullName: String!
  username: String
  email: String
  phone: String
  address: AddressInput
  password: String!
  provider: String
  status: String
  roleId: ID
  refRestaurantIds: [ID!]
  customerType: String
  captchaToken: String
}

input UpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
}

input UpdateAvatarInput {
  fileBase64: String
  fileUrl: String
  # clear: Boolean  # nếu cần xoá avatar có thể mở rộng thêm trường này
}

input AssignRoleToUserInput {
  userId: ID!
  roleId: ID!
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}

input AdminUpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
  status: String # 'active' | 'inactive' | 'blocked' | 'pending'
  customerType: CustomerType
  loyaltyPoints: Int
  totalOrders: Int
  totalSpending: Float
  isGuest: Boolean
  guestExpiresAt: String
  refRestaurantIds: [ID!]
  roleId: ID
}

# =========================
# Auth
# =========================

type AuthPayload {
  token: String!
  user: User!
}

# =========================
# Queries
# =========================

type Query {
  me: User
  roleList: [Role!]!
  users(roleId: ID, search: String, isGuest: Boolean): [User!]!
  customers(search: String, includeGuests: Boolean): [User!]!
}

# =========================
# Mutations
# =========================

type Mutation {
  # Auth
  createUser(input: CreateUserInput!): AuthPayload!
  login(
    email: String
    username: String
    phone: String
    password: String!
    captchaToken: String
  ): AuthPayload!
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!

  # Profile
  updateUser(input: UpdateUserInput!): User!
  updateAvatar(input: UpdateAvatarInput!): User!

  # Email verification
  requestEmailVerification(email: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  resendVerification(email: String!): Boolean!

  # Role & Admin ops
  assignRoleToUser(input: AssignRoleToUserInput!): User!
  adminUpdateUser(userId: ID!, input: AdminUpdateUserInput!): User!
  setUserStatus(userId: ID!, status: String!): User!
  softDeleteUser(userId: ID!): Boolean!

  # Guests
  createGuestUser(fullName: String, phone: String, expiresInDays: Int): User!

  # Loyalty/Metrics (NEW): đồng bộ điểm & hạng từ FE tính toán
  updateCustomerMetrics(
    id: ID!
    loyaltyPoints: Int!
    customerType: CustomerType!
  ): User!
}
