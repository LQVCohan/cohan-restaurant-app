# =========================
# Queries
# =========================

type Query {
  me: User
  roleList: [Role!]!
  users(roleId: ID, search: String, isGuest: Boolean): [User!]!
  customers(search: String, includeGuests: Boolean): [User!]!
  customerDetailAnalytics(userId: ID!, restaurantId: ID): CustomerDetailAnalytics!
  customerAnalytics(restaurantId: ID!): CustomerAnalyticsSummary!
  customerRankSettings(restaurantId: ID!): CustomerRankSettings!

  staff(id: ID!): User
  staffList(
    restaurantId: ID
    roleId: ID
    search: String
    employmentStatus: EmploymentStatus
  ): [User!]!
  staffAccountOverview(staffId: ID): StaffAccountOverview
  staffSalarySummary(staffId: ID): StaffSalarySummary
  staffShiftHistory(staffId: ID, limit: Int = 20): [StaffShiftHistoryItem!]!
  staffPayrollOverview(
    startDate: DateTime!
    endDate: DateTime!
    restaurantId: ID
    periodId: ID
  ): StaffPayrollOverview!
  payrollPeriods(restaurantId: ID, limit: Int = 12): [PayrollPeriod!]!
  payrollPeriodDetail(periodId: ID!): PayrollPeriodDetail
  payrollSettings(restaurantId: ID): PayrollSettings
  validatePayrollPeriod(periodId: ID!): PayrollValidationResult!
  myPayslips(limit: Int = 12): [StaffPayrollItem!]!
  myPayslip(periodId: ID!): StaffPayrollItem
  staffShifts(
    restaurantId: ID
    employeeId: ID
    startDate: DateTime
    endDate: DateTime
    status: String
    limit: Int = 500
  ): [StaffScheduleShift!]!
  staffAttendanceRecords(
    restaurantId: ID
    startDate: DateTime!
    endDate: DateTime!
    employeeId: ID
    status: String
    search: String
  ): [StaffAttendanceRecord!]!
  leaveRequests(filter: LeaveRequestFilterInput): [LeaveRequest!]!
  myReplacementLeaveRequests(
    restaurantId: ID
    status: ReplacementStatus
  ): [LeaveRequest!]!
  leaveBalance(employeeId: ID!, year: Int): LeaveBalance
  staffReportsOverview(input: StaffReportsInput!): StaffReportsOverview!
  staffSchedulingAssistant(
    restaurantId: ID!
    horizonDays: Int = 2
    timezone: String = "Asia/Ho_Chi_Minh"
  ): StaffSchedulingAssistant!
  myWalletTransactions(limit: Int = 20, offset: Int = 0): [WalletTransaction!]!
}

# =========================
# Mutations
# =========================

type Mutation {
  createUser(input: CreateUserInput!): AuthPayload!
  login(
    email: String
    username: String
    phone: String
    password: String!
    captchaToken: String
  ): AuthPayload!
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!

  updateUser(input: UpdateUserInput!): User!
  updateAvatar(input: UpdateAvatarInput!): User!

  requestEmailVerification(email: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  resendVerification(email: String!): Boolean!

  assignRoleToUser(input: AssignRoleToUserInput!): User!
  adminUpdateUser(userId: ID!, input: AdminUpdateUserInput!): User!
  setUserStatus(userId: ID!, status: String!): User!
  softDeleteUser(userId: ID!): Boolean!

  createGuestUser(fullName: String, phone: String, expiresInDays: Int): User!

  createMyWallet(input: CreateWalletInput!): User!
  topUpMyWallet(input: WalletTopupInput!): WalletTransaction!

  updateCustomerMetrics(
    id: ID!
    loyaltyPoints: Int!
    customerType: CustomerType!
  ): User!
  upsertCustomerRankSettings(
    restaurantId: ID!
    ranks: [RankThresholdInput!]!
  ): CustomerRankSettings!

  createStaff(input: CreateUserInput!): User!
  updateStaff(userId: ID!, input: AdminUpdateUserInput!): User!
  deleteStaff(userId: ID!): Boolean!
  rateStaff(userId: ID!, rating: Int!): User!
  setStaffEmploymentStatus(
    userId: ID!
    employmentStatus: EmploymentStatus!
  ): User!

  createStaffShift(input: CreateStaffShiftInput!): StaffScheduleShift!
  updateStaffShift(shiftId: ID!, input: UpdateStaffShiftInput!): StaffScheduleShift!
  deleteStaffShift(shiftId: ID!): Boolean!
  createPayrollPeriod(input: CreatePayrollPeriodInput!): PayrollPeriod!
  recalculatePayrollPeriod(periodId: ID!): PayrollPeriodDetail!
  finalizePayrollPeriod(periodId: ID!): PayrollPeriod!
  lockPayrollPeriod(periodId: ID!): PayrollPeriod!
  markPayrollPeriodPaid(periodId: ID!, employeeIds: [ID!]): PayrollPeriod!
  updatePayrollSettings(input: PayrollSettingsInput!): PayrollSettings!
  upsertPayrollAdjustment(input: PayrollAdjustmentInput!): StaffPayrollItem!
  deletePayrollAdjustment(periodId: ID!, employeeId: ID!, adjustmentId: ID!): StaffPayrollItem!
