scalar DateTime

# =========================
# Enums
# =========================

enum UserType {
  CUSTOMER
  STAFF
  MANAGER
  ADMIN
}

enum EmploymentType {
  FULL_TIME
  PART_TIME
  PROBATION
  SEASONAL
  CONTRACT
}

enum EmploymentStatus {
  WORKING
  ON_LEAVE
  RESIGNED
  SUSPENDED
}

enum ShiftType {
  MORNING
  AFTERNOON
  EVENING
  FULL_DAY
  ROTATING
}

enum StaffWorkingDay {
  MON
  TUE
  WED
  THU
  FRI
  SAT
  SUN
}

enum DepartmentType {
  service
  kitchen
  cashier
  management
  cleaning
  delivery
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}

# =========================
# Core Types
# =========================

type Restaurant {
  id: ID!
  name: String!
  defaultCurrency: String
  manualUsdToVndRate: Float
}

type Address {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

type EmergencyContact {
  name: String
  phone: String
  relation: String
}

type Wallet {
  provider: String
  status: String
  balance: Float
  currency: String
  createdAt: DateTime
  updatedAt: DateTime
}

enum WalletTransactionType {
  TOPUP
  PAYMENT
  REFUND
  ADJUSTMENT
}

enum WalletTransactionStatus {
  SUCCESS
  FAILED
  PENDING
}

type WalletTransaction {
  id: ID!
  userId: ID!
  type: WalletTransactionType!
  amount: Float!
  currency: String
  balanceBefore: Float!
  balanceAfter: Float!
  status: WalletTransactionStatus!
  referenceType: String
  referenceId: ID
  orderIds: [ID!]
  metadata: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

# =========================
# User Schema
# =========================

type User {
  id: ID!
  fullName: String!
  username: String
  email: String
  phone: String
  address: Address
  role: Role
  status: String
  provider: String
  avatarUrl: String
  refRestaurants: [Restaurant]
  restaurantForStaff: ID
  point: Int
  loyaltyPoints: Int
  roleName: String
  loyaltyRank: String

  customerType: CustomerType
  totalOrders: Int
  totalSpending: Float
  emailVerified: Boolean
  createdAt: String
  updatedAt: String
  createdBy: User
  updatedBy: User
  isGuest: Boolean
  guestExpiresAt: DateTime

  userType: UserType
  taxCode: String
  department: DepartmentType

  employeeCode: String
  positionTitle: String
  baseSalary: Int
  employmentType: EmploymentType
  employmentStatus: EmploymentStatus

  primaryRestaurant: Restaurant
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]

  dateJoined: DateTime
  dateLeft: DateTime

  lastLoginAt: DateTime
  lastLoginIp: String
  forcePasswordChange: Boolean

  noteInternal: String
  emergencyContact: EmergencyContact
  rate: Float
  rateCount: Int

  wallet: Wallet
  isOnline: Boolean
  loyaltyDurationScore: Int
}

type CustomerTopDish {
  dishName: String!
  quantity: Int!
}

type CustomerDetailAnalytics {
  userId: ID!
  favoriteFoods: [String!]!
  recentOrderCodes: [String!]!
  topDishes: [CustomerTopDish!]!
  loyaltyDurationScore: Int!
  rankPoints: Int!
}

type CustomerAnalyticsDay {
  date: String!
  orderCount: Int!
}

type CustomerAnalyticsSummary {
  restaurantId: ID!
  mostPopularDishes: [CustomerTopDish!]!
  busiestDays: [CustomerAnalyticsDay!]!
  averageMembershipDays: Int!
  activeCustomerCount: Int!
  returningCustomerCount: Int!
}

type RankThreshold {
  name: String!
  minPoints: Int!
  benefits: String
}

input RankThresholdInput {
  name: String!
  minPoints: Int!
  benefits: String
}

type CustomerRankSettings {
  restaurantId: ID!
  ranks: [RankThreshold!]!
  updatedAt: DateTime
}

# =========================
# Inputs
# =========================

input AddressInput {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

input EmergencyContactInput {
  name: String
  phone: String
  relation: String
}

input CreateUserInput {
  fullName: String!
  username: String
  email: String
  phone: String
  address: AddressInput
  password: String
  provider: String
  status: String
  roleId: ID
  refRestaurantIds: [ID!]
  restaurantForStaff: ID
  customerType: CustomerType
  captchaToken: String

  userType: UserType
  taxCode: String
  department: DepartmentType
  employeeCode: String
  positionTitle: String
  employmentType: EmploymentType
  employmentStatus: EmploymentStatus
  primaryRestaurantId: ID
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]
  dateJoined: DateTime
  noteInternal: String
  emergencyContact: EmergencyContactInput
  baseSalary: Int
}

input UpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
  loyaltyRank: String
}

input UpdateAvatarInput {
  fileBase64: String
  fileUrl: String
}

input CreateWalletInput {
  provider: String
  currency: String
}

input WalletTopupInput {
  amount: Float!
  note: String
  idempotencyKey: String
}

input AssignRoleToUserInput {
  userId: ID!
  roleId: ID!
}

input AdminUpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
  status: String
  customerType: CustomerType
  loyaltyPoints: Int
  totalOrders: Int
  totalSpending: Float
  isGuest: Boolean
  guestExpiresAt: String
  refRestaurantIds: [ID!]
  restaurantForStaff: ID
  roleId: ID

  userType: UserType
  taxCode: String

  employeeCode: String
  positionTitle: String
  employmentType: EmploymentType
  employmentStatus: EmploymentStatus
  primaryRestaurantId: ID
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]
  dateJoined: DateTime
  dateLeft: DateTime
  forcePasswordChange: Boolean
  noteInternal: String
  emergencyContact: EmergencyContactInput
}

# =========================
# Auth
# =========================

type AuthPayload {
  token: String!
  user: User!
}

type StaffAccountOverview {
  staffId: ID!
  fullName: String
  email: String
  phone: String
  avatarUrl: String
  roleName: String
  positionTitle: String
  employeeCode: String
  employmentStatus: EmploymentStatus
  primaryRestaurant: Restaurant
  restaurantForStaff: ID
  floorAssigned: [String!]!
  floorCount: Int!
  tableCount: Int!
  categoryCount: Int!
  promotionCount: Int!
  tableList: [String!]!
  ordersServedCount: Int!
  shiftsWorkedCount: Int!
  currentShift: String
  lastShift: String
}

type StaffSalarySummary {
  staffId: ID!
  baseSalary: Float
  totalHours: Float!
  totalWage: Float!
  totalAmount: Float!
  bonusAmount: Float!
  grossIncome: Float!
  totalDeduction: Float!
  netSalary: Float!
  insuranceSocial: Float!
  insuranceHealth: Float!
  insuranceUnemployment: Float!
  insuranceTotal: Float!
  overtimeNormal: Float!
  overtimeWeekend: Float!
  overtimeHoliday: Float!
  nightShiftExtra: Float!
  insuranceEligible: Boolean!
  policyCode: String
  policyEffectiveFrom: String
  warningMessages: [String!]!
  coefficient: Float!
  timesheetCount: Int!
}

type StaffShiftHistoryItem {
  id: ID!
  restaurant: Restaurant
  shiftType: String
  startTime: DateTime
  endTime: DateTime
  status: String
  notes: String
}

type PayrollStats {
  totalPayroll: Float!
  paidAmount: Float!
  remaining: Float!
  progress: Int!
}

type StaffPayrollItem {
  id: ID!
  name: String!
  code: String
  role: String
  department: String
  avatar: String
  baseSalary: Float!
  workDays: Int!
  actualWorkDays: Int!
  totalHours: Float!
  hourlyRate: Float!
  allowance: Float!
  bonus: Float!
  otherAddition: Float!
  overtime: Float!
  overtimeNormal: Float!
  overtimeWeekend: Float!
  overtimeHoliday: Float!
  nightShiftExtra: Float!
  overtimeHours: Float!
  overtimeNormalHours: Float!
  overtimeWeekendHours: Float!
  overtimeHolidayHours: Float!
  nightHours: Float!
  overtimeNightHours: Float!
  deduction: Float!
  otherDeduction: Float!
  advance: Float!
  insuranceSocial: Float!
  insuranceHealth: Float!
  insuranceUnemployment: Float!
  insuranceTotal: Float!
  insuranceEmployerTotal: Float!
  personalIncomeTax: Float!
  grossIncome: Float!
  coefficient: Float!
  totalIncome: Float!
  totalDeduction: Float!
  netSalary: Float!
  policyCode: String
  policyEffectiveFrom: String
  regionCode: String
  minimumWageMonthly: Float!
  minimumWageHourly: Float!
  minimumWageViolation: Boolean!
  insuranceEligible: Boolean!
  warningMessages: [String!]!
  status: String!
}

type StaffPayrollOverview {
  stats: PayrollStats!
  items: [StaffPayrollItem!]!
}

type StaffScheduleShift {
  id: ID!
  employeeId: ID!
  employeeName: String
  restaurantId: ID!
  shiftType: String!
  startTime: DateTime!
  endTime: DateTime!
  status: String!
  notes: String
}

type StaffAttendanceRecord {
  id: ID!
  employeeId: ID!
  employeeName: String
  employeeCode: String
  employeeRole: String
  employeeAvatar: String
  restaurantId: ID!
  workDate: DateTime!
  shiftId: ID
  shiftType: String
  plannedStartTime: DateTime
  plannedEndTime: DateTime
  actualCheckInAt: DateTime
  actualCheckOutAt: DateTime
  workedMinutes: Int!
  hours: Float!
  latenessMinutes: Int!
  earlyLeaveMinutes: Int!
  overtimeMinutes: Int!
  status: String!
  isOffSchedule: Boolean!
  source: String!
  note: String
  approved: Boolean!
  createdAt: DateTime
  updatedAt: DateTime
}

input UpsertStaffAttendanceInput {
  employeeId: ID!
  restaurantId: ID!
  action: String!
  timestamp: DateTime
  workDate: DateTime
  note: String
  source: String
}

input CreateStaffShiftInput {
  employeeId: ID!
  restaurantId: ID!
  shiftType: ShiftType!
  startTime: DateTime!
  endTime: DateTime!
  status: String
  notes: String
}

input UpdateStaffShiftInput {
  shiftType: ShiftType
  startTime: DateTime
  endTime: DateTime
  status: String
  notes: String
}



type StaffSchedulingSummary {
  totalShiftGroups: Int!
  underStaffedShifts: Int!
  overStaffedShifts: Int!
  highestRiskShift: String
  notes: [String!]!
}

type StaffSchedulingRoleNeed {
  role: String!
  required: Int!
  assigned: Int!
  delta: Int!
}

type StaffSchedulingCandidate {
  staffId: ID!
  fullName: String!
  role: String!
  reason: String!
}

type StaffSchedulingShiftInsight {
  shiftKey: String!
  date: String!
  shiftType: String!
  demandLevel: String!
  expectedOrders: Float!
  expectedGuests: Float!
  recommendedTotalStaff: Int!
  currentAssignedStaff: Int!
  deltaStaff: Int!
  status: String!
  severity: String!
  confidence: Float!
  recommendedRoles: [StaffSchedulingRoleNeed!]!
  suggestedCandidates: [StaffSchedulingCandidate!]!
}

type StaffSchedulingMeta {
  method: String!
  basedOnForecast: Boolean!
  fallbackUsed: Boolean!
  generatedAt: DateTime!
  timezone: String!
}

type StaffSchedulingAssistant {
  summary: StaffSchedulingSummary!
  shifts: [StaffSchedulingShiftInsight!]!
  meta: StaffSchedulingMeta!
}

# =========================
# Queries
# =========================

type Query {
  me: User
  roleList: [Role!]!
  users(roleId: ID, search: String, isGuest: Boolean): [User!]!
  customers(search: String, includeGuests: Boolean): [User!]!
  customerDetailAnalytics(userId: ID!, restaurantId: ID): CustomerDetailAnalytics!
  customerAnalytics(restaurantId: ID!): CustomerAnalyticsSummary!
  customerRankSettings(restaurantId: ID!): CustomerRankSettings!

  staff(id: ID!): User
  staffList(
    restaurantId: ID
    roleId: ID
    search: String
    employmentStatus: EmploymentStatus
  ): [User!]!
  staffAccountOverview(staffId: ID): StaffAccountOverview
  staffSalarySummary(staffId: ID): StaffSalarySummary
  staffShiftHistory(staffId: ID, limit: Int = 20): [StaffShiftHistoryItem!]!
  staffPayrollOverview(
    startDate: DateTime!
    endDate: DateTime!
    restaurantId: ID
  ): StaffPayrollOverview!
  staffShifts(
    restaurantId: ID
    employeeId: ID
    startDate: DateTime
    endDate: DateTime
    status: String
    limit: Int = 500
  ): [StaffScheduleShift!]!
  staffAttendanceRecords(
    restaurantId: ID
    startDate: DateTime!
    endDate: DateTime!
    employeeId: ID
    status: String
    search: String
  ): [StaffAttendanceRecord!]!
  staffSchedulingAssistant(
    restaurantId: ID!
    horizonDays: Int = 2
    timezone: String = "Asia/Ho_Chi_Minh"
  ): StaffSchedulingAssistant!
  myWalletTransactions(limit: Int = 20, offset: Int = 0): [WalletTransaction!]!
}

# =========================
# Mutations
# =========================

type Mutation {
  createUser(input: CreateUserInput!): AuthPayload!
  login(
    email: String
    username: String
    phone: String
    password: String!
    captchaToken: String
  ): AuthPayload!
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!

  updateUser(input: UpdateUserInput!): User!
  updateAvatar(input: UpdateAvatarInput!): User!

  requestEmailVerification(email: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  resendVerification(email: String!): Boolean!

  assignRoleToUser(input: AssignRoleToUserInput!): User!
  adminUpdateUser(userId: ID!, input: AdminUpdateUserInput!): User!
  setUserStatus(userId: ID!, status: String!): User!
  softDeleteUser(userId: ID!): Boolean!

  createGuestUser(fullName: String, phone: String, expiresInDays: Int): User!

  createMyWallet(input: CreateWalletInput!): User!
  topUpMyWallet(input: WalletTopupInput!): WalletTransaction!

  updateCustomerMetrics(
    id: ID!
    loyaltyPoints: Int!
    customerType: CustomerType!
  ): User!
  upsertCustomerRankSettings(
    restaurantId: ID!
    ranks: [RankThresholdInput!]!
  ): CustomerRankSettings!

  createStaff(input: CreateUserInput!): User!
  updateStaff(userId: ID!, input: AdminUpdateUserInput!): User!
  deleteStaff(userId: ID!): Boolean!
  rateStaff(userId: ID!, rating: Int!): User!
  setStaffEmploymentStatus(
    userId: ID!
    employmentStatus: EmploymentStatus!
  ): User!

  createStaffShift(input: CreateStaffShiftInput!): StaffScheduleShift!
  updateStaffShift(shiftId: ID!, input: UpdateStaffShiftInput!): StaffScheduleShift!
  deleteStaffShift(shiftId: ID!): Boolean!
  upsertStaffAttendance(input: UpsertStaffAttendanceInput!): StaffAttendanceRecord!
}
