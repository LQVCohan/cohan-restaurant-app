  returningCustomerCount: Int!
  totalOrderCount: Int!
  totalCustomerSpend: Float!
  averageOrderValue: Float!
  averageRepeatIntervalDays: Float!
  dormantCustomerCount: Int!
  highValueCustomerCount: Int!
  customerSegments: [CustomerSegmentSummary!]!
  churnRiskCustomers: [CustomerChurnRisk!]!
  topValueCustomers: [TopValueCustomer!]!
  cohortRetention: [CustomerCohortRetention!]!
  recommendations: [CustomerRecommendation!]!
}

type RankThreshold {
  name: String!
  minPoints: Int!
