enum UserType {
  CUSTOMER
  STAFF
  MANAGER
  ADMIN
}

enum EmploymentType {
  FULL_TIME
  PART_TIME
  PROBATION
  SEASONAL
  CONTRACT
}

enum EmploymentStatus {
  WORKING
  ON_LEAVE
  RESIGNED
  SUSPENDED
}

enum ShiftType {
  MORNING
  AFTERNOON
  EVENING
  FULL_DAY
  ROTATING
}

enum StaffWorkingDay {
  MON
  TUE
  WED
  THU
  FRI
  SAT
  SUN
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}

# =========================
# Core Types
# =========================

type Restaurant {
  id: ID!
  name: String!
}

type Address {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

type EmergencyContact {
  name: String
  phone: String
  relation: String
}

# =========================
# User Schema
# =========================

type User {
  id: ID!
  fullName: String!
  username: String
  email: String
  phone: String
  address: Address
  role: Role
  status: String
  provider: String
  avatarUrl: String
  refRestaurants: [Restaurant]
  point: Int
  loyaltyPoints: Int
  roleName: String

  customerType: String
  totalOrders: Int
  totalSpending: Float
  emailVerified: Boolean
  createdAt: String
  updatedAt: String
  createdBy: User
  updatedBy: User
  isGuest: Boolean
  guestExpiresAt: DateTime

  # -------- NEW: phân loại & thuế ----------
  userType: UserType
  taxCode: String

  # -------- NEW: thông tin nhân viên ----------
  employeeCode: String
  positionTitle: String

  employmentType: EmploymentType
  employmentStatus: EmploymentStatus

  primaryRestaurant: Restaurant
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]

  dateJoined: DateTime
  dateLeft: DateTime

  lastLoginAt: DateTime
  lastLoginIp: String
  forcePasswordChange: Boolean

  noteInternal: String
  emergencyContact: EmergencyContact
  rate: Int
  rateCount: Int
}

# =========================
# Inputs
# =========================

input AddressInput {
  line1: String
  line2: String
  ward: String
  district: String
  city: String
  country: String
}

input EmergencyContactInput {
  name: String
  phone: String
  relation: String
}

input CreateUserInput {
  fullName: String!
  username: String
  email: String
  phone: String
  address: AddressInput
  password: String!
  provider: String
  status: String
  roleId: ID
  refRestaurantIds: [ID!]
  customerType: String
  captchaToken: String

  # --- NEW: cho phép tạo nhân viên/owner/admin ---
  userType: UserType
  taxCode: String

  employeeCode: String
  positionTitle: String
  employmentType: EmploymentType
  employmentStatus: EmploymentStatus
  primaryRestaurantId: ID
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]
  dateJoined: DateTime
  noteInternal: String
  emergencyContact: EmergencyContactInput
}

input UpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
}

input UpdateAvatarInput {
  fileBase64: String
  fileUrl: String
  # clear: Boolean  # nếu cần xoá avatar có thể mở rộng thêm trường này
}

input AssignRoleToUserInput {
  userId: ID!
  roleId: ID!
}

input AdminUpdateUserInput {
  fullName: String
  username: String
  email: String
  phone: String
  address: AddressInput
  avatarUrl: String
  status: String # 'active' | 'inactive' | 'blocked' | 'pending'
  customerType: CustomerType
  loyaltyPoints: Int
  totalOrders: Int
  totalSpending: Float
  isGuest: Boolean
  guestExpiresAt: String
  refRestaurantIds: [ID!]
  roleId: ID

  # --- NEW: staff fields & taxCode ---
  userType: UserType
  taxCode: String

  employeeCode: String
  positionTitle: String
  employmentType: EmploymentType
  employmentStatus: EmploymentStatus
  primaryRestaurantId: ID
  shiftType: ShiftType
  workingDays: [StaffWorkingDay!]
  dateJoined: DateTime
  dateLeft: DateTime
  forcePasswordChange: Boolean
  noteInternal: String
  emergencyContact: EmergencyContactInput
}

# =========================
# Auth
# =========================

type AuthPayload {
  token: String!
  user: User!
}

# =========================
# Queries
# =========================

type Query {
  me: User
  roleList: [Role!]!
  users(roleId: ID, search: String, isGuest: Boolean): [User!]!
  customers(search: String, includeGuests: Boolean): [User!]!

  # --- NEW: staff queries ---
  staff(id: ID!): User
  staffList(
    restaurantId: ID
    roleId: ID
    search: String
    employmentStatus: EmploymentStatus
  ): [User!]!
}

# =========================
# Mutations
# =========================

type Mutation {
  # Auth
  createUser(input: CreateUserInput!): AuthPayload!
  login(
    email: String
    username: String
    phone: String
    password: String!
    captchaToken: String
  ): AuthPayload!
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!

  # Profile
  updateUser(input: UpdateUserInput!): User!
  updateAvatar(input: UpdateAvatarInput!): User!

  # Email verification
  requestEmailVerification(email: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  resendVerification(email: String!): Boolean!

  # Role & Admin ops
  assignRoleToUser(input: AssignRoleToUserInput!): User!
  adminUpdateUser(userId: ID!, input: AdminUpdateUserInput!): User!
  setUserStatus(userId: ID!, status: String!): User!
  softDeleteUser(userId: ID!): Boolean!

  # Guests
  createGuestUser(fullName: String, phone: String, expiresInDays: Int): User!

  # Loyalty/Metrics
  updateCustomerMetrics(
    id: ID!
    loyaltyPoints: Int!
    customerType: CustomerType!
  ): User!

  # --- NEW: Staff management (CRUD nhân viên) ---
  # Tạo nhân viên: dùng lại CreateUserInput, resolver gọi chung logic createUser
  createStaff(input: CreateUserInput!): User!

  # Sửa thông tin nhân viên (dùng AdminUpdateUserInput)
  updateStaff(userId: ID!, input: AdminUpdateUserInput!): User!

  # Xóa/soft-delete nhân viên
  deleteStaff(userId: ID!): Boolean!
  rateStaff(userId: ID!, rating: Int!): User!
  # Đổi trạng thái công việc (không phải status account)
  setStaffEmploymentStatus(
    userId: ID!
    employmentStatus: EmploymentStatus!
  ): User!
}
