# =========================
# User Schema (updated)
# =========================

type User {
  id: ID!
  fullName: String!
  username: String
  email: String
  phone: String
  address: Address
  role: Role
  status: String
  provider: String
  refRestaurants: [Restaurant]
  point: Int
  loyaltyPoints: Int
  roleName: String!
  users: [User!]!
  customerType: String
  totalOrders: Int
  totalSpending: Float
  emailVerified: Boolean
  createdAt: String
  updatedAt: String
  createdBy: User
  updatedBy: User
}

input CreateUserInput {
  fullName: String!
  username: String
  email: String
  phone: String
  address: AddressInput
  password: String!
  provider: String
  status: String
  roleId: ID
  refRestaurantIds: [ID!]
  customerType: String
  captchaToken: String # 👈 thêm nếu bạn bật reCAPTCHA cho đăng ký (tùy chọn)
}

# Nếu muốn dùng captcha cho login, có thể tách input như sau:
input LoginInput {
  email: String
  username: String
  phone: String
  password: String!
  captchaToken: String # 👈 tùy chọn
}

type AuthPayload {
  token: String!
  user: User!
}

input AssignRoleToUserInput {
  userId: ID!
  roleId: ID!
}

enum CustomerType {
  VIP
  NEW
  OFTEN
}

extend type Query {
  me: User
}

extend type Mutation {
  createUser(input: CreateUserInput!): AuthPayload!

  login(
    email: String
    username: String
    phone: String
    password: String!
    captchaToken: String
  ): AuthPayload!

  assignRoleToUser(input: AssignRoleToUserInput!): User!

  requestEmailVerification(email: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  resendVerification(email: String!): Boolean!
}
