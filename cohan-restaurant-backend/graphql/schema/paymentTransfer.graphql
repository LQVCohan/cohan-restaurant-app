enum TransferVerificationStatus {
  NOT_REQUIRED
  INSTRUCTIONS_SHOWN
  SUBMITTED
  VERIFYING
  VERIFIED
  REJECTED
  FAILED
  EXPIRED
}

type TransferPaymentState {
  status: TransferVerificationStatus!
  instructionsShownAt: DateTime
  submittedAt: DateTime
  submittedBy: ID
  proofImages: [String!]!
  proofNote: String
  customerClaimedPaidAt: DateTime
  verifiedAt: DateTime
  verifiedBy: ID
  rejectedAt: DateTime
  rejectedBy: ID
  rejectReason: String
  providerTransactionId: String
  receivedAmount: Float
  varianceAmount: Float
  matchedBankTransactionId: ID
  matchedReconciliationId: ID
}

extend type PaymentSession {
  transfer: TransferPaymentState
}

input CreateCustomerTransferPaymentInput {
  restaurantId: ID!
  orderIds: [ID!]!
  pricing: CheckoutPricingInput
  promotionIds: [ID!]
}

input SubmitTransferProofInput {
  paymentSessionId: ID!
  proofImages: [String!]!
  proofNote: String
  customerClaimedPaidAt: DateTime
}

input VerifyTransferPaymentInput {
  paymentSessionId: ID!
  bankTransactionId: ID
  providerTransactionId: String
  receivedAmount: Float
  note: String
}

input RejectTransferPaymentInput {
  paymentSessionId: ID!
  reason: String!
}

extend type Query {
  transferPaymentQueue(restaurantId: ID!, status: TransferVerificationStatus, limit: Int): [PaymentSession!]!
}

extend type Mutation {
  createCustomerTransferPayment(input: CreateCustomerTransferPaymentInput!): PaymentSession!
  submitTransferProof(input: SubmitTransferProofInput!): PaymentSession!
  verifyTransferPayment(input: VerifyTransferPaymentInput!): PaymentSession!
  rejectTransferPayment(input: RejectTransferPaymentInput!): PaymentSession!
}
