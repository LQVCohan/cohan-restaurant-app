# =========================================================
# ENUMS
# =========================================================

enum OrderStatus {
  draft
  pending
  confirmed
  customer_attached
  preparing
  ready
  served
  completed
  cancelled
  failed
}

enum ItemStatus {
  pending
  preparing
  ready
  served
  cancelled
  returned
}

enum OrderType {
  dine_in
  takeaway
  delivery
}

enum OrderPriority {
  LOW
  MEDIUM
  HIGH
}

enum ServingMode {
  PORTION
  BY_WEIGHT
}

enum PriceRuleKind {
  SET
  DELTA
}

enum InventoryRuleKind {
  NONE
  ADD_INGREDIENTS
  REPLACE_INGREDIENTS
  MULTIPLY_BASE_RECIPE
}

# =========================================================
# VALUE OBJECTS
# =========================================================

type GeoPoint {
  lat: Float
  lng: Float
  address: String
}

type Shipping {
  fullName: String
  phone: String
  email: String
  address: String
  note: String

  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String

  shippingFee: Int
  deliveryStatus: String

  location: GeoPoint
  customerLocation: GeoPoint
  restaurantLocation: GeoPoint
  driverLocation: GeoPoint

  driverName: String
  driverPhone: String
  driverAvatar: String
  driverVehiclePlate: String

  distance: Float
  duration: Float
  eta: DateTime
  externalTrackingCode: String
}

input GeoPointInput {
  lat: Float
  lng: Float
  address: String
}

input ShippingInput {
  fullName: String
  phone: String
  email: String
  address: String
  note: String

  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String

  shippingFee: Int
  deliveryStatus: String

  location: GeoPointInput
  customerLocation: GeoPointInput
  restaurantLocation: GeoPointInput
  driverLocation: GeoPointInput

  driverName: String
  driverPhone: String
  driverAvatar: String
  driverVehiclePlate: String

  distance: Float
  duration: Float
  eta: DateTime
  externalTrackingCode: String
}

# =========================================================
# SERVING VARIANT SNAPSHOT (CORE)
# =========================================================

type ServingVariantSnapshot {
  key: String!
  name: String
  mode: ServingMode!
  price: Int
  sellQty: Float
  sellUnit: String
}

input ServingVariantSnapshotInput {
  key: String!
  name: String
  mode: ServingMode!
  price: Int
  sellQty: Float
  sellUnit: String
}

# =========================================================
# INGREDIENT SNAPSHOT (COSTING + AUDIT)
# =========================================================

type OrderIngredientSnapshot {
  ingredientId: ID!
  name: String
  quantity: Float!
  unit: String!
  baseUnitQuantity: Float!
  costPerBaseUnit: Float
  totalCost: Float
}

# =========================================================
# MODIFIERS (NEW SNAPSHOT + INPUT SELECTION)
# =========================================================

type ModifierPriceRuleSnapshot {
  rule: PriceRuleKind!
  amount: Int!
}

type ModifierIngredientLineSnapshot {
  ingredientId: ID!
  qty: Float!
  unit: String!
  wastePct: Float
}

type ModifierInventoryRuleSnapshot {
  rule: InventoryRuleKind!
  ingredientLines: [ModifierIngredientLineSnapshot!]!
  baseRecipeMultiplier: Float
  note: String
}

type OrderModifierSnapshot {
  groupId: ID!
  groupName: String
  optionId: ID!
  optionName: String
  priceRule: ModifierPriceRuleSnapshot!
  inventoryRule: ModifierInventoryRuleSnapshot!
}

input OrderModifierSelectionInput {
  groupId: ID!
  optionId: ID!
}

# =========================================================
# ORDER ITEM
# =========================================================

type OrderItem {
  _id: ID

  dishId: ID
  menuId: ID
  categoryId: ID
  originalQuantity: Float
  cancelledQuantity: Float
  returnedQuantity: Float
  voidRequests: [OrderItemVoidRequest!]
  returnRequests: [OrderItemReturnRequest!]
  name: String!
  unit: String
  image: String
  proofImages: [String]

  basePrice: Int
  servingKey: String!
  servingVariant: ServingVariantSnapshot!

  quantity: Float!
  weightGrams: Int

  modifiers: [OrderModifierSnapshot!]!
  modifiersPrice: Int
  unitPrice: Int
  lineSubtotal: Int

  ingredientsSnapshot: [OrderIngredientSnapshot!]!

  note: String
  priority: OrderPriority
  status: ItemStatus
}
type OrderItemReturnRequest {
  requestId: ID!
  quantity: Float!
  reason: String!
  refundMode: String!
  status: String!
  requestedBy: ID
  requestedAt: DateTime
  reviewedBy: ID
  reviewedAt: DateTime
  reviewNote: String
}
type OrderItemVoidRequest {
  requestId: ID!
  quantity: Float!
  reason: String!
  status: String!
  requestedBy: ID
  requestedAt: DateTime
  reviewedBy: ID
  reviewedAt: DateTime
  reviewNote: String
}
input RequestOrderItemVoidInput {
  orderId: ID!
  orderItemId: ID!
  quantity: Int!
  reason: String!
}
input RequestOrderItemReturnInput {
  orderId: ID!
  orderItemId: ID!
  quantity: Int!
  reason: String!
  refundMode: String!
}
input ReviewOrderItemReturnInput {
  orderId: ID!
  orderItemId: ID!
  requestId: ID!
  approve: Boolean!
  note: String
}

input ReviewOrderItemVoidInput {
  orderId: ID!
  orderItemId: ID!
  requestId: ID!
  approve: Boolean!
  note: String
}
input OrderItemInput {
  dishId: ID
  menuId: ID
  categoryId: ID

  name: String!
  unit: String
  image: String
  proofImages: [String]

  basePrice: Int
  servingKey: String!
  servingVariant: ServingVariantSnapshotInput

  quantity: Float!
  weightGrams: Int

  selectedModifiers: [OrderModifierSelectionInput!]

  note: String
  priority: OrderPriority
  status: ItemStatus
}

