# =========================================================
# ENUMS
# =========================================================

enum OrderStatus {
  draft
  pending
  confirmed
  customer_attached
  preparing
  ready
  served
  completed
  cancelled
  failed
}

enum ItemStatus {
  pending
  preparing
  ready
  served
  cancelled
  returned
}

# =========================================================
# VALUE OBJECTS
# =========================================================

type Shipping {
  fullName: String
  phone: String
  email: String
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

input ShippingInput {
  fullName: String
  phone: String
  email: String
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

# =========================================================
# SERVING VARIANT SNAPSHOT (🔥 CORE)
# =========================================================

type ServingVariantSnapshot {
  name: String
  price: Int
  mode: String # PORTION | BY_WEIGHT
}

input ServingVariantSnapshotInput {
  name: String
  price: Int
  mode: String
}

# =========================================================
# MODIFIERS
# =========================================================

type OrderModifier {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

input OrderModifierInput {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

# =========================================================
# ORDER ITEM
# =========================================================

type OrderItem {
  _id: ID

  dishId: ID
  menuId: ID
  categoryId: ID

  name: String!
  unit: String
  image: String
  proofImages: [String]

  # 🔥 PRICE SNAPSHOT
  basePrice: Int
  servingVariantId: ID
  servingVariant: ServingVariantSnapshot

  modifiersPrice: Int
  quantity: Float!
  weightGrams: Float
  modifiers: [OrderModifier!]
  lineSubtotal: Int

  note: String
  status: ItemStatus
}

input OrderItemInput {
  dishId: ID
  menuId: ID
  categoryId: ID

  name: String!
  unit: String
  image: String
  proofImages: [String]

  # 🔥 PRICE SNAPSHOT
  basePrice: Int
  servingVariantId: ID
  servingVariant: ServingVariantSnapshotInput

  modifiersPrice: Int
  quantity: Float!
  modifiers: [OrderModifierInput!]

  note: String
  status: ItemStatus
}

# =========================================================
# ORDER TOTALS
# =========================================================

type OrderTotals {
  subtotal: Int!
  discount: Int!
  tax: Int!
  service: Int!
  grandTotal: Int!
}

# =========================================================
# PAYMENT
# =========================================================

type OrderPayment {
  method: String
  paidAmount: Int
  currency: String
  status: String
  txnRef: String
  paidAt: String
}

# =========================================================
# STATUS TIMELINE
# =========================================================

type StatusEvent {
  status: String!
  at: String!
  byUserId: ID
  note: String
}

# =========================================================
# CUSTOMER INFO
# =========================================================

type OrderCustomerInfo {
  name: String
  phone: String
  email: String
  note: String
  partySize: Int
  timeTo: String
}

input CustomerInput {
  fullName: String
  name: String
  phone: String
  email: String
}

# =========================================================
# ORDER
# =========================================================

type Order {
  id: ID!
  orderCode: String
  restaurantId: ID!

  orderType: String!
  tableCode: String

  userId: ID
  reservationId: ID

  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment

  statusTimeline: [StatusEvent!]!
  currentStatus: OrderStatus!

  note: String
  createdAt: String!
  updatedAt: String!

  user: User
  customerInfo: OrderCustomerInfo
  clientMeta: JSON
}

# =========================================================
# INPUTS – CREATE / UPDATE
# =========================================================

input CreateOrAppendTableOrderInput {
  restaurantId: ID!
  tableId: ID
  tableCode: String!
  orderCode: String

  items: [OrderItemInput!]!
  note: String
  customer: CustomerInput
  userId: ID
  clientMeta: JSON
  warehouseId: ID
}

type CreateOrAppendTableOrderPayload {
  isNewOrder: Boolean!
  order: Order!
}

input CreateOffPremiseOrderInput {
  restaurantId: ID!
  orderType: String! # takeaway | delivery
  items: [OrderItemInput!]!
  note: String
  customer: CustomerInput
  shipping: ShippingInput
  userId: ID
  clientMeta: JSON
  warehouseId: ID
}

type CreateOffPremiseOrderPayload {
  order: Order!
}

input UpdateOrderStatusInput {
  id: ID!
  restaurantId: ID
  status: OrderStatus!
  note: String
  warehouseId: ID
}

input UpdateOrderItemStatusInput {
  orderId: ID!
  restaurantId: ID
  itemKey: String!
  status: ItemStatus!
  note: String
}

input UpdateOrderCustomerByCodeInput {
  restaurantId: ID!
  orderCode: String!
  customer: CustomerInput!
  userId: ID
}

type UpdateOrderItemStatusPayload {
  order: Order!
}

type UpdateOrderCustomerByCodePayload {
  success: Boolean
  modifiedCount: Int
}

type CancelOrderPayload {
  success: Boolean!
  order: Order!
}

# =========================================================
# GROUPING / PAGINATION
# =========================================================

type OrderGroup {
  orderCode: String
  tableCode: String
  restaurantId: ID
  latestStatus: String
  count: Int
  orders: [Order!]!
}

type PageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

type OrderEdge {
  node: Order!
  cursor: ID!
}

type OrdersConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

input OrderFilterInput {
  restaurantId: ID
  tableCode: String
  orderCode: String
  status: String
  statuses: [String!]
  dateFrom: String
  dateTo: String
  keyword: String
}

type OrderList {
  items: [Order!]!
  totalCount: Int!
}

# =========================================================
# ROOT
# =========================================================

extend type Query {
  order(id: ID!): Order

  orders(filter: OrderFilterInput, limit: Int, offset: Int): OrderList!

  ordersByRestaurantNow(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByRestaurant(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!

  ordersByTableCode(
    restaurantId: ID!
    tableCode: String!
    limit: Int
    offset: Int
  ): OrderList!

  ordersGroupedByTable(restaurantId: ID!, tableCode: String!): [OrderGroup!]!
}

extend type Mutation {
  createOrAppendTableOrder(
    input: CreateOrAppendTableOrderInput!
  ): CreateOrAppendTableOrderPayload!

  createOffPremiseOrder(
    input: CreateOffPremiseOrderInput!
  ): CreateOffPremiseOrderPayload!

  updateOrderStatus(input: UpdateOrderStatusInput!): Order!

  updateOrderItemStatus(
    input: UpdateOrderItemStatusInput!
  ): UpdateOrderItemStatusPayload!

  updateOrderCustomerByCode(
    input: UpdateOrderCustomerByCodeInput!
  ): UpdateOrderCustomerByCodePayload!

  cancelOrder(
    restaurantId: ID!
    orderId: ID!
    reason: String
    warehouseId: ID
  ): CancelOrderPayload!
}
