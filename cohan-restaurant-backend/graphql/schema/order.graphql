# =========================================================
# ENUMS
# =========================================================

enum OrderStatus {
  draft
  pending
  confirmed
  customer_attached
  preparing
  ready
  served
  completed
  cancelled
  failed
}

enum ItemStatus {
  pending
  preparing
  ready
  served
  cancelled
  returned
}

enum OrderType {
  dine_in
  takeaway
  delivery
}

enum ServingMode {
  PORTION
  BY_WEIGHT
}

enum PriceRuleKind {
  SET
  DELTA
}

enum InventoryRuleKind {
  NONE
  ADD_INGREDIENTS
  REPLACE_INGREDIENTS
  MULTIPLY_BASE_RECIPE
}

# =========================================================
# VALUE OBJECTS
# =========================================================

type GeoPoint {
  lat: Float
  lng: Float
  address: String
}

type Shipping {
  fullName: String
  phone: String
  email: String
  address: String
  note: String

  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String

  shippingFee: Int
  deliveryStatus: String

  location: GeoPoint
  customerLocation: GeoPoint
  restaurantLocation: GeoPoint
  driverLocation: GeoPoint

  driverName: String
  driverPhone: String
  driverAvatar: String
  driverVehiclePlate: String

  distance: Float
  duration: Float
  eta: DateTime
  externalTrackingCode: String
}

input GeoPointInput {
  lat: Float
  lng: Float
  address: String
}

input ShippingInput {
  fullName: String
  phone: String
  email: String
  address: String
  note: String

  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String

  shippingFee: Int
  deliveryStatus: String

  location: GeoPointInput
  customerLocation: GeoPointInput
  restaurantLocation: GeoPointInput
  driverLocation: GeoPointInput

  driverName: String
  driverPhone: String
  driverAvatar: String
  driverVehiclePlate: String

  distance: Float
  duration: Float
  eta: DateTime
  externalTrackingCode: String
}

# =========================================================
# SERVING VARIANT SNAPSHOT (CORE)
# =========================================================

type ServingVariantSnapshot {
  key: String!
  name: String
  mode: ServingMode!
  price: Int
  sellQty: Float
  sellUnit: String
}

input ServingVariantSnapshotInput {
  key: String!
  name: String
  mode: ServingMode!
  price: Int
  sellQty: Float
  sellUnit: String
}

# =========================================================
# INGREDIENT SNAPSHOT (COSTING + AUDIT)
# =========================================================

type OrderIngredientSnapshot {
  ingredientId: ID!
  name: String
  quantity: Float!
  unit: String!
  baseUnitQuantity: Float!
  costPerBaseUnit: Float
  totalCost: Float
}

# =========================================================
# MODIFIERS (NEW SNAPSHOT + INPUT SELECTION)
# =========================================================

type ModifierPriceRuleSnapshot {
  rule: PriceRuleKind!
  amount: Int!
}

type ModifierIngredientLineSnapshot {
  ingredientId: ID!
  qty: Float!
  unit: String!
  wastePct: Float
}

type ModifierInventoryRuleSnapshot {
  rule: InventoryRuleKind!
  ingredientLines: [ModifierIngredientLineSnapshot!]!
  baseRecipeMultiplier: Float
  note: String
}

type OrderModifierSnapshot {
  groupId: ID!
  groupName: String
  optionId: ID!
  optionName: String
  priceRule: ModifierPriceRuleSnapshot!
  inventoryRule: ModifierInventoryRuleSnapshot!
}

input OrderModifierSelectionInput {
  groupId: ID!
  optionId: ID!
}

# =========================================================
# ORDER ITEM
# =========================================================

type OrderItem {
  _id: ID

  dishId: ID
  menuId: ID
  categoryId: ID

  name: String!
  unit: String
  image: String
  proofImages: [String]

  basePrice: Int
  servingKey: String!
  servingVariant: ServingVariantSnapshot!

  quantity: Float!
  weightGrams: Int

  modifiers: [OrderModifierSnapshot!]!
  modifiersPrice: Int
  unitPrice: Int
  lineSubtotal: Int

  ingredientsSnapshot: [OrderIngredientSnapshot!]!

  note: String
  status: ItemStatus
}

input OrderItemInput {
  dishId: ID
  menuId: ID
  categoryId: ID

  name: String!
  unit: String
  image: String
  proofImages: [String]

  basePrice: Int
  servingKey: String!
  servingVariant: ServingVariantSnapshotInput

  quantity: Float!
  weightGrams: Int

  selectedModifiers: [OrderModifierSelectionInput!]

  note: String
  status: ItemStatus
}

# =========================================================
# ORDER TOTALS
# =========================================================

type OrderTotals {
  subtotal: Int!
  discount: Int!
  discountReason: String
  voucherCode: String
  promotionId: ID

  service: Int!
  serviceRate: Float

  tax: Int!
  taxRate: Float

  shippingFee: Int
  grandTotal: Int!
}

# =========================================================
# PAYMENT
# =========================================================

type OrderPayment {
  method: String
  provider: String
  transactionId: ID
  status: String
  paidAmount: Int
  changeAmount: Int
  currency: String
  paidAt: DateTime
}

# =========================================================
# STATUS TIMELINE
# =========================================================

type StatusEvent {
  status: OrderStatus!
  at: DateTime!
  byUserId: ID
  note: String
}

# =========================================================
# CUSTOMER INFO
# =========================================================

type OrderCustomerInfo {
  name: String
  phone: String
  email: String
  note: String
  partySize: Int
  timeTo: String
}

input CustomerInput {
  fullName: String
  name: String
  phone: String
  email: String
}

# =========================================================
# ORDER
# =========================================================

type Order {
  id: ID!
  orderCode: String
  parentOrderCode: String
  restaurantId: ID!

  orderType: OrderType!
  tableCode: String
  tableName: String
  guestCount: Int

  userId: ID
  reservationId: ID

  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment

  statusTimeline: [StatusEvent!]!
  currentStatus: OrderStatus!

  note: String
  createdAt: DateTime!
  updatedAt: DateTime!

  user: User
  customerInfo: OrderCustomerInfo
  clientMeta: JSON
}

# =========================================================
# INPUTS – CREATE / UPDATE
# =========================================================

input CreateOrAppendTableOrderInput {
  restaurantId: ID!
  tableId: ID
  tableCode: String!
  orderCode: String
  parentOrderCode: String

  items: [OrderItemInput!]!
  note: String
  customer: CustomerInput
  userId: ID
  clientMeta: JSON
  warehouseId: ID
}

type CreateOrAppendTableOrderPayload {
  isNewOrder: Boolean!
  order: Order!
}

input CreateOffPremiseOrderInput {
  restaurantId: ID!
  orderType: OrderType! # takeaway | delivery
  parentOrderCode: String

  items: [OrderItemInput!]!
  note: String
  customer: CustomerInput
  shipping: ShippingInput
  userId: ID
  clientMeta: JSON
  warehouseId: ID
}

type CreateOffPremiseOrderPayload {
  order: Order!
}

input UpdateOrderStatusInput {
  id: ID!
  restaurantId: ID
  status: OrderStatus!
  note: String
  warehouseId: ID
}

input UpdateOrderItemStatusInput {
  orderId: ID!
  restaurantId: ID
  itemKey: String!
  status: ItemStatus!
  note: String
}

input UpdateOrderCustomerByCodeInput {
  restaurantId: ID!
  orderCode: String!
  customer: CustomerInput!
  userId: ID
}

type UpdateOrderItemStatusPayload {
  order: Order!
}

type UpdateOrderCustomerByCodePayload {
  success: Boolean
  modifiedCount: Int
}

type CancelOrderPayload {
  success: Boolean!
  order: Order!
}

# =========================================================
# GROUPING / PAGINATION
# =========================================================

type OrderGroup {
  orderCode: String
  tableCode: String
  restaurantId: ID
  latestStatus: String
  count: Int
  orders: [Order!]!
}

type PageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

type OrderEdge {
  node: Order!
  cursor: ID!
}

type OrdersConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

input OrderFilterInput {
  restaurantId: ID
  tableCode: String
  orderCode: String
  parentOrderCode: String
  status: String
  statuses: [String!]
  dateFrom: String
  dateTo: String
  keyword: String
}

type OrderList {
  items: [Order!]!
  totalCount: Int!
}

# =========================================================
# ROOT
# =========================================================

extend type Query {
  order(id: ID!): Order

  orders(filter: OrderFilterInput, limit: Int, offset: Int): OrderList!

  ordersByRestaurantNow(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByRestaurant(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!

  ordersByTableCode(
    restaurantId: ID!
    tableCode: String!
    limit: Int
    offset: Int
  ): OrderList!

  ordersGroupedByTable(restaurantId: ID!, tableCode: String!): [OrderGroup!]!
}

extend type Mutation {
  createOrAppendTableOrder(
    input: CreateOrAppendTableOrderInput!
  ): CreateOrAppendTableOrderPayload!

  createOffPremiseOrder(
    input: CreateOffPremiseOrderInput!
  ): CreateOffPremiseOrderPayload!

  updateOrderStatus(input: UpdateOrderStatusInput!): Order!

  updateOrderItemStatus(
    input: UpdateOrderItemStatusInput!
  ): UpdateOrderItemStatusPayload!

  updateOrderCustomerByCode(
    input: UpdateOrderCustomerByCodeInput!
  ): UpdateOrderCustomerByCodePayload!

  cancelOrder(
    restaurantId: ID!
    orderId: ID!
    reason: String
    warehouseId: ID
  ): CancelOrderPayload!
}
