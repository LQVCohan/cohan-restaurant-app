# =========================================================
# ORDER
# =========================================================

type Order {
  id: ID!
  orderCode: String
  parentOrderCode: String
  restaurantId: ID!

  orderType: OrderType!
  tableCode: String
  tableName: String
  guestCount: Int

  userId: ID
  reservationId: ID

  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment

  statusTimeline: [StatusEvent!]!
  currentStatus: OrderStatus!
  priority: OrderPriority

  note: String
  createdAt: DateTime!
  updatedAt: DateTime!

  user: User
  customerInfo: OrderCustomerInfo
  clientMeta: JSON
}

