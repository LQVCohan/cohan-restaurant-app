# --- Value Objects ---
type Shipping {
  fullName: String
  phone: String
  email: String
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

enum OrderStatus {
  draft
  pending
  confirmed
  customer_attached
  preparing
  ready
  served
  completed
  cancelled
  failed # Thêm failed cho trường hợp lỗi thanh toán
}

enum ItemStatus {
  pending
  preparing
  ready
  served
  cancelled
  returned # Thêm returned cho trường hợp trả món
}

type OrderModifier {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

input OrderModifierInput {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

type OrderTotals {
  subtotal: Int!
  discount: Int!
  tax: Int!
  service: Int!
  grandTotal: Int!
}

type StatusEvent {
  status: String! # Có thể giữ String để linh hoạt hoặc dùng Enum
  at: String!
  byUserId: ID
  note: String
}

type OrderPayment {
  method: String
  paidAmount: Int
  currency: String
  status: String
  txnRef: String
  paidAt: String
}

# --- Core Types ---
input CreateOffPremiseOrderInput {
  restaurantId: ID!
  # "takeaway" hoặc "delivery"
  orderType: String!

  items: [OrderItemInput!]!
  note: String
  customer: CustomerInput
  shipping: ShippingInput
  userId: ID
  clientMeta: JSON
  warehouseId: ID
}
type CreateOffPremiseOrderPayload {
  order: Order!
}

type OrderItem {
  _id: ID # Thêm _id riêng của item nếu cần thao tác chính xác
  dishId: ID
  menuId: ID
  categoryId: ID
  name: String!
  unit: String

  # ✅ CẬP NHẬT: Ảnh thumbnail món ăn (snapshot)
  image: String

  # ✅ CẬP NHẬT: Ảnh minh chứng (do user upload)
  proofImages: [String]

  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  note: String
  quantity: Float! # Float để hỗ trợ cân ký (1.5 kg)
  # Inventory fields (để hiển thị nếu cần)
  weightGrams: Float
  servingMode: String

  modifiers: [OrderModifier!]
  lineSubtotal: Int

  # ✅ Dùng Enum thay vì String
  status: ItemStatus

  recipeId: ID
  recipe: Recipe
}

type OrderCustomerInfo {
  name: String
  phone: String
  email: String
  note: String
  partySize: Int
  timeTo: DateTime
}

type Order {
  id: ID!
  orderCode: String
  restaurantId: ID!
  userId: ID
  reservationId: ID
  orderType: String!
  tableCode: String

  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment

  statusTimeline: [StatusEvent!]!

  # ✅ Dùng Enum thay vì String
  currentStatus: OrderStatus!

  note: String
  createdAt: String!
  updatedAt: String!
  user: User
  customerInfo: OrderCustomerInfo
  clientMeta: JSON
}

# --- Inputs ---
input ShippingInput {
  fullName: String
  phone: String
  email: String
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

input OrderItemInput {
  dishId: ID
  menuId: ID
  categoryId: ID
  name: String!
  unit: String

  # ✅ Ảnh thumbnail (snapshot từ menu)
  image: String

  # ✅ Ảnh minh chứng (upload lên)
  proofImages: [String]

  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  note: String
  quantity: Float!
  modifiers: [OrderModifierInput!]
  status: ItemStatus

  # ✅ Inventory support (Optional)
  weightGrams: Float
  servingKey: String
  servingMode: String
}

input CustomerInput {
  fullName: String
  name: String # Hỗ trợ cả 2 trường để tránh lỗi FE
  phone: String
  email: String
}

input CreateOrAppendTableOrderInput {
  restaurantId: ID!
  tableId: ID
  tableCode: String!
  orderCode: String
  items: [OrderItemInput!]!
  note: String
  customer: CustomerInput
  userId: ID
  clientMeta: JSON
  warehouseId: ID
}

type CreateOrAppendTableOrderPayload {
  isNewOrder: Boolean!
  order: Order!
}

input UpdateOrderStatusInput {
  id: ID!
  restaurantId: ID
  status: OrderStatus!
  note: String
  warehouseId: ID
}

input UpdateOrderItemStatusInput {
  orderId: ID!
  restaurantId: ID
  itemKey: String! # Có thể là ID món hoặc index
  status: ItemStatus!
  note: String
}

input UpdateOrderCustomerByCodeInput {
  restaurantId: ID!
  orderCode: String!
  customer: CustomerInput!
  userId: ID # Cho phép đổi user phụ trách nếu cần
}

type UpdateOrderItemStatusPayload {
  order: Order!
}

type UpdateOrderCustomerByCodePayload {
  success: Boolean
  modifiedCount: Int
}

type CancelOrderPayload {
  success: Boolean!
  order: Order!
}

# --- Connections & Lists ---
type PageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

type OrderEdge {
  node: Order!
  cursor: ID!
}

type OrdersConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

input OrderFilterInput {
  restaurantId: ID
  tableCode: String
  orderCode: String
  status: String
  statuses: [String!]
  dateFrom: String
  dateTo: String
  keyword: String
}

type OrderList {
  items: [Order!]!
  totalCount: Int!
}

type OrderGroup {
  orderCode: String
  tableCode: String
  restaurantId: ID
  latestStatus: String
  count: Int
  orders: [Order!]!
}

# --- Root ---
extend type Query {
  order(id: ID!): Order

  orders(filter: OrderFilterInput, limit: Int, offset: Int): OrderList!

  ordersByRestaurantNow(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByRestaurant(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!

  ordersByTableCode(
    restaurantId: ID!
    tableCode: String!
    limit: Int
    offset: Int
  ): OrderList!

  ordersGroupedByTable(restaurantId: ID!, tableCode: String!): [OrderGroup!]!
}

extend type Mutation {
  createOffPremiseOrder(
    input: CreateOffPremiseOrderInput!
  ): CreateOffPremiseOrderPayload!

  createOrAppendTableOrder(
    input: CreateOrAppendTableOrderInput!
  ): CreateOrAppendTableOrderPayload!

  updateOrderStatus(input: UpdateOrderStatusInput!): Order!

  updateOrderItemStatus(
    input: UpdateOrderItemStatusInput!
  ): UpdateOrderItemStatusPayload!

  updateOrderCustomerByCode(
    input: UpdateOrderCustomerByCodeInput!
  ): UpdateOrderCustomerByCodePayload!

  cancelOrder(
    restaurantId: ID!
    orderId: ID!
    reason: String
    warehouseId: ID
  ): CancelOrderPayload!
}
