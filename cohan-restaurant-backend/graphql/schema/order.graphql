type Shipping {
  fullName: String
  phone: String
  email: String # ✅ thêm email
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

input ShippingInput {
  fullName: String
  phone: String
  email: String # ✅ thêm email
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

type OrderModifier {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

input OrderModifierInput {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}
input PosOrderItemInput {
  dishId: ID
  menuId: ID
  categoryId: ID
  name: String!
  unit: String
  price: Int!
  quantity: Int!
  method: String
  description: String
  modifiers: [OrderModifierInput!]
}

input UpsertTableOrderInput {
  restaurantId: ID!
  tableCode: String!
  orderCode: String
  items: [OrderItemInput!]!
  note: String
  paymentMethod: String
  customer: CustomerInput
  clientMeta: JSON
}

type UpsertTableOrderPayload {
  order: Order!
  isNewOrder: Boolean!
}

type OrderItem {
  dishId: String
  menuId: String
  categoryId: String
  name: String!
  unit: String
  image: String
  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  description: String
  quantity: Float!
  modifiers: [OrderModifier!]
  lineSubtotal: Int
}

input OrderItemInput {
  dishId: String
  menuId: String
  categoryId: String
  name: String!
  unit: String
  image: String
  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  description: String
  quantity: Float!
  modifiers: [OrderModifierInput!]
}

input CustomerInput { # ✅ cho khách chưa đăng nhập
  fullName: String
  phone: String
  email: String
}

type OrderTotals {
  subtotal: Int!
  discount: Int!
  tax: Int!
  service: Int!
  grandTotal: Int!
}

type StatusEvent {
  status: String!
  at: String!
  byUserId: ID
  note: String
}

type OrderPayment {
  method: String
  paidAmount: Int
  currency: String
  status: String
  txnRef: String
  paidAt: String
}

type Order {
  id: ID!
  tableCode: String
  orderCode: String # ✅ mã gộp các đơn
  restaurantId: ID!
  reservationId: ID
  orderType: String!
  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment
  statusTimeline: [StatusEvent!]!
  currentStatus: String!
  note: String
  createdAt: String!
  updatedAt: String!
  customer: User
}

input CreateOrderInput {
  orderCode: String # ✅ truyền chung cho các đơn tách
  userId: ID
  restaurantId: ID!
  reservationId: ID
  orderType: String
  shipping: ShippingInput
  items: [OrderItemInput!]!
  note: String
  paymentMethod: String!
  customer: CustomerInput # ✅ dành cho khách chưa login
}

input UpdateOrderStatusInput {
  id: ID!
  status: String!
  note: String
}

type OrdersConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

type OrderEdge {
  node: Order!
  cursor: ID!
}

type PageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

extend type Query {
  orderByTableCode(
    restaurantId: ID!
    tableCode: String!
    onlyActive: Boolean = true
  ): Order
  order(id: ID!): Order
  ordersByRestaurant(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!
  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!
  orderByTable(restaurantId: ID!, tableCode: String!): Order
  orders(
    restaurantId: ID!
    tableCode: String
    orderCode: String
    statuses: [String!]
    from: String
    to: String
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!
}

extend type Mutation {
  upsertTableOrder(input: UpsertTableOrderInput!): UpsertTableOrderPayload!
  openTableSession(restaurantId: ID!, tableCode: String!): Order!
  closeTableSession(
    restaurantId: ID!
    tableCode: String!
    orderCode: String
  ): Order!
  createOrder(input: CreateOrderInput!): Order!
  updateOrderStatus(input: UpdateOrderStatusInput!): Order!
  cancelOrder(id: ID!, reason: String): Order!
}
