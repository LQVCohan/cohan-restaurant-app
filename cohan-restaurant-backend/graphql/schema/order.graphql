# =========================================================
# ROOT
# =========================================================

extend type Query {
  order(id: ID!): Order

  orders(filter: OrderFilterInput, limit: Int, offset: Int): OrderList!

  ordersByRestaurantNow(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByRestaurant(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!

  ordersByTableCode(
    restaurantId: ID!
    tableCode: String!
    limit: Int
    offset: Int
  ): OrderList!

  ordersGroupedByTable(
    restaurantId: ID!
    tableId: ID
    tableCode: String
  ): [OrderGroup!]!
  managerDashboard(restaurantId: ID!, range: String = "week"): ManagerDashboard!
  reportsOverview(
    restaurantId: ID!
    startAt: DateTime
    endAt: DateTime
    limit: Int = 500
  ): ReportsOverview!
  demandForecast(
    restaurantId: ID!
    horizonDays: Int = 2
    timezone: String = "Asia/Ho_Chi_Minh"
  ): DemandForecast!
  menuEngineeringAssistant(
    restaurantId: ID!
    lookbackDays: Int = 30
    timezone: String = "Asia/Ho_Chi_Minh"
  ): MenuEngineeringAssistant!
  smartPromotionEngine(
    restaurantId: ID!
    lookbackDays: Int = 30
    horizonDays: Int = 2
    timezone: String = "Asia/Ho_Chi_Minh"
  ): SmartPromotionEngine!
}

extend type Mutation {
  requestOrderItemVoid(input: RequestOrderItemVoidInput!): Order!
  reviewOrderItemVoid(input: ReviewOrderItemVoidInput!): Order!
  requestOrderItemReturn(input: RequestOrderItemReturnInput!): Order!
  reviewOrderItemReturn(input: ReviewOrderItemReturnInput!): Order!
  adjustOrderItemQuantity(input: AdjustOrderItemQuantityInput!): Order!
  createOrderForTable(
    input: CreateOrderForTableInput!
  ): CreateOrderForTablePayload!

  createOffPremiseOrder(
    input: CreateOffPremiseOrderInput!
  ): CreateOffPremiseOrderPayload!

  createStaffRemoteOrder(
    input: CreateStaffRemoteOrderInput!
  ): CreateStaffRemoteOrderPayload!

  createCheckoutOrders(
    input: CreateCheckoutOrdersInput!
  ): CreateCheckoutOrdersPayload!

  updateOrderStatus(input: UpdateOrderStatusInput!): Order!

  confirmIncomingOrder(
    input: ConfirmIncomingOrderInput!
  ): ConfirmIncomingOrderPayload!
  createTemporaryBillPrintJob(
    input: CreateTemporaryBillPrintJobInput!
  ): ActionResultPayload!

  rejectIncomingOrder(
    input: RejectIncomingOrderInput!
  ): RejectIncomingOrderPayload!
  requestPaymentForOrder(
    input: RequestPaymentForOrderInput!
  ): ActionResultPayload!
  requestPaymentForTable(
    input: RequestPaymentForTableInput!
  ): ActionResultPayload!
  remindOrderItem(input: RemindOrderItemInput!): ActionResultPayload!

  updateOrderItemStatus(
    input: UpdateOrderItemStatusInput!
  ): UpdateOrderItemStatusPayload!

  updateOrderItemPriority(
    input: UpdateOrderItemPriorityInput!
  ): UpdateOrderItemPriorityPayload!

  updateOrderCustomerByCode(
    input: UpdateOrderCustomerByCodeInput!
  ): UpdateOrderCustomerByCodePayload!

  cancelOrder(
    restaurantId: ID!
    orderId: ID!
    reason: String
    warehouseId: ID
  ): CancelOrderPayload!
}
