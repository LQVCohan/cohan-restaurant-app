# --- Value Objects ---
type Shipping {
  fullName: String
  phone: String
  email: String
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

enum OrderStatus {
  pending
  confirmed
  preparing
  ready
  served
  completed
  cancelled
}

enum ItemStatus {
  pending
  preparing
  ready
  served
  cancelled
}

type OrderModifier {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

input OrderModifierInput {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

type OrderTotals {
  subtotal: Int!
  discount: Int!
  tax: Int!
  service: Int!
  grandTotal: Int!
}

type StatusEvent {
  status: String!
  at: String!
  byUserId: ID
  note: String
}

type OrderPayment {
  method: String
  paidAmount: Int
  currency: String
  status: String
  txnRef: String
  paidAt: String
}

# --- Core Types ---
type OrderItem {
  dishId: String
  menuId: String
  categoryId: String
  name: String!
  unit: String
  image: String
  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  note: String
  quantity: Float!
  modifiers: [OrderModifier!]
  lineSubtotal: Int
  status: String
  recipeId: ID
  recipe: Recipe
}

type OrderCustomerInfo {
  name: String
  phone: String
  email: String
  note: String
  partySize: Int
  timeTo: DateTime
}

type Order {
  id: ID!
  orderCode: String
  restaurantId: ID!
  userId: ID
  reservationId: ID
  orderType: String!
  tableCode: String
  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment
  statusTimeline: [StatusEvent!]!
  currentStatus: String!
  note: String
  createdAt: String!
  updatedAt: String!
  user: User
  customerInfo: OrderCustomerInfo
}

# --- Inputs ---
input ShippingInput {
  fullName: String
  phone: String
  email: String
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

input OrderItemInput {
  dishId: String
  menuId: String
  categoryId: String
  name: String!
  unit: String
  image: String
  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  note: String
  quantity: Float!
  modifiers: [OrderModifierInput!]
  status: String
}

input CustomerInput {
  fullName: String
  phone: String
  email: String
}

"""
Tạo / append order cho bàn.
warehouseId optional: nếu không truyền, BE sẽ tự chọn warehouse đầu tiên của restaurant.
"""
input CreateOrAppendTableOrderInput {
  restaurantId: ID!
  tableId: ID
  tableCode: String!
  orderCode: String
  items: [OrderItemInput!]!
  note: String
  customer: CustomerInput
  userId: ID
  clientMeta: JSON
  warehouseId: ID
}

type CreateOrAppendTableOrderPayload {
  isNewOrder: Boolean!
  order: Order!
}

"""
✅ Cập nhật trạng thái Order theo ID, không dùng code nữa.
Thêm restaurantId optional để BE có thể check nếu cần.
warehouseId optional: nếu truyền, BE sẽ commit/cancel reservation ở kho tương ứng.
"""
input UpdateOrderStatusInput {
  id: ID!
  restaurantId: ID
  status: OrderStatus!
  note: String
  warehouseId: ID
}

input UpdateOrderItemStatusInput {
  orderId: ID!
  restaurantId: ID
  itemKey: String!
  status: ItemStatus!
  note: String
}

"""
Vẫn dùng orderCode cho case gán khách theo cả chuỗi order cùng bàn.
"""
input UpdateOrderCustomerByCodeInput {
  restaurantId: ID!
  orderCode: String!
  customer: CustomerInput!
}

# --- Return types ---

type UpdateOrderItemStatusPayload {
  order: Order!
}

type UpdateOrderCustomerByCodePayload {
  success: Boolean
  modifiedCount: Int
}

type CancelOrderPayload {
  success: Boolean!
  order: Order!
}

# --- Connections & Lists ---
type PageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

type OrderEdge {
  node: Order!
  cursor: ID!
}

type OrdersConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

input OrderFilterInput {
  restaurantId: ID
  tableCode: String
  orderCode: String
  status: String
  statuses: [String!]
  dateFrom: String
  dateTo: String
  keyword: String
}

type OrderList {
  items: [Order!]!
  totalCount: Int!
}

type OrderGroup {
  orderCode: String
  tableCode: String
  restaurantId: ID
  latestStatus: String
  count: Int
  orders: [Order!]!
}

# --- Root ---
extend type Query {
  order(id: ID!): Order
  orders(filter: OrderFilterInput, limit: Int, offset: Int): OrderList!
  ordersByRestaurantNow(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!
  ordersByRestaurant(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!
  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!
  ordersByTableCode(
    restaurantId: ID!
    tableCode: String!
    limit: Int
    offset: Int
  ): OrderList!

  ordersGroupedByTable(restaurantId: ID!, tableCode: String!): [OrderGroup!]!
}

extend type Mutation {
  createOrAppendTableOrder(
    input: CreateOrAppendTableOrderInput!
  ): CreateOrAppendTableOrderPayload!

  # ✅ Trạng thái Order theo ID
  updateOrderStatus(input: UpdateOrderStatusInput!): Order!

  # ✅ Trạng thái món theo orderId
  updateOrderItemStatus(
    input: UpdateOrderItemStatusInput!
  ): UpdateOrderItemStatusPayload!

  # ✅ Gán/đổi khách cho toàn bộ order cùng orderCode
  updateOrderCustomerByCode(
    input: UpdateOrderCustomerByCodeInput!
  ): UpdateOrderCustomerByCodePayload!

  cancelOrder(
    restaurantId: ID!
    orderId: ID!
    reason: String
    warehouseId: ID
  ): CancelOrderPayload!
}
