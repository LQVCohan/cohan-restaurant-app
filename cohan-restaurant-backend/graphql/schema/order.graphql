}

# =========================================================
# PAYMENT
# =========================================================

type OrderPayment {
  method: String
  provider: String
  transactionId: ID
  status: String
  paidAmount: Int
  changeAmount: Int
  currency: String
  requestedAt: DateTime
  requestedBy: ID
  paidAt: DateTime
  paidBy: ID
}

# =========================================================
# STATUS TIMELINE
# =========================================================

type StatusEvent {
  status: OrderStatus!
  at: DateTime!
  byUserId: ID
  note: String
}

# =========================================================
# CUSTOMER INFO
# =========================================================

type OrderCustomerInfo {
  name: String
  phone: String
  email: String
  note: String
  partySize: Int
  timeTo: String
}

input CustomerInput {
  fullName: String
  name: String
  phone: String
  email: String
}

# =========================================================
# ORDER
# =========================================================

type Order {
  id: ID!
  orderCode: String
  parentOrderCode: String
  orderKind: String
  parentOrderId: ID
  rootOrderId: ID
  orderPaymentStatus: String
  restaurantId: ID!

  orderType: OrderType!
  tableCode: String
  tableName: String
  guestCount: Int

  userId: ID
  reservationId: ID

  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment

  statusTimeline: [StatusEvent!]!
  currentStatus: OrderStatus!
  priority: OrderPriority

  note: String
  createdAt: DateTime!
  updatedAt: DateTime!

  user: User
  customerInfo: OrderCustomerInfo
  clientMeta: JSON
}

