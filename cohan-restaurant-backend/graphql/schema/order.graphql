type Shipping {
  fullName: String
  phone: String
  email: String # ✅ thêm email
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

input ShippingInput {
  fullName: String
  phone: String
  email: String # ✅ thêm email
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

type OrderModifier {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

input OrderModifierInput {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

input UpsertTableOrderInput {
  restaurantId: ID!
  tableCode: String!
  orderCode: String
  items: [OrderItemInput!]!
  note: String
  paymentMethod: String
  customer: CustomerInput
  clientMeta: JSON
}

type UpsertTableOrderPayload {
  order: Order!
  isNewOrder: Boolean!
}

type OrderItem {
  dishId: String
  menuId: String
  categoryId: String
  name: String!
  unit: String
  image: String
  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  description: String
  quantity: Float!
  modifiers: [OrderModifier!]
  lineSubtotal: Int
}

input OrderItemInput {
  dishId: String
  menuId: String
  categoryId: String
  name: String!
  unit: String
  image: String
  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  description: String
  quantity: Float!
  modifiers: [OrderModifierInput!]
}

input CustomerInput { # ✅ cho khách chưa đăng nhập
  fullName: String
  phone: String
  email: String
}

type OrderTotals {
  subtotal: Int!
  discount: Int!
  tax: Int!
  service: Int!
  grandTotal: Int!
}

type StatusEvent {
  status: String!
  at: String!
  byUserId: ID
  note: String
}

type OrderPayment {
  method: String
  paidAmount: Int
  currency: String
  status: String
  txnRef: String
  paidAt: String
}

type Order {
  id: ID!
  orderCode: String
  restaurantId: ID!
  userId: ID
  reservationId: ID
  orderType: String!
  tableCode: String
  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment
  statusTimeline: [StatusEvent!]!
  currentStatus: String!
  note: String
  createdAt: String!
  updatedAt: String!
  user: User
}

input CreateOrderInput {
  orderCode: String
  userId: ID
  restaurantId: ID!
  reservationId: ID
  orderType: String
  tableCode: String
  shipping: ShippingInput
  items: [OrderItemInput!]!
  note: String
  paymentMethod: String!
  customer: CustomerInput
}

input UpdateOrderStatusInput {
  id: ID!
  status: String!
  note: String
}

type OrdersConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

type OrderEdge {
  node: Order!
  cursor: ID!
}

type PageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}
input OrderFilterInput {
  restaurantId: ID
  tableCode: String
  orderCode: String
  status: String
  statuses: [String!]
  dateFrom: String
  dateTo: String
  keyword: String
}
type OrderList {
  items: [Order!]!
  totalCount: Int!
}
extend type Query {
  order(id: ID!): Order
  orders(filter: OrderFilterInput, limit: Int, offset: Int): OrderList!
  ordersByRestaurant(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!
  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!

  ordersByTableCode(
    restaurantId: ID!
    tableCode: String!
    limit: Int
    offset: Int
  ): OrderList!
}

extend type Mutation {
  upsertTableOrder(input: UpsertTableOrderInput!): UpsertTableOrderPayload!
  createOrder(input: CreateOrderInput!): Order!
  updateOrderStatus(input: UpdateOrderStatusInput!): Order!
  cancelOrder(id: ID!, reason: String): Order!
}
