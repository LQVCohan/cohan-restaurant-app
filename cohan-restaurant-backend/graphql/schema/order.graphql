# --- Value Objects ---

type Shipping {
  fullName: String
  phone: String
  email: String
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

enum OrderStatus {
  pending
  preparing
  ready
  served
  cancelled
  completed
}

enum ItemStatus {
  pending
  preparing
  ready
  served
  cancelled
}

type OrderModifier {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

input OrderModifierInput {
  optionId: ID
  optionName: String!
  groupId: ID
  price: Int
}

type OrderTotals {
  subtotal: Int!
  discount: Int!
  tax: Int!
  service: Int!
  grandTotal: Int!
}

type StatusEvent {
  status: String!
  at: String!
  byUserId: ID
  note: String
}

type OrderPayment {
  method: String
  paidAmount: Int
  currency: String
  status: String
  txnRef: String
  paidAt: String
}

# --- Core Types ---

type OrderItem {
  dishId: String
  menuId: String
  categoryId: String
  name: String!
  unit: String
  image: String
  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  note: String
  quantity: Float!
  modifiers: [OrderModifier!]
  lineSubtotal: Int
  status: String
  recipeId: ID
  recipe: Recipe
}

type Order {
  id: ID!
  orderCode: String
  restaurantId: ID!
  userId: ID
  reservationId: ID
  orderType: String!
  tableCode: String
  shipping: Shipping
  items: [OrderItem!]!
  totals: OrderTotals!
  payment: OrderPayment
  statusTimeline: [StatusEvent!]!
  currentStatus: String!
  note: String
  createdAt: String!
  updatedAt: String!
  user: User
}

# --- Events / Subscriptions ---

type OrderEvent {
  type: String!
  order: Order!
}

extend type Subscription {
  orderEvents(restaurantId: ID!): OrderEvent!
}

# --- Inputs ---

input ShippingInput {
  fullName: String
  phone: String
  email: String
  address: String
  note: String
  deliveryMethod: String
  deliveryTime: String
  scheduleDate: String
  scheduleTime: String
}

input OrderItemInput {
  dishId: String
  menuId: String
  categoryId: String
  name: String!
  unit: String
  image: String
  price: Int!
  modifiersPrice: Int
  method: String
  methodDelta: Int
  note: String
  quantity: Float!
  modifiers: [OrderModifierInput!]
  status: String
}

input CustomerInput {
  fullName: String
  phone: String
  email: String
}

input UpsertTableOrderInput {
  restaurantId: ID!
  tableCode: String!
  orderCode: String
  items: [OrderItemInput!]!
  replaceItems: Boolean
  note: String
  paymentMethod: String
  customer: CustomerInput
  clientMeta: JSON
}

type UpsertTableOrderPayload {
  order: Order!
  isNewOrder: Boolean!
}

input CreateOrderInput {
  orderCode: String
  userId: ID
  restaurantId: ID!
  reservationId: ID
  orderType: String
  tableCode: String
  shipping: ShippingInput
  items: [OrderItemInput!]!
  note: String
  paymentMethod: String!
  customer: CustomerInput
}

input UpdateOrderStatusInput {
  id: ID!
  status: String!
  note: String
}

input UpdateOrderStatusByCodeInput {
  restaurantId: ID!
  orderCode: String!
  status: OrderStatus!
  note: String
}

input UpdateOrderItemStatusByCodeInput {
  restaurantId: ID!
  orderCode: String!
  itemKey: String!
  status: ItemStatus!
  note: String
}

type UpdateOrderStatusByCodePayload {
  order: Order!
}

type UpdateOrderItemStatusByCodePayload {
  order: Order!
}

# --- NEW: chỉ cập nhật khách hàng cho order hiện có ---
input UpdateOrderCustomerByCodeInput {
  restaurantId: ID!
  orderCode: String!
  customer: CustomerInput!
}

type UpdateOrderCustomerByCodePayload {
  order: Order!
}

# --- Connections & Lists ---

type PageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

type OrderEdge {
  node: Order!
  cursor: ID!
}

type OrdersConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

input OrderFilterInput {
  restaurantId: ID
  tableCode: String
  orderCode: String
  status: String
  statuses: [String!]
  dateFrom: String
  dateTo: String
  keyword: String
}

type OrderList {
  items: [Order!]!
  totalCount: Int!
}

# --- Root ---

extend type Query {
  order(id: ID!): Order
  orders(filter: OrderFilterInput, limit: Int, offset: Int): OrderList!

  # ONLY current/active orders (exclude cancelled, completed)
  ordersByRestaurantNow(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  # ALL orders including cancelled & completed
  ordersByRestaurant(
    restaurantId: ID!
    limit: Int = 20
    cursor: ID
  ): OrdersConnection!

  ordersByUser(userId: ID!, limit: Int = 20, cursor: ID): OrdersConnection!

  ordersByTableCode(
    restaurantId: ID!
    tableCode: String!
    limit: Int
    offset: Int
  ): OrderList!
}

extend type Mutation {
  upsertTableOrder(input: UpsertTableOrderInput!): UpsertTableOrderPayload!
  createOrder(input: CreateOrderInput!): Order!
  updateOrderStatus(input: UpdateOrderStatusInput!): Order!
  cancelOrder(id: ID!, reason: String): Order!

  updateOrderStatusByCode(
    input: UpdateOrderStatusByCodeInput!
  ): UpdateOrderStatusByCodePayload!

  updateOrderItemStatusByCode(
    input: UpdateOrderItemStatusByCodeInput!
  ): UpdateOrderItemStatusByCodePayload!

  # --- NEW ---
  updateOrderCustomerByCode(
    input: UpdateOrderCustomerByCodeInput!
  ): UpdateOrderCustomerByCodePayload!
}
