enum PaymentMethod {
  cash
  card
  transfer
  bank_transfer
  e_wallet
  other
}
enum PaymentStatus {
  SUCCESS
  FAILED
  PENDING
  CANCELED
}
input PayOrdersByTableIdInput {
  restaurantId: ID!
  tableId: ID!
  paidAmount: Float
  method: String! # "cash" | "card" | "bank_transfer" | "e_wallet" | ...
  paidAt: DateTime
  note: String
  externalRef: String
  includeUnserved: Boolean = false
  pricing: CheckoutPricingInput
  promotionIds: [ID!]
}
input PayOrdersByOrderIdsInput {
  restaurantId: ID!
  orderIds: [ID!]!
  paidAmount: Float
  method: String! # "cash" | "card" | "bank_transfer" | "e_wallet" | ...
  paidAt: DateTime
  note: String
  externalRef: String
  pricing: CheckoutPricingInput
  promotionIds: [ID!]
}
input RequestTablePaymentInput {
  restaurantId: ID!
  tableId: ID!
  tableCode: String
  source: String
  requestedBy: String
  note: String
}
input ClearTablePaymentRequestInput {
  restaurantId: ID!
  tableId: ID!
  tableCode: String
  reason: String
}
enum InvoiceStatus {
  UNPAID
  PARTIAL
  PAID
  VOID
}

enum CashflowType {
  INFLOW
  OUTFLOW
}
enum CashflowCategory {
  SALE
  REFUND
  PAYROLL
  INVENTORY
  OPERATIONS
  SUPPLIER_PAYMENT
  ADJUSTMENT
  OTHER
}

enum FinanceRange {
  WEEK
  MONTH
  QUARTER
  YEAR
  CUSTOM
}

type PayOrdersByTableResult {
  warning: Boolean!
  pendingOrderCodes: [String!]
  invoice: Invoice
  transaction: PaymentTransaction
  cashflow: Cashflow
}

type RequestTablePaymentResult {
  ok: Boolean!
  warning: Boolean!
  readyForPayment: Boolean!
  message: String
  pendingOrderCodes: [String!]!
  session: Order
  orders: [Order!]!
  requestedAt: String
}

type ClearTablePaymentRequestResult {
  ok: Boolean!
  message: String
  session: Order
  orders: [Order!]!
}

type CashflowReference {
  kind: String
  id: ID
  orderId: ID
  invoiceId: ID
  paymentTransactionId: ID
  payrollPaymentId: ID
  stockMovementId: ID
  reconciliationId: ID
  refundId: ID
}

type Cashflow {
  id: ID!
  restaurantId: ID
  type: CashflowType!
  amount: Float!
  occurredAt: DateTime!
  currency: String
  category: String
  subcategory: String
  method: String
  status: String
  source: String
  reference: CashflowReference
  note: String
  evidenceAttachments: JSON
  createdBy: ID
  approvedBy: ID
  voidedBy: ID
  voidedAt: DateTime
  voidReason: String
  createdAt: DateTime
  updatedAt: DateTime
}
type Invoice {
  id: ID!
  number: String!
  status: InvoiceStatus!
  totals: OrderTotals!
  paid: Float!
  issuedAt: DateTime!
  orderId: ID!
  customerId: ID
  currency: String
  refTransactionId: ID
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}
type PaymentTransaction {
  id: ID!
  orderId: ID!
  paidAmount: Float!
  method: PaymentMethod!
  status: PaymentStatus!
  paidAt: DateTime!
  note: String
  externalRef: String
  refundedAmount: Float
  refundStatus: String
  refundIds: [ID!]
  createdBy: ID
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

type PaymentSession {
  id: ID!
  restaurantId: ID
  orderId: ID
  reservationId: ID
  userId: ID!
  provider: String!
  providerTransactionId: String
  requestId: String!
  reference: String!
  amount: Float!
  currency: String!
  paymentMethod: String
  status: String!
  callbackStatus: String!
  payUrl: String
  qrCodeUrl: String
  deeplink: String
  metadata: JSON
  providerResponseRaw: JSON
  callbackRaw: JSON
  reconciledAt: DateTime
  expiresAt: DateTime
  cancelledAt: DateTime
  cancelReason: String
  createdAt: DateTime
  updatedAt: DateTime
}
type BankTransaction {
  id: ID!
  provider: String
  restaurantId: ID
  transactionId: String
  bankAccountNumber: String @deprecated(reason: "Masked only; use bankAccountNumberMasked or bankAccountNumberLast4")
  bankAccountNumberMasked: String
  bankAccountNumberLast4: String
  amount: Float!
  currency: String
  description: String
  transferContent: String
  occurredAt: DateTime
  matchedPaymentSessionId: ID
  matchStatus: String
  createdAt: DateTime
  updatedAt: DateTime
}
type PaymentReconciliation {
  id: ID!
  restaurantId: ID
  paymentSessionId: ID
  provider: String
  expectedAmount: Float
  receivedAmount: Float
  varianceAmount: Float
  status: String!
  bankTransactionId: ID
  paymentReference: String
  matchedBy: String
  matchedAt: DateTime
  note: String
  matchConfidence: Float
  matchReason: String
  candidatePaymentSessionIds: [ID!]
  candidatePaymentTransactionIds: [ID!]
  candidateMatches: JSON
  resolvedBy: ID
  resolvedAt: DateTime
  resolution: String
  auditTrail: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

type PaymentRefund {
  id: ID!
  restaurantId: ID!
  orderId: ID
  invoiceId: ID
  paymentTransactionId: ID
  amount: Float!
  currency: String
  reason: String!
  method: String!
  status: String!
  providerRefundId: String
  createdBy: ID
  approvedBy: ID
  approvedAt: DateTime
  processedBy: ID
  processedAt: DateTime
  cashflowId: ID
  auditTrail: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

input CreateOrderPaymentInput {
  restaurantId: ID!
  orderIds: [ID!]!
  provider: String!
  paymentMethod: String
  pricing: CheckoutPricingInput
  promotionIds: [ID!]
}

input CreateReservationPaymentInput {
  reservationId: ID!
  provider: String!
}
input CancelPaymentSessionInput {
  paymentId: ID!
  reason: String
}

input PaymentProviderConfigInputLite {
  provider: String!
  label: String
  active: Boolean
  priority: Int
  mode: String
}

input UpdateRestaurantPaymentSettingsInput {
  restaurantId: ID!
  defaultProvider: String
  providers: [PaymentProviderConfigInputLite!]
}

type PaymentProviderPublicConfig {
  provider: String!
  label: String!
  active: Boolean!
  priority: Int!
  mode: String!
}

type RestaurantPaymentPublicConfig {
  defaultProvider: String!
  providers: [PaymentProviderPublicConfig!]!
}


type SupplierPayable {
  id: ID!
  restaurantId: ID!
  supplierName: String!
  supplierId: ID
  sourceKind: String
  sourceId: ID
  amount: Float!
  paidAmount: Float!
  remainingAmount: Float!
  dueDate: DateTime
  status: String!
  note: String
  createdBy: ID
  paidBy: ID
  paidAt: DateTime
  cashflowIds: [ID!]
  auditTrail: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

type FinanceSummary {
  revenue: Float!
  expense: Float!
  profit: Float!
  debt: Float!
  receivable: Float!
  payable: Float!
  overdue: Float!
  payment: Float!
  refund: Float!
  settlement: Float!
  cashIn: Float!
  cashOut: Float!
  primeCostRate: Float!
}

type FinanceTrendPoint {
  key: String!
  revenue: Float!
  expense: Float!
  profit: Float!
}

type FinanceTransaction {
  id: ID!
  occurredAt: DateTime!
  description: String!
  category: String!
  type: CashflowType!
  amount: Float!
  method: String
  status: String
  source: String
  referenceType: String
  referenceId: ID
}

type FinanceDebtItem {
  id: ID!
  supplier: String!
  amount: Float!
  dueDate: DateTime
  status: String!
}

type FinanceCostBreakdown {
  cogs: Float!
  labor: Float!
  operations: Float!
  other: Float!
}

type FinanceDashboard {
  summary: FinanceSummary!
  trend: [FinanceTrendPoint!]!
  transactions: [FinanceTransaction!]!
  debts: [FinanceDebtItem!]!
  costBreakdown: FinanceCostBreakdown!
  reconciliations: [FinanceReconciliationItem!]!
  reconciliationSummary: FinanceReconciliationSummary!
}
type FinanceReconciliationItem {
  id: ID!
  time: DateTime
  amount: Float!
  reference: String
  status: String!
  note: String
}
type FinanceReconciliationSummary {
  matched: Int!
  amountMismatch: Int!
  unmatched: Int!
}

input FinanceDashboardInput {
  restaurantId: ID!
  range: FinanceRange = MONTH
  dateFrom: DateTime
  dateTo: DateTime
  currency: String
}

input FinanceTransactionFilterInput {
  restaurantId: ID!
  dateFrom: DateTime
  dateTo: DateTime
  type: String
  category: String
  subcategory: String
  method: String
  status: String
  source: String
  referenceId: String
  search: String
  limit: Int
}

input ManualCashflowInput {
  restaurantId: ID!
  type: CashflowType!
  amount: Float!
  currency: String
  category: String!
  subcategory: String
  method: String
  status: String
  occurredAt: DateTime
  note: String
  evidenceAttachments: JSON
}

input UpdateManualCashflowInput {
  type: CashflowType
  amount: Float
  currency: String
  category: String
  subcategory: String
  method: String
  status: String
  occurredAt: DateTime
  note: String
  evidenceAttachments: JSON
}


input SupplierPayableFilterInput {
  restaurantId: ID!
  status: String
  sourceKind: String
  search: String
  limit: Int
}

input SupplierPayableInput {
  restaurantId: ID!
  supplierName: String!
  supplierId: ID
  sourceKind: String
  sourceId: ID
  amount: Float!
  paidAmount: Float
  dueDate: DateTime
  note: String
}

input UpdateSupplierPayableInput {
  supplierName: String
  supplierId: ID
  sourceKind: String
  sourceId: ID
  amount: Float
  paidAmount: Float
  dueDate: DateTime
  note: String
}

input RecordSupplierPaymentInput {
  amount: Float!
  method: String
  paidAt: DateTime
  note: String
}

input RefundRequestFilterInput {
  restaurantId: ID!
  status: String
  limit: Int
}

input CreateRefundRequestInput {
  restaurantId: ID!
  orderId: ID
  invoiceId: ID
  paymentTransactionId: ID
  amount: Float!
  reason: String!
  method: String!
}

input ProcessRefundInput {
  providerRefundId: String
  note: String
  skipApproval: Boolean
  reason: String
}

input ManualMatchBankTransactionInput {
  bankTransactionId: ID!
  paymentSessionId: ID
  paymentTransactionId: ID
  note: String
  forceMatch: Boolean
}

input ResolveReconciliationInput {
  reconciliationId: ID!
  resolution: String!
  note: String
}

extend type Query {
  paymentSession(id: ID!): PaymentSession
  reservationPaymentSessions(reservationId: ID!): [PaymentSession!]!
  restaurantPaymentPublicConfig(restaurantId: ID!): RestaurantPaymentPublicConfig!

  paymentTransactionsByOrder(orderId: ID!): [PaymentTransaction!]!
  invoicesByOrder(orderId: ID!): [Invoice!]!
  financeDashboard(input: FinanceDashboardInput!): FinanceDashboard!
  financeTransactions(input: FinanceTransactionFilterInput!): [FinanceTransaction!]!
  cashflows(input: FinanceTransactionFilterInput!): [Cashflow!]!
  cashflow(id: ID!): Cashflow
  refundRequests(input: RefundRequestFilterInput!): [PaymentRefund!]!
  refundRequest(id: ID!): PaymentRefund
  supplierPayables(input: SupplierPayableFilterInput!): [SupplierPayable!]!
  paymentReconciliations(restaurantId: ID!, status: String, limit: Int): [PaymentReconciliation!]!
  bankTransactions(restaurantId: ID!, matchStatus: String, limit: Int): [BankTransaction!]!
  reconciliationQueue(restaurantId: ID!, status: String, limit: Int): [PaymentReconciliation!]!
}

extend type Mutation {
  createReservationPayment(input: CreateReservationPaymentInput!): PaymentSession!
  createOrderPayment(input: CreateOrderPaymentInput!): PaymentSession!
  cancelPaymentSession(input: CancelPaymentSessionInput!): PaymentSession!
  syncPaymentStatus(paymentId: ID!): PaymentSession!
  updateRestaurantPaymentSettings(input: UpdateRestaurantPaymentSettingsInput!): Restaurant!

  requestTablePayment(input: RequestTablePaymentInput!): RequestTablePaymentResult!
  clearTablePaymentRequest(input: ClearTablePaymentRequestInput!): ClearTablePaymentRequestResult!
  payOrdersByTableId(input: PayOrdersByTableIdInput!): PayOrdersByTableResult!
  payOrdersByOrderIds(input: PayOrdersByOrderIdsInput!): PayOrdersByTableResult!

  createManualCashflow(input: ManualCashflowInput!): Cashflow!
  updateManualCashflow(id: ID!, input: UpdateManualCashflowInput!): Cashflow!
  voidManualCashflow(id: ID!, reason: String!): Cashflow!

  createSupplierPayable(input: SupplierPayableInput!): SupplierPayable!
  updateSupplierPayable(id: ID!, input: UpdateSupplierPayableInput!): SupplierPayable!
  recordSupplierPayment(id: ID!, input: RecordSupplierPaymentInput!): SupplierPayable!
  voidSupplierPayable(id: ID!, reason: String!): SupplierPayable!

  createRefundRequest(input: CreateRefundRequestInput!): PaymentRefund!
  approveRefundRequest(id: ID!): PaymentRefund!
  rejectRefundRequest(id: ID!, reason: String!): PaymentRefund!
  cancelRefundRequest(id: ID!, reason: String!): PaymentRefund!
  retryRefundRequest(id: ID!, input: ProcessRefundInput): PaymentRefund!
  processRefundRequest(id: ID!, input: ProcessRefundInput): PaymentRefund!

  reconcileBankTransaction(bankTransactionId: ID!): PaymentReconciliation!
  manuallyMatchBankTransaction(input: ManualMatchBankTransactionInput!): PaymentReconciliation!
  resolveReconciliation(input: ResolveReconciliationInput!): PaymentReconciliation!
  ignoreBankTransaction(id: ID!, reason: String!): BankTransaction!
}
