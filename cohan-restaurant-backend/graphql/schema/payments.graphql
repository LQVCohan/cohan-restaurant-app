enum PaymentMethod {
  cash
  card
  transfer
  bank_transfer
  e_wallet
  other
}
enum PaymentStatus {
  SUCCESS
  FAILED
  PENDING
  CANCELED
}
input PayOrdersByTableIdInput {
  restaurantId: ID!
  tableId: ID!
  paidAmount: Float
  method: String! # "cash" | "card" | "bank_transfer" | "e_wallet" | ...
  paidAt: DateTime
  note: String
  externalRef: String
  includeUnserved: Boolean = false
}
enum InvoiceStatus {
  UNPAID
  PARTIAL
  PAID
  VOID
}

enum CashflowType {
  INFLOW
  OUTFLOW
}
enum CashflowCategory {
  SALE
  REFUND
  OTHER
}

enum FinanceRange {
  WEEK
  MONTH
  QUARTER
  YEAR
  CUSTOM
}

type PayOrdersByTableResult {
  warning: Boolean!
  pendingOrderCodes: [String!]
  invoice: Invoice
  transaction: PaymentTransaction
  cashflow: Cashflow
}

type CashflowReference {
  kind: String
  id: ID
  orderId: ID
}

type Cashflow {
  id: ID!
  type: CashflowType!
  amount: Float!
  occurredAt: DateTime!
  currency: String
  reference: CashflowReference
  note: String
  createdBy: ID
  createdAt: DateTime
  updatedAt: DateTime
}
type Invoice {
  id: ID!
  number: String!
  status: InvoiceStatus!
  totals: OrderTotals!
  paid: Float!
  issuedAt: DateTime!
  orderId: ID!
  customerId: ID
  currency: String
  refTransactionId: ID
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}
type PaymentTransaction {
  id: ID!
  orderId: ID!
  paidAmount: Float!
  method: PaymentMethod!
  status: PaymentStatus!
  paidAt: DateTime!
  note: String
  externalRef: String
  createdBy: ID
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

type FinanceSummary {
  revenue: Float!
  expense: Float!
  profit: Float!
  debt: Float!
  payment: Float!
  refund: Float!
  settlement: Float!
  cashIn: Float!
  cashOut: Float!
}

type FinanceTrendPoint {
  key: String!
  revenue: Float!
  expense: Float!
  profit: Float!
}

type FinanceTransaction {
  id: ID!
  occurredAt: DateTime!
  description: String!
  category: String!
  type: CashflowType!
  amount: Float!
  method: String
  status: String
  source: String
  referenceType: String
  referenceId: ID
}

type FinanceDebtItem {
  id: ID!
  supplier: String!
  amount: Float!
  dueDate: DateTime
  status: String!
}

type FinanceCostBreakdown {
  cogs: Float!
  labor: Float!
  operations: Float!
  other: Float!
}

type FinanceDashboard {
  summary: FinanceSummary!
  trend: [FinanceTrendPoint!]!
  transactions: [FinanceTransaction!]!
  debts: [FinanceDebtItem!]!
  costBreakdown: FinanceCostBreakdown!
}

input FinanceDashboardInput {
  restaurantId: ID!
  range: FinanceRange = MONTH
  dateFrom: DateTime
  dateTo: DateTime
}

extend type Query {
  paymentTransactionsByOrder(orderId: ID!): [PaymentTransaction!]!
  invoicesByOrder(orderId: ID!): [Invoice!]!
  financeDashboard(input: FinanceDashboardInput!): FinanceDashboard!
}

extend type Mutation {
  payOrdersByTableId(input: PayOrdersByTableIdInput!): PayOrdersByTableResult!
}
