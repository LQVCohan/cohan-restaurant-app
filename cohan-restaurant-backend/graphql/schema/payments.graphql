enum PaymentMethod {
  cash
  card
  bank_transfer
  e_wallet
}
enum PaymentStatus {
  SUCCESS
  FAILED
  PENDING
  CANCELED
}
input PayOrdersByTableIdInput {
  restaurantId: ID!
  tableId: ID!
  paidAmount: Float
  method: String! # "cash" | "card" | "bank_transfer" | "e_wallet" | ...
  paidAt: DateTime
  note: String
  externalRef: String
  includeUnserved: Boolean = false
}
enum InvoiceStatus {
  UNPAID
  PARTIAL
  PAID
  VOID
}

enum CashflowType {
  INFLOW
  OUTFLOW
}
enum CashflowCategory {
  SALE
  REFUND
  OTHER
}

type PayOrdersByTableResult {
  warning: Boolean!
  pendingOrderCodes: [String!]
  invoice: Invoice
  transaction: PaymentTransaction
  cashflow: Cashflow
}

type CashflowReference {
  kind: String
  id: ID
  orderId: ID
}

type Cashflow {
  id: ID!
  type: CashflowType!
  amount: Float!
  occurredAt: DateTime!
  currency: String
  reference: CashflowReference
  note: String
  createdBy: ID
  createdAt: DateTime
  updatedAt: DateTime
}
type Invoice {
  id: ID!
  number: String!
  status: InvoiceStatus!
  totals: OrderTotals!
  paid: Float!
  issuedAt: DateTime!
  orderId: ID!
  customerId: ID
  currency: String
  refTransactionId: ID
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}
type PaymentTransaction {
  id: ID!
  orderId: ID!
  paidAmount: Float!
  method: PaymentMethod!
  status: PaymentStatus!
  paidAt: DateTime!
  note: String
  externalRef: String
  createdBy: ID
  meta: JSON
  createdAt: DateTime
  updatedAt: DateTime
}
extend type Query {
  paymentTransactionsByOrder(orderId: ID!): [PaymentTransaction!]!
  invoicesByOrder(orderId: ID!): [Invoice!]!
}

extend type Mutation {
  payOrdersByTableId(input: PayOrdersByTableIdInput!): PayOrdersByTableResult!
}
