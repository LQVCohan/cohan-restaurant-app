type AiChatbotAction {
  type: String
  label: String
  href: String
}

type AiChatbotSource {
  type: String
  id: ID
  label: String
}

type AiChatbotContextSummary {
  restaurantCount: Int
  menuItemCount: Int
  couponCount: Int
  orderCount: Int
  reservationCount: Int
}

type AiChatbotResponse {
  answer: String!
  intent: String
  confidence: Float
  quickReplies: [String!]!
  actions: [AiChatbotAction!]!
  sources: [AiChatbotSource!]!
  contextSummary: AiChatbotContextSummary
  isFallback: Boolean
  conversationId: ID
  handoffSuggested: Boolean
  handoffReason: String
  handoffMessage: String
}

input AiChatbotHistoryInput {
  role: String!
  content: String!
}

input AskAiChatbotInput {
  message: String!
  restaurantId: ID
  history: [AiChatbotHistoryInput!]
  guestId: String
  conversationId: ID
}

input RequestAiChatbotHandoffInput {
  conversationId: ID!
  restaurantId: ID
  guestId: String
  reason: String
  latestUserMessage: String
}

type AiChatbotHandoffResponse {
  ok: Boolean!
  conversationId: ID!
  handoffRequested: Boolean!
  chatThreadId: ID
  notificationCount: Int!
  message: String!
  alreadyRequested: Boolean!
}

extend type Mutation {
  askAiChatbot(input: AskAiChatbotInput!): AiChatbotResponse!
  requestAiChatbotHandoff(input: RequestAiChatbotHandoffInput!): AiChatbotHandoffResponse!
}
