type AiChatbotAction {
  type: String
  label: String
  href: String
  description: String
  icon: String
  priority: Int
}

type AiChatbotSource {
  type: String
  id: ID
  label: String
  restaurantName: String
  currency: String
  formattedPrice: String
  status: String
  isAvailable: Boolean
  hasOptions: Boolean
  hasVariants: Boolean
  restaurantId: ID
  basePrice: Float
  currentPrice: Float
  price: Float
  servingVariants: [JSON!]
}

type AiChatbotScopeCandidate {
  restaurantId: ID!
  restaurantName: String!
  reason: String
}

type AiChatbotContextSummary {
  restaurantCount: Int
  menuItemCount: Int
  couponCount: Int
  orderCount: Int
  reservationCount: Int
}



type AiChatbotKnowledgeSuggestion {
  id: ID!
  restaurantId: ID!
  question: String!
  normalizedQuestion: String
  suggestedTitle: String
  suggestedContent: String
  category: String
  tags: [String!]!
  triggerType: String!
  confidence: Float
  status: String!
  occurrenceCount: Int!
  lastAskedAt: DateTime
  approvedKnowledgeItemId: ID
  createdAt: DateTime
  updatedAt: DateTime
}

input AiChatbotKnowledgeSuggestionFilterInput {
  status: String
  search: String
  triggerType: String
}

input ApproveAiChatbotKnowledgeSuggestionInput {
  title: String
  content: String
  category: String
  tags: [String!]
  enabled: Boolean
  priority: Int
  sourceType: String
}

type AiChatbotKnowledgeItem {
  id: ID!
  restaurantId: ID!
  title: String!
  content: String!
  category: String
  tags: [String!]!
  enabled: Boolean!
  priority: Int!
  sourceType: String!
  createdAt: DateTime
  updatedAt: DateTime
}

input AiChatbotKnowledgeFilterInput {
  category: String
  enabled: Boolean
  search: String
}

input CreateAiChatbotKnowledgeItemInput {
  restaurantId: ID!
  title: String!
  content: String!
  category: String
  tags: [String!]
  enabled: Boolean
  priority: Int
  sourceType: String
}

input BulkAiChatbotIdsInput { ids: [ID!]! }

input ImportAiChatbotKnowledgeInput { restaurantId: ID! format: String! payload: String! }
type ImportAiChatbotKnowledgeResult { imported: Int! skipped: Int! errors: [String!]! }
type AiKnowledgeEmbeddingRebuildResult { total: Int! updated: Int! skipped: Int! failed: Int! errors: [String!]! }

input GenerateAiChatbotKnowledgeSuggestionsInput {
  restaurantId: ID!
  sources: [String!]
  overwriteExisting: Boolean
}

type GenerateAiChatbotKnowledgeSuggestionsResult {
  created: Int!
  updated: Int!
  skipped: Int!
  total: Int!
  suggestions: [AiChatbotKnowledgeSuggestion!]!
}

input UpdateAiChatbotKnowledgeItemInput {
  id: ID!
  title: String
  content: String
  category: String
  tags: [String!]
  enabled: Boolean
  priority: Int
  sourceType: String
}


type AiChatbotAnswerFeedback {
  id: ID!
  restaurantId: ID
  conversationId: ID
  messageId: ID
  guestId: String
  userId: ID
  question: String
  answer: String
  rating: String!
  reason: String
  tags: [String!]!
  sourceTypes: [String!]!
  confidence: Float
  status: String!
  reviewedBy: ID
  reviewedAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
}

input SubmitAiChatbotAnswerFeedbackInput {
  restaurantId: ID
  conversationId: ID
  messageId: ID
  guestId: String
  question: String
  answer: String
  rating: String!
  reason: String
  tags: [String!]
  confidence: Float
}

input AiChatbotAnswerFeedbackFilterInput {
  rating: String
  status: String
  search: String
  from: DateTime
  to: DateTime
}


type AiChatbotSafetyRule {
  id: ID!
  restaurantId: ID!
  ruleType: String!
  pattern: String!
  responseMessage: String
  enabled: Boolean!
  priority: Int!
  createdAt: DateTime
  updatedAt: DateTime
}

input AiChatbotSafetyRuleFilterInput {
  ruleType: String
  enabled: Boolean
  search: String
}

input CreateAiChatbotSafetyRuleInput {
  restaurantId: ID!
  ruleType: String!
  pattern: String!
  responseMessage: String
  enabled: Boolean
  priority: Int
}

input UpdateAiChatbotSafetyRuleInput {
  id: ID!
  ruleType: String
  pattern: String
  responseMessage: String
  enabled: Boolean
  priority: Int
}

type AiChatbotResponse {
  answer: String!
  intent: String
  confidence: Float
  scopeMode: String!
  resolvedRestaurantId: ID
  scopeCandidates: [AiChatbotScopeCandidate!]!
  quickReplies: [String!]!
  actions: [AiChatbotAction!]!
  sources: [AiChatbotSource!]!
  contextSummary: AiChatbotContextSummary
  isFallback: Boolean
  conversationId: ID
  answerMessageId: ID
  handoffSuggested: Boolean
  handoffReason: String
  handoffMessage: String
}

input AiChatbotHistoryInput {
  role: String!
  content: String!
}

input AskAiChatbotInput {
  message: String!
  restaurantId: ID
  history: [AiChatbotHistoryInput!]
  guestId: String
  conversationId: ID
  pageContext: JSON
}

input RequestAiChatbotHandoffInput {
  conversationId: ID!
  restaurantId: ID
  guestId: String
  reason: String
  latestUserMessage: String
}