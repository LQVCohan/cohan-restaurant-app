type AiChatbotAction {
  type: String
  label: String
  href: String
}

type AiChatbotSource {
  type: String
  id: ID
  label: String
}

type AiChatbotContextSummary {
  restaurantCount: Int
  menuItemCount: Int
  couponCount: Int
  orderCount: Int
  reservationCount: Int
}

type AiChatbotResponse {
  answer: String!
  intent: String
  confidence: Float
  quickReplies: [String!]!
  actions: [AiChatbotAction!]!
  sources: [AiChatbotSource!]!
  contextSummary: AiChatbotContextSummary
  isFallback: Boolean
  conversationId: ID
  handoffSuggested: Boolean
  handoffReason: String
  handoffMessage: String
}

input AiChatbotHistoryInput {
  role: String!
  content: String!
}

input AskAiChatbotInput {
  message: String!
  restaurantId: ID
  history: [AiChatbotHistoryInput!]
  guestId: String
  conversationId: ID
}

input RequestAiChatbotHandoffInput {
  conversationId: ID!
  restaurantId: ID
  guestId: String
  reason: String
  latestUserMessage: String
}

type AiChatbotHandoffResponse {
  ok: Boolean!
  conversationId: ID!
  handoffRequested: Boolean!
  chatThreadId: ID
  notificationCount: Int!
  message: String!
  alreadyRequested: Boolean!
}

input GetAiChatbotGuestRepliesInput {
  conversationId: ID!
  guestId: String!
  after: String
  limit: Int = 30
}

type AiChatbotGuestReply {
  id: String!
  role: String!
  senderLabel: String!
  content: String!
  createdAt: String!
}

type AiChatbotGuestRepliesResponse {
  ok: Boolean!
  handoffRequested: Boolean!
  conversationStatus: String
  handoffClosed: Boolean!
  conversationId: ID!
  replies: [AiChatbotGuestReply!]!
}

input SendAiChatbotGuestMessageInput {
  conversationId: ID!
  guestId: String!
  content: String!
}

type SendAiChatbotGuestMessageResponse {
  ok: Boolean!
  conversationId: ID!
  message: AiChatbotGuestReply
}

input ResolveAiChatbotHandoffInput {
  conversationId: ID
  chatThreadId: ID
  resolutionNote: String
}


type AiChatbotIntentMetric {
  intent: String!
  count: Int!
}

type AiChatbotRoleMetric {
  role: String!
  count: Int!
}

type AiChatbotRateLimitPolicy {
  action: String!
  max: Int!
  windowMs: Int!
}

type AiChatbotAnalyticsResponse {
  totalConversations: Int!
  totalMessages: Int!
  openConversations: Int!
  handoffRequested: Int!
  resolvedHandoffs: Int!
  fallbackResponses: Int!
  lowConfidenceResponses: Int!
  handoffConversionRate: Float!
  averageMessagesPerConversation: Float!
  averageHandoffResolutionMinutes: Float
  topIntents: [AiChatbotIntentMetric!]!
  messagesByRole: [AiChatbotRoleMetric!]!
  rateLimitStatus: [AiChatbotRateLimitPolicy!]!
}

input AiChatbotAnalyticsInput {
  restaurantId: ID
  from: DateTime
  to: DateTime
  groupBy: String
}

type ResolveAiChatbotHandoffResponse {
  ok: Boolean!
  conversationId: ID
  chatThreadId: ID
  status: String
  alreadyClosed: Boolean!
  message: String!
}

extend type Query {
  aiChatbotGuestReplies(input: GetAiChatbotGuestRepliesInput!): AiChatbotGuestRepliesResponse!
  aiChatbotAnalytics(input: AiChatbotAnalyticsInput!): AiChatbotAnalyticsResponse!
}

extend type Mutation {
  askAiChatbot(input: AskAiChatbotInput!): AiChatbotResponse!
  requestAiChatbotHandoff(input: RequestAiChatbotHandoffInput!): AiChatbotHandoffResponse!
  sendAiChatbotGuestMessage(input: SendAiChatbotGuestMessageInput!): SendAiChatbotGuestMessageResponse!
  resolveAiChatbotHandoff(input: ResolveAiChatbotHandoffInput!): ResolveAiChatbotHandoffResponse!
}
