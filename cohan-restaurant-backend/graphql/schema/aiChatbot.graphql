type AiChatbotAction {
  type: String
  label: String
  href: String
  description: String
  icon: String
  priority: Int
}

type AiChatbotSource {
  type: String
  id: ID
  label: String
  formattedPrice: String
  status: String
  isAvailable: Boolean
  hasOptions: Boolean
  hasVariants: Boolean
  restaurantId: ID
  basePrice: Float
  currentPrice: Float
  price: Float
  servingVariants: [JSON!]
}

type AiChatbotContextSummary {
  restaurantCount: Int
  menuItemCount: Int
  couponCount: Int
  orderCount: Int
  reservationCount: Int
}



type AiChatbotKnowledgeSuggestion {
  id: ID!
  restaurantId: ID!
  question: String!
  normalizedQuestion: String
  suggestedTitle: String
  suggestedContent: String
  category: String
  tags: [String!]!
  triggerType: String!
  confidence: Float
  status: String!
  occurrenceCount: Int!
  lastAskedAt: DateTime
  approvedKnowledgeItemId: ID
  createdAt: DateTime
  updatedAt: DateTime
}

input AiChatbotKnowledgeSuggestionFilterInput {
  status: String
  search: String
  triggerType: String
}

input ApproveAiChatbotKnowledgeSuggestionInput {
  title: String
  content: String
  category: String
  tags: [String!]
  enabled: Boolean
  priority: Int
  sourceType: String
}

type AiChatbotKnowledgeItem {
  id: ID!
  restaurantId: ID!
  title: String!
  content: String!
  category: String
  tags: [String!]!
  enabled: Boolean!
  priority: Int!
  sourceType: String!
  createdAt: DateTime
  updatedAt: DateTime
}

input AiChatbotKnowledgeFilterInput {
  category: String
  enabled: Boolean
  search: String
}

input CreateAiChatbotKnowledgeItemInput {
  restaurantId: ID!
  title: String!
  content: String!
  category: String
  tags: [String!]
  enabled: Boolean
  priority: Int
  sourceType: String
}

input BulkAiChatbotIdsInput { ids: [ID!]! }

input ImportAiChatbotKnowledgeInput { restaurantId: ID! format: String! payload: String! }
type ImportAiChatbotKnowledgeResult { imported: Int! skipped: Int! errors: [String!]! }
type AiKnowledgeEmbeddingRebuildResult { total: Int! updated: Int! skipped: Int! failed: Int! errors: [String!]! }

input GenerateAiChatbotKnowledgeSuggestionsInput {
  restaurantId: ID!
  sources: [String!]
  overwriteExisting: Boolean
}

type GenerateAiChatbotKnowledgeSuggestionsResult {
  created: Int!
  updated: Int!
  skipped: Int!
  total: Int!
  suggestions: [AiChatbotKnowledgeSuggestion!]!
}

input UpdateAiChatbotKnowledgeItemInput {
  id: ID!
  title: String
  content: String
  category: String
  tags: [String!]
  enabled: Boolean
  priority: Int
  sourceType: String
}


type AiChatbotAnswerFeedback {
  id: ID!
  restaurantId: ID
  conversationId: ID
  messageId: ID
  guestId: String
  userId: ID
  question: String
  answer: String
  rating: String!
  reason: String
  tags: [String!]!
  sourceTypes: [String!]!
  confidence: Float
  status: String!
  reviewedBy: ID
  reviewedAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
}

input SubmitAiChatbotAnswerFeedbackInput {
  restaurantId: ID
  conversationId: ID
  messageId: ID
  guestId: String
  question: String
  answer: String
  rating: String!
  reason: String
  tags: [String!]
  confidence: Float
}

input AiChatbotAnswerFeedbackFilterInput {
  rating: String
  status: String
  search: String
  from: DateTime
  to: DateTime
}


type AiChatbotSafetyRule {
  id: ID!
  restaurantId: ID!
  ruleType: String!
  pattern: String!
  responseMessage: String
  enabled: Boolean!
  priority: Int!
  createdAt: DateTime
  updatedAt: DateTime
}

input AiChatbotSafetyRuleFilterInput {
  ruleType: String
  enabled: Boolean
  search: String
}

input CreateAiChatbotSafetyRuleInput {
  restaurantId: ID!
  ruleType: String!
  pattern: String!
  responseMessage: String
  enabled: Boolean
  priority: Int
}

input UpdateAiChatbotSafetyRuleInput {
  id: ID!
  ruleType: String
  pattern: String
  responseMessage: String
  enabled: Boolean
  priority: Int
}

type AiChatbotResponse {
  answer: String!
  intent: String
  confidence: Float
  quickReplies: [String!]!
  actions: [AiChatbotAction!]!
  sources: [AiChatbotSource!]!
  contextSummary: AiChatbotContextSummary
  isFallback: Boolean
  conversationId: ID
  answerMessageId: ID
  handoffSuggested: Boolean
  handoffReason: String
  handoffMessage: String
}

input AiChatbotHistoryInput {
  role: String!
  content: String!
}

input AskAiChatbotInput {
  message: String!
  restaurantId: ID
  history: [AiChatbotHistoryInput!]
  guestId: String
  conversationId: ID
  pageContext: JSON
}

input RequestAiChatbotHandoffInput {
  conversationId: ID!
  restaurantId: ID
  guestId: String
  reason: String
  latestUserMessage: String
}

type AiChatbotHandoffResponse {
  ok: Boolean!
  conversationId: ID!
  handoffRequested: Boolean!
  chatThreadId: ID
  notificationCount: Int!
  message: String!
  alreadyRequested: Boolean!
}

input GetAiChatbotGuestRepliesInput {
  conversationId: ID!
  guestId: String!
  after: String
  limit: Int = 30
}

type AiChatbotGuestReply {
  id: String!
  role: String!
  senderLabel: String!
  content: String!
  createdAt: String!
}

type AiChatbotGuestRepliesResponse {
  ok: Boolean!
  handoffRequested: Boolean!
  conversationStatus: String
  handoffClosed: Boolean!
  conversationId: ID!
  replies: [AiChatbotGuestReply!]!
}

input SendAiChatbotGuestMessageInput {
  conversationId: ID!
  guestId: String!
  content: String!
}

type SendAiChatbotGuestMessageResponse {
  ok: Boolean!
  conversationId: ID!
  message: AiChatbotGuestReply
}

input ResolveAiChatbotHandoffInput {
  conversationId: ID
  chatThreadId: ID
  resolutionNote: String
}


type AiChatbotIntentMetric {
  intent: String!
  count: Int!
}

type AiChatbotRoleMetric {
  role: String!
  count: Int!
}

type AiChatbotRateLimitPolicy {
  action: String!
  max: Int!
  windowMs: Int!
}

type AiChatbotRiskSignal {
  code: String!
  level: String!
  count: Int!
}

type AiChatbotQualityQueueItem {
  id: ID!
  type: String!
  label: String!
  detail: String
  createdAt: DateTime
}

type AiChatbotAnalyticsResponse {
  totalConversations: Int!
  totalMessages: Int!
  openConversations: Int!
  handoffRequested: Int!
  resolvedHandoffs: Int!
  fallbackResponses: Int!
  lowConfidenceResponses: Int!
  totalKnowledgeItems: Int!
  pendingSuggestions: Int!
  notHelpfulFeedback: Int!
  activeSafetyRules: Int!
  evaluationCaseCount: Int!
  handoffConversionRate: Float!
  averageMessagesPerConversation: Float!
  averageHandoffResolutionMinutes: Float
  topIntents: [AiChatbotIntentMetric!]!
  messagesByRole: [AiChatbotRoleMetric!]!
  rateLimitStatus: [AiChatbotRateLimitPolicy!]!
  riskySignals: [AiChatbotRiskSignal!]!
  recentQualityQueue: [AiChatbotQualityQueueItem!]!
}

input AiChatbotAnalyticsInput {
  restaurantId: ID
  from: DateTime
  to: DateTime
  groupBy: String
}

type ResolveAiChatbotHandoffResponse {
  ok: Boolean!
  conversationId: ID
  chatThreadId: ID
  status: String
  alreadyClosed: Boolean!
  message: String!
}



type AiChatbotSettings {
  enabled: Boolean!
  welcomeMessage: String!
  starterQuickReplies: [String!]!
  handoffEnabled: Boolean!
  handoffUnavailableMessage: String!
  lowConfidenceHandoffThreshold: Float!
  fallbackMessage: String!
  updatedAt: DateTime
  updatedBy: ID
}

type PublicAiChatbotSettings {
  enabled: Boolean!
  welcomeMessage: String!
  starterQuickReplies: [String!]!
  handoffEnabled: Boolean!
  handoffUnavailableMessage: String!
}

input UpdateAiChatbotSettingsInput {
  restaurantId: ID!
  enabled: Boolean
  welcomeMessage: String
  starterQuickReplies: [String!]
  handoffEnabled: Boolean
  handoffUnavailableMessage: String
  lowConfidenceHandoffThreshold: Float
  fallbackMessage: String
}

extend type Query {
  aiChatbotGuestReplies(input: GetAiChatbotGuestRepliesInput!): AiChatbotGuestRepliesResponse!
  aiChatbotAnalytics(input: AiChatbotAnalyticsInput!): AiChatbotAnalyticsResponse!
  restaurantAiChatbotSettings(restaurantId: ID!): AiChatbotSettings!
  publicAiChatbotSettings(restaurantId: ID): PublicAiChatbotSettings!
  restaurantAiChatbotKnowledge(restaurantId: ID!, filter: AiChatbotKnowledgeFilterInput): [AiChatbotKnowledgeItem!]!
  restaurantAiChatbotKnowledgeItem(id: ID!): AiChatbotKnowledgeItem
  exportRestaurantAiChatbotKnowledge(restaurantId: ID!, format: String = "json"): String!
  restaurantAiChatbotKnowledgeSuggestions(restaurantId: ID!, filter: AiChatbotKnowledgeSuggestionFilterInput): [AiChatbotKnowledgeSuggestion!]!
  restaurantAiChatbotAnswerFeedback(restaurantId: ID!, filter: AiChatbotAnswerFeedbackFilterInput): [AiChatbotAnswerFeedback!]!
  restaurantAiChatbotSafetyRules(restaurantId: ID!, filter: AiChatbotSafetyRuleFilterInput): [AiChatbotSafetyRule!]!
}

extend type Mutation {
  askAiChatbot(input: AskAiChatbotInput!): AiChatbotResponse!
  requestAiChatbotHandoff(input: RequestAiChatbotHandoffInput!): AiChatbotHandoffResponse!
  sendAiChatbotGuestMessage(input: SendAiChatbotGuestMessageInput!): SendAiChatbotGuestMessageResponse!
  resolveAiChatbotHandoff(input: ResolveAiChatbotHandoffInput!): ResolveAiChatbotHandoffResponse!
  submitAiChatbotAnswerFeedback(input: SubmitAiChatbotAnswerFeedbackInput!): AiChatbotAnswerFeedback!
  markAiChatbotAnswerFeedbackReviewed(id: ID!): Boolean!
  ignoreAiChatbotAnswerFeedback(id: ID!): Boolean!
  convertAiChatbotFeedbackToSuggestion(id: ID!): Boolean!
  bulkMarkAiChatbotAnswerFeedbackReviewed(input: BulkAiChatbotIdsInput!): Boolean!
  bulkIgnoreAiChatbotAnswerFeedback(input: BulkAiChatbotIdsInput!): Boolean!
  bulkConvertAiChatbotFeedbackToSuggestion(input: BulkAiChatbotIdsInput!): Boolean!
  updateRestaurantAiChatbotSettings(input: UpdateAiChatbotSettingsInput!): AiChatbotSettings!
  createRestaurantAiChatbotKnowledgeItem(input: CreateAiChatbotKnowledgeItemInput!): AiChatbotKnowledgeItem!
  updateRestaurantAiChatbotKnowledgeItem(input: UpdateAiChatbotKnowledgeItemInput!): AiChatbotKnowledgeItem!
  deleteRestaurantAiChatbotKnowledgeItem(id: ID!): Boolean!
  bulkUpdateRestaurantAiChatbotKnowledgeEnabled(input: BulkAiChatbotIdsInput!, enabled: Boolean!): Boolean!
  bulkDeleteRestaurantAiChatbotKnowledge(input: BulkAiChatbotIdsInput!): Boolean!
  importRestaurantAiChatbotKnowledge(input: ImportAiChatbotKnowledgeInput!): ImportAiChatbotKnowledgeResult!
  rebuildRestaurantAiKnowledgeEmbeddings(restaurantId: ID!): AiKnowledgeEmbeddingRebuildResult!
  generateRestaurantAiChatbotKnowledgeSuggestions(input: GenerateAiChatbotKnowledgeSuggestionsInput!): GenerateAiChatbotKnowledgeSuggestionsResult!
  approveRestaurantAiChatbotKnowledgeSuggestion(id: ID!, input: ApproveAiChatbotKnowledgeSuggestionInput!): AiChatbotKnowledgeItem!
  dismissRestaurantAiChatbotKnowledgeSuggestion(id: ID!): Boolean!
  deleteRestaurantAiChatbotKnowledgeSuggestion(id: ID!): Boolean!
  bulkDismissRestaurantAiChatbotKnowledgeSuggestions(input: BulkAiChatbotIdsInput!): Boolean!
  bulkDeleteRestaurantAiChatbotKnowledgeSuggestions(input: BulkAiChatbotIdsInput!): Boolean!
  createRestaurantAiChatbotSafetyRule(input: CreateAiChatbotSafetyRuleInput!): AiChatbotSafetyRule!
  updateRestaurantAiChatbotSafetyRule(input: UpdateAiChatbotSafetyRuleInput!): AiChatbotSafetyRule!
  deleteRestaurantAiChatbotSafetyRule(id: ID!): Boolean!
  bulkUpdateRestaurantAiChatbotSafetyRuleEnabled(input: BulkAiChatbotIdsInput!, enabled: Boolean!): Boolean!
  bulkDeleteRestaurantAiChatbotSafetyRules(input: BulkAiChatbotIdsInput!): Boolean!
}

type AiChatbotEvaluationSafetyResult { blocked: Boolean! outOfScope: Boolean! disclaimers: [String!]! handoffSuggested: Boolean! matchedRuleIds: [ID!]! }
type AiChatbotKnowledgeMatch { id: ID title: String category: String sourceType: String score: Float }
type AiChatbotEvaluationDebugInfo { evaluationMode: Boolean historyUsed: [String!] }
type AiChatbotEvaluationResult {
  caseId: ID
  question: String
  expectedBehavior: String
  category: String
  tags: [String!]
  answer: String!
  intent: String
  confidence: Float
  isFallback: Boolean
  handoffSuggested: Boolean
  handoffReason: String
  handoffMessage: String
  quickReplies: [String!]!
  actions: [AiChatbotAction!]!
  contextSummary: AiChatbotContextSummary
  knowledgeMatches: [AiChatbotKnowledgeMatch!]!
  safetyResult: AiChatbotEvaluationSafetyResult
  sources: [AiChatbotSource!]!
  debug: AiChatbotEvaluationDebugInfo
}

type AiChatbotEvaluationCase {
  id: ID!
  restaurantId: ID!
  question: String!
  expectedBehavior: String
  category: String
  tags: [String!]!
  enabled: Boolean!
  createdBy: ID
  updatedBy: ID
  createdAt: DateTime
  updatedAt: DateTime
}

input EvaluateAiChatbotPromptInput { restaurantId: ID! message: String! history: [AiChatbotHistoryInput!] includeDebug: Boolean }
input RunAiChatbotEvaluationSetInput { restaurantId: ID! caseIds: [ID!] includeDebug: Boolean }
input CreateAiChatbotEvaluationCaseInput { restaurantId: ID! question: String! expectedBehavior: String category: String tags: [String!] enabled: Boolean }
input UpdateAiChatbotEvaluationCaseInput { id: ID! question: String expectedBehavior: String category: String tags: [String!] enabled: Boolean }

extend type Query {
  evaluateRestaurantAiChatbotPrompt(input: EvaluateAiChatbotPromptInput!): AiChatbotEvaluationResult!
  runRestaurantAiChatbotEvaluationSet(input: RunAiChatbotEvaluationSetInput!): [AiChatbotEvaluationResult!]!
  restaurantAiChatbotEvaluationCases(restaurantId: ID!): [AiChatbotEvaluationCase!]!
}

extend type Mutation {
  createRestaurantAiChatbotEvaluationCase(input: CreateAiChatbotEvaluationCaseInput!): AiChatbotEvaluationCase!
  updateRestaurantAiChatbotEvaluationCase(input: UpdateAiChatbotEvaluationCaseInput!): AiChatbotEvaluationCase!
  deleteRestaurantAiChatbotEvaluationCase(id: ID!): Boolean!
}
