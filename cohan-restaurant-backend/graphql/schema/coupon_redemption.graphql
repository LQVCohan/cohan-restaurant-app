type CouponRedemption {
  id: ID!
  couponId: ID!
  userId: ID
  restaurantId: ID!
  orderIds: [ID!]!
  invoiceId: ID
  couponCode: String!
  discountAmount: Float!
  subtotal: Float!
  grandTotal: Float!
  source: String!
  redeemedAt: DateTime
  metadata: JSON
  coupon: Coupon
}
type CouponAnalyticsTopCoupon {
  couponId: ID!
  couponCode: String
  couponName: String
  usageCount: Int!
  totalDiscount: Float!
}

type CouponAnalytics {
  totalCoupons: Int!
  activeCoupons: Int!
  savedCoupons: Int!
  usedCoupons: Int!
  totalRedemptions: Int!
  totalDiscountAmount: Float!
  usageRate: Float!
  expiringSoon: Int!
  nearUsageLimit: Int!
  topCoupons: [CouponAnalyticsTopCoupon!]!
}
extend type Query {
  couponAnalyticsByRestaurant(restaurantId: ID!): CouponAnalytics!
  myCouponRedemptions(restaurantId: ID, couponId: ID): [CouponRedemption!]!
  couponRedemptionsByRestaurant(
    restaurantId: ID!
    couponId: ID
    limit: Int = 50
    offset: Int = 0
  ): [CouponRedemption!]!
}
