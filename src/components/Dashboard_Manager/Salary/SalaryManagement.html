<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Employee Salary Management System</title>
        <script src="/_sdk/data_sdk.js"></script>
        <script src="/_sdk/element_sdk.js"></script>
        <style>
        body {
            box-sizing: border-box;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #059669;
            --primary-hover: #047857;
            --primary-light: #ecfdf5;
            --secondary-color: #f8fafc;
            --success-color: #16a34a;
            --warning-color: #f59e0b;
            --danger-color: #dc2626;
            --info-color: #3b82f6;
            --background-color: #f1f5f9;
            --card-background: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-radius: 1rem;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            height: 100%;
            padding: 1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px;
            height: 100%;
        }

        /* Header */
        .header {
            background: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            margin-bottom: 1rem;
            overflow: hidden;
            transition: var(--transition);
        }

        .header:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .header-content {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: white;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 2rem;
        }

        .header-left {
            min-width: 0;
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .header-left p {
            opacity: 0.9;
            font-size: 1rem;
            line-height: 1.4;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            min-width: 400px;
        }

        .stat-item {
            text-align: center;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 1.75rem;
            font-weight: 800;
            display: block;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Navigation */
        .nav-tabs {
            background: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            margin-bottom: 1rem;
            padding: 0 1rem;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            transition: var(--transition);
        }

        .nav-tabs:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .nav-list {
            display: flex;
            gap: 0;
            min-width: max-content;
        }

        .nav-tab {
            background: none;
            border: none;
            padding: 16px 20px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            position: relative;
        }

        .nav-tab:hover {
            color: var(--primary-color);
            background: var(--primary-light);
        }

        .nav-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background: var(--primary-light);
        }

        .nav-tab .badge {
            background: var(--danger-color);
            color: white;
            font-size: 0.625rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            padding: 24px 0;
            min-height: calc(100vh - 200px);
        }

        .content-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            background: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            height: fit-content;
            position: sticky;
            top: 1rem;
            transition: var(--transition);
        }

        .sidebar:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .sidebar h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .filter-select, .filter-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            background: var(--card-background);
            transition: var(--transition);
        }

        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        /* Content Area */
        .content-area {
            background: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: var(--transition);
        }

        .content-area:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .content-header {
            padding: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .content-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .content-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            width: 250px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        /* Employee Cards */
        .employees-list {
            padding: 0;
        }

        .employee-card {
            border-bottom: 2px solid var(--border-color);
            padding: 1.5rem;
            transition: var(--transition);
        }

        .employee-card:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        .employee-card:last-child {
            border-bottom: none;
        }

        .employee-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .employee-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .employee-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.125rem;
        }

        .employee-details h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .employee-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .employee-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 8px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            font-size: 0.875rem;
        }

        .action-btn:hover {
            background: rgba(5, 150, 105, 0.1);
            color: var(--primary-color);
        }

        .employee-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .info-group {
            background: var(--secondary-color);
            padding: 12px;
            border-radius: 8px;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .salary-info {
            background: linear-gradient(135deg, var(--success-color), #16a34a);
            color: white;
        }

        .salary-info .info-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .salary-info .info-value {
            color: white;
            font-size: 1rem;
        }

        .employee-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(22, 163, 74, 0.1);
            color: var(--success-color);
        }

        .status-inactive {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger-color);
        }

        .status-probation {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        /* Salary Table */
        .salary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .salary-table th,
        .salary-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .salary-table th {
            background: var(--secondary-color);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .salary-table td {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .salary-table tr:hover {
            background: var(--primary-light);
        }

        .amount {
            font-weight: 600;
            color: var(--text-primary);
        }

        .amount.positive {
            color: var(--success-color);
        }

        .amount.negative {
            color: var(--danger-color);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-description {
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal {
            background: var(--card-background);
            border-radius: var(--border-radius);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger-color);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            background: var(--card-background);
            transition: var(--transition);
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .sidebar {
                position: static;
                order: 2;
            }

            .header-stats {
                grid-template-columns: repeat(2, 1fr);
                min-width: auto;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 12px;
            }

            .header-content {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 1.5rem;
            }

            .header-left h1 {
                font-size: 1.5rem;
            }

            .header-left p {
                font-size: 0.875rem;
            }

            .header-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .stat-item {
                padding: 0.5rem;
            }

            .stat-number {
                font-size: 1.25rem;
            }

            .stat-label {
                font-size: 0.7rem;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .search-input {
                width: 100%;
            }

            .employee-card {
                padding: 16px;
            }

            .employee-content {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .nav-tab {
                padding: 12px 16px;
                font-size: 0.8125rem;
            }

            .employee-avatar {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .header-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>

            type="text/javascript"></script>
    </head>

                                <option value>Tất cả chức vụ</option> <option

                                    value="supervisor">Giám sát</option> <option
                                    value="chef">Đầu bếp</option> <option
                                    value="cook">Phụ bếp</option> <option
                                    value="waiter">Phục vụ</option> <option
                                    value="cashier">Thu ngân</option> <option
                                    value="accountant">Kế toán</option> <option
                                    value="security">Bảo vệ</option> </select>
                        </div>
                        <div class="filter-group"><label
                                class="filter-label">Trạng thái</label> <select
                                class="filter-select" id="status-filter">
                                <option value>Tất cả trạng thái</option> <option

                                <option value="probation">Thử việc</option>

                        <div class="filter-group"><label class="filter-label">🏪

                                    value="district3">🏪 Quận 3</option> <option

                                    value="danang">🏪 Đà Nẵng</option> </select>
                        </div>
                        <div class="filter-group"><label
                                class="filter-label">Mức lương</label> <select

                                <option value>Tất cả mức lương</option> <option
                                    value="0-5">Dưới 5 triệu</option> <option
                                    value="5-10">5-10 triệu</option> <option

                        mapToCapabilities: (config) => ({
                            recolorables: [],
                            borderables: [],
                            fontEditable: undefined,
                            fontSizeable: undefined
                        }),
                        mapToEditPanelValues: (config) => new Map([
                            ['company_name', config.company_name || defaultConfig.company_name],
                            ['system_title', config.system_title || defaultConfig.system_title],

                    });

                console.error('Initialization error:', error);

                applyFilters();
                updateStats();

            }

        // Utility functions
        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(amount);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('vi-VN');
        }

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function getPositionName(position) {
            const positions = {
                manager: 'Quản lý',
                supervisor: 'Giám sát',
                chef: 'Đầu bếp',
                cook: 'Phụ bếp',
                waiter: 'Phục vụ',
                cashier: 'Thu ngân',
                accountant: 'Kế toán',
                security: 'Bảo vệ'
            };
            return positions[position] || position;
        }

        function getDepartmentName(department) {
            const departments = {
                kitchen: 'Bếp',
                service: 'Phục vụ',
                management: 'Quản lý',
                accounting: 'Kế toán',
                security: 'Bảo vệ'
            };
            return departments[department] || department;
        }

        function getBranchName(branch) {
            const branches = {
                main: 'Chi nhánh chính',
                district1: 'Quận 1',
                district3: 'Quận 3',
                hanoi: 'Hà Nội',
                danang: 'Đà Nẵng'
            };
            return branches[branch] || branch;
        }

        // Filter and search functions
        function applyFilters() {
            let filtered = [...currentEmployees];

            // Department filter
            const departmentFilter = document.getElementById('department-filter')?.value;
            if (departmentFilter) {
                filtered = filtered.filter(emp => emp.department === departmentFilter);
            }

            // Position filter
            const positionFilter = document.getElementById('position-filter')?.value;
            if (positionFilter) {
                filtered = filtered.filter(emp => emp.position === positionFilter);
            }

            // Status filter
            const statusFilter = document.getElementById('status-filter')?.value;
            if (statusFilter) {
                filtered = filtered.filter(emp => emp.status === statusFilter);
            }

            // Restaurant filter
            const restaurantFilter = document.getElementById('restaurant-filter')?.value;
            if (restaurantFilter) {
                filtered = filtered.filter(emp => emp.restaurant_branch === restaurantFilter);
            }

            // Salary range filter
            const salaryRangeFilter = document.getElementById('salary-range-filter')?.value;
            if (salaryRangeFilter) {
                const [min, max] = salaryRangeFilter.split('-').map(v => v === '+' ? Infinity : parseInt(v) * 1000000);
                filtered = filtered.filter(emp => {
                    const salary = emp.total_salary || emp.base_salary;
                    return salary >= min && (max === undefined || salary < max);
                });
            }

            // Month filter
            const monthFilter = document.getElementById('month-filter')?.value;
            if (monthFilter) {
                filtered = filtered.filter(emp => emp.salary_month === monthFilter);
            }

            // Search filter
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(emp => 
                    emp.full_name.toLowerCase().includes(searchTerm) ||
                    emp.employee_id.toLowerCase().includes(searchTerm) ||
                    emp.email.toLowerCase().includes(searchTerm) ||
                    emp.phone.includes(searchTerm)
                );
            }

            filteredEmployees = filtered;
        }

        function updateStats() {
            const totalEmployees = currentEmployees.length;
            const activeEmployees = currentEmployees.filter(emp => emp.status === 'active').length;
            const totalSalary = currentEmployees.reduce((sum, emp) => sum + (emp.total_salary || emp.base_salary), 0);
            const avgSalary = totalEmployees > 0 ? totalSalary / totalEmployees : 0;

            document.getElementById('total-employees').textContent = totalEmployees;
            document.getElementById('active-employees').textContent = activeEmployees;
            document.getElementById('total-salary').textContent = formatCurrency(totalSalary).replace('₫', '₫');
            document.getElementById('avg-salary').textContent = formatCurrency(avgSalary).replace('₫', '₫');
        }

            const container = document.getElementById('content-container');
            
            if (isLoading) {

                return;

            switch (currentTab) {
                case 'employees':
                    renderEmployees();
                    break;
                case 'salary':
                    renderSalaryTable();
                    break;
                case 'attendance':

                    break;
                case 'bonus':

        async function addEmployee(employeeData) {
            if (!window.dataSdk) {
                showNotification('Không thể thêm nhân viên: SDK không khả dụng', 'error');
                return;
            }

            isLoading = true;
            renderContent();

            try {
                // Calculate total salary
                const baseSalary = employeeData.base_salary || 0;
                const overtimePay = (employeeData.overtime_hours || 0) * (employeeData.hourly_rate || 0);
                const bonus = employeeData.bonus || 0;
                const allowance = employeeData.allowance || 0;
                const deduction = employeeData.deduction || 0;
                const totalSalary = baseSalary + overtimePay + bonus + allowance - deduction;

                const result = await window.dataSdk.create({
                    ...employeeData,
                    id: `emp_${Date.now()}`,
                    employee_id: `FH${String(currentEmployees.length + 1).padStart(3, '0')}`,
                    total_salary: totalSalary,
                    salary_month: new Date().toISOString().slice(0, 7),
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });

                if (result.isOk) {
                    showNotification('Nhân viên đã được thêm thành công!', 'success');
                } else {
                    showNotification('Có lỗi xảy ra khi thêm nhân viên', 'error');
                }
            } catch (error) {
                console.error('Error adding employee:', error);
                showNotification('Có lỗi xảy ra khi thêm nhân viên', 'error');
            } finally {
                isLoading = false;
            }
        }

        async function updateEmployee(employeeData) {
            if (!window.dataSdk) {
                showNotification('Không thể cập nhật nhân viên: SDK không khả dụng', 'error');
                return;
            }

            isLoading = true;
            renderContent();

            try {
                // Calculate total salary
                const baseSalary = employeeData.base_salary || 0;
                const overtimePay = (employeeData.overtime_hours || 0) * (employeeData.hourly_rate || 0);
                const bonus = employeeData.bonus || 0;
                const allowance = employeeData.allowance || 0;
                const deduction = employeeData.deduction || 0;
                const totalSalary = baseSalary + overtimePay + bonus + allowance - deduction;

                const result = await window.dataSdk.update({
                    ...employeeData,
                    total_salary: totalSalary,
                    updated_at: new Date().toISOString()
                });

                if (result.isOk) {
                    showNotification('Thông tin nhân viên đã được cập nhật!', 'success');
                } else {

            if (!window.dataSdk) {
                showNotification('Không thể xóa nhân viên: SDK không khả dụng', 'error');
                return;
            }

            const employee = currentEmployees.find(emp => emp.id === employeeId);
            if (!employee) return;

            // Show inline confirmation
            const employeeCard = document.querySelector(`[data-employee-id="${employeeId}"]`);
            const originalContent = employeeCard.innerHTML;
            
            employeeCard.innerHTML = `

        async function confirmDeleteEmployee(employeeId) {
            const employee = currentEmployees.find(emp => emp.id === employeeId);
            if (!employee) return;

            isLoading = true;
            renderContent();

            try {
                const result = await window.dataSdk.delete(employee);

                    showNotification('Nhân viên đã được xóa thành công!', 'success');
                } else {
                    showNotification('Có lỗi xảy ra khi xóa nhân viên', 'error');

            } catch (error) {
                console.error('Error deleting employee:', error);

                isLoading = false;

                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Phụ cấp (VNĐ)</label>
                                <input type="number" id="allowance" class="form-input" value="0" min="0">
                            </div>
                        </div>
                        
                        <div style="background: var(--primary-light); padding: 16px; border-radius: 8px; margin-top: 16px;">
                            <p style="color: var(--text-secondary); font-size: 0.875rem; margin: 0;">
                                💡 <strong>Lưu ý:</strong> Các thông tin về giờ làm việc, chấm công, thưởng phạt sẽ được cập nhật sau khi thêm nhân viên thành công.
                            </p>
                        </div>

                `;
            }

            document.querySelector('.modal-title').textContent = isEdit ? `Chỉnh sửa nhân viên - ${employee.full_name}` : 'Thêm nhân viên mới';
            document.querySelector('.modal-footer').innerHTML = `
                <button class="btn btn-secondary" onclick="closeModal()">Hủy bỏ</button>
                <button class="btn btn-primary" onclick="saveEmployee()">Lưu thông tin</button>
            `;
            document.getElementById('employee-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('employee-modal').style.display = 'none';
            editingEmployee = null;
        }

        function saveEmployee() {
            const form = document.getElementById('employee-form');
            if (!form) return;

            const employeeData = {
                full_name: document.getElementById('full-name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                position: document.getElementById('position').value,
                department: document.getElementById('department').value,
                restaurant_branch: document.getElementById('restaurant-branch').value,
                hire_date: document.getElementById('hire-date').value,
                base_salary: parseInt(document.getElementById('base-salary').value) || 0,
                address: document.getElementById('address').value,
                bank_account: document.getElementById('bank-account').value,
                tax_id: document.getElementById('tax-id').value,
                allowance: parseInt(document.getElementById('allowance').value) || 0
            };

            // Validate required fields for new employee
            if (!editingEmployee) {
                if (!employeeData.full_name || !employeeData.email || !employeeData.phone || 
                    !employeeData.position || !employeeData.department || !employeeData.restaurant_branch || 
                    !employeeData.hire_date || !employeeData.base_salary) {
                    showNotification('Vui lòng điền đầy đủ thông tin bắt buộc', 'error');
                    return;
                }

                // Set default values for new employee
                employeeData.status = 'active';
                employeeData.hourly_rate = Math.round(employeeData.base_salary / 176); // Tính lương giờ từ lương cơ bản
                employeeData.work_hours = 176;
                employeeData.overtime_hours = 0;
                employeeData.bonus = 0;
                employeeData.deduction = 0;
                employeeData.attendance_days = 22;
                employeeData.leave_days = 0;
                employeeData.late_count = 0;
            } else {
                // For editing, get all fields including advanced ones
                employeeData.status = document.getElementById('status').value;
                employeeData.hourly_rate = parseInt(document.getElementById('hourly-rate').value) || 0;
                employeeData.work_hours = parseInt(document.getElementById('work-hours').value) || 176;
                employeeData.overtime_hours = parseInt(document.getElementById('overtime-hours').value) || 0;
                employeeData.bonus = parseInt(document.getElementById('bonus').value) || 0;
                employeeData.deduction = parseInt(document.getElementById('deduction').value) || 0;
                employeeData.attendance_days = parseInt(document.getElementById('attendance-days').value) || 22;
                employeeData.leave_days = parseInt(document.getElementById('leave-days').value) || 0;
                employeeData.late_count = parseInt(document.getElementById('late-count').value) || 0;

                // Validate required fields for editing
                if (!employeeData.full_name || !employeeData.email || !employeeData.phone || 
                    !employeeData.position || !employeeData.department || !employeeData.restaurant_branch || 
                    !employeeData.hire_date || !employeeData.status || !employeeData.base_salary) {
                    showNotification('Vui lòng điền đầy đủ thông tin bắt buộc', 'error');
                    return;
                }
            }

            if (editingEmployee) {
                updateEmployee({
                    ...editingEmployee,
                    ...employeeData
                });
            } else {
                addEmployee(employeeData);
            }
            
            closeModal();
        }

        function calculateSalary() {
            showNotification('Đang tính toán lương cho tất cả nhân viên...', 'info');
            
            // Simulate salary calculation
            setTimeout(() => {
                showNotification('Đã tính toán lương thành công cho tất cả nhân viên!', 'success');
                updateStats();
                renderContent();
            }, 2000);
        }

        function exportData() {
            const csvContent = [
                ['Mã NV', 'Họ tên', 'Chức vụ', 'Phòng ban', 'Chi nhánh', 'Lương CB', 'Thưởng', 'Phụ cấp', 'Khấu trừ', 'Tổng lương'].join(','),
                ...filteredEmployees.map(emp => [
                    emp.employee_id,
                    `"${emp.full_name}"`,
                    getPositionName(emp.position),
                    getDepartmentName(emp.department),
                    getBranchName(emp.restaurant_branch),
                    emp.base_salary,
                    emp.bonus || 0,
                    emp.allowance || 0,
                    emp.deduction || 0,
                    emp.total_salary || emp.base_salary
                ].join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `salary_report_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();

            showNotification('Báo cáo đã được xuất thành công!', 'success');
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 1001;
                animation: slideIn 0.3s ease-out;
                background: ${type === 'success' ? '#16a34a' : type === 'error' ? '#dc2626' : '#3b82f6'};
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 3000);
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Tab navigation
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    switchTab(tab.dataset.tab);
                });
            });

            // Search input
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                let searchTimeout;
                searchInput.addEventListener('input', () => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        applyFilters();
                        renderContent();
                    }, 300);
                });
            }

            // Filter changes
            document.querySelectorAll('.filter-select').forEach(filter => {
                filter.addEventListener('change', () => {
                    applyFilters();
                    renderContent();
                });
            });

            // Initialize app
            initializeApp();
        });

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
