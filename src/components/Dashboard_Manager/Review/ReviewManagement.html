<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Restaurant Review Management System</title>
        <script src="/_sdk/data_sdk.js"></script>
        <script src="/_sdk/element_sdk.js"></script>
        <style>
        body {
            box-sizing: border-box;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --primary-light: #f0f9ff;
            --secondary-color: #f8fafc;
            --success-color: #16a34a;
            --warning-color: #f59e0b;
            --danger-color: #dc2626;
            --background-color: #f1f5f9;
            --card-background: #ffffff;
            --text-primary: #0c4a6e;
            --text-secondary: #6b7280;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-radius: 1rem;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            height: 100%;
            padding: 1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px;
            height: 100%;
        }

        /* Header */
        .header {
            background: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            margin-bottom: 1rem;
            overflow: hidden;
            transition: var(--transition);
        }

        .header:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .header-content {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: white;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 2rem;
        }

        .header-left {
            min-width: 0;
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .header-left p {
            opacity: 0.9;
            font-size: 1rem;
            line-height: 1.4;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            min-width: 300px;
        }

        .stat-item {
            text-align: center;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 1.75rem;
            font-weight: 800;
            display: block;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Navigation */
        .nav-tabs {
            background: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            margin-bottom: 1rem;
            padding: 0 1rem;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            transition: var(--transition);
        }

        .nav-tabs:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .nav-list {
            display: flex;
            gap: 0;
            min-width: max-content;
        }

        .nav-tab {
            background: none;
            border: none;
            padding: 16px 20px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            position: relative;
        }

        .nav-tab:hover {
            color: var(--primary-color);
            background: var(--primary-light);
        }

        .nav-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background: var(--primary-light);
        }

        .nav-tab .badge {
            background: var(--danger-color);
            color: white;
            font-size: 0.625rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            padding: 24px 0;
            min-height: calc(100vh - 200px);
        }

        .content-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            background: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            height: fit-content;
            position: sticky;
            top: 1rem;
            transition: var(--transition);
        }

        .sidebar:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .sidebar h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .filter-select, .filter-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            background: var(--card-background);
            transition: var(--transition);
        }

        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .rating-filter {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rating-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .rating-option:hover {
            background: rgba(59, 130, 246, 0.05);
        }

        .rating-option input[type="checkbox"] {
            margin: 0;
        }

        .stars {
            display: flex;
            gap: 2px;
        }

        .star {
            color: #fbbf24;
            font-size: 0.875rem;
        }

        /* Content Area */
        .content-area {
            background: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: var(--transition);
        }

        .content-area:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .content-header {
            padding: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .content-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .content-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            width: 250px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* Review Cards */
        .reviews-list {
            padding: 0;
        }

        .review-card {
            border-bottom: 2px solid var(--border-color);
            padding: 1.5rem;
            transition: var(--transition);
        }

        .review-card:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        .review-card:last-child {
            border-bottom: none;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .reviewer-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .reviewer-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.125rem;
        }

        .reviewer-details h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .reviewer-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .verified-badge {
            background: var(--success-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.625rem;
            font-weight: 600;
        }

        .review-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 8px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            font-size: 0.875rem;
        }

        .action-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary-color);
        }

        .review-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .rating-stars {
            display: flex;
            gap: 2px;
        }

        .rating-number {
            font-weight: 600;
            color: var(--text-primary);
        }

        .review-target {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .review-restaurant {
            background: rgba(16, 163, 74, 0.1);
            color: var(--success-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-left: 8px;
        }

        .review-content {
            margin-bottom: 16px;
        }

        .review-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .review-text {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .review-images {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .review-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            transition: var(--transition);
        }

        .review-image:hover {
            transform: scale(1.05);
        }

        .review-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .review-tag {
            background: var(--secondary-color);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .review-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .review-stats {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .review-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-published {
            background: rgba(22, 163, 74, 0.1);
            color: var(--success-color);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .status-hidden {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger-color);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-description {
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal {
            background: var(--card-background);
            border-radius: var(--border-radius);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger-color);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .sidebar {
                position: static;
                order: 2;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 12px;
            }

            .header-content {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 1.5rem;
            }

            .header-left h1 {
                font-size: 1.5rem;
            }

            .header-left p {
                font-size: 0.875rem;
            }

            .header-stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
                min-width: auto;
            }

            .stat-item {
                padding: 0.5rem;
            }

            .stat-number {
                font-size: 1.25rem;
            }

            .stat-label {
                font-size: 0.7rem;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .search-input {
                width: 100%;
            }

            .review-card {
                padding: 16px;
            }

            .reviewer-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .review-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .nav-tab {
                padding: 12px 16px;
                font-size: 0.8125rem;
            }

            .reviewer-avatar {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .review-images {
                gap: 6px;
            }

            .review-image {
                width: 60px;
                height: 60px;
            }
        }
    </style>
        <style>@view-transition { navigation: auto; }</style>
        <script src="https://cdn.tailwindcss.com"
            type="text/javascript"></script>
    </head>
    <body>

            <main class="main-content">
                <div class="content-grid"><!-- Sidebar -->
                    <aside class="sidebar">

                                    </div><span>(4 sao)</span> </label> <label

                                    <div class="stars"><span

                                    </div><span>(3 sao)</span> </label> <label

                                        type="checkbox" value="2" checked>
                                    <div class="stars"><span
                                            class="star">★★☆☆☆</span>
                                    </div><span>(2 sao)</span> </label> <label
                                    class="rating-option"> <input
                                        type="checkbox" value="1" checked>
                                    <div class="stars"><span
                                            class="star">★☆☆☆☆</span>
                                    </div><span>(1 sao)</span> </label>
                            </div>
                        </div>
                        <div class="filter-group"><label
                                class="filter-label">Trạng thái</label> <select
                                class="filter-select" id="status-filter">
                                <option value>Tất cả trạng thái</option> <option
                                    value="published">Đã xuất bản</option>
                                <option value="pending">Chờ duyệt</option>
                                <option value="hidden">Đã ẩn</option> </select>
                        </div>
                        <div class="filter-group"><label
                                class="filter-label">Thời gian</label> <select
                                class="filter-select" id="time-filter"> <option
                                    value>Tất cả thời gian</option> <option
                                    value="today">Hôm nay</option> <option
                                    value="week">Tuần này</option> <option
                                    value="month">Tháng này</option> <option
                                    value="quarter">Quý này</option> </select>
                        </div>
                        <div class="filter-group"><label class="filter-label">Có

                                <option value="with-images">Có hình ảnh</option>

                        </div>
                        <div class="filter-group"><label
                                class="filter-label">Nhà hàng</label> <select
                                class="filter-select" id="restaurant-filter">

        // Utility functions
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) return 'Hôm qua';
            if (diffDays < 7) return `${diffDays} ngày trước`;
            if (diffDays < 30) return `${Math.ceil(diffDays / 7)} tuần trước`;
            return date.toLocaleDateString('vi-VN');
        }

        function getStarRating(rating) {
            const fullStars = '★'.repeat(rating);
            const emptyStars = '☆'.repeat(5 - rating);
            return fullStars + emptyStars;
        }

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function parseImages(imagesString) {
            try {
                return imagesString ? JSON.parse(imagesString) : [];
            } catch {
                return [];
            }
        }

        function parseTags(tagsString) {
            try {
                return tagsString ? JSON.parse(tagsString) : [];
            } catch {
                return [];
            }
        }

        // Filter and search functions
        function applyFilters() {
            let filtered = [...currentReviews];

            // Tab filter
            if (currentTab !== 'all') {
                if (currentTab === 'pending') {
                    filtered = filtered.filter(review => review.status === 'pending');
                } else if (currentTab === 'reported') {
                    filtered = filtered.filter(review => review.status === 'reported');
                } else {
                    filtered = filtered.filter(review => review.type === currentTab);
                }
            }

            // Rating filter
            const ratingCheckboxes = document.querySelectorAll('.rating-filter input[type="checkbox"]:checked');
            const selectedRatings = Array.from(ratingCheckboxes).map(cb => parseInt(cb.value));
            if (selectedRatings.length > 0 && selectedRatings.length < 5) {
                filtered = filtered.filter(review => selectedRatings.includes(review.rating));
            }

            // Status filter
            const statusFilter = document.getElementById('status-filter')?.value;
            if (statusFilter) {
                filtered = filtered.filter(review => review.status === statusFilter);
            }

            // Time filter
            const timeFilter = document.getElementById('time-filter')?.value;
            if (timeFilter) {
                const now = new Date();
                const filterDate = new Date();
                
                switch (timeFilter) {
                    case 'today':
                        filterDate.setHours(0, 0, 0, 0);
                        break;
                    case 'week':
                        filterDate.setDate(now.getDate() - 7);
                        break;
                    case 'month':
                        filterDate.setMonth(now.getMonth() - 1);
                        break;
                    case 'quarter':
                        filterDate.setMonth(now.getMonth() - 3);
                        break;
                }
                
                filtered = filtered.filter(review => new Date(review.created_at) >= filterDate);
            }

            // Image filter
            const imageFilter = document.getElementById('image-filter')?.value;
            if (imageFilter) {
                if (imageFilter === 'with-images') {
                    filtered = filtered.filter(review => parseImages(review.images).length > 0);
                } else if (imageFilter === 'no-images') {
                    filtered = filtered.filter(review => parseImages(review.images).length === 0);
                }
            }

            // Restaurant filter
            const restaurantFilter = document.getElementById('restaurant-filter')?.value;
            if (restaurantFilter) {
                filtered = filtered.filter(review => review.restaurant_id === restaurantFilter);
            }

            // Verified filter
            const verifiedFilter = document.getElementById('verified-filter')?.value;
            if (verifiedFilter) {
                const isVerified = verifiedFilter === 'verified';
                filtered = filtered.filter(review => review.verified_purchase === isVerified);
            }

            // Search filter
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(review => 
                    review.customer_name.toLowerCase().includes(searchTerm) ||
                    review.title.toLowerCase().includes(searchTerm) ||
                    review.content.toLowerCase().includes(searchTerm) ||
                    review.target_name.toLowerCase().includes(searchTerm)
                );
            }

            filteredReviews = filtered;
        }

        function updateStats() {
            const totalReviews = currentReviews.length;
            const avgRating = totalReviews > 0 
                ? (currentReviews.reduce((sum, review) => sum + review.rating, 0) / totalReviews).toFixed(1)
                : '0.0';
            const pendingReviews = currentReviews.filter(review => review.status === 'pending').length;

            document.getElementById('total-reviews').textContent = totalReviews;
            document.getElementById('avg-rating').textContent = avgRating;
            document.getElementById('pending-reviews').textContent = pendingReviews;
            document.getElementById('pending-badge').textContent = pendingReviews;
        }

        function renderReviews() {

            `).join('');
        }

        // Handle image upload preview
        function handleImageUpload() {
            const input = document.getElementById('review-images');
            const preview = document.getElementById('image-preview');
            
            if (input && input.files) {
                preview.innerHTML = '';
                Array.from(input.files).forEach((file, index) => {
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const img = document.createElement('img');
                            img.src = e.target.result;
                            img.style.cssText = `
                                width: 60px;
                                height: 60px;
                                object-fit: cover;
                                border-radius: 8px;
                                border: 2px solid var(--border-color);
                                cursor: pointer;
                            `;
                            img.onclick = () => removeImage(index);
                            img.title = 'Click để xóa ảnh';
                            preview.appendChild(img);
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        }

        function removeImage(index) {
            const input = document.getElementById('review-images');
            const dt = new DataTransfer();
            
            Array.from(input.files).forEach((file, i) => {
                if (i !== index) dt.items.add(file);
            });
            
            input.files = dt.files;
            handleImageUpload();
        }

        function updateTargetOptions() {
            const typeSelect = document.getElementById('review-type');
            const targetDiv = document.getElementById('target-selection');
            const targetSelect = document.getElementById('review-target');
            
            if (typeSelect.value) {
                targetDiv.style.display = 'block';
                targetSelect.innerHTML = '<option value="">Chọn mục cụ thể</option>';
                
                const options = targetOptions[typeSelect.value] || [];
                options.forEach(option => {
                    const optionElement = document.createElement('option');
                    optionElement.value = option.id;
                    optionElement.textContent = option.name;
                    targetSelect.appendChild(optionElement);
                });
            } else {
                targetDiv.style.display = 'none';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update active tab
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            // Update content title
            const titles = {
                all: 'Tất cả đánh giá',
                restaurant: 'Đánh giá nhà hàng',
                food: 'Đánh giá món ăn',
                service: 'Đánh giá dịch vụ',
                pending: 'Đánh giá chờ duyệt',
                reported: 'Đánh giá bị báo cáo'
            };
            document.getElementById('content-title').textContent = titles[tab];
            
            applyFilters();
            renderReviews();
        }

        async function addReview(reviewData) {
            if (!window.dataSdk) {
                showNotification('Không thể thêm đánh giá: SDK không khả dụng', 'error');
                return;
            }

            isLoading = true;
            renderReviews();

            try {
                const result = await window.dataSdk.create({
                    ...reviewData,
                    id: `review_${Date.now()}`,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    likes: 0,
                    replies: 0,
                    helpful_count: 0
                });

                if (result.isOk) {
                    showNotification('Đánh giá đã được thêm thành công!', 'success');
                } else {
                    showNotification('Có lỗi xảy ra khi thêm đánh giá', 'error');
                }
            } catch (error) {
                console.error('Error adding review:', error);
                showNotification('Có lỗi xảy ra khi thêm đánh giá', 'error');
            } finally {
                isLoading = false;

        async function deleteReview(reviewId) {
            if (!window.dataSdk) {
                showNotification('Không thể xóa đánh giá: SDK không khả dụng', 'error');
                return;
            }

            const review = currentReviews.find(r => r.id === reviewId);
            if (!review) return;

            // Show inline confirmation
            const reviewCard = document.querySelector(`[data-review-id="${reviewId}"]`);
            const originalContent = reviewCard.innerHTML;
            
            reviewCard.innerHTML = `
                <div style="padding: 20px; text-align: center; background: #fef2f2; border: 2px solid #fecaca; border-radius: 8px;">

                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <button class="btn btn-secondary" onclick="cancelDelete('${reviewId}', \`${originalContent.replace(/`/g, '\\`')}\`)">

                        <button class="btn" style="background: #dc2626; color: white;" onclick="confirmDelete('${reviewId}')">
                            Xóa đánh giá
                        </button>
                    </div>
                </div>

        }

        function cancelDelete(reviewId, originalContent) {
            const reviewCard = document.querySelector(`[data-review-id="${reviewId}"]`);
            reviewCard.innerHTML = originalContent;
        }

        async function confirmDelete(reviewId) {
            const review = currentReviews.find(r => r.id === reviewId);
            if (!review) return;

            isLoading = true;
            renderReviews();

            try {
                const result = await window.dataSdk.delete(review);
                if (result.isOk) {
                    showNotification('Đánh giá đã được xóa thành công!', 'success');
                } else {
                    showNotification('Có lỗi xảy ra khi xóa đánh giá', 'error');
                }
            } catch (error) {
                console.error('Error deleting review:', error);
                showNotification('Có lỗi xảy ra khi xóa đánh giá', 'error');
            } finally {
                isLoading = false;
            }
        }

        function saveReview() {
            const form = document.getElementById('add-review-form');
            if (!form) return;

            const typeSelect = document.getElementById('review-type');
            const targetSelect = document.getElementById('review-target');
            const restaurantSelect = document.getElementById('review-restaurant');
            const imagesInput = document.getElementById('review-images');
            
            // Get target name
            let targetName = '';
            let targetId = '';
            
            if (targetSelect.value) {
                const selectedOption = targetSelect.options[targetSelect.selectedIndex];
                targetName = selectedOption.textContent;
                targetId = targetSelect.value;
            } else {
                // Default names if no specific target selected
                const defaultNames = {
                    restaurant: 'FoodHub Restaurant',
                    food: 'Món ăn',
                    service: 'Dịch vụ'
                };
                targetName = defaultNames[typeSelect.value] || 'Không xác định';
                targetId = `${typeSelect.value}_general`;
            }

            // Get restaurant info
            let restaurantName = '';
            if (restaurantSelect.value) {
                const selectedRestaurant = restaurantSelect.options[restaurantSelect.selectedIndex];
                restaurantName = selectedRestaurant.textContent;
            }

            // Process images
            const imageUrls = [];
            if (imagesInput && imagesInput.files) {
                // In a real app, you would upload these to a server
                // For demo purposes, we'll use data URLs
                Array.from(imagesInput.files).forEach(file => {
                    if (file.type.startsWith('image/')) {
                        // Simulate uploaded image URLs
                        imageUrls.push(`https://images.unsplash.com/photo-${Date.now() + Math.random()}?w=300`);
                    }
                });
            }

            const reviewData = {
                type: typeSelect.value,
                target_id: targetId,
                target_name: targetName,
                restaurant_id: restaurantSelect.value,
                restaurant_name: restaurantName,
                customer_name: document.getElementById('customer-name').value,
                customer_avatar: '',
                rating: parseInt(document.getElementById('review-rating').value),
                title: document.getElementById('review-title').value,
                content: document.getElementById('review-content').value,
                images: JSON.stringify(imageUrls),
                status: document.getElementById('review-status').value,
                location: document.getElementById('customer-location').value,
                verified_purchase: document.getElementById('verified-purchase').checked,
                tags: '[]'
            };

            // Validate required fields
            if (!reviewData.type || !reviewData.restaurant_id || !reviewData.customer_name || !reviewData.rating || 
                !reviewData.title || !reviewData.content || !reviewData.location) {
                showNotification('Vui lòng điền đầy đủ thông tin bắt buộc', 'error');
                return;
            }

            addReview(reviewData);
            closeModal();
        }
