    <path d="M154 599c7-18 20-28 43-28 22 0 38 11 44 32v21c-28 12-62 12-94 0Z" fill="url(#cream)"/>
    <path d="M273 603c9-20 24-31 47-31 23 0 40 12 48 34v18c-33 12-67 12-99 0Z" fill="url(#cream)"/>
    <path d="M166 585h70M278 586h65" stroke="#ff750b" stroke-width="8"/>
