<svg xmlns="http://www.w3.org/2000/svg" width="500" height="670" viewBox="0 0 500 670" role="img" aria-labelledby="title desc">
  <title id="title">AI Chef Concierge</title>
  <desc id="desc">Nhân vật robot đầu bếp AI thân thiện, đứng ở bên trái và hướng sang phải.</desc>
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f8efe4"/>
      <stop offset="1" stop-color="#e9d6c5"/>
    </linearGradient>
    <linearGradient id="creamHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1e2d4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a2f"/>
      <stop offset=".55" stop-color="#ff7308"/>
      <stop offset="1" stop-color="#e95700"/>
    </linearGradient>
    <radialGradient id="screen" cx=".38" cy=".2" r=".95">
      <stop offset="0" stop-color="#36302b"/>
      <stop offset=".55" stop-color="#151210"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="eye" cx=".35" cy=".25" r=".8">
      <stop offset="0" stop-color="#ffe2a6"/>
      <stop offset=".45" stop-color="#ff941d"/>
      <stop offset="1" stop-color="#a83b00"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#8e4315" flood-opacity=".2"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="250" cy="636" rx="132" ry="20" fill="#9c4b1d" opacity=".13"/>

  <g stroke="#6e5849" stroke-width="5" stroke-linejoin="round">
    <path d="M170 512h68l-7 91h-63Z" fill="url(#creamHi)"/>
