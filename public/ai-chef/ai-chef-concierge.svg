    <rect x="83" y="132" width="320" height="234" rx="104" fill="url(#creamHi)"/>
    <circle cx="91" cy="247" r="47" fill="url(#cream)"/>
    <circle cx="91" cy="247" r="29" fill="url(#orange)" stroke="#b94b00"/>
    <circle cx="397" cy="247" r="45" fill="url(#cream)"/>
