  <g filter="url(#softShadow)" stroke="#6e5849" stroke-width="5" stroke-linejoin="round">
    <path d="M135 148V98c0-38 31-62 67-53 17-28 61-32 83-7 31-8 62 13 66 43 32 4 53 32 44 61-7 23-27 38-51 38H178c-24 0-43-12-43-32Z" fill="url(#creamHi)"/>
