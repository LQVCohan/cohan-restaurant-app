    <text x="42" y="58" text-anchor="middle" font-family="Outfit,Arial,sans-serif" font-size="13" font-weight="900" fill="#22150d">AI CHEF</text>
    <text x="42" y="71" text-anchor="middle" font-family="Outfit,Arial,sans-serif" font-size="8" font-weight="800" fill="#7d5a43">CONCIERGE</text>
