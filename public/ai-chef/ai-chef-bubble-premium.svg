<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-labelledby="title desc">
  <title id="title">Thẻ mở trợ lý Cohan AI</title>
  <desc id="desc">Trợ lý AI giúp gợi ý món, tìm ưu đãi và theo dõi đơn hàng.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="0.58" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#fff1e4"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a0b"/>
      <stop offset="0.55" stop-color="#ff6500"/>
      <stop offset="1" stop-color="#ed4f00"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0e4"/>
      <stop offset="1" stop-color="#fff8f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#ffb15f" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffb15f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#8d3e0b" flood-opacity=".18"/>
    </filter>
    <filter id="buttonShadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#d84d00" flood-opacity=".26"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M76 18h562c26 0 46 20 46 46v212c0 26-20 46-46 46H80c-24 0-44-18-46-42L8 302l24-62V64c0-26 20-46 44-46Z" fill="url(#panel)" stroke="#ff8a2a" stroke-width="3"/>
    <path d="M76 20h560c24 0 44 19 44 43v7H32v-7c0-24 20-43 44-43Z" fill="#ffffff" opacity=".72"/>
    <ellipse cx="610" cy="52" rx="154" ry="112" fill="url(#glow)"/>
  </g>

  <g transform="translate(72 42)">
    <rect width="226" height="42" rx="21" fill="url(#badge)" stroke="#ffd3ad"/>
    <circle cx="22" cy="21" r="7" fill="#16a36a"/>
    <circle cx="22" cy="21" r="12" fill="#16a36a" opacity=".12"/>
    <text x="42" y="27" fill="#c84b00" font-family="Outfit, Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing=".7">COHAN AI · SẴN SÀNG</text>
  </g>

  <g fill="none" stroke="#ff7a0b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M621 50c3 16 11 24 27 27-16 3-24 11-27 27-3-16-11-24-27-27 16-3 24-11 27-27Z" fill="#fff7ed" stroke-width="3"/>
    <path d="M655 95c2 9 6 13 15 15-9 2-13 6-15 15-2-9-6-13-15-15 9-2 13-6 15-15Z" fill="#fff7ed" stroke-width="2.5"/>
  </g>

  <text x="72" y="137" fill="#23150d" font-family="Outfit, Inter, Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="-1.4">Hôm nay bạn muốn ăn gì?</text>
  <text x="72" y="181" fill="#756155" font-family="Outfit, Inter, Arial, sans-serif" font-size="23" font-weight="650">Gợi ý món đúng gu · săn ưu đãi · theo dõi đơn</text>

  <g transform="translate(72 216)" filter="url(#buttonShadow)">
    <rect width="532" height="76" rx="24" fill="url(#button)"/>
    <path d="M1 24c76-26 154-30 230-10" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="10" stroke-linecap="round"/>
    <text x="30" y="49" fill="#fff" font-family="Outfit, Inter, Arial, sans-serif" font-size="27" font-weight="900">Khám phá cùng AI</text>
    <g transform="translate(466 14)">
      <circle cx="24" cy="24" r="24" fill="#fff" fill-opacity=".18"/>
      <path d="M15 24h18m-7-7 7 7-7 7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
