  <rect x="190" y="604" width="184" height="92" rx="24" fill="#FFF4E0" filter="url(#smallShadow)"/>
  <rect x="824" y="580" width="176" height="124" rx="28" fill="#2A211B" filter="url(#smallShadow)"/>
