<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VPOS restaurant counter illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B1B13"/>
      <stop offset="0.48" stop-color="#9A4F08"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="counter" x1="150" y1="620" x2="1090" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE3B8"/>
      <stop offset="1" stop-color="#C77726"/>
    </linearGradient>
    <linearGradient id="screen" x1="372" y1="234" x2="792" y2="506" gradientUnits="userSpaceOnUse">
