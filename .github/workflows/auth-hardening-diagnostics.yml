name: Auth hardening diagnostics

on:
  push:
    branches:
      - codex/auth-rbac-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Record auth test output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Migrate review tests to authorization service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cohan-restaurant-backend/tests/resolvers/review-access.test.js')
          s = p.read_text()
          s = s.replace(
              'const guardMocks = vi.hoisted(() => ({ requireRestaurantAccess: vi.fn(), requirePermission: vi.fn() }));',
              'const authorizationMocks = vi.hoisted(() => ({ requireRestaurantPermission: vi.fn(), requirePermission: vi.fn() }));',
          )
          s = s.replace(
              'vi.mock("../../graphql/guards.js", () => guardMocks);',
              'vi.mock("../../src/services/auth/authorization.service.js", () => authorizationMocks);',
          )
          s = s.replace(
              '''    guardMocks.requireRestaurantAccess.mockResolvedValue();
              guardMocks.requirePermission.mockImplementation((ctx) => {
                if (!ctx?.user) throw new Error("UNAUTHENTICATED");
                if (String(ctx?.user?.roleName || "").toLowerCase() === "customer") throw new Error("FORBIDDEN");
              });''',
              '''    authorizationMocks.requireRestaurantPermission.mockImplementation(async (ctx) => {
                if (!ctx?.user) throw new Error("UNAUTHENTICATED");
                if (String(ctx?.user?.roleName || "").toLowerCase() === "customer") throw new Error("FORBIDDEN");
                return true;
              });
              authorizationMocks.requirePermission.mockImplementation(async (ctx) => {
                if (!ctx?.user) throw new Error("UNAUTHENTICATED");
                if (String(ctx?.user?.roleName || "").toLowerCase() === "customer") throw new Error("FORBIDDEN");
                return true;
              });''',
          )
          s = s.replace('guardMocks.requireRestaurantAccess', 'authorizationMocks.requireRestaurantPermission')
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix cohan-restaurant-backend ci
      - name: Capture affected frontend tests
        run: |
          set +e
          npx vitest run src/utils/frontendRoleAccess.test.js src/context/__tests__/AuthProvider.test.jsx > auth-frontend-test-output.txt 2>&1
          echo "frontend_status=$?" > auth-test-status.txt
      - name: Capture affected backend tests
        run: |
          set +e
          npm --prefix cohan-restaurant-backend test -- tests/resolvers/guards-restaurant-access.test.js tests/services/authorization.service.test.js tests/resolvers/review-access.test.js tests/resolvers/review-blockers.resolver.test.js tests/resolvers/review-transparent-flow.test.js > auth-backend-test-output.txt 2>&1
          echo "backend_status=$?" >> auth-test-status.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record auth test output"
          git push origin HEAD:codex/auth-rbac-clean
