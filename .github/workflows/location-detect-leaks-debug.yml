name: location detect leaks debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run target with CI flags
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 15m npx vitest run src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.test.jsx --detectAsyncLeaks --maxWorkers=2 --reporter=verbose > location-detect-leaks.log 2>&1
          echo $? > location-detect-leaks.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: location-detect-leaks-debug
          path: |
            location-detect-leaks.log
            location-detect-leaks.status
