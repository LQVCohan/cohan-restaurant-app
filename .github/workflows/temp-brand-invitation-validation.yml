name: temp-brand-invitation-validation

on:
  push:
    branches: [feature/brand-member-invitation-flow]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mark validation pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"temp-brand-invitation-validation","description":"Validation is running"}'
      - name: Install frontend dependencies
        run: npm install --no-package-lock
      - name: Install backend dependencies
        run: npm --prefix cohan-restaurant-backend install --no-package-lock
      - name: Check backend syntax
        run: |
          node --check cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js
          node --check cohan-restaurant-backend/graphql/resolvers/brand/memberRoleConsistency.js
          node --check cohan-restaurant-backend/graphql/resolvers/index.js
      - name: Check GraphQL schema and operations
        run: npm run check:graphql
      - name: Run focused invitation guards
        run: npm --prefix cohan-restaurant-backend test -- tests/resolvers/brand-member-invitation-guards.test.js
      - name: Build frontend
        run: npm run build
      - name: Mark validation successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"temp-brand-invitation-validation","description":"Syntax, GraphQL, focused tests and build passed"}'
      - name: Mark validation failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"temp-brand-invitation-validation","description":"Temporary validation failed; inspect the workflow run"}'
