name: repair-apply-report
on:
  push:
    branches: [agent/fix-report-pages-16-20]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-report-pages-16-20.yml')
          text = p.read_text()
          old = '''          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))
'''
          new = '''          from pathlib import Path
          import re
          import textwrap

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) == 1:
                  p.write_text(text.replace(old, new, 1))
                  return
              old_lines = old.strip("\\n").splitlines()
              parts = []
              for line in old_lines:
                  body = line.lstrip()
                  parts.append(r"^[ \\t]*" + re.escape(body) + r"[ \\t]*$")
              pattern = re.compile("\\n".join(parts), re.MULTILINE)
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one flexible match in {path}, found {len(matches)}: {old[:100]!r}"
                  )
              match = matches[0]
              first_line = match.group(0).splitlines()[0]
              indent = first_line[: len(first_line) - len(first_line.lstrip())]
              normalized_new = textwrap.dedent(new).strip("\\n")
              replacement = "\\n".join(
                  indent + line if line else "" for line in normalized_new.splitlines()
              )
              p.write_text(text[: match.start()] + replacement + text[match.end() :])
'''
          if old not in text:
              raise SystemExit('matcher helper block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-report-pages-16-20.yml
          git commit -m "chore: harden report patch matcher"
          git push origin HEAD
