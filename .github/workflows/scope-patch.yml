name: Scope consistency patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Align assigned restaurant scope
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cohan-restaurant-backend/graphql/resolvers/auth/emailVerification.mutation.js')
          s = p.read_text()
          s = s.replace(
            '    ...(Array.isArray(target?.refRestaurants) ? target.refRestaurants : []),',
            '    target?.restaurantId,\n    ...(Array.isArray(target?.restaurantIds) ? target.restaurantIds : []),',
          )
          p.write_text(s)

          p = Path('cohan-restaurant-backend/tests/resolvers/account-verification.service.test.js')
          s = p.read_text()
          s = s.replace('allows manager when any target refRestaurant is in scope', 'allows manager for assigned staff in scope')
          s = s.replace(
            '{ _id: "customer-1", userType: "CUSTOMER", refRestaurants: ["restaurant-a", { _id: "restaurant-b" }] },',
            '{ _id: "staff-1", userType: "STAFF", restaurantForStaff: "restaurant-b" },',
          )
          s = s.replace('denies manager when no target restaurant is in scope', 'does not use customer history as privileged scope')
          s = s.replace(
            '{ user: { id: "manager-1", roleName: "manager", restaurantIds: ["restaurant-a"] } },\n      { _id: "customer-1", userType: "CUSTOMER", refRestaurants: ["restaurant-b"] },',
            '{ user: { id: "manager-1", roleName: "manager", restaurantIds: ["restaurant-b"] } },\n      { _id: "customer-1", userType: "CUSTOMER", refRestaurants: ["restaurant-b"] },',
          )
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/graphql/resolvers/auth/emailVerification.mutation.js cohan-restaurant-backend/tests/resolvers/account-verification.service.test.js
          git commit -m "Align verification restaurant scope"
          git push origin HEAD:codex/auth-rbac-clean
