name: Agent customer table VR patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/customer-table-vr-and-safe-back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-table-vr-and-safe-back
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/agent_patch_customer_table_vr.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add src/components/Customer/TableBooking/TableBooking.jsx \
            src/components/Customer/TableBooking/BookingSummary/BookingSummary.scss \
            src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx \
            src/components/Customer/VRViewer/VRViewer.jsx \
            src/components/Customer/VRViewer/VRViewer.test.jsx
          git commit -m "fix(table-vr): expose customer viewer and safe back behavior"
          git push origin HEAD:agent/customer-table-vr-and-safe-back
