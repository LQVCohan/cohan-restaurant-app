name: quick-polish-report-16-20
on:
  push:
    branches: [agent/fix-report-pages-16-20]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/Dashboard_Manager/Customer/CustomerAnalyticsPage.jsx')
          text = path.read_text()
          for old, new in [
            ('Lọc nhóm này <ArrowRight size={14} aria-hidden="true" />', 'Mở danh sách khách <ArrowRight size={14} aria-hidden="true" />'),
            ('Xem nhóm giá trị cao <ArrowRight size={14} aria-hidden="true" />', 'Mở danh sách khách <ArrowRight size={14} aria-hidden="true" />'),
          ]:
            if text.count(old) != 1:
              raise SystemExit(f'Expected one match for {old!r}, found {text.count(old)}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/quick-polish-report-16-20.yml
          rm -f .trellis/tasks/07-13-report-pages-16-20/polish-trigger.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(customer): align analytics actions with visible data"
          git push origin HEAD
