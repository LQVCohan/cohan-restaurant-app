name: Apply manager smoke AuthBusinessContext aliases

on:
  push:
    branches:
      - codex/customer-menu-ux-final-v2
    paths:
      - scripts/apply-manager-smoke-auth-context.mjs
      - .github/workflows/apply-manager-smoke-auth-context.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-menu-ux-final-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted smoke patches
        run: |
          node --check scripts/apply-manager-smoke-auth-context.mjs
          node scripts/apply-manager-smoke-auth-context.mjs
          node --check tests/e2e/smoke/ai-handoff-features.spec.js
          node --check tests/e2e/smoke/manager-payroll.spec.js
          git diff --check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(smoke): align manager auth business context"
          git push origin HEAD:codex/customer-menu-ux-final-v2
