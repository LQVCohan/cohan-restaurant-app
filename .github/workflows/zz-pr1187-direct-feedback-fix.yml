name: pr1187-direct-feedback-fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/sua-luong-du-lieu-cho-ai-chatbot' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sua-luong-du-lieu-cho-ai-chatbot
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply direct component integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          widget_path = Path('src/components/common/AiChatbotWidget.jsx')
          widget = widget_path.read_text()
          style_import = 'import "./AiChatbotWidget.scss";\n'
          component_import = 'import AiChatbotFeedbackControls from "./AiChatbotFeedbackControls";\n'
          if component_import not in widget:
              widget = widget.replace(style_import, style_import + component_import, 1)
          widget = widget.replace('  const [feedbackSent, setFeedbackSent] = useState({});\n', '')

          start = '                  {item.role === "assistant" && item.meta?.conversationId ? (\n                    <div\n'
          end = '                    </div>\n                  ) : null}'
          start_index = widget.index(start)
          end_index = widget.index(end, start_index) + len(end)
          replacement = '''                  {item.role === "assistant" && item.meta?.conversationId ? (\n                    <AiChatbotFeedbackControls\n                      item={item}\n                      index={index}\n                      messages={messages}\n                      restaurantId={item.meta?.resolvedRestaurantId || restaurantId}\n                      guestId={guestId}\n                      submitFeedback={submitFeedback}\n                    />\n                  ) : null}'''
          widget = widget[:start_index] + replacement + widget[end_index:]
          if 'window.prompt' in widget:
              raise RuntimeError('Legacy window.prompt remains in widget')
          widget_path.write_text(widget)

          vite_path = Path('vite.config.js')
          vite = vite_path.read_text()
          vite = vite.replace('import { aiChatbotFeedbackControlsPlugin } from "./build/aiChatbotFeedbackControlsPlugin.js";\n', '')
          vite = vite.replace('      aiChatbotFeedbackControlsPlugin(),\n', '')
          vite_path.write_text(vite)

          feedback_test_path = Path('src/components/common/AiChatbotFeedbackControls.test.jsx')
          feedback_test = feedback_test_path.read_text()
          if 'omits restaurantId for verified global feedback' not in feedback_test:
              test = '''\n  it("omits restaurantId for verified global feedback", async () => {\n    const submitFeedback = vi.fn().mockResolvedValue({ data: {} });\n    renderControls(submitFeedback, "");\n\n    fireEvent.click(screen.getByRole("button", { name: "Hữu ích" }));\n\n    await waitFor(() => expect(submitFeedback).toHaveBeenCalledTimes(1));\n    const input = submitFeedback.mock.calls[0][0].variables.input;\n    expect(input).not.toHaveProperty("restaurantId");\n    expect(input).toMatchObject({\n      conversationId: "conversation-1",\n      messageId: "message-1",\n      rating: "helpful",\n    });\n  });\n'''
              close_index = feedback_test.rfind('\n});')
              feedback_test = feedback_test[:close_index] + test + feedback_test[close_index:]
              feedback_test_path.write_text(feedback_test)

          for obsolete in [
              Path('build/aiChatbotFeedbackControlsPlugin.js'),
              Path('src/utils/aiChatbotFeedbackControlsPlugin.test.js'),
          ]:
              if obsolete.exists():
                  obsolete.unlink()
          PY

      - name: Commit to existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/zz-pr1187-direct-feedback-fix.yml
          git add -A
          git commit -m "fix(ai-chatbot): integrate feedback controls directly"
          git push origin HEAD:codex/sua-luong-du-lieu-cho-ai-chatbot
