name: Apply restaurant profile production polish

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Load and apply reviewed polish patch
        run: |
          git fetch origin fix/restaurant-location-production
          git show origin/fix/restaurant-location-production:.github/scripts/apply_restaurant_profile_production_polish.py > /tmp/apply_restaurant_profile_production_polish.py
          python - <<'PY'
          from pathlib import Path

          script_path = Path('/tmp/apply_restaurant_profile_production_polish.py')
          script = script_path.read_text(encoding='utf-8')

          helper_needle = '    if count != 1:\n        raise SystemExit(f"Expected exactly one match for {label}, found {count}")\n'
          helper_replacement = '    if label == \'"Nhà hàng chưa gán chuỗi"\' and count == 2:\n        target.write_text(text.replace(old, new), encoding="utf-8")\n        return\n    if count != 1:\n        raise SystemExit(f"Expected exactly one match for {label}, found {count}")\n'
          if helper_needle not in script:
              raise SystemExit('patch helper signature changed')
          script = script.replace(helper_needle, helper_replacement, 1)

          sync_mapping = '    \'>\\n                   Đồng bộ\\n                 </Button>\': \'>\\n                   Cập nhật danh mục\\n                 </Button>\',\n'
          if sync_mapping not in script:
              raise SystemExit('sync wording mapping changed')
          script_path.write_text(script.replace(sync_mapping, '', 1), encoding='utf-8')

          source_path = Path('src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx')
          source = source_path.read_text(encoding='utf-8')
          old_sync = '                  Đồng bộ\n'
          if source.count(old_sync) != 1:
              raise SystemExit(f'Expected one sync label, found {source.count(old_sync)}')
          source_path.write_text(
              source.replace(old_sync, '                  Cập nhật danh mục\n', 1),
              encoding='utf-8',
          )
          PY
          python /tmp/apply_restaurant_profile_production_polish.py 2>&1 | tee restaurant-profile-polish.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restaurant-profile-polish-apply-log
          path: restaurant-profile-polish.log
          if-no-files-found: ignore

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: align restaurant profile with manager dashboard"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
