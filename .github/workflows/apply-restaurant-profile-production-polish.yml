name: Apply restaurant profile production polish

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Capture reviewed polish patch output
        run: |
          git fetch origin fix/restaurant-location-production
          git show origin/fix/restaurant-location-production:.github/scripts/apply_restaurant_profile_production_polish.py > /tmp/apply_restaurant_profile_production_polish.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_restaurant_profile_production_polish.py')
          text = path.read_text(encoding='utf-8')
          needle = '    if count != 1:\n        raise SystemExit(f"Expected exactly one match for {label}, found {count}")\n'
          replacement = '    if label == \'"Nhà hàng chưa gán chuỗi"\' and count == 2:\n        target.write_text(text.replace(old, new), encoding="utf-8")\n        return\n    if count != 1:\n        raise SystemExit(f"Expected exactly one match for {label}, found {count}")\n'
          if needle not in text:
              raise SystemExit('patch helper signature changed')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          set +e
          python /tmp/apply_restaurant_profile_production_polish.py > restaurant-profile-polish.log 2>&1
          echo $? > restaurant-profile-polish.status
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-profile-polish-debug-2
          path: |
            restaurant-profile-polish.log
            restaurant-profile-polish.status
