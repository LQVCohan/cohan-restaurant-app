name: Fix user admin test isolation

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Isolate user admin resolver test dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Add customer rank service mock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cohan-restaurant-backend/tests/resolvers/user-admin-management-access.test.js')
          source = path.read_text()
          marker = 'vi.mock("../../utils/authz.js", () => ({ requireRole: requireRoleMock }));\n'
          addition = '''vi.mock("../../src/services/customerRankSetting.service.js", () => ({
            getEffectiveCustomerRankSetting: vi.fn(async () => ({ ranks: [], isDefault: true })),
          }));
          '''
          if addition not in source:
              if marker not in source:
                  raise SystemExit('authz mock marker not found')
              source = source.replace(marker, marker + addition)
          path.write_text(source)
          PY
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/tests/resolvers/user-admin-management-access.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Isolate user admin resolver test dependencies"
          git pull --rebase origin codex/auth-rbac-clean
          git push origin HEAD:codex/auth-rbac-clean
