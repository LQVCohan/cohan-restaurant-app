name: PR 1103 backend diagnostics

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message != 'Record PR 1103 backend diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm --prefix cohan-restaurant-backend ci
      - name: Capture backend tests
        run: |
          set +e
          npm --prefix cohan-restaurant-backend test > pr1103-backend-ci.txt 2>&1
          echo "backend_status=$?" > pr1103-backend-status.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr1103-backend-ci.txt pr1103-backend-status.txt
          git commit -m "Record PR 1103 backend diagnostics"
          git push origin HEAD:codex/auth-rbac-clean
