name: Agent table VR source patch

on:
  push:
    branches:
      - agent/improve-table-360-upload

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ !contains(github.event.head_commit.message, '[table-vr-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-table-360-upload
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/apply-table-vr-upload-patch.py

      - name: Commit generated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx
          git diff --cached --quiet && exit 0
          git commit -m "improve table panorama upload [table-vr-patched]"
          git push origin HEAD:agent/improve-table-360-upload
