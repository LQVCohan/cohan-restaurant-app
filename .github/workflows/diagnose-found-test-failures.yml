name: diagnose-found-test-failures

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --silent
          npm --prefix cohan-restaurant-backend ci --silent

      - name: Run targeted failure set
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm --prefix cohan-restaurant-backend test -- tests/resolvers/search-public-safety.test.js --reporter=verbose > backend-search.log 2>&1
          echo $? > backend-search.status
          npx vitest run src/context/__tests__/AuthProvider.test.jsx --reporter=verbose > frontend-auth.log 2>&1
          echo $? > frontend-auth.status
          set -e

      - name: Upload targeted logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: found-test-failure-logs
          path: |
            backend-search.log
            backend-search.status
            frontend-auth.log
            frontend-auth.status

      - name: Fail when a targeted test failed
        shell: bash
        run: |
          test "$(cat backend-search.status)" = "0"
          test "$(cat frontend-auth.status)" = "0"
