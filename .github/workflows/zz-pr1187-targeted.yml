name: pr1187-targeted

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm --prefix cohan-restaurant-backend ci --silent
      - run: npm --prefix cohan-restaurant-backend exec -- vitest run tests/services/restaurant-chatbot-feedback-global.test.js tests/services/restaurantChatbot.service.test.js tests/services/restaurantChatbot.persistence.service.test.js tests/services/restaurantChatbot.settings.service.test.js
      - run: npm --prefix cohan-restaurant-backend run lint --if-present
      - run: npm --prefix cohan-restaurant-backend run build --if-present

  frontend-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent
      - run: npx vitest run src/components/common/AiChatbotFeedbackControls.test.jsx src/components/common/AiChatbotWidget.basic.test.jsx
      - run: npm run lint
      - run: npm run build
