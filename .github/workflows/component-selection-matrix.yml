name: component selection matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare Vitest changed selections
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          OUT_DIR="/tmp/component-selection-debug"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          run_case() {
            name="$1"
            shift
            git reset --hard "$BASE_SHA" >/dev/null
            git clean -fd >/dev/null
            for path in "$@"; do
              git checkout "$HEAD_SHA" -- "$path"
            done
            git diff --name-only > "$OUT_DIR/${name}-files.txt"
            npx vitest list src/components --changed "$BASE_SHA" > "$OUT_DIR/${name}-tests.txt" 2>&1
            wc -l "$OUT_DIR/${name}-tests.txt" > "$OUT_DIR/${name}-count.txt"
          }

          run_case source-only \
            src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx
          run_case test-only \
            src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.test.jsx
          run_case source-and-test \
            src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx \
            src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.test.jsx
          run_case backend-only \
            cohan-restaurant-backend/graphql/resolvers/restaurant/mutation.js \
            cohan-restaurant-backend/tests/resolvers/restaurant-mutation-access.test.js
          run_case task-only \
            .trellis/tasks/restaurant-location-production-readiness/task.json \
            .trellis/tasks/restaurant-location-production-readiness/prd.md

          mkdir -p "$GITHUB_WORKSPACE/selection-debug"
          cp -R "$OUT_DIR"/. "$GITHUB_WORKSPACE/selection-debug/"
      - uses: actions/upload-artifact@v4
        with:
          name: component-selection-matrix
          path: selection-debug
