name: Agent table VR verification

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    if: github.head_ref == 'agent/customer-table-vr-and-safe-back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run table VR tests
        run: >-
          npx vitest run
          src/utils/tableVrNavigation.test.js
          src/components/Customer/VRViewer/VRViewer.test.jsx
          src/components/Customer/TableBooking/BookingSummary/BookingSummary.test.jsx
      - name: Build frontend
        run: npm run build
