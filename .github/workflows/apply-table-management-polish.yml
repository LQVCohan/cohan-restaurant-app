name: Apply table management polish

on:
  push:
    branches:
      - fix/table-management-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/table-management-polish
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "cohan-restaurant-backend/models/table.model.js",
              '''  tags: { type: [String], default: [] },

  isJoinable: { type: Boolean, default: false },''',
              '''  tags: { type: [String], default: [] },
  zone: { type: String, trim: true },
  promotionIds: [{ type: mongoose.Schema.Types.ObjectId, ref: "Promotion" }],
  bookingPerks: { type: [String], default: [] },
  reservationHoldMinutes: { type: Number, min: 0 },
  minSpend: { type: Number, min: 0 },
  cancelPolicy: { type: String, trim: true },

  isJoinable: { type: Boolean, default: false },'''
          )

          replace_once(
              "cohan-restaurant-backend/graphql/schema/floor_table.graphql",
              '''  deposit: Int
  tags: [String!]
  isJoinable: Boolean''',
              '''  deposit: Int
  tags: [String!]
  zone: String
  promotionIds: [ID!]
  bookingPerks: [String!]
  reservationHoldMinutes: Int
  minSpend: Float
  cancelPolicy: String
  isJoinable: Boolean'''
          )
          replace_once(
              "cohan-restaurant-backend/graphql/schema/floor_table.graphql",
              '''  deposit: Int
  vrUrl: String
  notes: String
  visualConfig: JSON
  status: TableStatus
  tags: [String!]
  isJoinable: Boolean''',
              '''  deposit: Int
  vrUrl: String
  notes: String
  visualConfig: JSON
  status: TableStatus
  tags: [String!]
  zone: String
  promotionIds: [ID!]
  bookingPerks: [String!]
  reservationHoldMinutes: Int
  minSpend: Float
  cancelPolicy: String
  isJoinable: Boolean'''
          )

          replace_once(
              "src/hooks/useTableManagement.js",
              '''    deposit
    floorId''',
              '''    deposit
    zone
    promotionIds
    bookingPerks
    reservationHoldMinutes
    minSpend
    cancelPolicy
    floorId'''
          )

          resolver = Path("cohan-restaurant-backend/graphql/resolvers/table/mutation.js")
          resolver_text = resolver.read_text(encoding="utf-8")
          resolver_text = resolver_text.replace(
              '''      .select({ _id: 1, restaurantId: 1, code: 1, floorId: 1 })''',
              '''      .select({ _id: 1, restaurantId: 1, code: 1, floorId: 1, joinGroupId: 1 })''',
              1,
          )
          old_merge_guard = '''    const floorIds = new Set(tables.map((item) => String(item.floorId || "")));
    if (floorIds.size !== 1) {
      throw new GraphQLError("Cannot merge tables from different floors");
    }

    // Tạo joinGroupId nếu chưa truyền'''
          new_merge_guard = '''    const floorIds = new Set(tables.map((item) => String(item.floorId || "")));
    if (floorIds.size !== 1) {
      throw new GraphQLError("Cannot merge tables from different floors");
    }
    if (!tableIds.some((id) => String(id) === String(anchorId))) {
      throw new GraphQLError("anchorId must belong to tableIds");
    }
    const conflictingGroup = tables.find(
      (item) => item.joinGroupId && String(item.joinGroupId) !== String(joinGroupId || "")
    );
    if (conflictingGroup) {
      throw new GraphQLError(
        `Bàn ${conflictingGroup.code || "đã chọn"} đang thuộc nhóm khác. Vui lòng tách bàn trước khi gộp lại.`
      );
    }

    // Tạo joinGroupId nếu chưa truyền'''
          if old_merge_guard not in resolver_text:
              raise SystemExit("Merge guard anchor not found")
          resolver_text = resolver_text.replace(old_merge_guard, new_merge_guard, 1)

          old_split = '''    // Xác định tập bàn sẽ tách
    let toUnmergeFilter = { restaurantId, joinGroupId };
    if (mode === "PARTIAL") {
      toUnmergeFilter._id = { $in: tableIds };
    }

    const affected = await Table.updateMany(toUnmergeFilter, {
      $set: { isJoinable: false },
      $unset: { joinGroupId: "" },
    });

    // Lấy lại id các bàn đã tách (để trả về)
    const unmerged = await Table.find({
      restaurantId,
      ...(mode === "PARTIAL" ? { _id: { $in: tableIds } } : {}), // ALL: tất cả bàn của group cũ đã clear
      // Sau khi tách, joinGroupId đã null -> dựa vào ids ở PARTIAL
    })
      .select({ _id: 1 })
      .lean();

    const unmergedTableIds = unmerged.map((x) => x._id.toString());'''
          new_split = '''    const groupedTables = await Table.find({ restaurantId, joinGroupId })
      .select({ _id: 1 })
      .lean();
    const groupTableIds = groupedTables.map((item) => item._id.toString());
    const requestedIds = new Set((tableIds || []).map(String));
    const requestedGroupTableIds =
      mode === "PARTIAL"
        ? groupTableIds.filter((id) => requestedIds.has(id))
        : groupTableIds;
    const remainingCount = groupTableIds.length - requestedGroupTableIds.length;
    const unmergedTableIds =
      mode === "PARTIAL" && remainingCount === 1
        ? groupTableIds
        : requestedGroupTableIds;

    const affected = unmergedTableIds.length
      ? await Table.updateMany(
          {
            restaurantId,
            joinGroupId,
            _id: { $in: unmergedTableIds },
          },
          {
            $set: { isJoinable: false },
            $unset: { joinGroupId: "" },
          }
        )
      : { modifiedCount: 0 };'''
          if old_split not in resolver_text:
              raise SystemExit("Split block not found")
          resolver.write_text(resolver_text.replace(old_split, new_split, 1), encoding="utf-8")

          replace_once(
              "src/components/Dashboard_Manager/Table/TableManagement.jsx",
              '''  const [simulatorTargetFloor, setSimulatorTargetFloor] = useState(null);
  const [vrForm, setVrForm] = useState({''',
              '''  const [simulatorTargetFloor, setSimulatorTargetFloor] = useState(null);
  const latestLiteTable = useMemo(
    () =>
      liteTable?.id
        ? getRawTableById(tablesRaw, liteTable.id) || liteTable
        : liteTable,
    [liteTable, tablesRaw]
  );
  const [vrForm, setVrForm] = useState({'''
          )
          replace_once(
              "src/components/Dashboard_Manager/Table/TableManagement.jsx",
              '''                        className="btn-mini primary"
                        aria-label={`Mở 3D và AR cho bàn''',
              '''                        className="btn-mini primary btn-mini--3d"
                        aria-label={`Mở 3D và AR cho bàn'''
          )
          replace_once(
              "src/components/Dashboard_Manager/Table/TableManagement.jsx",
              '''      {showLiteModal && liteTable && (
        <TableActionsLiteModal
          open={showLiteModal}
          table={liteTable}''',
              '''      {showLiteModal && latestLiteTable && (
        <TableActionsLiteModal
          open={showLiteModal}
          table={latestLiteTable}'''
          )
          replace_once(
              "src/components/Dashboard_Manager/Table/TableManagement.jsx",
              '''        table={liteTable}
        floor={''',
              '''        table={latestLiteTable}
        floor={'''
          )

          replace_once(
              "src/components/Dashboard_Manager/Table/TableManagement.scss",
              '''      &:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        filter: grayscale(0.15);
      }

      &.success {''',
              '''      &:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        filter: grayscale(0.15);
      }

      &.btn-mini--3d {
        flex: 0 0 auto;
        min-width: 64px;
        min-height: 28px;
        padding: 4px 8px;
        align-self: center;
        font-size: 0.72rem;
      }

      &.success {'''
          )

          replace_once(
              "src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx",
              '''        deposit: depositAmount === "" ? null : Number.parseFloat(depositAmount),''',
              '''        deposit: depositAmount === "" ? null : Number.parseInt(depositAmount, 10),'''
          )

          replace_once(
              "src/components/Dashboard_Manager/Table/TableManagement.test.jsx",
              '''  return render(
    <MemoryRouter>
      <AuthContext.Provider
        value={{
          restaurants: [{ id: "restaurant-1", name: "Cơ sở trung tâm" }],
        }}
      >
        <TableManagement />
      </AuthContext.Provider>
    </MemoryRouter>
  );''',
              '''  const renderTree = () => (
    <MemoryRouter>
      <AuthContext.Provider
        value={{
          restaurants: [{ id: "restaurant-1", name: "Cơ sở trung tâm" }],
        }}
      >
        <TableManagement />
      </AuthContext.Provider>
    </MemoryRouter>
  );
  const view = render(renderTree());
  return {
    ...view,
    rerenderTableManagement: () => view.rerender(renderTree()),
  };'''
          )
          replace_once(
              "src/components/Dashboard_Manager/Table/TableManagement.test.jsx",
              '''    expect(screen.getByTestId("table-actions-lite-modal")).toBeInTheDocument();
    expect(tableActionsModalState.lastTable?.code).toBe("A1");
  });

  it("opens 3D and AR with the concrete table and floor", async () => {''',
              '''    expect(screen.getByTestId("table-actions-lite-modal")).toBeInTheDocument();
    expect(tableActionsModalState.lastTable?.code).toBe("A1");
  });

  it("keeps the open detail modal synchronized after table data refetches", async () => {
    const { rerenderTableManagement } = await renderTableManagement();

    const tableCard = screen.getByText("A1").closest("article");
    fireEvent.click(
      within(tableCard).getByRole("button", { name: /Mở cấu hình bàn A1/i })
    );

    tableManagementState.tables = tableManagementState.tables.map((item) =>
      item.code === "A1" ? { ...item, joinGroupId: "group-1" } : item
    );
    rerenderTableManagement();

    expect(tableActionsModalState.lastTable?.joinGroupId).toBe("group-1");
  });

  it("opens 3D and AR with the concrete table and floor", async () => {'''
          )
          replace_once(
              "src/components/Dashboard_Manager/Table/TableManagement.test.jsx",
              '''    fireEvent.click(arButton);

    expect(screen.getByTestId("table-3d-modal")).toBeInTheDocument();''',
              '''    expect(arButton).toHaveClass("btn-mini--3d");
    fireEvent.click(arButton);

    expect(screen.getByTestId("table-3d-modal")).toBeInTheDocument();'''
          )

          replace_once(
              "cohan-restaurant-backend/tests/resolvers/table-restaurant-access.test.js",
              '''  it("splitTables denied", async () => { const m=(await import("../../graphql/resolvers/table/mutation.js")).default; authMocks.requireRestaurantPermission.mockRejectedValue(new Error("FORBIDDEN_SCOPE")); await expect(m.splitTables(null,{input:{restaurantId:"valid-r1",joinGroupId:"g1",mode:"ALL"}},{})).rejects.toThrow(); expect(tableMocks.updateMany).not.toHaveBeenCalled(); expect(tableMocks.find).not.toHaveBeenCalled(); expect(eventMocks.logEvent).not.toHaveBeenCalled(); });
  it("swapTableCodes denied",''',
              '''  it("splitTables denied", async () => { const m=(await import("../../graphql/resolvers/table/mutation.js")).default; authMocks.requireRestaurantPermission.mockRejectedValue(new Error("FORBIDDEN_SCOPE")); await expect(m.splitTables(null,{input:{restaurantId:"valid-r1",joinGroupId:"g1",mode:"ALL"}},{})).rejects.toThrow(); expect(tableMocks.updateMany).not.toHaveBeenCalled(); expect(tableMocks.find).not.toHaveBeenCalled(); expect(eventMocks.logEvent).not.toHaveBeenCalled(); });
  it("splitTables ALL returns only tables from the requested group", async () => {
    const m = (await import("../../graphql/resolvers/table/mutation.js")).default;
    tableMocks.find.mockReturnValueOnce(
      selectLeanWrap([{ _id: "valid-a" }, { _id: "valid-b" }])
    );
    tableMocks.updateMany.mockResolvedValueOnce({ modifiedCount: 2 });

    const result = await m.splitTables(
      null,
      { input: { restaurantId: "valid-r1", joinGroupId: "g1", mode: "ALL" } },
      {}
    );

    expect(result.unmergedTableIds).toEqual(["valid-a", "valid-b"]);
    expect(tableMocks.updateMany).toHaveBeenCalledWith(
      {
        restaurantId: "valid-r1",
        joinGroupId: "g1",
        _id: { $in: ["valid-a", "valid-b"] },
      },
      {
        $set: { isJoinable: false },
        $unset: { joinGroupId: "" },
      }
    );
  });
  it("splitTables PARTIAL ignores ids outside the requested group", async () => {
    const m = (await import("../../graphql/resolvers/table/mutation.js")).default;
    tableMocks.find.mockReturnValueOnce(
      selectLeanWrap([{ _id: "valid-a" }, { _id: "valid-b" }, { _id: "valid-c" }])
    );
    tableMocks.updateMany.mockResolvedValueOnce({ modifiedCount: 1 });

    const result = await m.splitTables(
      null,
      {
        input: {
          restaurantId: "valid-r1",
          joinGroupId: "g1",
          mode: "PARTIAL",
          tableIds: ["valid-a", "valid-outside"],
        },
      },
      {}
    );

    expect(result.unmergedTableIds).toEqual(["valid-a"]);
  });
  it("splitTables PARTIAL dissolves a one-table remainder", async () => {
    const m = (await import("../../graphql/resolvers/table/mutation.js")).default;
    tableMocks.find.mockReturnValueOnce(
      selectLeanWrap([{ _id: "valid-a" }, { _id: "valid-b" }])
    );
    tableMocks.updateMany.mockResolvedValueOnce({ modifiedCount: 2 });

    const result = await m.splitTables(
      null,
      {
        input: {
          restaurantId: "valid-r1",
          joinGroupId: "g1",
          mode: "PARTIAL",
          tableIds: ["valid-a"],
        },
      },
      {}
    );

    expect(result.unmergedTableIds).toEqual(["valid-a", "valid-b"]);
  });
  it("swapTableCodes denied",'''
          )

          # Existing merge query fixtures now need the group field when relevant; add a regression for grouped tables.
          replace_once(
              "cohan-restaurant-backend/tests/resolvers/table-restaurant-access.test.js",
              '''  it("mergeTables rejects tables from different floors", async () => {''',
              '''  it("mergeTables rejects an anchor outside tableIds", async () => {
    const m = (await import("../../graphql/resolvers/table/mutation.js")).default;
    tableMocks.find.mockReturnValueOnce(
      selectLeanWrap([
        { _id: "valid-a", restaurantId: "valid-r1", floorId: "valid-f1", code: "A1" },
        { _id: "valid-b", restaurantId: "valid-r1", floorId: "valid-f1", code: "B1" },
      ])
    );

    await expect(
      m.mergeTables(
        null,
        {
          input: {
            restaurantId: "valid-r1",
            tableIds: ["valid-a", "valid-b"],
            anchorId: "valid-outside",
          },
        },
        {}
      )
    ).rejects.toThrow("anchorId must belong to tableIds");
    expect(tableMocks.updateMany).not.toHaveBeenCalled();
  });
  it("mergeTables requires existing groups to be split first", async () => {
    const m = (await import("../../graphql/resolvers/table/mutation.js")).default;
    tableMocks.find.mockReturnValueOnce(
      selectLeanWrap([
        {
          _id: "valid-a",
          restaurantId: "valid-r1",
          floorId: "valid-f1",
          code: "A1",
          joinGroupId: "existing-group",
        },
        { _id: "valid-b", restaurantId: "valid-r1", floorId: "valid-f1", code: "B1" },
      ])
    );

    await expect(
      m.mergeTables(
        null,
        {
          input: {
            restaurantId: "valid-r1",
            tableIds: ["valid-a", "valid-b"],
            anchorId: "valid-a",
          },
        },
        {}
      )
    ).rejects.toThrow("đang thuộc nhóm khác");
    expect(tableMocks.updateMany).not.toHaveBeenCalled();
