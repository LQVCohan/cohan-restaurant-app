name: Branch cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Restore current main files and remove temporary artifacts
        run: |
          git fetch origin main
          git checkout origin/main -- \
            cohan-restaurant-backend/graphql/resolvers/analytics/index.js \
            cohan-restaurant-backend/graphql/resolvers/index.js \
            cohan-restaurant-backend/src/server/server.js \
            src/lib/apiBaseUrl.ts
          rm -f \
            .github/workflows/component-test-diagnostics.yml \
            .github/workflows/fix-verification-scope.yml \
            .github/workflows/scope-patch.yml \
            .github/workflows/branch-cleanup.yml \
            component-test-diagnostics.txt \
            component-test-status.txt \
            pr1103-backend-ci.txt \
            pr1103-backend-status.txt \
            pr1103-frontend-ci.txt \
            pr1103-frontend-status.txt \
            pr1103-schema-diagnostics.txt
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clean temporary diagnostics and sync main files"
          git push origin HEAD:codex/auth-rbac-clean
