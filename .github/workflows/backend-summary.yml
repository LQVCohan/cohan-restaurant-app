name: Backend test summary

on:
  push:
    branches: [codex/auth-rbac-clean]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  summarize:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Record backend test summary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'codex/auth-rbac-clean' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm --prefix cohan-restaurant-backend ci
      - name: Run and summarize backend tests
        run: |
          set +e
          npm --prefix cohan-restaurant-backend test > /tmp/backend-tests.txt 2>&1
          status=$?
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/backend-tests.txt').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          keep = []
          for line in text.splitlines():
            value = line.strip()
            if value.startswith('FAIL ') or value.startswith('Test Files ') or value.startswith('Tests '):
              keep.append(value)
            elif any(token in value for token in ('AssertionError:', 'SyntaxError:', 'TypeError:', 'ReferenceError:', 'Cannot find package')):
              keep.append(value)
          Path('backend-test-summary.txt').write_text('\n'.join(keep[-500:]) + f'\nbackend_status={status}\n')
          PY
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-test-summary.txt
          git commit -m "Record backend test summary"
          git push origin HEAD:codex/auth-rbac-clean
