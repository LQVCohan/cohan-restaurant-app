name: temp-comment-run-hours-patch

on:
  pull_request_target:
    types: [ready_for_review, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 1244 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/restaurant-hours-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restaurant-hours-controls
          fetch-depth: 0

      - name: Load patch script from main
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/temp-patch-restaurant-hours-pr.yml > /tmp/patch-workflow.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/patch-workflow.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start + 1:end]
          ) + '\n'
          Path('/tmp/restaurant-hours-patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/restaurant-hours-patch.py

      - name: Verify and commit
        run: |
          git diff --check
          grep -q 'type="time"' src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx
          grep -q 'getHoursValidationError' src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx \
            src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.test.jsx \
            src/styles/RestaurantProfileHoursResponsiveFix.css
          git commit -m "fix: upgrade restaurant opening hours controls"
          git push origin HEAD:fix/restaurant-hours-controls
