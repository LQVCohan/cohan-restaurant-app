              white-space: nowrap;
            }

            .floating-cart-wrapper .btn-floating-cart .cart-right {
              flex: 0 0 auto;
              padding: 6px 12px;
            }
          }

          @media (max-width: 560px) {
            .staff-pos-main {
              padding: 6px;
            }

            .floating-cart-wrapper .btn-floating-cart .icon-cart-wrap {
              padding: 7px;
            }

            .floating-cart-wrapper .btn-floating-cart .table-info {
              font-size: 13px;
            }

            .floating-cart-wrapper .btn-floating-cart .status-info {
              font-size: 11px;
            }
          }''',
          )

          append_once(
              "src/components/Staff/components/MenuOrdering.scss",
              "/* Compact mobile flow from table selection */",
              '''/* Compact mobile flow from table selection */
          .staff-pos-menu .table-status-banner .table-meta {
            color: #64746a;
            font-size: 12px;
            font-weight: 600;
          }

          .staff-pos-menu .table-status-banner .btn-change-table {
            display: inline-flex;
            min-height: 38px;
            flex: 0 0 auto;
