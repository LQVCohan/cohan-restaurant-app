            }

            .item-options-overlay .item-options-sheet .drag-indicator {
              padding: 9px 0 3px;
              border-radius: 20px 20px 0 0;
            }

            .item-options-overlay .item-options-sheet .sheet-header {
              padding: 7px 14px 11px;
            }

            .item-options-overlay .item-options-sheet .sheet-header .header-info h3 {
              font-size: 16px;
            }

            .item-options-overlay .item-options-sheet .sheet-body {
