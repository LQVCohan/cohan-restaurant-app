          Path("src/components/Staff/StaffOrdering.selection.test.jsx").write_text(
              '''import { beforeEach, describe, expect, it, vi } from "vitest";
          import { __testables } from "./StaffOrdering";

          const {
            getStaffOrderTableStorageKey,
            readStoredStaffOrderTable,
            persistStaffOrderTable,
            clearStoredStaffOrderTable,
            isStaffOrderMobileViewport,
          } = __testables;

          beforeEach(() => {
            window.sessionStorage.clear();
            vi.restoreAllMocks();
          });

          describe("staff order table selection storage", () => {
            it("stores id and code inside the current restaurant scope", () => {
              persistStaffOrderTable("restaurant-1", {
                id: "table-1",
                tableCode: "T101",
              });

              expect(getStaffOrderTableStorageKey("restaurant-1")).toBe(
                "cohan:staff-order:selected-table:restaurant-1",
              );
              expect(readStoredStaffOrderTable("restaurant-1")).toEqual({
                id: "table-1",
                tableCode: "T101",
              });
              expect(readStoredStaffOrderTable("restaurant-2")).toBeNull();
            });

            it("clears stale selection and tolerates invalid browser data", () => {
              const key = getStaffOrderTableStorageKey("restaurant-1");
              window.sessionStorage.setItem(key, "not-json");
              expect(readStoredStaffOrderTable("restaurant-1")).toBeNull();

              persistStaffOrderTable("restaurant-1", {
                id: "table-1",
                name: "T101",
              });
              clearStoredStaffOrderTable("restaurant-1");
              expect(readStoredStaffOrderTable("restaurant-1")).toBeNull();
            });

            it("uses the staff mobile breakpoint for automatic menu navigation", () => {
              Object.defineProperty(window, "matchMedia", {
                configurable: true,
                value: vi.fn().mockReturnValue({ matches: true }),
              });

              expect(isStaffOrderMobileViewport()).toBe(true);
            });
          });
          ''',
              encoding="utf-8",
          )

          Path("src/components/Staff/components/MenuOrdering.test.jsx").write_text(
              '''import React from "react";
          import { fireEvent, render, screen } from "@testing-library/react";
          import { describe, expect, it, vi } from "vitest";
          import { AuthContext } from "@/context/AuthContext";
          import MenuOrdering from "./MenuOrdering";

          describe("MenuOrdering selected table header", () => {
            it("shows the saved table context and returns to table selection", () => {
              const onChangeTable = vi.fn();

              render(
                <AuthContext.Provider value={{ user: { roleName: "manager" } }}>
                  <MenuOrdering
                    onAdd={vi.fn()}
                    onChangeTable={onChangeTable}
                    selectedTable={{
                      id: "table-1",
                      tableCode: "T101",
                      name: "T101",
                      floor: "Tầng 1",
                      guests: 4,
                    }}
                    menuItems={[]}
                    categories={["Tất cả"]}
                  />
                </AuthContext.Provider>,
              );

              expect(screen.getByText("T101")).toBeInTheDocument();
              expect(screen.getByText("Tầng 1 · 4 khách")).toBeInTheDocument();

              fireEvent.click(screen.getByRole("button", { name: "Đổi bàn" }));
              expect(onChangeTable).toHaveBeenCalledTimes(1);
            });
          });
          ''',
