            }

            .item-options-overlay .item-options-sheet .sheet-body .option-group .group-label {
              margin-bottom: 8px;
              font-size: 13px;
            }

            .item-options-overlay .item-options-sheet .sheet-body .chips-container {
              gap: 7px;
            }

            .item-options-overlay .item-options-sheet .sheet-body .option-chip {
              padding: 9px 11px;
              border-radius: 10px;
              font-size: 12px;
            }

            .item-options-overlay .item-options-sheet .sheet-footer {
              padding: 11px 14px calc(12px + env(safe-area-inset-bottom, 0px));
            }

            .item-options-overlay .item-options-sheet .sheet-footer .btn-confirm-add {
              min-height: 48px;
              padding: 12px;
              font-size: 15px;
            }
          }''',
          )

          append_once(
              "src/components/Staff/components/CartBottomSheet.scss",
              "/* Responsive cart branch from staff menu */",
              '''/* Responsive cart branch from staff menu */
          .staff-pos-cart-overlay .staff-pos-cart-sheet {
            height: min(92dvh, 760px);
            max-height: calc(100dvh - env(safe-area-inset-top, 0px));
          }

          @media (max-width: 640px) {
            .staff-pos-cart-overlay {
              padding-top: env(safe-area-inset-top, 0px);
            }

            .staff-pos-cart-overlay .staff-pos-cart-sheet {
              width: 100%;
              max-width: none;
              height: calc(100dvh - env(safe-area-inset-top, 0px));
              border-radius: 20px 20px 0 0;
            }

            .staff-pos-cart-overlay .staff-pos-cart-sheet .drag-indicator {
              padding: 9px 0 3px;
              border-radius: 20px 20px 0 0;
            }

            .staff-pos-cart-overlay .staff-pos-cart-sheet .sheet-header {
              padding: 7px 14px 11px;
            }

            .staff-pos-cart-overlay .staff-pos-cart-sheet .sheet-header .header-info h3 {
