name: One-shot staff order mobile flow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-staff-order-mobile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused mobile flow patch
        run: python .github/scripts/apply_staff_order_mobile_flow.py

      - name: Review patch integrity
        run: git diff --check

      - name: Commit focused update
        run: |
          git config user.name "COHAN Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(staff-order): streamline mobile table-to-menu flow"
          git push origin HEAD:main
