name: One-shot staff order mobile flow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-staff-order-mobile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused mobile flow patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path, marker, block):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if marker in text:
                  return
              file_path.write_text(text.rstrip() + "\n\n" + block.strip() + "\n", encoding="utf-8")

          staff_ordering = "src/components/Staff/StaffOrdering.jsx"
          replace_once(
              staff_ordering,
              'const STAFF_ASSISTED_CHANNEL = "staff_assisted";\n\nconst getCurrentStaffMenuTimeSlot',
              '''const STAFF_ASSISTED_CHANNEL = "staff_assisted";
          const STAFF_ORDER_TABLE_STORAGE_PREFIX =
            "cohan:staff-order:selected-table";

          const isStaffOrderMobileViewport = () =>
            typeof window !== "undefined" &&
            window.matchMedia?.("(max-width: 899px)")?.matches === true;

          const getStaffOrderTableStorageKey = (restaurantId) =>
            restaurantId
              ? `${STAFF_ORDER_TABLE_STORAGE_PREFIX}:${restaurantId}`
              : "";

          const readStoredStaffOrderTable = (restaurantId) => {
            const key = getStaffOrderTableStorageKey(restaurantId);
            if (!key || typeof window === "undefined") return null;

            try {
              const value = JSON.parse(window.sessionStorage.getItem(key) || "null");
              if (!value?.id || !value?.tableCode) return null;
              return {
                id: String(value.id),
                tableCode: String(value.tableCode),
              };
            } catch {
              return null;
            }
          };

          const persistStaffOrderTable = (restaurantId, table) => {
            const key = getStaffOrderTableStorageKey(restaurantId);
            const tableCode = table?.tableCode || table?.code || table?.name;
            if (!key || !table?.id || !tableCode || typeof window === "undefined") {
              return;
            }

            try {
              window.sessionStorage.setItem(
                key,
                JSON.stringify({
                  id: String(table.id),
                  tableCode: String(tableCode),
                }),
              );
            } catch {
              // Session storage may be unavailable in restricted browser modes.
            }
          };

          const clearStoredStaffOrderTable = (restaurantId) => {
            const key = getStaffOrderTableStorageKey(restaurantId);
            if (!key || typeof window === "undefined") return;

            try {
              window.sessionStorage.removeItem(key);
            } catch {
              // Session storage may be unavailable in restricted browser modes.
            }
          };

          const getCurrentStaffMenuTimeSlot''',
          )

          replace_once(
              staff_ordering,
              '''  const searchTimerRef = useRef(null);
            const customerSearchRef = useRef(null);
            const remoteSubmitKeyRef = useRef(null);
            const openRemoteOrderModal = useCallback(() => {''',
              '''  const searchTimerRef = useRef(null);
            const customerSearchRef = useRef(null);
            const remoteSubmitKeyRef = useRef(null);
            const mainContentRef = useRef(null);

            useEffect(() => {
              setSelectedTableId(null);
              setActiveTab("tables");
              setOrderMode("dine_in");
            }, [restaurantId]);

            const openRemoteOrderModal = useCallback(() => {''',
          )

          replace_once(
              staff_ordering,
              '''  const selectedTable = useMemo(
              () => tables.find((t) => t.id === selectedTableId),
              [tables, selectedTableId],
            );

            const cart = selectedTable ? cartByTable[selectedTable.id] || [] : [];''',
              '''  const selectedTable = useMemo(
              () => tables.find((t) => t.id === selectedTableId),
              [tables, selectedTableId],
            );

            const scrollStaffOrderToTop = useCallback(() => {
              window.requestAnimationFrame(() => {
                mainContentRef.current?.scrollTo({ top: 0, behavior: "auto" });
              });
            }, []);

            useEffect(() => {
              if (!restaurantId || selectedTableId || !tables.length) return;

              const stored = readStoredStaffOrderTable(restaurantId);
              if (!stored) return;

              const restoredTable = tables.find(
                (table) =>
                  String(table.id) === stored.id ||
                  String(table.tableCode || table.name || "") === stored.tableCode,
              );

              if (!restoredTable) {
                clearStoredStaffOrderTable(restaurantId);
                return;
              }

              setSelectedTableId(restoredTable.id);
              setOrderMode("dine_in");
              if (isStaffOrderMobileViewport()) {
                setActiveTab("menu");
                scrollStaffOrderToTop();
              }
            }, [restaurantId, scrollStaffOrderToTop, selectedTableId, tables]);

            const handleSelectTable = useCallback(
              (table) => {
                if (!table?.id) return;

                setSelectedTableId(table.id);
                setOrderMode("dine_in");
                persistStaffOrderTable(restaurantId, table);

                if (isStaffOrderMobileViewport()) {
                  setActiveTab("menu");
                  scrollStaffOrderToTop();
                }
              },
              [restaurantId, scrollStaffOrderToTop],
            );

            const handleChangeTable = useCallback(() => {
              setActiveTab("tables");
              scrollStaffOrderToTop();
            }, [scrollStaffOrderToTop]);

            const cart = selectedTable ? cartByTable[selectedTable.id] || [] : [];''',
          )

          replace_once(
              staff_ordering,
              '<div className={`staff-pos-main staff-pos-main--${activeTab}`}>',
              '<div ref={mainContentRef} className={`staff-pos-main staff-pos-main--${activeTab}`}>',
          )
          replace_once(
              staff_ordering,
              'onSelect={(t) => setSelectedTableId(t.id)}',
              'onSelect={handleSelectTable}',
          )
          replace_once(
              staff_ordering,
              '''              onRemoveCustomer={handleRemoveCustomer}
                        menuItems={menuItems}''',
              '''              onRemoveCustomer={handleRemoveCustomer}
                        onChangeTable={handleChangeTable}
                        menuItems={menuItems}''',
          )
          append_once(
              staff_ordering,
              "export const __testables = {",
              '''export const __testables = {
            getStaffOrderTableStorageKey,
            readStoredStaffOrderTable,
            persistStaffOrderTable,
            clearStoredStaffOrderTable,
            isStaffOrderMobileViewport,
          };''',
          )

          menu_ordering = "src/components/Staff/components/MenuOrdering.jsx"
          replace_once(menu_ordering, "  ChevronRight,\n", "")
          replace_once(
              menu_ordering,
              '''  onRemoveCustomer,
            menuItems = [],''',
              '''  onRemoveCustomer,
            onChangeTable,
            menuItems = [],''',
          )
          replace_once(
              menu_ordering,
              '''      <div className="table-status-banner">
                <div className="table-info">
                  <span className="label">Đang lên đơn</span>
                  <span className="table-name">{selectedTable.name}</span>
                </div>
                <ChevronRight size={18} className="icon-right" />
              </div>''',
              '''      <div className="table-status-banner">
                <div className="table-info">
                  <span className="label">Đang lên đơn</span>
                  <span className="table-name">
                    {selectedTable.tableCode || selectedTable.name}
                  </span>
                  <span className="table-meta">
                    {selectedTable.floor || "Khu vực hiện tại"} ·{" "}
                    {selectedTable.guests || selectedTable.capacity || 0} khách
                  </span>
                </div>
                <button
                  type="button"
                  className="btn-change-table"
                  onClick={onChangeTable}
                >
                  <MapPin size={15} aria-hidden="true" />
                  Đổi bàn
                </button>
              </div>''',
          )

          append_once(
              "src/components/Staff/StaffOrdering.scss",
              "/* Staff order mobile table-to-menu flow */",
              '''/* Staff order mobile table-to-menu flow */
          @media (max-width: 899px) {
            .staff-pos-main {
