name: PR 1103 CI diagnostics

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message != 'Record PR 1103 CI diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json
      - run: npm ci
      - run: npm --prefix cohan-restaurant-backend ci
      - name: Capture frontend tests
        run: |
          set +e
          npm run test:unit > pr1103-frontend-ci.txt 2>&1
          echo "frontend_status=$?" > pr1103-ci-status.txt
      - name: Capture backend tests
        run: |
          set +e
          npm --prefix cohan-restaurant-backend test > pr1103-backend-ci.txt 2>&1
          echo "backend_status=$?" >> pr1103-ci-status.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr1103-frontend-ci.txt pr1103-backend-ci.txt pr1103-ci-status.txt
          git commit -m "Record PR 1103 CI diagnostics"
          git push origin HEAD:codex/auth-rbac-clean
