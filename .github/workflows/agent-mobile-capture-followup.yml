name: Agent mobile capture follow-up

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/stabilize-mobile-5-photo-capture' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-mobile-5-photo-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply follow-up patch
        run: python scripts/agent_patch_mobile_capture_followup.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No follow-up changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/aiTableCaptureDraft.js \
            src/utils/aiTableCaptureDraft.test.js \
            src/components/Dashboard_Manager/Table/CustomTableModelBuilderModal.jsx \
            src/components/Dashboard_Manager/Table/CustomTableModelBuilderModal.test.jsx \
            src/components/Dashboard_Manager/Table/Table3DSimulatorModalV2.jsx \
            src/components/Dashboard_Manager/Table/Table3DPreviewLauncher.jsx \
            src/components/Dashboard_Manager/Table/Table3DPreviewLauncher.test.jsx
          git commit -m "fix(table-3d): restore capture flow after mobile reload"
          git push origin HEAD:agent/stabilize-mobile-5-photo-capture
