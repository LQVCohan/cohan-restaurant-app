name: Diagnose table unit tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 1246
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend schema dependencies
        run: npm --prefix cohan-restaurant-backend ci

      - name: Capture unit test output
        shell: bash
        run: |
          set +e
          npm run test:unit -- --reporter=verbose > unit-tests.log 2>&1
          status=$?
          set -e
          tail -n 500 unit-tests.log > unit-tests-tail.log
          echo "exit_status=${status}" >> unit-tests-tail.log

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: table-unit-test-log
          path: unit-tests-tail.log
          retention-days: 1
