name: Validate table management changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-table:
    if: github.event.pull_request.number == 1246
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix cohan-restaurant-backend ci

      - name: Check GraphQL contract
        run: npm run check:graphql

      - name: Run manager table component tests
        run: npx vitest run src/components/Dashboard_Manager/Table/TableManagement.test.jsx

      - name: Run table resolver tests
        run: npm --prefix cohan-restaurant-backend test -- tests/resolvers/table-restaurant-access.test.js

      - name: Build frontend
        run: npm run build
