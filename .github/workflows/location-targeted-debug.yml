name: location targeted debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-location-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture frontend test output
        run: |
          set +e
          npx vitest run src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.test.jsx --reporter=verbose > frontend-location.log 2>&1
          echo $? > frontend-location.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-location-debug
          path: |
            frontend-location.log
            frontend-location.status

  backend-location-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm ci
      - name: Capture backend test output
        run: |
          set +e
          npx vitest run tests/resolvers/restaurant-mutation-access.test.js --reporter=verbose > backend-location.log 2>&1
          echo $? > backend-location.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: backend-location-debug
          path: |
            cohan-restaurant-backend/backend-location.log
            cohan-restaurant-backend/backend-location.status
