name: backend-test-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm ci
      - name: Run backend suite
        continue-on-error: true
        run: npm run test -- --reporter=verbose > backend-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-log
          path: cohan-restaurant-backend/backend-test.log
