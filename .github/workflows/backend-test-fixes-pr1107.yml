name: PR 1107 backend test fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply PR 1107 backend test fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-rbac-ci-stabilization
          fetch-depth: 0
      - name: Patch stale backend test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cohan-restaurant-backend/tests/resolvers/order-discount-business.test.js')
          s = p.read_text()
          old = '''    it("resolves checkout customer rank aliases from restaurant rank settings", () => {
                const src = read(ORDER_MUTATION_PATH);
                const contextSrc = getNamedFunctionSnippet(src, "loadCheckoutUserRankContext");
                const rankSrc = getNamedFunctionSnippet(src, "resolveCheckoutCustomerRankAliases");

                expect(contextSrc).toMatch(/select\("loyaltyRank customerType loyaltyPoints totalSpending"\)/);
                expect(contextSrc).not.toMatch(/customerRank/);
                expect(rankSrc).toMatch(/getEffectiveCustomerRankSetting\(\{/);
                expect(rankSrc).toMatch(/resolveCustomerRankByPoints\(\{/);
                expect(rankSrc).toMatch(/buildCustomerRankAliases\(matchedRank\.name\)/);
                expect(rankSrc).not.toMatch(/CustomerRankSetting\.findOne/);
                expect(rankSrc).not.toMatch(/resolveLoyaltyRankFromPoints/);
                expect(rankSrc).not.toMatch(/resolveCustomerTypeFromLoyaltyPoints/);
              });'''
          new = '''    it("delegates checkout rank resolution to the centralized rank service", () => {
                const src = read(ORDER_MUTATION_PATH);

                expect(src).toMatch(/const loadCheckoutUserRankContext = loadCustomerRankContext/);
                expect(src).toMatch(/const resolveCheckoutCustomerRankAliases = resolveCustomerRankAliasesForRestaurant/);
                expect(src).toMatch(/loadCheckoutUserRankContext\(finalUserId, session\)/);
                expect(src).toMatch(/resolveCheckoutCustomerRankAliases\(\{/);
                expect(src).not.toMatch(/CustomerRankSetting\.findOne/);
              });'''
          if old not in s:
              raise SystemExit('order discount expectation block not found')
          p.write_text(s.replace(old, new))

          p = Path('cohan-restaurant-backend/tests/resolvers/order-payment-request-review.test.js')
          s = p.read_text()
          marker = 'vi.mock("../../models/index.js", () => modelMocks);\n'
          mocks = '''vi.mock("../../src/services/customerRankSetting.service.js", () => ({
            loadCustomerRankContext: vi.fn(),
            resolveCustomerRankAliasesForRestaurant: vi.fn(),
          }));
          vi.mock("../../src/services/auth/authorization.service.js", () => ({
            requireRestaurantPermission: vi.fn(async () => true),
          }));
          vi.mock("../../src/services/payment/transferExpiry.service.js", () => ({
            expireStaleTransferPayments: vi.fn(),
          }));
          vi.mock("../../src/services/discountCalculation.service.js", () => ({
            calculateDiscountBreakdown: vi.fn(),
          }));
          vi.mock("../../src/services/finance/financePermission.service.js", () => ({
            requireFinanceWrite: vi.fn(),
            requireReconciliationWrite: vi.fn(),
            requireRefundWrite: vi.fn(),
          }));
          vi.mock("../../src/services/finance/financeAudit.service.js", () => ({
            writeFinanceAudit: vi.fn(),
          }));
          vi.mock("../../src/services/finance/reconciliationMatching.service.js", () => ({
            chooseAutoMatch: vi.fn(),
            findReconciliationCandidates: vi.fn(),
            serializeCandidates: vi.fn(),
          }));
          vi.mock("../../src/services/orderTracking.service.js", () => ({
            emitCustomerTrackingUpdateIfChanged: vi.fn(),
          }));
          '''
          if mocks not in s:
              if marker not in s:
                  raise SystemExit('order payment model mock marker not found')
              s = s.replace(marker, marker + mocks)
          s = s.replace(
              'vi.mock("../../src/services/payment/paymentSession.service.js", () => ({ createReservationPayment: vi.fn() }));',
              'vi.mock("../../src/services/payment/paymentSession.service.js", () => ({ cancelPaymentSession: vi.fn(), createOrderPayment: vi.fn(), createReservationPayment: vi.fn(), sanitizePaymentSessionForClient: vi.fn((value) => value) }));',
          )
          s = s.replace('refRestaurants: ["65f000000000000000000099"],', 'restaurantIds: ["65f000000000000000000099"],')
          p.write_text(s)

          p = Path('cohan-restaurant-backend/tests/resolvers/payment-transfer-resubmit.test.js')
          s = p.read_text()
          marker = 'vi.mock("../../graphql/resolvers/order/helper/emitOrderEvent.js", () => emitMocks);\n'
          mocks = '''vi.mock("../../src/services/payment/paymentRealtime.service.js", () => ({
            emitPaymentRealtime: vi.fn(),
          }));
          vi.mock("../../src/services/payment/transferExpiry.service.js", () => ({
            cancelDraftTransferOrdersForExpiredPayment: vi.fn(),
          }));
          vi.mock("mongoose", () => ({
            default: {
              isValidObjectId: vi.fn(() => true),
              Types: {
                ObjectId: function ObjectId(value) {
                  this.value = value;
                  this.toString = () => String(value);
                },
              },
            },
          }));
          '''
          if mocks not in s:
              if marker not in s:
                  raise SystemExit('transfer emit mock marker not found')
              s = s.replace(marker, marker + mocks)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm --prefix cohan-restaurant-backend ci
      - name: Run affected backend tests
        run: npm --prefix cohan-restaurant-backend test -- tests/resolvers/order-discount-business.test.js tests/resolvers/order-payment-request-review.test.js tests/resolvers/payment-transfer-resubmit.test.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/tests/resolvers/order-discount-business.test.js cohan-restaurant-backend/tests/resolvers/order-payment-request-review.test.js cohan-restaurant-backend/tests/resolvers/payment-transfer-resubmit.test.js
          git commit -m "Apply PR 1107 backend test fixes"
          git pull --rebase origin codex/post-rbac-ci-stabilization
          git push origin HEAD:codex/post-rbac-ci-stabilization
