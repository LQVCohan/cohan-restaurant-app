name: ci

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  validate-brand-reinvite:
    if: github.head_ref == 'feature/brand-member-invitation-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch cancelled invitation resend flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              write(path, text.replace(old, new, 1))

          invitation = "cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js"
          replace_once(
              invitation,
              '''    if (membership.status !== "invited") {
                throw bad("Lời mời này không còn ở trạng thái chờ xác nhận.");
              }
              await assertInvitePermission(ctx, membership.brandId, membership.role);'''.replace("              ", ""),
              '''    const cancelledInvitation =
                membership.status === "inactive" &&
                membership.revokedFromStatus === "invited";
              if (membership.status !== "invited" && !cancelledInvitation) {
                throw bad("Lời mời này không còn ở trạng thái có thể gửi lại.");
              }
              await assertInvitePermission(ctx, membership.brandId, membership.role);'''.replace("              ", ""),
              "allow cancelled invitation resend",
          )
          replace_once(
              invitation,
              '''    membership.inviteTokenHash = hash;
              membership.inviteTokenExp = new Date(Date.now() + inviteTtlMs());
              membership.invitedAt = new Date();
              membership.invitedBy = oid(getUserId(ctx.user));
              membership.updatedBy = oid(getUserId(ctx.user));'''.replace("              ", ""),
              '''    membership.status = "invited";
              membership.inviteTokenHash = hash;
              membership.inviteTokenExp = new Date(Date.now() + inviteTtlMs());
              membership.invitedAt = new Date();
              membership.invitedBy = oid(getUserId(ctx.user));
              membership.revokedAt = null;
              membership.revokedBy = null;
              membership.revokedReason = null;
              membership.revokedFromStatus = null;
              membership.updatedBy = oid(getUserId(ctx.user));'''.replace("              ", ""),
              "reactivate cancelled invitation",
          )

          management = "src/components/Dashboard_Manager/Brand/BrandManagement.jsx"
          replace_once(
              management,
              '''      role
              status
              user {'''.replace("              ", ""),
              '''      role
              status
              revokedFromStatus
              user {'''.replace("              ", ""),
              "query revoked invitation source",
          )

          test = "src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx"
          text = read(test)
          if 'source.includes("mutation ResendBrandInvitationAccess")' not in text:
              anchor = '    if (source.includes("mutation RemoveBrandMemberAccess")) {'
              if text.count(anchor) != 1:
                  raise RuntimeError(f"resend mutation mapping anchor count: {text.count(anchor)}")
              mapping = '''    if (source.includes("mutation ResendBrandInvitationAccess")) {
                return [vi.fn().mockResolvedValue({ data: { resendBrandInvitation: {} } }), { loading: false }];
              }
              '''
              text = text.replace(anchor, mapping + anchor, 1)
              write(test, text)
          PY

      - name: Install dependencies without rewriting lockfiles
        run: |
          npm install --no-package-lock
          npm --prefix cohan-restaurant-backend install --no-package-lock

      - name: Run focused validation
        run: |
          node --check cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js
          node --check cohan-restaurant-backend/graphql/resolvers/brand/memberRoleConsistency.js
          npm --prefix cohan-restaurant-backend test -- tests/resolvers/brand-member-role-consistency.test.js tests/resolvers/brand-member-invitation-guards.test.js
          npm run check:graphql
          npx vitest run src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx
          npm run build

      - name: Commit validated resend flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js \
            src/components/Dashboard_Manager/Brand/BrandManagement.jsx \
            src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx
          git commit -m "feat: allow resending cancelled Brand invitations"
          git push origin HEAD:${{ github.head_ref }}
