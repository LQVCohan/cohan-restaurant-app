name: ci

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  validate-brand-reinvite:
    if: github.head_ref == 'feature/brand-member-invitation-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch cancelled invitation resend flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          invitation_path = Path("cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js")
          text = invitation_path.read_text(encoding="utf-8")
          start = text.index("  resendBrandInvitation: async")
          end = text.index("\n\n  acceptBrandInvitation:", start)
          block = text[start:end]

          old_status = '''    if (membership.status !== "invited") {
                throw bad("Lời mời này không còn ở trạng thái chờ xác nhận.");
              }'''.replace("              ", "")
          if old_status not in block:
              raise RuntimeError("resend status block not found")
          block = block.replace(
              old_status,
              '''    const cancelledInvitation =
                membership.status === "inactive" &&
                membership.revokedFromStatus === "invited";
              if (membership.status !== "invited" && !cancelledInvitation) {
                throw bad("Lời mời này không còn ở trạng thái có thể gửi lại.");
              }'''.replace("              ", ""),
              1,
          )

          old_token = '''    membership.inviteTokenHash = hash;
              membership.inviteTokenExp = new Date(Date.now() + inviteTtlMs());
              membership.invitedAt = new Date();
              membership.invitedBy = oid(getUserId(ctx.user));
              membership.updatedBy = oid(getUserId(ctx.user));'''.replace("              ", "")
          if old_token not in block:
              raise RuntimeError("resend token block not found")
          block = block.replace(
              old_token,
              '''    membership.status = "invited";
              membership.inviteTokenHash = hash;
              membership.inviteTokenExp = new Date(Date.now() + inviteTtlMs());
              membership.invitedAt = new Date();
              membership.invitedBy = oid(getUserId(ctx.user));
              membership.revokedAt = null;
              membership.revokedBy = null;
              membership.revokedReason = null;
              membership.revokedFromStatus = null;
              membership.updatedBy = oid(getUserId(ctx.user));'''.replace("              ", ""),
              1,
          )
          invitation_path.write_text(text[:start] + block + text[end:], encoding="utf-8")

          management_path = Path("src/components/Dashboard_Manager/Brand/BrandManagement.jsx")
          management = management_path.read_text(encoding="utf-8")
          query_anchor = "      role\n      status\n      user {"
          if management.count(query_anchor) != 1:
              raise RuntimeError(f"member query anchor count: {management.count(query_anchor)}")
          management_path.write_text(
              management.replace(
                  query_anchor,
                  "      role\n      status\n      revokedFromStatus\n      user {",
                  1,
              ),
              encoding="utf-8",
          )

          test_path = Path("src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx")
          test = test_path.read_text(encoding="utf-8")
          if 'source.includes("mutation ResendBrandInvitationAccess")' not in test:
              anchor = '    if (source.includes("mutation RemoveBrandMemberAccess")) {'
              if test.count(anchor) != 1:
                  raise RuntimeError(f"resend test mapping anchor count: {test.count(anchor)}")
              mapping = '''    if (source.includes("mutation ResendBrandInvitationAccess")) {
                return [vi.fn().mockResolvedValue({ data: { resendBrandInvitation: {} } }), { loading: false }];
              }
              '''
              test = test.replace(anchor, mapping + anchor, 1)
              test_path.write_text(test, encoding="utf-8")
          PY

      - name: Install dependencies without rewriting lockfiles
        run: |
          npm install --no-package-lock
          npm --prefix cohan-restaurant-backend install --no-package-lock

      - name: Run focused validation
        run: |
          node --check cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js
          node --check cohan-restaurant-backend/graphql/resolvers/brand/memberRoleConsistency.js
          npm --prefix cohan-restaurant-backend test -- tests/resolvers/brand-member-role-consistency.test.js tests/resolvers/brand-member-invitation-guards.test.js
          npm run check:graphql
          npx vitest run src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx
          npm run build

      - name: Commit validated resend flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js \
            src/components/Dashboard_Manager/Brand/BrandManagement.jsx \
            src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx
          git commit -m "feat: allow resending cancelled Brand invitations"
          git push origin HEAD:${{ github.head_ref }}
