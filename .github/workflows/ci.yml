name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend schema dependencies
        run: npm --prefix cohan-restaurant-backend ci

      - name: Check unresolved conflict markers
        run: npm run check:conflicts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 20m \
            npm run test:unit -- \
            --detectAsyncLeaks \
            --maxWorkers=2 \
            2>&1 | tee /tmp/frontend-unit.log

      - name: Upload frontend unit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-log
          path: /tmp/frontend-unit.log
          if-no-files-found: ignore

      - name: Test Menu RBAC
        run: npm run test:menu-rbac --if-present

      - name: Component tests for changed code
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          TEST_BASE="$(git merge-base HEAD "origin/${BASE_REF}")"
          echo "Running component tests for changes since ${TEST_BASE} (origin/${BASE_REF})"
          timeout --signal=TERM --kill-after=30s 15m \
            npm run test:component -- \
            --changed "${TEST_BASE}" \
            --detectAsyncLeaks \
            --maxWorkers=2

      - name: Full component tests
        if: github.event_name != 'pull_request'
        run: >-
          timeout --signal=TERM --kill-after=30s 30m
          npm run test:component --
          --detectAsyncLeaks
          --maxWorkers=2

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm run test --if-present 2>&1 | tee /tmp/backend-test.log

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: /tmp/backend-test.log
          if-no-files-found: ignore

      - name: Test Menu RBAC
        run: npm run test:menu-rbac --if-present

      - name: Build
        run: npm run build --if-present
