name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend schema dependencies
        run: npm --prefix cohan-restaurant-backend ci

      - name: Check unresolved conflict markers
        run: npm run check:conflicts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Test Menu RBAC
        run: npm run test:menu-rbac --if-present

      - name: Component tests for changed code
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          TEST_BASE="$(git merge-base HEAD "origin/${BASE_REF}")"
          echo "Running component tests for changes since ${TEST_BASE} (origin/${BASE_REF})"
          timeout --signal=TERM --kill-after=30s 15m \
            npm run test:component -- \
            --changed "${TEST_BASE}" \
            --detectAsyncLeaks \
            --maxWorkers=2

      - name: Full component tests
        if: github.event_name != 'pull_request'
        run: >-
          timeout --signal=TERM --kill-after=30s 30m
          npm run test:component --
          --detectAsyncLeaks
          --maxWorkers=2

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Test Menu RBAC
        run: npm run test:menu-rbac --if-present

      - name: Build
        run: npm run build --if-present

  patch-restaurant-hours:
    name: patch restaurant hours
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1244
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/restaurant-hours-controls
          fetch-depth: 0

      - name: Apply and push the component patch
        run: |
          if grep -q 'const getHoursValidationError' src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx; then
            echo "Restaurant hours patch already applied"
            exit 0
          fi

          git fetch origin main
          git show origin/main:.github/workflows/temp-patch-restaurant-hours-pr.yml > /tmp/patch-workflow.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/patch-workflow.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start + 1:end]
          ) + '\n'
          Path('/tmp/restaurant-hours-patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/restaurant-hours-patch.py

          git diff --check
          grep -q 'type="time"' src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx
          grep -q 'getHoursValidationError' src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx \
            src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.test.jsx \
            src/styles/RestaurantProfileHoursResponsiveFix.css
          git commit -m "fix: upgrade restaurant opening hours controls"
          git push origin HEAD:fix/restaurant-hours-controls
