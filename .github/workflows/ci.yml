name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend schema dependencies
        run: npm --prefix cohan-restaurant-backend ci

      - name: Check unresolved conflict markers
        run: npm run check:conflicts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Test Menu RBAC
        run: npm run test:menu-rbac --if-present

      - name: Component tests
        id: component-tests
        continue-on-error: true
        run: npm run test:component > component-test.log 2>&1

      - name: Upload component test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-log
          path: component-test.log

      - name: Fail when component tests fail
        if: steps.component-tests.outcome == 'failure'
        run: exit 1

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Test Menu RBAC
        run: npm run test:menu-rbac --if-present

      - name: Build
        run: npm run build --if-present
