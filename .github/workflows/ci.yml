name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend schema dependencies
        run: npm --prefix cohan-restaurant-backend ci

      - name: Check unresolved conflict markers
        run: npm run check:conflicts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --reporter=dot

      - name: Test Menu RBAC
        run: npm run test:menu-rbac --if-present

      - name: Component tests for changed code
        if: github.event_name == 'pull_request'
        run: >-
          timeout --signal=TERM --kill-after=30s 15m
          npm run test:component --
          --changed "${{ github.event.pull_request.base.sha }}"
          --detectAsyncLeaks
          --maxWorkers=2

      - name: Full component tests
        if: github.event_name != 'pull_request'
        run: >-
          timeout --signal=TERM --kill-after=30s 30m
          npm run test:component --
          --detectAsyncLeaks
          --maxWorkers=2

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Test Menu RBAC
        run: npm run test:menu-rbac --if-present

      - name: Build
        run: npm run build --if-present
