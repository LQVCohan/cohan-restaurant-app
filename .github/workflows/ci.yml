name: ci

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  validate-brand-revocation:
    if: github.head_ref == 'feature/brand-member-invitation-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch BrandManagement component tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "const updateMemberMock = vi.fn();",
              "const updateMemberMock = vi.fn();\nconst removeMemberMock = vi.fn();",
              "remove member mock declaration",
          )

          replace_once(
              '''  updateMemberMock.mockResolvedValue({
                data: { updateBrandMember: { id: "m1", role: "manager", status: "inactive" } },
              });''',
              '''  updateMemberMock.mockResolvedValue({
                data: { updateBrandMember: { id: "m1", role: "manager", status: "inactive" } },
              });
              removeMemberMock.mockResolvedValue({
                data: { removeBrandMember: true },
              });
              window.confirm = vi.fn(() => true);''',
              "remove member mock setup",
          )

          replace_once(
              '''    if (source.includes("mutation UpdateBrand")) {
                return [updateBrandMock, { loading: false }];
              }''',
              '''    if (source.includes("mutation RemoveBrandMemberAccess")) {
                return [removeMemberMock, { loading: false }];
              }
              if (source.includes("mutation UpdateBrand")) {
                return [updateBrandMock, { loading: false }];
              }''',
              "remove member mutation mapping",
          )

          new_test = dedent('''
            it("revokes Brand access from the existing membership access panel", async () => {
              render(<BrandManagement />);

              fireEvent.click(screen.getByText("Đổi vai trò và phạm vi"));
              fireEvent.change(screen.getByLabelText("Thành viên cần đổi quyền"), {
                target: { value: "m1" },
              });
              fireEvent.click(screen.getByRole("button", { name: "Tháo quyền Brand" }));

              await waitFor(() => expect(removeMemberMock).toHaveBeenCalledTimes(1));
              expect(window.confirm).toHaveBeenCalledWith(
                "Tháo quyền Brand của thành viên này? Tài khoản và dữ liệu lịch sử vẫn được giữ.",
              );
              expect(removeMemberMock.mock.calls[0][0].variables).toEqual({
                id: "m1",
                reason: "Tháo quyền từ trang quản lý chuỗi",
              });
              expect(message.success).toHaveBeenCalledWith("Đã tháo quyền Brand");
            });

          ''')
          anchor = '  it("searches by employee name or account ID and filters by role and branch", async () => {'
          replace_once(anchor, new_test + anchor, "revocation component test")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies without rewriting lockfiles
        run: |
          npm install --no-package-lock
          npm --prefix cohan-restaurant-backend install --no-package-lock

      - name: Run focused validation
        run: |
          node --check cohan-restaurant-backend/graphql/resolvers/brand/memberRoleConsistency.js
          node --check cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js
          node --check cohan-restaurant-backend/models/brandMembership.model.js
          npm --prefix cohan-restaurant-backend test -- tests/resolvers/brand-member-role-consistency.test.js tests/resolvers/brand-member-invitation-guards.test.js
          npm run check:graphql
          npx vitest run src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx
          npm run build

      - name: Commit validated test and restore CI
        shell: bash
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx
          git commit -m "test: cover Brand access revocation UI"
          git push origin HEAD:${{ github.head_ref }}
