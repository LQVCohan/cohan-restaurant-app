name: Apply customer modifier retry UX

on:
  push:
    branches:
      - codex/customer-menu-ux-final-hardening
    paths:
      - scripts/apply-customer-modifier-retry.mjs
      - .github/workflows/apply-customer-modifier-retry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-menu-ux-final-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted patch
        run: |
          node --check scripts/apply-customer-modifier-retry.mjs
          node scripts/apply-customer-modifier-retry.mjs
          node --check src/utils/foodOrderingActionState.js
          git diff --check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(customer): add modifier retry and accurate stock state"
          git push origin HEAD:codex/customer-menu-ux-final-hardening
