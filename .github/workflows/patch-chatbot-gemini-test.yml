name: patch-chatbot-gemini-test

on:
  push:
    branches: [fix/restaurant-brand-membership-guards]
    paths:
      - .github/workflows/patch-chatbot-gemini-test.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restaurant-brand-membership-guards
          fetch-depth: 0
      - name: Align provider context assertion with Gemini payload
        shell: python
        run: |
          from pathlib import Path

          path = Path("cohan-restaurant-backend/tests/services/restaurantChatbot.service.test.js")
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = '  it("provider receives safe user/page/navigation context", async () => {'
          start = lines.index(marker)
          stub = next(i for i in range(start, len(lines)) if 'vi.stubGlobal("fetch", fetchMock);' in lines[i])
          lines[start + 1:stub] = [
              '    process.env.GEMINI_API_KEY = "test";',
              '    const fetchMock = mockGeminiFetch({ answer: "ok", intent: "navigation", confidence: 0.9, quickReplies: [], actions: [], sources: [] });',
          ]
          old_system = '    const system = body.messages[0].content;'
          system_index = lines.index(old_system, start)
          lines[system_index] = '    const system = body.systemInstruction.parts[0].text;'
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit test update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/tests/services/restaurantChatbot.service.test.js
          git diff --cached --check
          git commit -m "test(ai): align provider prompt assertion with Gemini"
          git push origin HEAD:fix/restaurant-brand-membership-guards
