name: debug-ci

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: debug-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: build failure summary
    runs-on: ubuntu-latest
    steps:
      - name: Run build and show failure
        run: |
          git clone -q --depth=1 --branch "${{ github.head_ref }}" https://github.com/${{ github.repository }} repo
          cd repo
          npm ci --silent --no-audit --no-fund >/dev/null 2>&1
          npm --prefix cohan-restaurant-backend ci --silent --no-audit --no-fund >/dev/null 2>&1
          set +e
          npm run build > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo BUILD_FAILED
            grep -E "error|Error|failed|Failed|does not provide an export|not exported|Unexpected|SyntaxError|ReferenceError" /tmp/build.log | tail -n 160
            tail -n 120 /tmp/build.log
          else
            echo BUILD_PASSED
          fi
          exit "$status"
