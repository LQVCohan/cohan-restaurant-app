name: search-validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/global-search-catalog-chefs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --silent
          npm --prefix cohan-restaurant-backend ci --silent
      - name: Capture backend suite
        run: npm --prefix cohan-restaurant-backend test > backend-tests.log 2>&1 || true
      - name: Upload backend diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-tests.log
          retention-days: 1
      - name: Backend search tests
        run: npm --prefix cohan-restaurant-backend test -- tests/resolvers/search-public-safety.test.js --reporter=verbose
      - name: Frontend search tests
        run: npx vitest run src/components/Customer/Homepage_Client/MobileHome.test.jsx src/pages/SearchPage.test.jsx --reporter=verbose
      - name: GraphQL contract
        run: npm run check:graphql
      - name: Build
        run: npm run build
