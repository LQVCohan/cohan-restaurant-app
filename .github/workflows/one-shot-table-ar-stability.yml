name: One-shot table AR stability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-table-ar-stability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused AR stability patch
        run: |
          python - <<'PY'
          from pathlib import Path

          modal_path = Path("src/components/Dashboard_Manager/Table/Table3DSimulatorModalV2.jsx")
          modal = modal_path.read_text(encoding="utf-8")

          replacements = [
              (
                  "  const canOpenAr = canOpenModelViewerAr(selectedModel);",
                  '''  const arModes =
            capabilities.webxr == null
              ? "none"
              : capabilities.webxr
                ? "webxr"
                : "scene-viewer quick-look";
          const canOpenAr = canOpenModelViewerAr(selectedModel);''',
              ),
              (
                  '"WebXR sẽ nhận diện mặt phẳng sàn trước khi đặt mô hình bàn."',
                  '"WebXR sẽ giữ mô hình ở anchor mặt sàn với tỷ lệ cố định."',
              ),
              (
                  '"Mô hình sẽ mở bằng Scene Viewer hoặc Quick Look để nhận diện mặt phẳng."',
                  '"Mô hình sẽ mở bằng Scene Viewer hoặc Quick Look; độ ổn định tracking phụ thuộc thiết bị."',
              ),
              ('viewer.setAttribute("ar-scale", "auto");', 'viewer.setAttribute("ar-scale", "fixed");'),
              ('ar-modes="webxr scene-viewer quick-look"', 'ar-modes={arModes}'),
              ('ar-scale="auto"', 'ar-scale="fixed"'),
          ]

          for old, new in replacements:
              if modal.count(old) != 1:
                  raise SystemExit(f"Unexpected modal match count for {old!r}: {modal.count(old)}")
              modal = modal.replace(old, new, 1)

          modal_path.write_text(modal, encoding="utf-8")

          guide_path = Path("src/components/Dashboard_Manager/Table/Table3DQuickGuide.jsx")
          guide = guide_path.read_text(encoding="utf-8")
          old_guide = '''          vật vì thiết bị có thể nhận nhầm chúng là mặt phẳng đặt bàn. Sau khi đặt,
          dùng hai ngón tay để thu nhỏ hoặc phóng to mô hình cho đúng tỉ lệ thực tế.
          Chế độ xem thử này không thay đổi dữ liệu bàn hoặc sơ đồ tầng.'''
          new_guide = '''          vật vì thiết bị có thể nhận nhầm chúng là mặt phẳng đặt bàn. Chỉ đặt khi
          mặt sàn đã ổn định; sau khi đặt không kéo hoặc chụm hai ngón vì tỷ lệ AR
          đã được khóa để hạn chế mô hình phóng, thu hoặc trôi khi camera đổi khoảng
          cách. Nếu model vẫn sai tỷ lệ, hãy dùng file có đơn vị mét chuẩn. Chế độ
          xem thử này không thay đổi dữ liệu bàn hoặc sơ đồ tầng.'''
          if guide.count(old_guide) != 1:
              raise SystemExit(f"Unexpected guide match count: {guide.count(old_guide)}")
          guide_path.write_text(guide.replace(old_guide, new_guide, 1), encoding="utf-8")
          PY

      - name: Review patch integrity
        run: git diff --check

      - name: Commit focused update
        run: |
          rm .github/workflows/one-shot-table-ar-stability.yml
          git config user.name "COHAN Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(table3d): stabilize native AR placement"
          git push origin HEAD:main
