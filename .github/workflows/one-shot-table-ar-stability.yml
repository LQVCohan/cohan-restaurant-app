name: One-shot table AR stability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-table-ar-stability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused AR stability patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          modal = "src/components/Dashboard_Manager/Table/Table3DSimulatorModalV2.jsx"
          replace_once(
              modal,
              '''  const canOpenAr = canOpenModelViewerAr(selectedModel);
              const canLaunchNativeAr = Boolean(''',
              '''  const arModes =
                capabilities.webxr == null
                  ? "none"
                  : capabilities.webxr
                    ? "webxr"
                    : "scene-viewer quick-look";
              const canOpenAr = canOpenModelViewerAr(selectedModel);
              const canLaunchNativeAr = Boolean(''',
          )
          replace_once(
              modal,
              '''        description:
                    "WebXR sẽ nhận diện mặt phẳng sàn trước khi đặt mô hình bàn.",''',
              '''        description:
                    "WebXR sẽ giữ mô hình ở anchor mặt sàn với tỷ lệ cố định.",''',
          )
          replace_once(
              modal,
              '''      description:
                "Mô hình sẽ mở bằng Scene Viewer hoặc Quick Look để nhận diện mặt phẳng.",''',
              '''      description:
                "Mô hình sẽ mở bằng Scene Viewer hoặc Quick Look; độ ổn định tracking phụ thuộc thiết bị.",''',
          )
          replace_once(
              modal,
              '      viewer.setAttribute("ar-scale", "auto");',
              '      viewer.setAttribute("ar-scale", "fixed");',
          )
          replace_once(
              modal,
              '''                ar-modes="webxr scene-viewer quick-look"
                          ar-placement="floor"
                          ar-scale="auto"''',
              '''                ar-modes={arModes}
                          ar-placement="floor"
                          ar-scale="fixed"''',
          )

          guide = "src/components/Dashboard_Manager/Table/Table3DQuickGuide.jsx"
          replace_once(
              guide,
              '''          Lùi khỏi vị trí đặt khoảng 1,5–2 m, hướng camera xuống vùng sàn trống,
                    đủ sáng và di chuyển chậm sang hai bên. Tránh quét giường, ghế hoặc đồ
                    vật vì thiết bị có thể nhận nhầm chúng là mặt phẳng đặt bàn. Sau khi đặt,
                    dùng hai ngón tay để thu nhỏ hoặc phóng to mô hình cho đúng tỉ lệ thực tế.
                    Chế độ xem thử này không thay đổi dữ liệu bàn hoặc sơ đồ tầng.''',
              '''          Lùi khỏi vị trí đặt khoảng 1,5–2 m, hướng camera xuống vùng sàn trống,
                    đủ sáng và di chuyển chậm sang hai bên. Chỉ đặt khi mặt sàn đã được nhận
                    diện ổn định; sau khi đặt không kéo hoặc chụm hai ngón vì tỷ lệ AR đã được
                    khóa để hạn chế mô hình phóng, thu hoặc trôi khi camera đổi khoảng cách.
                    Nếu model vẫn sai tỷ lệ, hãy dùng file có đơn vị mét chuẩn. Chế độ xem thử
                    này không thay đổi dữ liệu bàn hoặc sơ đồ tầng.''',
          )

          test = "src/components/Dashboard_Manager/Table/Table3DSimulatorModalV2.test.jsx"
          replace_once(
              test,
              '    expect(viewer).toHaveAttribute("ar-scale", "auto");',
              '    expect(viewer).toHaveAttribute("ar-scale", "fixed");',
          )
          replace_once(
              test,
              '''    expect(viewer).toHaveAttribute(
                    "ar-modes",
                    "webxr scene-viewer quick-look",
                  );''',
              '''    await waitFor(() =>
                    expect(viewer).toHaveAttribute("ar-modes", "webxr"),
                  );''',
          )
          replace_once(
              test,
              '''    fireEvent.click(screen.getByRole("button", { name: /Mở camera AR/i }));

                  await waitFor(() => expect(viewer.activateAR).toHaveBeenCalledTimes(1));''',
              '''    fireEvent.click(screen.getByRole("button", { name: /Mở camera AR/i }));

                  await waitFor(() => expect(viewer.activateAR).toHaveBeenCalledTimes(1));
                  expect(viewer).toHaveAttribute("ar-scale", "fixed");''',
          )
          PY

      - name: Review patch integrity
        run: git diff --check

      - name: Commit focused update
        run: |
          rm .github/workflows/one-shot-table-ar-stability.yml
          git config user.name "COHAN Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Dashboard_Manager/Table/Table3DSimulatorModalV2.jsx \
                  src/components/Dashboard_Manager/Table/Table3DQuickGuide.jsx \
                  src/components/Dashboard_Manager/Table/Table3DSimulatorModalV2.test.jsx \
                  .github/workflows/one-shot-table-ar-stability.yml
          git commit -m "fix(table3d): stabilize native AR placement"
          git push origin HEAD:main
