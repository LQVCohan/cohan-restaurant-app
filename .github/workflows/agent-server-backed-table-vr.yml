name: Agent server-backed table VR patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/customer-table-vr-and-safe-back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-table-vr-and-safe-back
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply server-backed VR patch
        run: python .agent/patch_server_backed_table_vr.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useAvatarUploadLocal.js \
            src/utils/tableVrImageProcessing.js \
            src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx \
            src/components/Customer/TableBooking/TableBooking.jsx \
            src/components/Customer/VRViewer/VRViewer.jsx \
            src/utils/tableVrNavigation.js \
            src/utils/tableVrNavigation.test.js
          git diff --cached --quiet || git commit -m "fix: persist table panoramas through local backend upload"
          git push origin HEAD:agent/customer-table-vr-and-safe-back
