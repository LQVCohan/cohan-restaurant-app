name: Temporary customer Brand promotion update

on:
  push:
    branches:
      - feature/brand-member-invitation-flow

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-member-invitation-flow
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply customer promotion patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              write(path, text.replace(old, new, 1))

          def replace_between(path, start_marker, end_marker, replacement, label):
              text = read(path)
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(f"{label}: marker not found")
              write(path, text[:start] + replacement + text[end:])

          consistency = "cohan-restaurant-backend/graphql/resolvers/brand/memberRoleConsistency.js"
          replace_once(
              consistency,
              'import { BrandMembership, User } from "../../../models/index.js";',
              'import { BrandMembership, Role, User } from "../../../models/index.js";',
              "consistency imports",
          )
          compatibility = dedent('''
          export async function assertBrandMembershipAccountCompatibility({
            userId,
            membershipRole,
            session = null,
            allowCustomerPromotion = false,
          }) {
            const account = await loadAccount(userId, session);
            if (!account) throw bad("Không tìm thấy tài khoản thành viên.");

            const accountRole = accountRoleOf(account);
            const nextMembershipRole = String(membershipRole || "").trim().toLowerCase();
            if (!accountRole) {
              throw bad("Tài khoản chưa có vai trò hệ thống.");
            }

            const promotesCustomer =
              allowCustomerPromotion &&
              account.userType === "CUSTOMER" &&
              accountRole === "customer" &&
              ["admin", "manager"].includes(nextMembershipRole);

            if (nextMembershipRole === "manager" && accountRole !== "manager" && !promotesCustomer) {
              throw bad(
                accountRole === "admin"
                  ? "Admin hệ thống không được gán làm Quản lý chi nhánh."
                  : "Quản lý chi nhánh phải sử dụng tài khoản Manager hoặc Customer hợp lệ.",
              );
            }

            if (nextMembershipRole === "admin" && accountRole !== "manager" && !promotesCustomer) {
              throw bad(
                accountRole === "admin"
                  ? "Admin hệ thống đã có phạm vi toàn hệ thống và không được gán làm Quản trị chuỗi."
                  : "Quản trị chuỗi phải sử dụng tài khoản Manager hoặc Customer hợp lệ.",
              );
            }

            if (
              nextMembershipRole === "staff" &&
              ["admin", "manager", "customer"].includes(accountRole)
            ) {
              throw bad(
                "Nhân viên chi nhánh phải sử dụng vai trò nhân sự phù hợp; hãy đổi vai trò hệ thống trước khi hạ quyền trong chuỗi.",
              );
            }

            return account;
          }

          export async function promoteCustomerAccountToManager({ userId, session = null }) {
            const roleQuery = Role.findOne({
              $or: [{ slug: "manager" }, { name: /^manager$/i }],
            }).select("_id");
            if (session) roleQuery.session(session);
            const managerRole = await roleQuery.lean();
            if (!managerRole) throw bad("Không tìm thấy vai trò Manager trong hệ thống.");

            const result = await User.updateOne(
              { _id: userId, userType: "CUSTOMER" },
              { $set: { userType: "MANAGER", role: managerRole._id } },
              {
                ...(session ? { session } : {}),
                runValidators: true,
                overwriteDiscriminatorKey: true,
              },
            );
            if ((result.matchedCount ?? result.n ?? 0) !== 1) {
              throw bad("Tài khoản không còn ở trạng thái Customer để nâng quyền.");
            }

            return managerRole._id;
          }

          ''').lstrip()
          replace_between(
              consistency,
              "export async function assertBrandMembershipAccountCompatibility({",
              "export function guardBrandMemberRoleMutations",
              compatibility,
              "compatibility function",
          )
          replace_once(
              consistency,
              dedent('''
                      await assertBrandMembershipAccountCompatibility({
                        userId: input.userId,
                        membershipRole: input.role,
                      });
              ''').strip("\n"),
              dedent('''
                      await assertBrandMembershipAccountCompatibility({
                        userId: input.userId,
                        membershipRole: input.role,
                        allowCustomerPromotion: ["admin", "manager"].includes(input.role),
                      });
              ''').strip("\n"),
              "guard invitation compatibility",
          )

          invitation = "cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js"
          replace_once(
              invitation,
              'import { assertBrandMembershipAccountCompatibility } from "./memberRoleConsistency.js";',
              dedent('''
              import {
                assertBrandMembershipAccountCompatibility,
                promoteCustomerAccountToManager,
              } from "./memberRoleConsistency.js";
              ''').strip(),
              "invitation imports",
          )
          replace_once(
              invitation,
              dedent('''
                    await assertBrandMembershipAccountCompatibility({
                      userId: user._id,
                      membershipRole: input.role,
                      session,
                    });
              ''').strip("\n"),
              dedent('''
                    await assertBrandMembershipAccountCompatibility({
                      userId: user._id,
                      membershipRole: input.role,
                      session,
                      allowCustomerPromotion: true,
                    });
              ''').strip("\n"),
              "create invitation compatibility",
          )
          replace_once(
              invitation,
              "const user = await User.findById(membership.userId).session(session);",
              'const user = await User.findById(membership.userId).populate("role").session(session);',
              "acceptance user lookup",
          )
          replace_once(
              invitation,
              dedent('''
                    if (!["active", "pending"].includes(user.status)) {
                      throw forbidden("Tài khoản đang bị khóa hoặc tạm ngưng.");
                    }

                    if (membership.role === "manager") {
              ''').strip("\n"),
              dedent('''
                    if (!["active", "pending"].includes(user.status)) {
                      throw forbidden("Tài khoản đang bị khóa hoặc tạm ngưng.");
                    }

                    const currentAccountRole = roleName(user);
                    const promotesCustomer =
                      user.userType === "CUSTOMER" && currentAccountRole === "customer";
                    const isManagerAccount =
                      user.userType === "MANAGER" && currentAccountRole === "manager";
                    if (!promotesCustomer && !isManagerAccount) {
                      throw bad(
                        "Lời mời chỉ có thể được xác nhận bởi tài khoản Customer hoặc Manager hợp lệ.",
                      );
                    }

                    if (membership.role === "manager") {
              ''').strip("\n"),
              "acceptance account validation",
          )
          replace_once(
              invitation,
              dedent('''
                    if (user.status === "pending") user.status = "active";
                    await user.save({ session });

                    membership.status = "active";
              ''').strip("\n"),
              dedent('''
                    if (user.status === "pending") user.status = "active";
                    await user.save({ session });

                    if (promotesCustomer) {
                      await promoteCustomerAccountToManager({ userId: user._id, session });
                    }

                    membership.status = "active";
              ''').strip("\n"),
              "acceptance customer promotion",
          )

          brand_resolver = "cohan-restaurant-backend/graphql/resolvers/brand/index.js"
          replace_once(
              brand_resolver,
              'userType: { $in: ["STAFF", "MANAGER", "HR", "ACCOUNTANT", "ADMIN"] },',
              'userType: { $in: ["CUSTOMER", "STAFF", "MANAGER", "HR", "ACCOUNTANT", "ADMIN"] },',
              "customer candidate search",
          )

          ui = "src/components/Dashboard_Manager/Brand/BrandManagement.jsx"
          replace_once(
              ui,
              dedent('''
              const getCandidateLabel = (candidate) => {
                const name =
                  candidate?.fullName || candidate?.username || candidate?.email || "Tài khoản";
                const identity = candidate?.email || candidate?.username || candidate?.id;
                return `${name} — ${identity} · ID: ${candidate?.id}`;
              };
              ''').strip(),
              dedent('''
              const getCandidateLabel = (candidate) => {
                const name =
                  candidate?.fullName || candidate?.username || candidate?.email || "Tài khoản";
                const identity = candidate?.email || candidate?.username || candidate?.id;
                const source = String(candidate?.id || "").startsWith("invite:")
                  ? "Tài khoản mới"
                  : candidate?.userType === "CUSTOMER"
                    ? "Khách hàng hiện có"
                    : "Tài khoản quản lý";
                return `${name} — ${identity} · ${source} · ID: ${candidate?.id}`;
              };
              ''').strip(),
              "candidate label",
          )
          replace_once(
              ui,
              dedent('''
                const candidates = candidateSearchReady
                  ? candidateData?.brandMemberCandidates || []
                  : [];
                const selectedCandidate = candidates.find(
              ''').strip("\n"),
              dedent('''
                const rawCandidates = candidateSearchReady
                  ? candidateData?.brandMemberCandidates || []
                  : [];
                const candidates = rawCandidates.filter((candidate) =>
                  member.role === "staff"
                    ? candidate.userType !== "CUSTOMER"
                    : ["CUSTOMER", "MANAGER"].includes(candidate.userType),
                );
                const selectedCandidate = candidates.find(
              ''').strip("\n"),
              "candidate role filter",
          )
          replace_once(
              ui,
              '      message.success("Đã cập nhật thành viên trong chuỗi");',
              dedent('''
                    message.success(
                      member.role === "staff"
                        ? "Đã cập nhật thành viên trong chuỗi"
                        : "Đã gửi lời mời tham gia chuỗi",
                    );
              ''').strip("\n"),
              "invitation success message",
          )
          replace_once(
              ui,
              dedent('''
                                      role: event.target.value,
                                      restaurantIds: [],
              ''').strip("\n"),
              dedent('''
                                      role: event.target.value,
                                      userId: "",
                                      restaurantIds: [],
              ''').strip("\n"),
              "clear candidate after role change",
          )
          replace_once(
              ui,
              '{addingMember ? "Đang thêm..." : "Thêm thành viên"}',
              dedent('''
              {addingMember
                ? member.role === "staff" ? "Đang thêm..." : "Đang gửi..."
                : member.role === "staff" ? "Thêm thành viên" : "Gửi lời mời"}
              ''').strip(),
              "invite button wording",
          )
          replace_once(
              ui,
              dedent('''
                                      : "Không tìm thấy tài khoản chưa thuộc chuỗi."}
                              </small>
                            </label>
                          </div>
              ''').strip("\n"),
              dedent('''
                                      : "Không tìm thấy tài khoản chưa thuộc chuỗi."}
                              </small>
                            </label>
                            {selectedCandidate?.userType === "CUSTOMER" && member.role !== "staff" && (
                              <div className="brand-scope-note">
                                <strong>Tài khoản khách hàng hiện có</strong>
                                <span>
                                  Quyền chỉ chuyển sang Manager sau khi người này xác nhận lời mời qua email.
                                </span>
                              </div>
                            )}
                          </div>
              ''').strip("\n"),
              "customer promotion note",
          )

          backend_test = "cohan-restaurant-backend/tests/resolvers/brand-member-invitation-guards.test.js"
          replace_once(
              backend_test,
              dedent('''
                User: {
                  findById: vi.fn(),
                },
              ''').strip("\n"),
              dedent('''
                User: {
                  findById: vi.fn(),
                  updateOne: vi.fn(),
                },
                Role: {
                  findOne: vi.fn(),
                },
              ''').strip("\n"),
              "backend test mocks",
          )
          backend_anchor = '  it("lets the invitation resolver create a new account from a synthetic email candidate", async () => {'
          backend_tests = dedent('''
            it("lets an existing Customer enter the invitation flow without immediate promotion", async () => {
              const accountQuery = {
                lean: vi.fn().mockResolvedValue({
                  _id: "customer-1",
                  userType: "CUSTOMER",
                  role: { slug: "customer" },
                }),
              };
              accountQuery.populate = vi.fn().mockReturnValue(accountQuery);
              modelMocks.User.findById.mockReturnValue(accountQuery);
              const addBrandMember = vi.fn().mockResolvedValue({ status: "invited" });
              const { guardBrandMemberRoleMutations } = await import(
                "../../graphql/resolvers/brand/memberRoleConsistency.js"
              );
              const guarded = guardBrandMemberRoleMutations({ addBrandMember });
              const input = {
                brandId: "brand-1",
                userId: "customer-1",
                role: "manager",
                restaurantIds: ["restaurant-1"],
              };

              await expect(
                guarded.addBrandMember(null, { input }, { user: { id: "owner-1" } }, {}),
              ).resolves.toEqual({ status: "invited" });

              expect(modelMocks.User.updateOne).not.toHaveBeenCalled();
              expect(addBrandMember).toHaveBeenCalledTimes(1);
            });

            it("promotes Customer only through the acceptance helper", async () => {
              const roleQuery = {
                lean: vi.fn().mockResolvedValue({ _id: "manager-role" }),
              };
              roleQuery.select = vi.fn().mockReturnValue(roleQuery);
              modelMocks.Role.findOne.mockReturnValue(roleQuery);
              modelMocks.User.updateOne.mockResolvedValue({ matchedCount: 1 });
              const { promoteCustomerAccountToManager } = await import(
                "../../graphql/resolvers/brand/memberRoleConsistency.js"
              );

              await expect(
                promoteCustomerAccountToManager({ userId: "customer-1" }),
              ).resolves.toBe("manager-role");

              expect(modelMocks.User.updateOne).toHaveBeenCalledWith(
                { _id: "customer-1", userType: "CUSTOMER" },
                { $set: { userType: "MANAGER", role: "manager-role" } },
                expect.objectContaining({
                  runValidators: true,
                  overwriteDiscriminatorKey: true,
                }),
              );
            });

          ''')
          text = read(backend_test)
          if text.count(backend_anchor) != 1:
              raise SystemExit("backend test insertion anchor missing")
          write(backend_test, text.replace(backend_anchor, backend_tests + backend_anchor, 1))

          frontend_test = "src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx"
          replace_once(frontend_test, '    userType: "STAFF",', '    userType: "MANAGER",', "manager fixture")
          replace_once(
              frontend_test,
              dedent('''
                {
                  id: "u-new-manager",
                  fullName: "Lê Thu Lan",
                  username: "thu.lan",
                  email: "lan@cohan.vn",
                  userType: "MANAGER",
                  status: "active",
                },
              ''').strip("\n"),
              dedent('''
                {
                  id: "u-new-manager",
                  fullName: "Lê Thu Lan",
                  username: "thu.lan",
                  email: "lan@cohan.vn",
                  userType: "MANAGER",
                  status: "active",
                },
                {
                  id: "u-customer",
                  fullName: "Phạm Minh Khôi",
                  username: "minh.khoi",
                  email: "khoi@example.com",
                  userType: "CUSTOMER",
                  status: "active",
                },
              ''').strip("\n"),
              "customer fixture",
          )
          text = read(frontend_test).replace('name: "Thêm thành viên"', 'name: "Gửi lời mời"')
          write(frontend_test, text)
          ui_anchor = '  it("clears a stale selected account when the candidate search changes", async () => {'
          ui_test = dedent('''
            it("explains that an existing Customer is promoted only after accepting the email", async () => {
              render(<BrandManagement />);

              fireEvent.change(
                screen.getByLabelText("Tìm người cần thêm theo tên, email hoặc mã tài khoản"),
                { target: { value: "Phạm Minh Khôi" } },
              );
              const accountSelect = screen.getByLabelText("Chọn tài khoản cần thêm");
              await waitFor(() => expect(accountSelect).not.toBeDisabled());
              fireEvent.change(accountSelect, { target: { value: "u-customer" } });

              expect(screen.getByText("Tài khoản khách hàng hiện có")).toBeInTheDocument();
              expect(screen.getByText(/Quyền chỉ chuyển sang Manager/)).toBeInTheDocument();

              fireEvent.change(screen.getByLabelText("Chi nhánh phụ trách"), {
                target: { value: "r2" },
              });
              fireEvent.click(screen.getByRole("button", { name: "Gửi lời mời" }));

              await waitFor(() => expect(addMemberMock).toHaveBeenCalledTimes(1));
              expect(addMemberMock.mock.calls[0][0].variables.input).toEqual({
                brandId: "b1",
                userId: "u-customer",
                role: "manager",
                restaurantIds: ["r2"],
              });
              expect(message.success).toHaveBeenCalledWith("Đã gửi lời mời tham gia chuỗi");
            });

          ''')
          text = read(frontend_test)
          if text.count(ui_anchor) != 1:
              raise SystemExit("frontend test insertion anchor missing")
          write(frontend_test, text.replace(ui_anchor, ui_test + ui_anchor, 1))

          prd = ".trellis/tasks/brand-member-invitation-flow/prd.md"
          replace_once(prd, "- Existing compatible manager-capable accounts can be invited.", "- Existing Manager accounts and public Customer accounts can be invited.", "prd accounts")
          replace_once(prd, "- Accepting an invitation activates the membership and, for a new account, verifies email and sets the chosen password.", "- Accepting an invitation activates the membership; an existing Customer is promoted to global Manager only at that point, while a new account is verified and receives its chosen password.", "prd acceptance")
          replace_once(prd, "5. New account supplies a password; existing account only confirms.\n6. Backend verifies token, activates membership, and activates/verifies a new account.", "5. New account supplies a password; an existing Customer or Manager confirms the invitation.\n6. Backend verifies the token, promotes an existing Customer to global Manager only after confirmation, then activates the membership and activates/verifies a new account.", "prd flow")
          replace_once(prd, "- Reject Customer or operational staff accounts for Brand admin/manager invitations.", "- Allow Customer accounts for Brand admin/manager invitations but do not promote them before acceptance; reject operational Staff, HR, Accountant, and System Admin accounts.", "prd validation")
          replace_once(prd, "- Customer/staff incompatibility and manager-scope conflicts remain blocked.", "- Existing Customer promotion occurs only on acceptance; operational-role incompatibility and manager-scope conflicts remain blocked.", "prd tests")

          task_path = ".trellis/tasks/brand-member-invitation-flow/task.json"
          task = json.loads(read(task_path))
          for related in [
              "cohan-restaurant-backend/graphql/resolvers/brand/index.js",
              "src/components/Dashboard_Manager/Brand/BrandManagement.jsx",
              "src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx",
          ]:
              if related not in task["relatedFiles"]:
                  task["relatedFiles"].append(related)
          task["notes"] = (
              "Employee/staff account creation remains explicitly out of scope. Existing Customer accounts can receive Brand admin/manager invitations, but role and userType are changed atomically only after email acceptance. Customer-specific fields remain stored. Focused tests, GraphQL checks and the frontend build are executed before commit. Repository CI may still be blocked by the pre-existing backend package.json/package-lock dependency mismatch."
          )
          write(task_path, json.dumps(task, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Install dependencies without changing lockfiles
        run: |
          npm install --no-package-lock
          npm --prefix cohan-restaurant-backend install --no-package-lock

      - name: Validate focused flow
        run: |
          node --check cohan-restaurant-backend/graphql/resolvers/brand/memberRoleConsistency.js
          node --check cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js
          node --check cohan-restaurant-backend/graphql/resolvers/brand/index.js
          npm --prefix cohan-restaurant-backend test -- tests/resolvers/brand-member-invitation-guards.test.js
          npm run check:graphql
          npx vitest run src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx
          npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/temp-customer-brand-promotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: promote invited customers after acceptance"
          git push origin HEAD:feature/brand-member-invitation-flow
