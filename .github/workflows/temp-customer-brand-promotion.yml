name: Temporary customer promotion patch source

on:
  workflow_dispatch:

jobs:
  unused:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path, old, new, label):
              text = read(path)
              if text.count(old) != 1:
                  raise RuntimeError(f"{label}: expected one match, found {text.count(old)}")
              write(path, text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, label, flags=0):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one regex match, found {count}")
              write(path, updated)

          consistency_path = "cohan-restaurant-backend/graphql/resolvers/brand/memberRoleConsistency.js"
          write(consistency_path, '''import { GraphQLError } from "graphql";
          import { BrandMembership, Role, User } from "../../../models/index.js";
          import {
            canManageBrand,
            getUserId,
          } from "../../../src/services/auth/restaurantScope.service.js";

          const bad = (message) => new GraphQLError(message, {
            extensions: { code: "BAD_USER_INPUT" },
          });

          const forbidden = (message) => new GraphQLError(message, {
            extensions: { code: "FORBIDDEN" },
          });

          const roleSlug = (role) =>
            String(role?.slug || role?.name || "").trim().toLowerCase();

          const accountRoleOf = (user) => roleSlug(user?.role);
          const sameId = (left, right) =>
            Boolean(left && right && String(left) === String(right));
          const isSyntheticInviteId = (value) => String(value || "").startsWith("invite:");

          async function loadAccount(userId, session = null) {
            const query = User.findById(userId)
              .populate({ path: "role", populate: { path: "parentRole" } });
            if (session) query.session(session);
            return query.lean();
          }

          export async function assertBrandMembershipAccountCompatibility({
            userId,
            membershipRole,
            session = null,
            allowCustomerPromotion = false,
          }) {
            const account = await loadAccount(userId, session);
            if (!account) throw bad("Không tìm thấy tài khoản thành viên.");

            const accountRole = accountRoleOf(account);
            const nextMembershipRole = String(membershipRole || "").trim().toLowerCase();
            if (!accountRole) {
              throw bad("Tài khoản chưa có vai trò hệ thống.");
            }

            const promotesCustomer =
              allowCustomerPromotion &&
              account.userType === "CUSTOMER" &&
              accountRole === "customer" &&
              ["admin", "manager"].includes(nextMembershipRole);

            if (nextMembershipRole === "manager" && accountRole !== "manager" && !promotesCustomer) {
              throw bad(
                accountRole === "admin"
                  ? "Admin hệ thống không được gán làm Quản lý chi nhánh."
                  : "Quản lý chi nhánh phải sử dụng tài khoản Manager hoặc Customer hợp lệ.",
              );
            }

            if (nextMembershipRole === "admin" && accountRole !== "manager" && !promotesCustomer) {
              throw bad(
                accountRole === "admin"
                  ? "Admin hệ thống đã có phạm vi toàn hệ thống và không được gán làm Quản trị chuỗi."
                  : "Quản trị chuỗi phải sử dụng tài khoản Manager hoặc Customer hợp lệ.",
              );
            }

            if (
              nextMembershipRole === "staff" &&
              ["admin", "manager", "customer"].includes(accountRole)
            ) {
              throw bad(
                "Nhân viên chi nhánh phải sử dụng vai trò nhân sự phù hợp; hãy đổi vai trò hệ thống trước khi hạ quyền trong chuỗi.",
              );
            }

            return account;
          }

          export async function promoteCustomerAccountToManager({ userId, session = null }) {
            const roleQuery = Role.findOne({
              $or: [{ slug: "manager" }, { name: /^manager$/i }],
            }).select("_id");
            if (session) roleQuery.session(session);
            const managerRole = await roleQuery.lean();
            if (!managerRole) throw bad("Không tìm thấy vai trò Manager trong hệ thống.");

            const result = await User.updateOne(
              { _id: userId, userType: "CUSTOMER" },
              { $set: { userType: "MANAGER", role: managerRole._id } },
              {
                ...(session ? { session } : {}),
                runValidators: true,
                overwriteDiscriminatorKey: true,
              },
            );
            if ((result.matchedCount ?? result.n ?? 0) !== 1) {
              throw bad("Tài khoản không còn ở trạng thái Customer để nâng quyền.");
            }

            return managerRole._id;
          }

          export function guardBrandMemberRoleMutations(mutations = {}) {
            return {
              addBrandMember: async (root, { input }, ctx, info) => {
                if (!ctx?.user || !await canManageBrand(ctx.user, input.brandId)) {
                  return mutations.addBrandMember(root, { input }, ctx, info);
                }

                if (!isSyntheticInviteId(input.userId)) {
                  await assertBrandMembershipAccountCompatibility({
                    userId: input.userId,
                    membershipRole: input.role,
                    allowCustomerPromotion: ["admin", "manager"].includes(input.role),
                  });
                }
                return mutations.addBrandMember(root, { input }, ctx, info);
              },

              updateBrandMember: async (root, { input }, ctx, info) => {
                const membership = await BrandMembership.findById(input.id)
                  .select("brandId userId role status")
                  .lean();

                if (
                  !membership ||
                  !ctx?.user ||
                  !await canManageBrand(ctx.user, membership.brandId)
                ) {
                  return mutations.updateBrandMember(root, { input }, ctx, info);
                }

                if (membership.status === "invited" && input.status === "active") {
                  throw forbidden(
                    "Thành viên phải tự xác nhận liên kết trong email trước khi quyền được kích hoạt.",
                  );
                }

                const suspendsMembership =
                  input.status === "inactive" && membership.status !== "inactive";
                if (suspendsMembership && membership.role === "owner") {
                  throw forbidden(
                    "Không thể tạm ngưng Chủ chuỗi. Hãy chuyển quyền sở hữu trước nếu cần thay đổi tài khoản chủ.",
                  );
                }
                if (suspendsMembership && sameId(membership.userId, getUserId(ctx.user))) {
                  throw forbidden(
                    "Bạn không thể tự tạm ngưng quyền của mình. Hãy nhờ Chủ chuỗi hoặc một Quản trị chuỗi khác thực hiện.",
                  );
                }

                const nextStatus = input.status || membership.status;
                if (nextStatus === "active") {
                  await assertBrandMembershipAccountCompatibility({
                    userId: membership.userId,
                    membershipRole: input.role || membership.role,
                  });
                }

                return mutations.updateBrandMember(root, { input }, ctx, info);
              },
            };
          }
          '''.replace("          ", ""))

          invitation_path = "cohan-restaurant-backend/graphql/resolvers/brand/invitationFlow.js"
          replace_once(
              invitation_path,
              'import { assertBrandMembershipAccountCompatibility } from "./memberRoleConsistency.js";',
              'import {\n  assertBrandMembershipAccountCompatibility,\n  promoteCustomerAccountToManager,\n} from "./memberRoleConsistency.js";',
              "invitation imports",
          )
          sub_once(
              invitation_path,
              r"await assertBrandMembershipAccountCompatibility\(\{\s*userId: user\._id,\s*membershipRole: input\.role,\s*session,\s*\}\);",
              "await assertBrandMembershipAccountCompatibility({\n        userId: user._id,\n        membershipRole: input.role,\n        session,\n        allowCustomerPromotion: true,\n      });",
              "invitation compatibility",
          )
          replace_once(
              invitation_path,
              "const user = await User.findById(membership.userId).session(session);",
              'const user = await User.findById(membership.userId).populate("role").session(session);',
              "accept user lookup",
          )
          replace_once(
              invitation_path,
              '''        if (!["active", "pending"].includes(user.status)) {
          throw forbidden("Tài khoản đang bị khóa hoặc tạm ngưng.");
        }

        if (membership.role === "manager") {''',
              '''        if (!["active", "pending"].includes(user.status)) {
          throw forbidden("Tài khoản đang bị khóa hoặc tạm ngưng.");
        }

        const currentAccountRole = roleName(user);
        const promotesCustomer =
          user.userType === "CUSTOMER" && currentAccountRole === "customer";
        const isManagerAccount =
          user.userType === "MANAGER" && currentAccountRole === "manager";
        if (!promotesCustomer && !isManagerAccount) {
          throw bad(
            "Lời mời chỉ có thể được xác nhận bởi tài khoản Customer hoặc Manager hợp lệ.",
          );
        }

        if (membership.role === "manager") {''',
              "accept account validation",
          )
          replace_once(
              invitation_path,
              '''        if (user.status === "pending") user.status = "active";
        await user.save({ session });

        membership.status = "active";''',
              '''        if (user.status === "pending") user.status = "active";
        await user.save({ session });

        if (promotesCustomer) {
          await promoteCustomerAccountToManager({ userId: user._id, session });
        }

        membership.status = "active";''',
              "accept customer promotion",
          )

          brand_resolver = "cohan-restaurant-backend/graphql/resolvers/brand/index.js"
          replace_once(
              brand_resolver,
              'userType: { $in: ["STAFF", "MANAGER", "HR", "ACCOUNTANT", "ADMIN"] },',
              'userType: { $in: ["CUSTOMER", "STAFF", "MANAGER", "HR", "ACCOUNTANT", "ADMIN"] },',
              "customer candidate query",
          )

          ui_path = "src/components/Dashboard_Manager/Brand/BrandManagement.jsx"
          replace_once(
              ui_path,
              '''const getCandidateLabel = (candidate) => {
            const name =
              candidate?.fullName || candidate?.username || candidate?.email || "Tài khoản";
            const identity = candidate?.email || candidate?.username || candidate?.id;
            return `${name} — ${identity} · ID: ${candidate?.id}`;
          };'''.replace("          ", ""),
              '''const getCandidateLabel = (candidate) => {
            const name =
              candidate?.fullName || candidate?.username || candidate?.email || "Tài khoản";
            const identity = candidate?.email || candidate?.username || candidate?.id;
            const source = String(candidate?.id || "").startsWith("invite:")
              ? "Tài khoản mới"
              : candidate?.userType === "CUSTOMER"
                ? "Khách hàng hiện có"
                : "Tài khoản quản lý";
            return `${name} — ${identity} · ${source} · ID: ${candidate?.id}`;
          };'''.replace("          ", ""),
              "candidate label",
          )
          replace_once(
              ui_path,
              '''  const candidates = candidateSearchReady
            ? candidateData?.brandMemberCandidates || []
            : [];
          const selectedCandidate = candidates.find('''.replace("          ", ""),
              '''  const rawCandidates = candidateSearchReady
            ? candidateData?.brandMemberCandidates || []
            : [];
          const candidates = rawCandidates.filter((candidate) =>
            member.role === "staff"
              ? candidate.userType !== "CUSTOMER"
              : ["CUSTOMER", "MANAGER"].includes(candidate.userType),
          );
          const selectedCandidate = candidates.find('''.replace("          ", ""),
              "candidate role filter",
          )
          replace_once(
              ui_path,
              '      message.success("Đã cập nhật thành viên trong chuỗi");',
              '      message.success(\n        member.role === "staff"\n          ? "Đã cập nhật thành viên trong chuỗi"\n          : "Đã gửi lời mời tham gia chuỗi",\n      );',
              "invitation success wording",
          )
          replace_once(
              ui_path,
              '''                        role: event.target.value,
                        restaurantIds: [],''',
              '''                        role: event.target.value,
                        userId: "",
                        restaurantIds: [],''',
              "clear selected candidate",
          )
          replace_once(
              ui_path,
              '{addingMember ? "Đang thêm..." : "Thêm thành viên"}',
              '{addingMember\n                    ? member.role === "staff" ? "Đang thêm..." : "Đang gửi..."\n                    : member.role === "staff" ? "Thêm thành viên" : "Gửi lời mời"}',
              "invite button wording",
          )
          sub_once(
              ui_path,
              r'(\s+: "Không tìm thấy tài khoản chưa thuộc chuỗi\."\}\s*</small>\s*</label>)(\s*</div>)',
              r'''\1
                    {selectedCandidate?.userType === "CUSTOMER" && member.role !== "staff" && (
                      <div className="brand-scope-note">
                        <strong>Tài khoản khách hàng hiện có</strong>
                        <span>
                          Quyền chỉ chuyển sang Manager sau khi người này xác nhận lời mời qua email.
                        </span>
                      </div>
                    )}\2''',
              "customer promotion notice",
          )

          backend_test_path = "cohan-restaurant-backend/tests/resolvers/brand-member-invitation-guards.test.js"
          write(backend_test_path, '''import { beforeEach, describe, expect, it, vi } from "vitest";

          const modelMocks = vi.hoisted(() => ({
            BrandMembership: {
              findById: vi.fn(),
            },
            User: {
              findById: vi.fn(),
              updateOne: vi.fn(),
            },
            Role: {
              findOne: vi.fn(),
            },
          }));

          const scopeMocks = vi.hoisted(() => ({
            canManageBrand: vi.fn(),
            getUserId: vi.fn((user) => user?.id),
          }));

          vi.mock("../../models/index.js", () => modelMocks);
          vi.mock("../../src/services/auth/restaurantScope.service.js", () => scopeMocks);

          const selectedLean = (value) => ({
            select: vi.fn().mockReturnValue({
              lean: vi.fn().mockResolvedValue(value),
            }),
          });

          describe("Brand invitation mutation guards", () => {
            beforeEach(() => {
              vi.clearAllMocks();
              scopeMocks.canManageBrand.mockResolvedValue(true);
            });

            it("requires an invited member to accept the email link before activation", async () => {
              modelMocks.BrandMembership.findById.mockReturnValue(selectedLean({
                brandId: "brand-1",
                userId: "user-1",
                role: "manager",
                status: "invited",
              }));
              const updateBrandMember = vi.fn();
              const { guardBrandMemberRoleMutations } = await import(
                "../../graphql/resolvers/brand/memberRoleConsistency.js"
              );
              const guarded = guardBrandMemberRoleMutations({ updateBrandMember });

              await expect(
                guarded.updateBrandMember(
                  null,
                  { input: { id: "membership-1", status: "active" } },
                  { user: { id: "owner-1" } },
                  {},
                ),
              ).rejects.toMatchObject({ extensions: { code: "FORBIDDEN" } });

              expect(updateBrandMember).not.toHaveBeenCalled();
            });

            it("lets an existing Customer enter the invitation flow without immediate promotion", async () => {
              const accountQuery = {
                lean: vi.fn().mockResolvedValue({
                  _id: "customer-1",
                  userType: "CUSTOMER",
                  role: { slug: "customer" },
                }),
              };
              accountQuery.populate = vi.fn().mockReturnValue(accountQuery);
              modelMocks.User.findById.mockReturnValue(accountQuery);
              const addBrandMember = vi.fn().mockResolvedValue({ status: "invited" });
              const { guardBrandMemberRoleMutations } = await import(
                "../../graphql/resolvers/brand/memberRoleConsistency.js"
              );
              const guarded = guardBrandMemberRoleMutations({ addBrandMember });
              const input = {
                brandId: "brand-1",
                userId: "customer-1",
                role: "manager",
                restaurantIds: ["restaurant-1"],
              };

              await expect(
                guarded.addBrandMember(null, { input }, { user: { id: "owner-1" } }, {}),
              ).resolves.toEqual({ status: "invited" });

              expect(modelMocks.User.updateOne).not.toHaveBeenCalled();
              expect(addBrandMember).toHaveBeenCalledTimes(1);
            });

            it("promotes Customer only through the acceptance helper", async () => {
              const roleQuery = {
                lean: vi.fn().mockResolvedValue({ _id: "manager-role" }),
              };
              roleQuery.select = vi.fn().mockReturnValue(roleQuery);
              modelMocks.Role.findOne.mockReturnValue(roleQuery);
              modelMocks.User.updateOne.mockResolvedValue({ matchedCount: 1 });
              const { promoteCustomerAccountToManager } = await import(
                "../../graphql/resolvers/brand/memberRoleConsistency.js"
              );

              await expect(
                promoteCustomerAccountToManager({ userId: "customer-1" }),
              ).resolves.toBe("manager-role");

              expect(modelMocks.User.updateOne).toHaveBeenCalledWith(
                { _id: "customer-1", userType: "CUSTOMER" },
                { $set: { userType: "MANAGER", role: "manager-role" } },
                expect.objectContaining({
                  runValidators: true,
                  overwriteDiscriminatorKey: true,
                }),
              );
            });

            it("lets the invitation resolver create a new account from a synthetic email candidate", async () => {
              const addBrandMember = vi.fn().mockResolvedValue({ status: "invited" });
              const { guardBrandMemberRoleMutations } = await import(
                "../../graphql/resolvers/brand/memberRoleConsistency.js"
              );
              const guarded = guardBrandMemberRoleMutations({ addBrandMember });
              const input = {
                brandId: "brand-1",
                userId: "invite:manager@example.com",
                role: "manager",
                restaurantIds: ["restaurant-1"],
              };

              await expect(
                guarded.addBrandMember(null, { input }, { user: { id: "owner-1" } }, {}),
              ).resolves.toEqual({ status: "invited" });

              expect(modelMocks.User.findById).not.toHaveBeenCalled();
              expect(addBrandMember).toHaveBeenCalledWith(
                null,
                { input },
                { user: { id: "owner-1" } },
                {},
              );
            });
          });
          '''.replace("          ", ""))

          frontend_test_path = "src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx"
          replace_once(frontend_test_path, '    userType: "STAFF",', '    userType: "MANAGER",', "manager fixture")
          replace_once(
              frontend_test_path,
              '''  {
            id: "u-new-manager",
            fullName: "Lê Thu Lan",
            username: "thu.lan",
            email: "lan@cohan.vn",
            userType: "MANAGER",
            status: "active",
          },'''.replace("          ", ""),
              '''  {
            id: "u-new-manager",
            fullName: "Lê Thu Lan",
            username: "thu.lan",
            email: "lan@cohan.vn",
            userType: "MANAGER",
            status: "active",
          },
          {
            id: "u-customer",
            fullName: "Phạm Minh Khôi",
            username: "minh.khoi",
            email: "khoi@example.com",
            userType: "CUSTOMER",
            status: "active",
          },'''.replace("          ", ""),
              "customer fixture",
          )
          write(frontend_test_path, read(frontend_test_path).replace('name: "Thêm thành viên"', 'name: "Gửi lời mời"'))
          customer_ui_test = '''  it("explains that an existing Customer is promoted only after accepting the email", async () => {
            render(<BrandManagement />);

            fireEvent.change(
              screen.getByLabelText("Tìm người cần thêm theo tên, email hoặc mã tài khoản"),
              { target: { value: "Phạm Minh Khôi" } },
            );
            const accountSelect = screen.getByLabelText("Chọn tài khoản cần thêm");
            await waitFor(() => expect(accountSelect).not.toBeDisabled());
            fireEvent.change(accountSelect, { target: { value: "u-customer" } });

            expect(screen.getByText("Tài khoản khách hàng hiện có")).toBeInTheDocument();
            expect(screen.getByText(/Quyền chỉ chuyển sang Manager/)).toBeInTheDocument();

            fireEvent.change(screen.getByLabelText("Chi nhánh phụ trách"), {
              target: { value: "r2" },
            });
            fireEvent.click(screen.getByRole("button", { name: "Gửi lời mời" }));

            await waitFor(() => expect(addMemberMock).toHaveBeenCalledTimes(1));
            expect(addMemberMock.mock.calls[0][0].variables.input).toEqual({
              brandId: "b1",
              userId: "u-customer",
              role: "manager",
              restaurantIds: ["r2"],
            });
            expect(message.success).toHaveBeenCalledWith("Đã gửi lời mời tham gia chuỗi");
          });

          '''.replace("          ", "")
          replace_once(
              frontend_test_path,
              '  it("clears a stale selected account when the candidate search changes", async () => {',
              customer_ui_test + '  it("clears a stale selected account when the candidate search changes", async () => {',
              "customer UI test",
          )

          prd_path = ".trellis/tasks/brand-member-invitation-flow/prd.md"
          replace_once(prd_path, "- Existing compatible manager-capable accounts can be invited.", "- Existing Manager accounts and public Customer accounts can be invited.", "prd account scope")
          replace_once(prd_path, "- Accepting an invitation activates the membership and, for a new account, verifies email and sets the chosen password.", "- Accepting an invitation activates the membership; an existing Customer is promoted to global Manager only at that point, while a new account is verified and receives its chosen password.", "prd acceptance")
          replace_once(prd_path, "5. New account supplies a password; existing account only confirms.\n6. Backend verifies token, activates membership, and activates/verifies a new account.", "5. New account supplies a password; an existing Customer or Manager confirms the invitation.\n6. Backend verifies the token, promotes an existing Customer to global Manager only after confirmation, then activates the membership and activates/verifies a new account.", "prd flow")
          replace_once(prd_path, "- Reject Customer or operational staff accounts for Brand admin/manager invitations.", "- Allow Customer accounts for Brand admin/manager invitations but do not promote them before acceptance; reject operational Staff, HR, Accountant, and System Admin accounts.", "prd validation")
          replace_once(prd_path, "- Customer/staff incompatibility and manager-scope conflicts remain blocked.", "- Existing Customer promotion occurs only on acceptance; operational-role incompatibility and manager-scope conflicts remain blocked.", "prd tests")

          task_path = ".trellis/tasks/brand-member-invitation-flow/task.json"
          task = json.loads(read(task_path))
          for related in [
              "cohan-restaurant-backend/graphql/resolvers/brand/index.js",
              "src/components/Dashboard_Manager/Brand/BrandManagement.jsx",
              "src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx",
          ]:
              if related not in task["relatedFiles"]:
                  task["relatedFiles"].append(related)
          task["notes"] = "Employee/staff account creation remains explicitly out of scope. Existing Customer accounts can receive Brand admin/manager invitations, but role and userType are changed atomically only after email acceptance. Customer-specific fields remain stored. Focused tests, GraphQL checks and frontend build must pass before commit. Repository CI may remain blocked by the pre-existing backend dependency lock mismatch."
          write(task_path, json.dumps(task, ensure_ascii=False, indent=2) + "\n")
          PY
