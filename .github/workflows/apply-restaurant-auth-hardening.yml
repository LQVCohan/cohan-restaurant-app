name: Apply restaurant auth hardening

on:
  push:
    branches:
      - codex/complete-restaurant-auth-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Apply restaurant auth hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'codex/complete-restaurant-auth-hardening' }}
          fetch-depth: 0
      - name: Apply targeted source updates
        run: |
          set +e
          node scripts/apply-restaurant-auth-hardening.mjs > /tmp/auth-hardening.log 2>&1
          status=$?
          cat /tmp/auth-hardening.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/auth-hardening.log auth-hardening-error.txt
            printf 'status=failure\n' > auth-hardening-result.txt
          else
            rm -f auth-hardening-error.txt
            printf 'status=success\n' > auth-hardening-result.txt
            git diff --stat >> auth-hardening-result.txt
          fi
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Apply restaurant auth hardening"
          git push origin HEAD:codex/complete-restaurant-auth-hardening
