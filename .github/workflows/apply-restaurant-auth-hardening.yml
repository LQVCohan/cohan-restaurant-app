name: Apply restaurant auth hardening

on:
  push:
    branches:
      - codex/complete-restaurant-auth-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply restaurant auth hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/complete-restaurant-auth-hardening
      - name: Apply targeted source updates
        run: node scripts/apply-restaurant-auth-hardening.mjs
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Apply restaurant auth hardening"
          git push origin HEAD:codex/complete-restaurant-auth-hardening
