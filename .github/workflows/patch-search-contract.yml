name: patch-search-contract

on:
  push:
    branches:
      - codex/global-search-catalog-chefs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/global-search-catalog-chefs
          fetch-depth: 0
      - name: Update legacy search contract test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cohan-restaurant-backend/tests/resolvers/backend-auth-wrapup-access.test.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '  User: {},\n  Permission:',
              '  User: {},\n  Staff: { aggregate: vi.fn() },\n  Permission:',
              1,
          )
          text = text.replace(
              '    vi.clearAllMocks();\n  });',
              '    vi.clearAllMocks();\n    modelMocks.Staff.aggregate.mockResolvedValue([]);\n  });',
              1,
          )
          text = text.replace(
              'expect(result).toEqual({ restaurants: [], menuItems: [], locations: [], owners: [] });',
              'expect(result).toEqual({ restaurants: [], menuItems: [], chefs: [], locations: [], owners: [] });',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-search-contract.yml
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cohan-restaurant-backend/tests/resolvers/backend-auth-wrapup-access.test.js .github/workflows/patch-search-contract.yml
          git commit -m "test(search): include public chef suggestion contract"
          git push origin HEAD:codex/global-search-catalog-chefs
