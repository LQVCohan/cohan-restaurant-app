name: Test context refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Refresh test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cohan-restaurant-backend/tests/jobs/attendance-exception-job.test.js')
          source = path.read_text()
          source = source.replace(
              '{ user: { id: actorId, userType: role, restaurantForStaff: restaurantId } },',
              '''{
                user:
                  role === "ADMIN"
                    ? { id: actorId, userType: role }
                    : role === "MANAGER"
                      ? { id: actorId, userType: role, restaurantId }
                      : { id: actorId, userType: role, restaurantForStaff: restaurantId },
              },''',
          )
          path.write_text(source)

          path = Path('cohan-restaurant-backend/tests/services/off-schedule-attendance.test.js')
          source = path.read_text()
          source = source.replace(
              'function ctx(id, userType, restaurantId = RESTAURANT_ID) {\n  return { user: { id, userType, restaurantForStaff: restaurantId } };\n}',
              '''function ctx(id, userType, restaurantId = RESTAURANT_ID) {
            const normalizedRole = String(userType || "").toUpperCase();
            if (normalizedRole === "ADMIN") return { user: { id, userType } };
            if (normalizedRole === "MANAGER") return { user: { id, userType, restaurantId } };
            return { user: { id, userType, restaurantForStaff: restaurantId } };
          }''',
          )
          path.write_text(source)

          for filename in [
              'cohan-restaurant-backend/tests/services/staffRoleAssignment.service.test.js',
              'cohan-restaurant-backend/tests/resolvers/module-permission-guards.test.js',
              'cohan-restaurant-backend/tests/resolvers/shift-acknowledgement.mutation.test.js',
              'cohan-restaurant-backend/tests/resolvers/shift-acknowledgement.query.test.js',
          ]:
              path = Path(filename)
              source = path.read_text()
              source = source.replace('refRestaurants: [', 'restaurantIds: [')
              path.write_text(source)

          path = Path('cohan-restaurant-backend/tests/resolvers/offschedule-workflow.resolver.test.js')
          source = path.read_text().replace(
              "userType: 'MANAGER',\n          restaurantForStaff:",
              "userType: 'MANAGER',\n          restaurantId:",
          ).replace(
              "userType: 'MANAGER', restaurantForStaff:",
              "userType: 'MANAGER', restaurantId:",
          )
          path.write_text(source)

          path = Path('cohan-restaurant-backend/tests/resolvers/user-sanitization.test.js')
          source = path.read_text()
          source = source.replace('recognizes direct and refRestaurants staff restaurant membership', 'recognizes only assigned staff restaurant membership')
          source = source.replace(
              'expect(staffBelongsToRestaurant({ refRestaurants: [{ _id: "restaurant-1" }] }, "restaurant-1")).toBe(true);',
              'expect(staffBelongsToRestaurant({ refRestaurants: [{ _id: "restaurant-1" }] }, "restaurant-1")).toBe(false);',
          )
          source = source.replace(
              'roleName: "manager", restaurantForStaff: "restaurant-a"',
              'roleName: "manager", restaurantId: "restaurant-a"',
          )
          path.write_text(source)

          path = Path('cohan-restaurant-backend/src/security/userDtos.js')
          source = path.read_text()
          source = source.replace(
              '''  if (idEquals(source.restaurantForStaff, restaurantId)) return true;
            if (Array.isArray(source.refRestaurants)) {
              return source.refRestaurants.some((restaurant) => idEquals(restaurant, restaurantId));
            }
            return false;''',
              '''  return idEquals(source.restaurantForStaff, restaurantId);''',
          )
          path.write_text(source)
          PY
      - name: Commit refreshed fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/tests cohan-restaurant-backend/src/security/userDtos.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh restaurant scope test contexts"
          git push origin HEAD:codex/auth-rbac-clean
