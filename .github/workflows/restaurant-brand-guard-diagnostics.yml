name: restaurant-brand-guard-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: restaurant-brand-guard-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-diagnostics:
    if: github.head_ref == 'fix/restaurant-brand-membership-guards'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm ci
      - name: Run backend tests and capture output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test -- --reporter=dot > backend-test.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-brand-guard-backend-test-log
          path: cohan-restaurant-backend/backend-test.log
          retention-days: 1
      - name: Propagate backend test result
        if: always()
        run: exit "${{ steps.tests.outputs.exit_code || '1' }}"
