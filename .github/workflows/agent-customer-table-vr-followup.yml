name: Agent customer table VR follow-up

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/customer-table-vr-and-safe-back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-table-vr-and-safe-back
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply follow-up patch
        run: python scripts/agent_patch_customer_table_vr_followup.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add src/components/Customer/TableBooking/TableBooking.jsx \
            src/components/Customer/VRViewer/VRViewer.jsx
          git commit -m "fix(table-vr): use router history and hide unavailable local panoramas"
          git push origin HEAD:agent/customer-table-vr-and-safe-back
