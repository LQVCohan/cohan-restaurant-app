name: Agent sync table VR branch

on:
  push:
    branches:
      - agent/improve-table-360-upload
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-main:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[sync-main]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-table-360-upload
          fetch-depth: 0

      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "sync latest main [sync-main]"
          git push origin HEAD:agent/improve-table-360-upload
