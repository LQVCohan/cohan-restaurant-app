name: Agent portable table VR URL patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/persist-table-vr-like-avatar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persist-table-vr-like-avatar
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply portable URL patch
        run: python .agent/patch_portable_vr_url.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx \
            src/utils/tableVrNavigation.js \
            src/utils/tableVrNavigation.test.js
          git diff --cached --quiet || git commit -m "fix: keep local table VR URLs portable across ngrok hosts"
          git push origin HEAD:agent/persist-table-vr-like-avatar
