name: performance-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  performance-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm ci
      - name: Run targeted tests
        id: tests
        shell: bash
        run: |
          set +e
          npx vitest run \
            tests/graphql/staff-performance-schema-runtime.test.js \
            tests/services/performance-incident.service.test.js \
            tests/services/performance-appeal.service.test.js \
            --reporter=verbose > performance-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-log
          path: cohan-restaurant-backend/performance-test.log
      - name: Preserve test result
        if: steps.tests.outputs.status != '0'
        run: exit 1
