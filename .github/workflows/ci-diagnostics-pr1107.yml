name: PR 1107 diagnostics

on:
  push:
    branches:
      - codex/post-rbac-ci-stabilization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json
      - run: npm ci
      - run: npm --prefix cohan-restaurant-backend ci
      - name: Run failing suites and summarize
        run: |
          set +e
          npm run test:component > /tmp/frontend.txt 2>&1
          frontend_status=$?
          npm --prefix cohan-restaurant-backend test > /tmp/backend.txt 2>&1
          backend_status=$?
          FRONTEND_STATUS=$frontend_status BACKEND_STATUS=$backend_status python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          def summarize(path):
              text = Path(path).read_text(errors='replace')
              text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
              lines = []
              for raw in text.splitlines():
                  value = raw.strip()
                  if (
                      value.startswith('FAIL ')
                      or value.startswith('Test Files ')
                      or value.startswith('Tests ')
                      or 'AssertionError:' in value
                      or 'TypeError:' in value
                      or 'ReferenceError:' in value
                      or 'SyntaxError:' in value
                      or 'Cannot find package' in value
                      or 'Unable to find' in value
                  ):
                      lines.append(value)
              return lines[-800:]

          output = [
              f"frontend_status={os.environ['FRONTEND_STATUS']}",
              *summarize('/tmp/frontend.txt'),
              '',
              f"backend_status={os.environ['BACKEND_STATUS']}",
              *summarize('/tmp/backend.txt'),
          ]
          Path('ci-diagnostics-pr1107.txt').write_text('\n'.join(output) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-pr1107
          path: ci-diagnostics-pr1107.txt
          retention-days: 1
