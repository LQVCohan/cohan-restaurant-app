name: PR 1103 backend dependency repair

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Add direct backend Fastify dependency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - name: Add Fastify to backend package
        run: npm --prefix cohan-restaurant-backend install fastify@^5.6.0 --save
      - name: Verify backend can import Fastify
        run: node --input-type=module -e "import('fastify').then(() => console.log('fastify ok'))"
        working-directory: cohan-restaurant-backend
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/package.json cohan-restaurant-backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Fastify dependency already present"
            exit 0
          fi
          git commit -m "Add direct backend Fastify dependency"
          git push origin HEAD:codex/auth-rbac-clean
