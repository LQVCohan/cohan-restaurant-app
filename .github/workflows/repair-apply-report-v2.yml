name: repair-apply-report-v2
on:
  push:
    branches: [agent/fix-report-pages-16-20]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-report-pages-16-20.yml')
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'from pathlib import Path')
          end = next(i for i, line in enumerate(lines[start + 1:], start + 1) if line.strip().startswith('def insert_before_last'))
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          replacement = '''from pathlib import Path
import re
import textwrap

def replace_once(path, old, new):
    p = Path(path)
    text = p.read_text()
    if text.count(old) == 1:
        p.write_text(text.replace(old, new, 1))
        return
    old_lines = old.strip("\\n").splitlines()
    pattern = re.compile(
        "\\n".join(
            r"^[ \\t]*" + re.escape(line.lstrip()) + r"[ \\t]*$"
            for line in old_lines
        ),
        re.MULTILINE,
    )
    matches = list(pattern.finditer(text))
    if len(matches) != 1:
        raise SystemExit(
            f"Expected exactly one flexible match in {path}, found {len(matches)}: {old[:100]!r}"
        )
    match = matches[0]
    first_line = match.group(0).splitlines()[0]
    base_indent = first_line[: len(first_line) - len(first_line.lstrip())]
    normalized_new = textwrap.dedent(new).strip("\\n")
    replacement_text = "\\n".join(
        base_indent + line if line else ""
        for line in normalized_new.splitlines()
    )
    p.write_text(text[: match.start()] + replacement_text + text[match.end() :])

'''.splitlines()
          replacement = [indent + line if line else '' for line in replacement]
          p.write_text('\n'.join(lines[:start] + replacement + lines[end:]) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-report-pages-16-20.yml
          git commit -m "chore: repair report patch matcher"
          git push origin HEAD
