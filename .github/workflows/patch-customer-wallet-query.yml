name: Patch customer wallet query

on:
  push:
    branches:
      - agent/fix-customer-business-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-customer-business-flow
          fetch-depth: 0
      - name: Add wallet fields to paged customer query
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/hooks/useUserManagement.js')
          text = p.read_text(encoding='utf-8')
          start = text.index('export const GET_CUSTOMER_LIST_PAGE')
          end = text.index('export const GET_CUSTOMER_EXPORT_ROWS', start)
          block = text[start:end]
          old = '        totalSpending\n        emailVerified'
          new = '        totalSpending\n        wallet { status provider currency balance }\n        emailVerified'
          if old not in block:
              raise SystemExit('paged customer wallet anchor not found')
          block = block.replace(old, new, 1)
          p.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          rm -f .github/workflows/patch-customer-wallet-query.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(customer): expose wallet status in customer page"
          git push origin HEAD:agent/fix-customer-business-flow
