name: Apply customer business flow fix

on:
  push:
    branches:
      - agent/fix-customer-business-flow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-customer-business-flow
          fetch-depth: 0
      - name: Apply patches
        run: python .trellis/tmp/apply_customer_business_fix.py
      - name: Commit generated changes
        run: |
          rm -f .trellis/tmp/apply_customer_business_fix.py
          rm -f .github/workflows/apply-customer-business-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(customer): align customer business flows"
          git push origin HEAD:agent/fix-customer-business-flow
