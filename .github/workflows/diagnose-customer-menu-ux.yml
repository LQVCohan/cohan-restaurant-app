name: diagnose customer menu UX

on:
  push:
    branches:
      - codex/customer-menu-food-detail-ux
    paths:
      - .github/workflows/diagnose-customer-menu-ux.yml
      - cohan-restaurant-backend/**

permissions:
  contents: write

jobs:
  backend-diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-menu-food-detail-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json

      - name: Install dependencies
        working-directory: cohan-restaurant-backend
        run: npm ci

      - name: Run backend tests and capture output
        id: tests
        working-directory: cohan-restaurant-backend
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose 2>&1 | tee /tmp/backend-tests.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save concise failure log
        if: steps.tests.outputs.status != '0'
        run: |
          mkdir -p .trellis/tasks/07-08-customer-menu-food-detail-ux
          tail -n 500 /tmp/backend-tests.log > .trellis/tasks/07-08-customer-menu-food-detail-ux/backend-test-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .trellis/tasks/07-08-customer-menu-food-detail-ux/backend-test-failure.log
          git commit -m "test: capture customer menu backend failure" || exit 0
          git push origin HEAD:codex/customer-menu-food-detail-ux

      - name: Fail after diagnostics
        if: steps.tests.outputs.status != '0'
        run: exit 1
