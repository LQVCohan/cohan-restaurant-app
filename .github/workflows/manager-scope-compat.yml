name: Manager scope compatibility

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply manager scope compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Patch manager direct restaurant scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cohan-restaurant-backend/graphql/guards.js')
          s = p.read_text()
          old = '''  const isRestaurantScopedRole = roles.some((role) => RESTAURANT_SCOPED_ROLES.has(role));
          const target = restaurantIdToString(restaurantId);
          if (!target || !isRestaurantScopedRole) return false;

          const scopedIds = [
            user.restaurantForStaff,
            user.restaurantId,
            ...(Array.isArray(user.restaurantIds) ? user.restaurantIds : []),
          ];'''
          new = '''  const isManager = roles.includes("MANAGER");
          const isRestaurantScopedRole = roles.some((role) => RESTAURANT_SCOPED_ROLES.has(role));
          const target = restaurantIdToString(restaurantId);
          if (!target || (!isManager && !isRestaurantScopedRole)) return false;

          const scopedIds = isManager
            ? [user.restaurantId, ...(Array.isArray(user.restaurantIds) ? user.restaurantIds : [])]
            : [
                user.restaurantForStaff,
                user.restaurantId,
                ...(Array.isArray(user.restaurantIds) ? user.restaurantIds : []),
              ];'''
          if old not in s:
              raise SystemExit('manager scope patch source not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/graphql/guards.js
          git commit -m "Apply manager scope compatibility"
          git push origin HEAD:codex/auth-rbac-clean
