name: Fix verification restaurant scope

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Remove customer history from verification scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Patch resolver and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path('cohan-restaurant-backend/graphql/resolvers/auth/emailVerification.mutation.js')
          source = resolver.read_text()
          source = source.replace(
          '''  const ids = [
            target?.restaurantForStaff,
            ...(Array.isArray(target?.refRestaurants) ? target.refRestaurants : []),
          ]''',
          '''  const ids = [
            target?.restaurantForStaff,
            target?.restaurantId,
            ...(Array.isArray(target?.restaurantIds) ? target.restaurantIds : []),
          ]''')
          resolver.write_text(source)

          test = Path('cohan-restaurant-backend/tests/resolvers/account-verification.service.test.js')
          tests = test.read_text()
          tests = tests.replace(
            'vi.mock("../../models/index.js", () => ({ User: MockUser }));',
            'vi.mock("../../models/index.js", () => ({ User: MockUser, Restaurant: { exists: vi.fn() } }));',
          )
          tests = tests.replace(
          '''  it("allows manager when any target refRestaurant is in scope", async () => {
            const { assertCanResendForTarget } = await emailVerificationResolverPromise;
            await expect(assertCanResendForTarget(
              { user: { id: "manager-1", roleName: "manager", restaurantIds: ["restaurant-b"] } },
              { _id: "customer-1", userType: "CUSTOMER", refRestaurants: ["restaurant-a", { _id: "restaurant-b" }] },
            )).resolves.toBe(true);
          });''',
          '''  it("allows manager for staff assigned to the manager restaurant", async () => {
            const { assertCanResendForTarget } = await emailVerificationResolverPromise;
            await expect(assertCanResendForTarget(
              { user: { id: "manager-1", roleName: "manager", restaurantIds: ["restaurant-b"] } },
              { _id: "staff-1", userType: "STAFF", restaurantForStaff: "restaurant-b" },
            )).resolves.toBe(true);
          });

          it("does not treat customer refRestaurants as authorization", async () => {
            const { assertCanResendForTarget } = await emailVerificationResolverPromise;
            await expect(assertCanResendForTarget(
              { user: { id: "manager-1", roleName: "manager", restaurantIds: ["restaurant-b"] } },
              { _id: "customer-1", userType: "CUSTOMER", refRestaurants: ["restaurant-b"] },
            )).rejects.toMatchObject({ extensions: { code: "FORBIDDEN" } });
          });''')
          test.write_text(tests)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/graphql/resolvers/auth/emailVerification.mutation.js cohan-restaurant-backend/tests/resolvers/account-verification.service.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove customer history from verification scope"
          git pull --rebase origin codex/auth-rbac-clean
          git push origin HEAD:codex/auth-rbac-clean
