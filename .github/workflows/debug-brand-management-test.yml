name: Debug brand management component test

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  debug:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Capture focused component test output
        run: |
          set +e
          npx vitest run src/components/Dashboard_Manager/Brand/BrandManagement.test.jsx --reporter=verbose > brand-management-test.log 2>&1
          echo $? > brand-management-test.status
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: brand-management-test-debug
          path: |
            brand-management-test.log
            brand-management-test.status
