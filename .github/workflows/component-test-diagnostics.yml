name: Component test diagnostics

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message != 'Record component test diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run component tests
        run: |
          set +e
          npm run test:component > component-test-diagnostics.txt 2>&1
          echo "component_status=$?" > component-test-status.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add component-test-diagnostics.txt component-test-status.txt
          git commit -m "Record component test diagnostics"
          git pull --rebase origin codex/auth-rbac-clean
          git push origin HEAD:codex/auth-rbac-clean
