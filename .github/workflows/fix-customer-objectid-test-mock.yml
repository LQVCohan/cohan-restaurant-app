name: Fix customer ObjectId test mock

on:
  push:
    branches:
      - agent/fix-customer-business-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-customer-business-flow
          fetch-depth: 0
      - name: Fix ObjectId constructor mock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cohan-restaurant-backend/tests/resolvers/user-admin-management-access.test.js')
          text = p.read_text(encoding='utf-8')
          old = '    Types: { ObjectId: vi.fn((id) => ({ _mockObjectId: String(id) })) },'
          new = '''    Types: {
              ObjectId: function ObjectId(id) {
                return { _mockObjectId: String(id), toString: () => String(id) };
              },
            },'''
          if old not in text:
              raise SystemExit('ObjectId mock anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit test fix
        run: |
          rm -f .github/workflows/fix-customer-objectid-test-mock.yml
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(customer): make ObjectId mock constructible"
          git push origin HEAD:agent/fix-customer-business-flow
