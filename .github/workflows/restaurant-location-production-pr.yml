name: Apply restaurant location fix on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Extract and apply focused patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/restaurant-location-production-autofix.yml')
          text = workflow_path.read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          body = text[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          Path('/tmp/apply-restaurant-location-fix.py').write_text(
              script,
              encoding='utf-8',
          )
          PY
          python /tmp/apply-restaurant-location-fix.py
          rm -f .github/workflows/restaurant-location-production-pr.yml

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden restaurant location capture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
