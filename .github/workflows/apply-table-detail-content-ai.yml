name: Apply table detail content patch

on:
  push:
    branches:
      - fix/table-detail-content-ai

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/table-detail-content-ai
          fetch-depth: 1

      - name: Apply focused patch
        run: python .trellis/tasks/07-07-table-detail-content-ai/apply_patch.py

      - name: Review and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/hooks/usePromotions.js \
            src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx \
            src/components/Dashboard_Manager/Table/TableActionsLiteModal.test.jsx \
            cohan-restaurant-backend/tests/server/ai-table-endpoints-auth.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(table): simplify detail modal and repair assistant data"
          git push origin HEAD:fix/table-detail-content-ai
