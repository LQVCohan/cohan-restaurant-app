name: apply-report-pages-16-20

on:
  push:
    branches: [agent/fix-report-pages-16-20]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and commit report fixes
        shell: bash
        run: |
          set +e
          python scripts/apply_report_pages_16_20.py > /tmp/report-patch.log 2>&1
          status=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            mkdir -p .trellis/tasks/07-13-report-pages-16-20
            cp /tmp/report-patch.log .trellis/tasks/07-13-report-pages-16-20/apply-diagnostic.txt
            git add .trellis/tasks/07-13-report-pages-16-20/apply-diagnostic.txt
            git commit -m "chore: record report patch failure"
            git push origin HEAD
            exit 0
          fi
          rm -f scripts/apply_report_pages_16_20.py
          rm -f .github/workflows/apply-report-pages-16-20.yml
          rm -f .trellis/tasks/07-13-report-pages-16-20/trigger*.md
          rm -f .trellis/tasks/07-13-report-pages-16-20/automation-marker.txt
          rm -f .trellis/tasks/07-13-report-pages-16-20/apply-diagnostic.txt
          git add -A
          git commit -m "fix: address report pages 16-20 and remaining regressions"
          git push origin HEAD
