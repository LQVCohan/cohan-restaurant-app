name: Apply table promotion search

on:
  push:
    branches:
      - fix/table-promotion-search

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/table-promotion-search
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused patch
        run: python .trellis/tasks/07-07-table-promotion-search/apply_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused component test
        run: npx vitest run src/components/Dashboard_Manager/Table/TableActionsLiteModal.test.jsx

      - name: Build frontend
        run: npm run build

      - name: Review and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx \
            src/components/Dashboard_Manager/Table/TableActionsLiteModal.test.jsx
          git commit -m "feat(table): add promotion search in detail modal"
          git push origin HEAD:fix/table-promotion-search
