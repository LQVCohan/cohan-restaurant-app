name: Apply untracked serving hotfix

on:
  push:
    branches:
      - fix/public-table-untracked-serving

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch inventory contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cohan-restaurant-backend/src/services/inventory.service.js')
          text = path.read_text()
          old = '''    const comps = arr(serving?.ingredients);
              if (!comps.length) {
                throw new Error(
                  `ServingVariant has no ingredients for menuItem ${
                    line.menuItemId
                  } (key=${s(serving.key)})`
                );
              }
          '''
          new = '''    const comps = arr(serving?.ingredients);
              if (!comps.length) continue;
          '''
          if old not in text:
              raise SystemExit('Expected inventory block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/src/services/inventory.service.js
          git commit -m "fix(inventory): allow untracked serving variants"
          git push
