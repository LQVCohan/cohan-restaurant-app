name: Agent patch staff order quantity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/staff-order-quantity-inputs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply staff quantity patch
        run: python scripts/agent_patch_staff_order_quantity.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Staff/components/MenuOrdering.jsx src/components/Staff/components/MenuOrdering.scss src/components/Staff/StaffOrdering.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Support integer portions and decimal kilograms"
            git push origin HEAD:${{ github.head_ref }}
          fi
