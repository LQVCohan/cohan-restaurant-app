name: Fix customer guest test mock

on:
  push:
    branches:
      - agent/fix-customer-business-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-customer-business-flow
          fetch-depth: 0
      - name: Fix mongoose findOne mock chain
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cohan-restaurant-backend/tests/resolvers/user-admin-management-access.test.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '  ctor.findOne = vi.fn(async () => null);',
              '  ctor.findOne = vi.fn(() => ({ lean: vi.fn(async () => null) }));',
              1,
          )
          text = text.replace(
              '    CustomerMock.findOne.mockResolvedValue(null);',
              '    CustomerMock.findOne.mockReturnValue({ lean: vi.fn(async () => null) });',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit test fix
        run: |
          rm -f .github/workflows/fix-customer-guest-test-mock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(customer): mock guest duplicate lookup chain"
          git push origin HEAD:agent/fix-customer-business-flow
