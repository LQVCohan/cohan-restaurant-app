name: PR 1103 manager scope compatibility

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply manager scope compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Update restaurant access guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cohan-restaurant-backend/graphql/guards.js')
          source = path.read_text()
          source = source.replace(
          '''  const isRestaurantScopedRole = roles.some((role) => RESTAURANT_SCOPED_ROLES.has(role));
          const target = restaurantIdToString(restaurantId);
          if (!target || !isRestaurantScopedRole) return false;

          const scopedIds = [
            user.restaurantForStaff,
            user.restaurantId,
            ...(Array.isArray(user.restaurantIds) ? user.restaurantIds : []),
          ];''',
          '''  const isManager = roles.includes("MANAGER");
          const isRestaurantScopedRole = roles.some((role) => RESTAURANT_SCOPED_ROLES.has(role));
          const target = restaurantIdToString(restaurantId);
          if (!target || (!isManager && !isRestaurantScopedRole)) return false;

          const scopedIds = isManager
            ? [user.restaurantId, ...(Array.isArray(user.restaurantIds) ? user.restaurantIds : [])]
            : [
                user.restaurantForStaff,
                user.restaurantId,
                ...(Array.isArray(user.restaurantIds) ? user.restaurantIds : []),
              ];''')
          source = source.replace(
          '''    const Restaurant = models.Restaurant;
            if (typeof Restaurant?.exists !== "function") return false;''',
          '''    const descriptor = Object.getOwnPropertyDescriptor(models, "Restaurant");
            const Restaurant = descriptor?.value;
            if (typeof Restaurant?.exists !== "function") return false;''')
          path.write_text(source)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cohan-restaurant-backend/package-lock.json
      - run: npm --prefix cohan-restaurant-backend ci
      - name: Run guard and authorization tests
        run: npm --prefix cohan-restaurant-backend test -- tests/resolvers/guards-restaurant-access.test.js tests/services/authorization.service.test.js
      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/graphql/guards.js
          if git diff --cached --quiet; then
            echo "No guard changes"
            exit 0
          fi
          git commit -m "Apply manager scope compatibility"
          git push origin HEAD:codex/auth-rbac-clean
