name: Agent verify server-backed table VR

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    if: github.head_ref == 'agent/persist-table-vr-like-avatar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused table VR tests
        run: npx vitest run src/utils/tableVrNavigation.test.js src/utils/tableVrImageProcessing.test.js src/components/Customer/VRViewer/VRViewer.test.jsx
      - name: Build frontend
        run: npm run build
