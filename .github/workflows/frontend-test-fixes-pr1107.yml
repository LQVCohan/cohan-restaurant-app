name: PR 1107 frontend test migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'codex/post-rbac-ci-stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-rbac-ci-stabilization
          fetch-depth: 0

      - name: Align stale frontend tests with current components
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              file = Path(path)
              source = file.read_text()
              if old in source:
                  source = source.replace(old, new, count)
                  file.write_text(source)
              elif new not in source:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]}")

          replace(
              'src/components/Dashboard_Manager/PayrollPage/PayrollManagement.test.jsx',
              'startDate: expect.stringMatching(/^2026-05-25T00:00:00\\.000Z$/),',
              'startDate: expect.stringMatching(/^2026-05-26T00:00:00\\.000Z$/),',
          )
          replace(
              'src/components/Dashboard_Manager/PayrollPage/PayrollManagement.test.jsx',
              'endDate: expect.stringMatching(/^2026-06-24T23:59:59\\.999Z$/),',
              'endDate: expect.stringMatching(/^2026-06-25T23:59:59\\.999Z$/),',
          )

          promotion = Path('src/components/Dashboard_Manager/Promotion/PromotionManagement.test.jsx')
          source = promotion.read_text()
          apollo_mock = '''vi.mock("@apollo/client", async () => {
            const actual = await vi.importActual("@apollo/client");
            return {
              ...actual,
              useQuery: vi.fn(() => ({
                data: { customerRankSettings: { ranks: [] } },
                loading: false,
                error: null,
              })),
            };
          });

          '''
          marker = 'vi.mock("@/hooks/usePromotions", () => ({\n'
          if apollo_mock not in source:
              if marker not in source:
                  raise SystemExit('PromotionManagement Apollo mock marker not found')
              source = source.replace(marker, apollo_mock + marker, 1)
              promotion.write_text(source)

          staff = Path('src/components/Dashboard_Manager/Staff/StaffManagement.test.jsx')
          source = staff.read_text()
          old = '''    useQuery: () => ({
                data: { leaveRequests: [] },
                loading: false,
                error: null,
              }),'''
          new = '''    useQuery: () => ({
                data: { leaveRequests: [] },
                loading: false,
                error: null,
              }),
              useMutation: () => [vi.fn(), { loading: false, error: null }],'''
          if old in source:
              staff.write_text(source.replace(old, new, 1))
          elif 'useMutation: () => [vi.fn(), { loading: false, error: null }],' not in source:
              raise SystemExit('StaffManagement Apollo mock block not found')

          table_source = Path('src/components/Dashboard_Manager/Table/TableCameraPlacementPreviewModal.jsx')
          source = table_source.read_text()
          old = '      scrollContainer?.scrollTo({ top: 0, behavior: "auto" });'
          new = '''      if (typeof scrollContainer?.scrollTo === "function") {
                scrollContainer.scrollTo({ top: 0, behavior: "auto" });
              }'''
          if old in source:
              table_source.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('Camera modal scroll block not found')

          table_test = Path('src/components/Dashboard_Manager/Table/TableCameraPlacementPreviewModal.test.js')
          source = table_test.read_text()
          replacements = {
              'Thiết bị/trình duyệt chưa hỗ trợ camera preview.': 'Thiết bị hoặc trình duyệt này chưa hỗ trợ xem thử bằng camera.',
              'Thử Chrome/Safari mobile nếu thiết bị hiện tại không mở được camera.': 'Thử Chrome hoặc Safari phiên bản mới nhất.',
              'Bạn có thể dùng preview 3D thường để kiểm tra hình dáng mẫu bàn.': 'Mở trang bằng HTTPS hoặc localhost.',
              'Thumbnail Bàn thumbnail': 'Mẫu Bàn thumbnail',
              'Overlay mô hình bàn để xem thử trong camera': 'Mẫu bàn dùng để ước lượng trong khung camera',
              '/opacity: 0.42/': '/Độ rõ của mẫu: 42%/',
          }
          for old_text, new_text in replacements.items():
              source = source.replace(old_text, new_text)
          table_test.write_text(source)

          replace(
              'src/components/Dashboard_Manager/Menu/components/MenuItemCard/MenuItemCard.test.jsx',
              'screen.getByText("Sẵn sàng")',
              'screen.getByText("Đang bán")',
          )
          replace(
              'src/components/Dashboard_Manager/Menu/components/MenuItemCard/MenuItemCard.test.jsx',
              'name: "Mở menu trạng thái món"',
              'name: "Mở danh sách trạng thái bán"',
          )
          replace(
              'src/components/Dashboard_Manager/Menu/components/MenuItemCard/MenuItemCard.test.jsx',
              'name: "Tạm dừng"',
              'name: "Tạm ngưng bán"',
          )

          replace(
              'src/components/Dashboard_Manager/Menu/components/MenuItemModal/MenuItemModal.foodClassification.test.jsx',
              'expect(source).toContain("Phân loại món ăn");',
              'expect(source).toContain("Nhóm món ăn");',
          )
          replace(
              'src/components/Dashboard_Manager/Menu/components/MenuItemModal/MenuItemModal.foodClassification.test.jsx',
              'expect(source).toContain("Loại thịt / đạm động vật");',
              'expect(source).toContain("Thành phần thịt hoặc hải sản");',
          )
          PY

      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/Dashboard_Manager/PayrollPage/PayrollManagement.test.jsx \
            src/components/Dashboard_Manager/Promotion/PromotionManagement.test.jsx \
            src/components/Dashboard_Manager/Staff/StaffManagement.test.jsx \
            src/components/Dashboard_Manager/Table/TableCameraPlacementPreviewModal.jsx \
            src/components/Dashboard_Manager/Table/TableCameraPlacementPreviewModal.test.js \
            src/components/Dashboard_Manager/Menu/components/MenuItemCard/MenuItemCard.test.jsx \
            src/components/Dashboard_Manager/Menu/components/MenuItemModal/MenuItemModal.foodClassification.test.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align frontend component tests with current UI"
          git pull --rebase origin codex/post-rbac-ci-stabilization
          git push origin HEAD:codex/post-rbac-ci-stabilization

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run affected frontend tests
        run: |
          npx vitest run \
            src/components/Login.test.jsx \
            src/components/Dashboard_Manager/Customer/CustomerList.test.jsx \
            src/components/Dashboard_Manager/Dashboard/Dashboard.test.jsx \
            src/components/Dashboard_Manager/PayrollPage/PayrollManagement.test.jsx \
            src/components/Dashboard_Manager/Promotion/PromotionManagement.test.jsx \
            src/components/Dashboard_Manager/Staff/StaffManagement.test.jsx \
            src/components/Dashboard_Manager/Table/TableCameraPlacementPreviewModal.test.js \
            src/components/Dashboard_Manager/Menu/components/MenuItemCard/MenuItemCard.test.jsx \
            src/components/Dashboard_Manager/Menu/components/MenuItemModal/MenuItemModal.foodClassification.test.jsx
