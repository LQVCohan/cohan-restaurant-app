name: MenuManagement CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "cohan-restaurant-backend/**"
      - "docs/menu-management-*.md"
      - ".github/workflows/menu-management-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "cohan-restaurant-backend/**"
      - "docs/menu-management-*.md"
      - ".github/workflows/menu-management-ci.yml"

jobs:
  frontend-menu-rbac:
    name: Frontend Menu RBAC tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Lint frontend
        run: npm run -s lint

      - name: Run frontend MenuManagement RBAC tests
        run: npm run test -- src/utils/frontendRoleAccess.test.js

  backend-menu-rbac:
    name: Backend Menu RBAC tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohan-restaurant-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install

      - name: Lint backend
        run: npm run -s lint

      - name: Run backend MenuManagement RBAC tests
        run: |
          npm run test -- \
            tests/server/auth-user-resolver.test.js \
            tests/resolvers/menu-permission.test.js \
            tests/resolvers/menu-audit-log-permission.test.js
