name: Apply table management polish from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Execute focused patch script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          raw = Path('.github/workflows/apply-table-management-polish.yml').read_text(encoding='utf-8')
          marker_start = "          python <<'PY'\n"
          marker_end = "\n          PY\n"
          block = raw.split(marker_start, 1)[1].split(marker_end, 1)[0]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(code, 'table-management-polish.py', 'exec'))
          PY

          git diff --check

      - name: Commit focused patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/models/table.model.js \
            cohan-restaurant-backend/graphql/schema/floor_table.graphql \
            cohan-restaurant-backend/graphql/resolvers/table/mutation.js \
            cohan-restaurant-backend/tests/resolvers/table-restaurant-access.test.js \
            src/hooks/useTableManagement.js \
            src/components/Dashboard_Manager/Table/TableManagement.jsx \
            src/components/Dashboard_Manager/Table/TableManagement.scss \
            src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx \
            src/components/Dashboard_Manager/Table/TableManagement.test.jsx
          git commit -m "fix(table): polish manager table workflows"
          git push origin HEAD:${{ github.head_ref }}
