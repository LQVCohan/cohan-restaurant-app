name: Apply table management polish from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Prepare focused patch script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/apply-table-management-polish.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          block = raw.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          code = code.replace(
              'className="btn-mini primary"\n              aria-label',
              'className="btn-mini primary"\n                        aria-label',
          )
          Path('/tmp/table-management-polish.py').write_text(code, encoding='utf-8')
          PY

      - name: Execute focused patch script
        id: patch
        shell: bash
        run: |
          set +e
          python /tmp/table-management-polish.py > /tmp/table-management-polish.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "PATCH SCRIPT FAILED"
            cat /tmp/table-management-polish.log
          else
            git diff --check
          fi

      - name: Commit patch diagnostic
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          cp /tmp/table-management-polish.log .trellis/tasks/07-07-table-management-polish/patch-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .trellis/tasks/07-07-table-management-polish/patch-error.txt
          git commit -m "chore(task): capture table patch failure"
          git push origin HEAD:${{ github.head_ref }}

      - name: Commit focused patch
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/models/table.model.js \
            cohan-restaurant-backend/graphql/schema/floor_table.graphql \
            cohan-restaurant-backend/graphql/resolvers/table/mutation.js \
            cohan-restaurant-backend/tests/resolvers/table-restaurant-access.test.js \
            src/hooks/useTableManagement.js \
            src/components/Dashboard_Manager/Table/TableManagement.jsx \
            src/components/Dashboard_Manager/Table/TableManagement.scss \
            src/components/Dashboard_Manager/Table/TableActionsLiteModal.jsx \
            src/components/Dashboard_Manager/Table/TableManagement.test.jsx
          git commit -m "fix(table): polish manager table workflows"
          git push origin HEAD:${{ github.head_ref }}
