name: validate restaurant hours

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.number == 1244
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run restaurant profile tests
        run: npx vitest run src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.test.jsx

      - name: Build frontend
        run: npm run build
