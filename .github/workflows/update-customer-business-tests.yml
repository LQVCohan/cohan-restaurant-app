name: Update customer business tests

on:
  push:
    branches:
      - agent/fix-customer-business-flow

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-customer-business-flow
          fetch-depth: 0
      - name: Update regression tests
        run: python .trellis/tmp/update_customer_business_tests.py
      - name: Commit test updates
        run: |
          rm -f .trellis/tmp/update_customer_business_tests.py
          rm -f .github/workflows/update-customer-business-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(customer): align business flow regressions"
          git push origin HEAD:agent/fix-customer-business-flow
