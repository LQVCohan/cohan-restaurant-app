name: Validate preparation station completion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused source changes
        id: patch
        continue-on-error: true
        shell: bash
        run: python scripts/complete-prep-station.py > prep-station-patch.log 2>&1

      - name: Upload patch diagnostics
        if: steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: prep-station-patch-log
          path: prep-station-patch.log

      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          cat prep-station-patch.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend checks
        run: |
          npx vitest run \
            src/components/Dashboard_Manager/Menu/components/MenuItemModal/MenuItemModal.foodClassification.test.jsx \
            src/components/Staff/StaffKitchenPage.test.jsx
          npm run check:staff-theme
          npm run build

      - name: Install backend dependencies
        working-directory: cohan-restaurant-backend
        run: npm ci --no-audit --no-fund

      - name: Run backend checks
        working-directory: cohan-restaurant-backend
        run: |
          npx vitest run \
            tests/resolvers/order-restaurant-access-guard.test.js \
            tests/graphql/confirmed-order-print-mutation.test.js

      - name: Commit verified changes
        run: |
          rm -f \
            .github/workflows/prep-station-complete.yml \
            .github/workflows/prep-station-pr.yml \
            scripts/complete-prep-station.py \
            prep-station-patch.log
          git config user.name "cohan-prep-station-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete preparation station routing [prep-station-complete]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
