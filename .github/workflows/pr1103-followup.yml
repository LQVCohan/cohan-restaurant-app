name: PR 1103 follow-up

on:
  push:
    branches:
      - codex/auth-rbac-clean

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message != 'Apply PR 1103 follow-up fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auth-rbac-clean
          fetch-depth: 0
      - name: Apply compatibility fixes
        run: |
          git fetch origin main
          git show origin/main:src/utils/frontendRoleAccess.js > /tmp/frontendRoleAccess.js
          python3 - <<'PY'
          from pathlib import Path

          role_file = Path('/tmp/frontendRoleAccess.js')
          source = role_file.read_text()
          old = '''// HR and accountant accounts are restaurant-scoped staff for restaurant
          // selection even though they are not operational floor roles. AuthProvider
          // uses this helper to retain restaurantForStaff and select the assigned branch.
          export const isStaffOperationalRole = (role) => {
            const normalized = resolveUserRoleName(role);
            return (
              STAFF_OPERATIONAL_ROLES.has(normalized) ||
              HR_ROLES.has(normalized) ||
              ACCOUNTANT_ROLES.has(normalized)
            );
          };'''
          new = '''export const isStaffOperationalRole = (role) =>
            STAFF_OPERATIONAL_ROLES.has(resolveUserRoleName(role));

          export const isRestaurantScopedRole = (role) => {
            const normalized = resolveUserRoleName(role);
            return (
              STAFF_OPERATIONAL_ROLES.has(normalized) ||
              HR_ROLES.has(normalized) ||
              ACCOUNTANT_ROLES.has(normalized)
            );
          };'''
          if old not in source:
            raise SystemExit('frontend role helper source not found')
          role_file.write_text(source.replace(old, new))
          Path('src/utils/frontendRoleAccess.js').write_text(role_file.read_text())

          availability = Path('cohan-restaurant-backend/tests/resolvers/availability.resolver.test.js')
          tests = availability.read_text()
          tests = tests.replace('modelMocks.Restaurant.exists.mockResolvedValue(null);', 'modelMocks.Restaurant.exists.mockResolvedValue(true);', 1)
          tests = tests.replace('roles: [], restaurantId: "r1"', 'roleName: "staff", restaurantForStaff: "r1"')
          tests = tests.replace('roles: [], restaurantId: "r2"', 'roleName: "staff", restaurantForStaff: "r2"')
          tests = tests.replace('userType: "HR", restaurantId: "r1"', 'userType: "HR", restaurantForStaff: "r1"')
          tests = tests.replace('userType: "hr", restaurantId: "r1"', 'userType: "hr", restaurantForStaff: "r1"')
          tests = tests.replace('userType: "hr", restaurantId: "r2"', 'userType: "hr", restaurantForStaff: "r2"')
          tests = tests.replace('roleName: "accountant", restaurantId: "r1"', 'roleName: "accountant", restaurantForStaff: "r1"')
          tests = tests.replace('roleName: "accountant", restaurantId: "r2"', 'roleName: "accountant", restaurantForStaff: "r2"')
          availability.write_text(tests)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cohan-restaurant-backend/package-lock.json
      - run: npm ci
      - run: npm --prefix cohan-restaurant-backend ci
      - name: Run affected frontend tests
        run: npx vitest run src/utils/frontendRoleAccess.test.js src/context/__tests__/AuthProvider.test.jsx
      - name: Run affected backend tests
        run: npm --prefix cohan-restaurant-backend test -- tests/resolvers/availability.resolver.test.js tests/resolvers/guards-restaurant-access.test.js tests/services/authorization.service.test.js tests/resolvers/review-access.test.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/frontendRoleAccess.js cohan-restaurant-backend/tests/resolvers/availability.resolver.test.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Apply PR 1103 follow-up fixes"
          git push origin HEAD:codex/auth-rbac-clean
