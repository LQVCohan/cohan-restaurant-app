name: debug-apply-report
on:
  push:
    branches: [agent/fix-report-pages-16-20]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          workflow = Path('.github/workflows/apply-report-pages-16-20.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          lines = workflow[start:end]
          indents = [len(line) - len(line.lstrip()) for line in lines if line.strip()]
          indent = min(indents) if indents else 0
          script = '\n'.join(line[indent:] if line.strip() else '' for line in lines) + '\n'
          Path('/tmp/apply_report.py').write_text(script)
          result = subprocess.run(['python', '/tmp/apply_report.py'], text=True, capture_output=True)
          Path('/tmp/apply-diagnostic.txt').write_text(
              f'returncode={result.returncode}\n\nSTDOUT\n{result.stdout}\n\nSTDERR\n{result.stderr}\n'
          )
          PY
          git reset --hard HEAD
          cp /tmp/apply-diagnostic.txt .trellis/tasks/07-13-report-pages-16-20/apply-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .trellis/tasks/07-13-report-pages-16-20/apply-diagnostic.txt
          git commit -m "chore: record report patch diagnostics"
          git push origin HEAD
