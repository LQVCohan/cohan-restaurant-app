name: Cleanup restaurant profile polish

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove duplicate legacy polish and finish wording
        run: |
          python - <<'PY'
          from pathlib import Path

          scss_path = Path('src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.scss')
          scss = scss_path.read_text(encoding='utf-8')
          marker = '// Shared manager sage polish layered on top of the existing AntD markup.'
          if scss.count(marker) != 1:
              raise SystemExit(f'Expected one duplicate polish marker, found {scss.count(marker)}')
          scss = scss.split(marker, 1)[0].rstrip() + '\n'
          old_font = '''  font-family:\n    "Inter",\n    -apple-system,\n    BlinkMacSystemFont,\n    sans-serif;'''
          if old_font not in scss:
              raise SystemExit('Base font block changed')
          scss = scss.replace(old_font, '  font-family: inherit;', 1)
          scss_path.write_text(scss, encoding='utf-8')

          jsx_path = Path('src/components/Dashboard_Manager/RestaurantInfo/RestaurantInfoManagement.jsx')
          jsx = jsx_path.read_text(encoding='utf-8')
          replacements = {
              '<Form.Item label="Website">': '<Form.Item label="Trang web">',
              '<Form.Item label="Ưu tiên">': '<Form.Item label="Thứ tự ưu tiên">',
          }
          for old, new in replacements.items():
              if jsx.count(old) != 1:
                  raise SystemExit(f'Expected one wording match for {old}, found {jsx.count(old)}')
              jsx = jsx.replace(old, new, 1)
          jsx_path.write_text(jsx, encoding='utf-8')

          Path('.github/workflows/cleanup-restaurant-profile-polish.yml').unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: remove duplicate restaurant profile theme"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
