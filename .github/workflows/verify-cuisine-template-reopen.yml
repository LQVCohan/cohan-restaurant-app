name: verify-cuisine-template-reopen

on:
  pull_request:
    branches:
      - main
    paths:
      - src/components/Dashboard_Manager/Header.jsx
      - src/components/Dashboard_Manager/Header.test.jsx
      - src/components/Dashboard_Manager/RestaurantSetup/RestaurantCuisineOnboarding.jsx
      - src/components/Dashboard_Manager/RestaurantSetup/RestaurantCuisineOnboarding.test.jsx
      - .github/workflows/verify-cuisine-template-reopen.yml
  push:
    branches:
      - fix/cuisine-template-reopen-20260710
    paths:
      - src/components/Dashboard_Manager/Header.jsx
      - src/components/Dashboard_Manager/Header.test.jsx
      - src/components/Dashboard_Manager/RestaurantSetup/RestaurantCuisineOnboarding.jsx
      - src/components/Dashboard_Manager/RestaurantSetup/RestaurantCuisineOnboarding.test.jsx
      - .github/workflows/verify-cuisine-template-reopen.yml

permissions:
  contents: read

concurrency:
  group: verify-cuisine-template-reopen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Header reopen action
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 3m \
            npx vitest run src/components/Dashboard_Manager/Header.test.jsx --maxWorkers=1 --reporter=verbose \
            2>&1 | tee /tmp/header-test.log

      - name: Test onboarding reopen signal
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 3m \
            npx vitest run src/components/Dashboard_Manager/RestaurantSetup/RestaurantCuisineOnboarding.test.jsx --maxWorkers=1 --reporter=verbose \
            2>&1 | tee /tmp/onboarding-test.log

      - name: Upload focused logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-template-reopen-focused-logs
          path: |
            /tmp/header-test.log
            /tmp/onboarding-test.log
          if-no-files-found: ignore

      - name: Check conflict markers
        run: npm run check:conflicts

      - name: Build frontend
        run: npm run build
