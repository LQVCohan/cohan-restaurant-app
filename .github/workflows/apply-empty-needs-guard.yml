name: Apply empty inventory needs guard

on:
  push:
    branches:
      - fix/public-table-untracked-serving

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch empty needs guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cohan-restaurant-backend/src/services/inventory.service.js')
          text = path.read_text()
          old = '''  const ingIds = Array.from(ingIdsSet);
          let q2 = Ingredient.find({ _id: { $in: ingIds } }).select({
          '''
          new = '''  const ingIds = Array.from(ingIdsSet);
          if (!ingIds.length) return new Map();

          let q2 = Ingredient.find({ _id: { $in: ingIds } }).select({
          '''
          if old not in text:
              raise SystemExit('Expected ingredient lookup block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cohan-restaurant-backend/src/services/inventory.service.js
          git commit -m "fix(inventory): skip empty ingredient lookup"
          git push
